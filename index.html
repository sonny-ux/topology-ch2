// ===== Munkres's numbered results: every "Theorem 17.1", "Lemma 23.2", "(23.5)" in the guide is a link that shows the statement,
// with a link to the full article where the guide has one. All of them are listed on the page "Theorems by number".
// What each numbered result adds to the picture of topology, and its proof (Midterm 2 range, §19–24, first).
var THMMEAN = {
'19.1': R`The product topology constrains only finitely many coordinates at a time. That finiteness is what makes maps into products checkable coordinate by coordinate (19.6) and, later, products of compact spaces compact; the box topology, which constrains all coordinates at once, loses both.`,
'19.2': R`You never need all open sets of the factors: small standard pieces (intervals, balls) in each coordinate already generate the product. In $\mathbb R^n$, products of open intervals are enough.`,
'19.3': R`Taking subspaces and taking products can be done in either order with the same result. This is not true of every pair of constructions: subspace and quotient do not commute ([[hw7-q5]]).`,
'19.4': R`Hausdorffness passes to products: two different points differ in some coordinate, and one coordinate is enough to separate them.`,
'19.5': R`Closure in a product is computed one coordinate at a time. In particular a product of closed sets is closed.`,
'19.6': R`This is the property that characterises the product topology: it is exactly the topology in which a map into the product is continuous when its [[coordinate-function|coordinate functions]] are. Building maps into products (paths in $\mathbb R^n$, slices, diagonals) reduces to building maps into the factors.`,
'20.1': R`Boundedness is not a topological property. Any metric can be replaced by a bounded one without changing a single open set, so "bounded" says something about the metric, not about the space.`,
'20.2': R`To compare two metric topologies, compare small balls: one topology is finer when every ball of the other contains one of its balls around the same centre. This is Lemma 13.3 specialised to balls.`,
'20.3': R`Round balls and square balls give the same open sets. Topology forgets the shape of neighbourhoods and keeps only nearness, and the topology of $\mathbb R^n$ is exactly the product of $n$ copies of $\mathbb R$.`,
'20.4': R`An infinite product carries three natural topologies, ordered from coarse to fine: product, uniform, box. The product topology, the coarsest, is the one with the good theorems.`,
'20.5': R`Countable products of metric spaces are metrizable: $\mathbb R^\omega$ with the product topology has a metric. Uncountable products such as $\mathbb R^{\mathbb R}$ do not ([[hw4-q4]] shows the obstruction for $\prod\{0,1\}$).`,
'21.1': R`The open-set definition of continuity agrees with the $\varepsilon$–$\delta$ definition from calculus wherever both make sense. Topology generalises calculus continuity rather than replacing it.`,
'21.2': R`In metric spaces, closure means "limits of sequences". In general spaces sequences can be too few to detect closure; the converse needs a countable supply of neighbourhoods at each point ([[first-countable]]).`,
'21.3': R`In metric spaces continuity can be tested with sequences: $x_n\to x$ implies $f(x_n)\to f(x)$. Again the converse direction is where metrizability is used.`,
'21.4': R`The arithmetic operations of $\mathbb R$ are continuous, so polynomials and rational functions are continuous. These are the raw material for paths, homotopies and maps into $\mathbb R^n$.`,
'21.5': R`Continuous real functions on a space can be added, subtracted, multiplied and (away from zeros) divided. This is how functions such as $\max(0,y)=\tfrac{y+|y|}2$ ([[hw7-q5]]) and distance functions are shown continuous.`,
'21.6': R`Continuity survives uniform limits, though not pointwise limits ($x^n$ on $[0,1]$ converges to a discontinuous function). It is the tool for building continuous maps as limits, such as space-filling curves.`,
'22.1': R`Gluing commutes with restricting to a piece only under conditions: the piece open or closed and saturated, or the gluing map open or closed. Without them, restricting a quotient map can fail to give a quotient map ([[hw7-q5]]).`,
'22.2': R`The universal property of quotients: to define a continuous map out of a glued space, define one on the original space that respects the gluing. Every map out of a circle, torus or collapsed space is made this way.`,
'22.3': R`Every continuous surjection $g$ factors as "glue each fibre to a point" followed by a continuous bijection, and $g$ is a quotient map exactly when that bijection is a homeomorphism. Hausdorffness of the target passes up to the glued space ([[hw6-q5]]).`,
'23.1': R`A separation of a subspace can be described without mentioning its open sets: two pieces, neither of which contains a limit point of the other. Being "stuck together" means one piece touches the closure of the other.`,
'23.2': R`The basic tool of the chapter: a connected set cannot straddle a separation. Almost every connectedness proof is this lemma in disguise.`,
'23.3': R`Connectedness spreads through common points, which is how big connected sets are assembled from small ones (and why components exist, §25).`,
'23.4': R`Adding limit points never disconnects. The closure of a connected set is connected, which is why the topologist's sine curve, the closure of a connected graph, is connected.`,
'23.5': R`Connectedness is preserved by continuous maps, hence a topological property: homeomorphic spaces are both connected or both not. It is the first invariant that tells spaces apart.`,
'23.6': R`Finite products of connected spaces are connected, so $\mathbb R^n$ and $[0,1]^n$ are connected. The proof's "hub and cross" picture is the same as [[hw8-q5]].`,
'24.1': R`The connectedness of intervals comes from the completeness of $\mathbb R$ (least upper bounds). $\mathbb Q$ lacks it and falls apart; this is where the analysis of $\mathbb R$ enters topology.`,
'24.2': R`$\mathbb R$ itself is connected, together with all its intervals and rays. Every later connectedness proof in $\mathbb R^n$ starts here.`,
'24.3': R`The intermediate value theorem is really a statement about connectedness: it holds for any connected domain, not just intervals, because a missed value would split the image in two.`
};
var THMPROOF = {
'19.1': R`<p>The box topology is defined by the basis of all $\prod U_\alpha$ with $U_\alpha$ open. The product topology is generated by the subbasis of sets $\pi_\beta^{-1}(U_\beta)$, so its basis consists of finite intersections $\pi_{\beta_1}^{-1}(U_1)\cap\dots\cap\pi_{\beta_n}^{-1}(U_n)$. Such an intersection is the product $\prod U_\alpha$ with $U_\alpha=U_i$ when $\alpha=\beta_i$ (intersecting the $U_i$ if an index repeats) and $U_\alpha=X_\alpha$ otherwise: exactly the products restricting finitely many coordinates. $\blacksquare$</p>`,
'19.2': R`<p>By Lemma 13.2 it is enough to show: for each open $W$ and $x\in W$ there is one of the given products containing $x$ inside $W$. By 19.1 there is a basic $\prod U_\alpha$ with $x\in\prod U_\alpha\subseteq W$. For each $\alpha$ with $U_\alpha\ne X_\alpha$, choose $B_\alpha\in\mathcal B_\alpha$ with $x_\alpha\in B_\alpha\subseteq U_\alpha$ (basis of $X_\alpha$); elsewhere take $B_\alpha=X_\alpha$. Then $x\in\prod B_\alpha\subseteq\prod U_\alpha\subseteq W$. In the product case only finitely many $B_\alpha$ differ from $X_\alpha$, as required. $\blacksquare$</p>`,
'19.3': R`<p>A basis for the subspace topology on $\prod A_\alpha$ is $(\prod U_\alpha)\cap\prod A_\alpha=\prod(U_\alpha\cap A_\alpha)$ with $\prod U_\alpha$ basic in $\prod X_\alpha$ (Lemma 16.1). Each $U_\alpha\cap A_\alpha$ is open in $A_\alpha$, and in the product case $U_\alpha\cap A_\alpha=A_\alpha$ for all but finitely many $\alpha$. These are exactly the basis elements of the product of the subspaces. Equal bases give equal topologies. $\blacksquare$</p>`,
'19.4': R`<p>Let $x\ne y$ in $\prod X_\alpha$. They differ in some coordinate: $x_\beta\ne y_\beta$. Since $X_\beta$ is Hausdorff there are disjoint open $U\ni x_\beta$, $V\ni y_\beta$. Then $\pi_\beta^{-1}(U)\ni x$ and $\pi_\beta^{-1}(V)\ni y$ are open in either topology and disjoint (a point in both would have $\beta$-th coordinate in $U\cap V=\varnothing$). $\blacksquare$</p>`,
'19.5': R`<p>($\supseteq$) Let $x\in\prod\overline{A_\alpha}$ and let $\prod U_\alpha$ be a basic open set containing $x$. Each $U_\alpha$ contains $x_\alpha\in\overline{A_\alpha}$, so meets $A_\alpha$ (Theorem 17.5); choose $y_\alpha\in U_\alpha\cap A_\alpha$. Then $y=(y_\alpha)\in\prod U_\alpha\cap\prod A_\alpha$, so $x\in\overline{\prod A_\alpha}$.</p><p>($\subseteq$) Let $x\in\overline{\prod A_\alpha}$ and fix $\beta$. For an open $V\ni x_\beta$, the set $\pi_\beta^{-1}(V)$ is open and contains $x$, so it meets $\prod A_\alpha$ at some $y$; then $y_\beta\in V\cap A_\beta$. So $x_\beta\in\overline{A_\beta}$ for every $\beta$. $\blacksquare$</p>`,
'19.6': R`<p>($\Rightarrow$) Each projection $\pi_\alpha$ is continuous, so $f_\alpha=\pi_\alpha\circ f$ is a composite of continuous maps. ($\Leftarrow$) The sets $\pi_\beta^{-1}(U)$, $U$ open in $X_\beta$, form a subbasis for the product topology, so it suffices that their preimages are open. And $f^{-1}(\pi_\beta^{-1}(U))=(\pi_\beta\circ f)^{-1}(U)=f_\beta^{-1}(U)$, open because $f_\beta$ is continuous. $\blacksquare$</p><p>For the box topology the argument fails: a basis element $\prod U_\alpha$ has preimage $\bigcap_\alpha f_\alpha^{-1}(U_\alpha)$, an <em>infinite</em> intersection of open sets, which need not be open.</p>`,
'20.1': R`<p><b>Metric:</b> $\bar d(x,y)\ge0$ with equality iff $x=y$, and $\bar d$ is symmetric, because $d$ is. Triangle inequality: if $d(x,y)\ge1$ or $d(y,z)\ge1$, the right side $\bar d(x,y)+\bar d(y,z)\ge1\ge\bar d(x,z)$. Otherwise $\bar d(x,z)\le d(x,z)\le d(x,y)+d(y,z)=\bar d(x,y)+\bar d(y,z)$.</p><p><b>Same topology:</b> for $\varepsilon\le1$ the balls $B_d(x,\varepsilon)$ and $B_{\bar d}(x,\varepsilon)$ are the same set, and in any metric space the balls of radius at most $1$ already form a basis (a smaller ball fits inside any ball). Same basis, same topology. $\blacksquare$</p>`,
'20.2': R`<p>($\Leftarrow$) By Lemma 13.3 with the bases of balls: given a $d$-ball containing $x$, a smaller $d$-ball $B_d(x,\varepsilon)$ centred at $x$ lies inside it, and by hypothesis a $d'$-ball $B_{d'}(x,\delta)$ lies inside that. ($\Rightarrow$) $B_d(x,\varepsilon)$ is open in $\mathcal T\subseteq\mathcal T'$, so it is $\mathcal T'$-open and contains $x$; hence it contains some $d'$-ball around $x$. $\blacksquare$</p>`,
'20.3': R`<p>For $x,y\in\mathbb R^n$: $\rho(x,y)\le d(x,y)\le\sqrt n\,\rho(x,y)$ (the largest coordinate difference is at most the euclidean length, which is at most $\sqrt n$ times the largest difference). So $B_d(x,\varepsilon)\subseteq B_\rho(x,\varepsilon)$ and $B_\rho(x,\varepsilon/\sqrt n)\subseteq B_d(x,\varepsilon)$; by 20.2 the topologies agree.</p><p>Product topology: a $\rho$-ball is the cube $\prod(x_i-\varepsilon,x_i+\varepsilon)$, a product basis element. Conversely if $x\in\prod(a_i,b_i)$, let $\varepsilon=\min_i\min(x_i-a_i,b_i-x_i)$; the cube of radius $\varepsilon$ around $x$ lies inside. So the two bases generate the same topology. $\blacksquare$</p>`,
'20.4': R`<p>Let $\bar\rho(x,y)=\sup_\alpha\min(|x_\alpha-y_\alpha|,1)$. <b>Uniform finer than product:</b> a basic product set $\prod U_\alpha$ around $x$ restricts finitely many $\alpha_1,\dots,\alpha_n$; choose $\varepsilon\lt1$ with $(x_{\alpha_i}-\varepsilon,x_{\alpha_i}+\varepsilon)\subseteq U_{\alpha_i}$; then $B_{\bar\rho}(x,\varepsilon)\subseteq\prod U_\alpha$. <b>Box finer than uniform:</b> the box $\prod(x_\alpha-\tfrac\varepsilon2,x_\alpha+\tfrac\varepsilon2)$ lies in $B_{\bar\rho}(x,\varepsilon)$ (every coordinate difference is less than $\tfrac\varepsilon2$, so the sup is at most $\tfrac\varepsilon2\lt\varepsilon$).</p><p><b>All different for infinite $J$</b> (on $\mathbb R^\omega$): $B_{\bar\rho}(0,1)$ restricts every coordinate, so it contains no product basis element around $0$; and $\prod(-\tfrac1n,\tfrac1n)$ contains no uniform ball around $0$, since a ball of radius $\varepsilon$ contains points with every coordinate $\tfrac\varepsilon2$. $\blacksquare$</p>`,
'20.5': R`<p><b>Product open sets are $D$-open:</b> let $x\in\prod U_i$, basic, with $U_i=\mathbb R$ for $i>N$. Choose $\varepsilon_i\le1$ with $(x_i-\varepsilon_i,x_i+\varepsilon_i)\subseteq U_i$ for $i\le N$, and $\varepsilon=\min_{i\le N}\varepsilon_i/i$. If $D(x,y)\lt\varepsilon$ then $\bar d(x_i,y_i)\lt i\varepsilon\le\varepsilon_i$ for $i\le N$, so $y\in\prod U_i$.</p><p><b>$D$-balls are product-open:</b> given $\varepsilon$, choose $N$ with $\tfrac1N\lt\varepsilon$. Let $V=\prod_{i\le N}(x_i-\varepsilon,x_i+\varepsilon)\times\mathbb R\times\mathbb R\times\cdots$. For $y\in V$: $\bar d(x_i,y_i)/i\lt\varepsilon$ for $i\le N$ and $\le\tfrac1{N+1}$ for $i>N$, so $D(x,y)\lt\varepsilon$; thus $V\subseteq B_D(x,\varepsilon)$. $\blacksquare$</p>`,
'21.1': R`<p>($\Rightarrow$) $B(f(x),\varepsilon)$ is open, so $f^{-1}(B(f(x),\varepsilon))$ is open and contains $x$; it contains some $B(x,\delta)$, which is the $\varepsilon$–$\delta$ condition. ($\Leftarrow$) Let $V\subseteq Y$ be open and $x\in f^{-1}(V)$. Choose $\varepsilon$ with $B(f(x),\varepsilon)\subseteq V$, then $\delta$ from the hypothesis: $f(B(x,\delta))\subseteq B(f(x),\varepsilon)\subseteq V$, so $B(x,\delta)\subseteq f^{-1}(V)$. Every point of $f^{-1}(V)$ has a ball inside it: it is open. $\blacksquare$</p>`,
'21.2': R`<p>(First part) If $x_n\to x$ with $x_n\in A$, every neighbourhood of $x$ contains some $x_n$, hence meets $A$; so $x\in\overline A$ (Theorem 17.5). (Converse, $X$ metrizable) If $x\in\overline A$, each ball $B(x,\tfrac1n)$ meets $A$; choose $x_n$ in it. Any neighbourhood of $x$ contains some $B(x,\tfrac1N)$, hence all $x_n$ with $n\ge N$: $x_n\to x$. $\blacksquare$</p>`,
'21.3': R`<p>($\Rightarrow$) Let $x_n\to x$ and $V$ a neighbourhood of $f(x)$. Then $f^{-1}(V)$ is a neighbourhood of $x$, so it contains $x_n$ for all large $n$; hence $f(x_n)\in V$ for all large $n$. ($\Leftarrow$, $X$ metrizable) Use Theorem 18.1(2): let $x\in\overline A$. By 21.2 there are $x_n\in A$ with $x_n\to x$; by hypothesis $f(x_n)\to f(x)$, and $f(x_n)\in f(A)$, so $f(x)\in\overline{f(A)}$ by the easy half of 21.2. Thus $f(\overline A)\subseteq\overline{f(A)}$ and $f$ is continuous. $\blacksquare$</p>`,
'21.4': R`<p>Use the square metric on $\mathbb R^2$ (20.3). <b>Addition:</b> $|(x+y)-(x_0+y_0)|\le|x-x_0|+|y-y_0|\lt\varepsilon$ when both differences are below $\varepsilon/2$. <b>Multiplication:</b> $xy-x_0y_0=(x-x_0)(y-y_0)+x_0(y-y_0)+y_0(x-x_0)$; if both differences are below $\delta=\min(1,\ \varepsilon/(1+|x_0|+|y_0|))$, the absolute value is at most $\delta^2+(|x_0|+|y_0|)\delta\le\delta(1+|x_0|+|y_0|)\le\varepsilon$. <b>Quotient:</b> $y\mapsto1/y$ is continuous on $\mathbb R\setminus\{0\}$ (for $|y-y_0|\lt|y_0|/2$, $|1/y-1/y_0|=|y-y_0|/|yy_0|\le2|y-y_0|/y_0^2$), and $x/y=x\cdot(1/y)$. Subtraction is addition composed with $y\mapsto-y$. $\blacksquare$</p>`,
'21.5': R`<p>The map $h(x)=(f(x),g(x))$ into $\mathbb R\times\mathbb R$ is continuous by Theorem 18.4. Then $f+g$, $f-g$, $f\cdot g$ are $h$ followed by addition, subtraction, multiplication, all continuous (21.4), so the composites are continuous (18.2). If $g$ never vanishes, $h$ maps into $\mathbb R\times(\mathbb R\setminus\{0\})$ and $f/g$ is $h$ followed by division. $\blacksquare$</p>`,
'21.6': R`<p>Let $\varepsilon>0$ and $x_0\in X$. By uniform convergence choose $N$ with $d(f_N(x),f(x))\lt\varepsilon/3$ for <em>all</em> $x$. Since $f_N$ is continuous there is a neighbourhood $U$ of $x_0$ with $d(f_N(x),f_N(x_0))\lt\varepsilon/3$ for $x\in U$. For $x\in U$:</p>$$d(f(x),f(x_0))\le d(f(x),f_N(x))+d(f_N(x),f_N(x_0))+d(f_N(x_0),f(x_0))\lt\varepsilon.$$<p>So $f$ is continuous at every point. $\blacksquare$ (Uniformity is what lets one $N$ work at both $x$ and $x_0$.)</p>`,
'22.1': R`<p>In each case $q$ is continuous (a restriction, 18.2) and surjective onto $p(A)$. Let $V\subseteq p(A)$ with $q^{-1}(V)$ open in $A$. Because $A$ is saturated and $V\subseteq p(A)$, $q^{-1}(V)=p^{-1}(V)$.</p><p><b>$A$ open:</b> $p^{-1}(V)$ is open in $A$, and $A$ is open in $X$, so $p^{-1}(V)$ is open in $X$ (Lemma 16.2); since $p$ is a quotient map, $V$ is open in $Y$, hence in $p(A)$. <b>$A$ closed:</b> the same argument with closed sets (Theorem 17.3).</p><p><b>$p$ open:</b> write $p^{-1}(V)=A\cap U$ with $U$ open in $X$. Then $V=p(A)\cap p(U)$: "$\subseteq$" is clear; for "$\supseteq$", if $y=p(u)=p(a)$ with $u\in U$, $a\in A$, then $u\in p^{-1}(\{y\})\subseteq A$ (saturated), so $u\in A\cap U=p^{-1}(V)$ and $y\in V$. As $p(U)$ is open, $V$ is open in $p(A)$. <b>$p$ closed:</b> the same with closed sets. $\blacksquare$</p>`,
'22.2': R`<p>$f$ is well defined: for $y\in Y$, $g$ takes one value on the fibre $p^{-1}(\{y\})$; call it $f(y)$. Then $f\circ p=g$. If $f$ is continuous, $g=f\circ p$ is a composite of continuous maps. If $g$ is continuous and $V\subseteq Z$ is open, then $p^{-1}(f^{-1}(V))=g^{-1}(V)$ is open, and since $p$ is a quotient map, $f^{-1}(V)$ is open. For the last part: if $f$ is a quotient map, so is the composite $g=f\circ p$; if $g$ is a quotient map, $f$ is surjective and continuous, and if $f^{-1}(V)$ is open then $g^{-1}(V)=p^{-1}(f^{-1}(V))$ is open, so $V$ is open. $\blacksquare$</p>`,
'22.3': R`<p>(a) $g$ is constant on each fibre $g^{-1}(\{z\})$, which is a point of $X^*$, so by 22.2 (with $p:X\to X^*$ the quotient map) $g$ induces a continuous $f:X^*\to Z$ with $f\circ p=g$. It is bijective: each $z$ has exactly one fibre. A bijective quotient map is a homeomorphism (images of open sets are open because open sets are exactly those with open preimage), so by the last part of 22.2, $f$ is a homeomorphism iff $g$ is a quotient map. (b) If $Z$ is Hausdorff and $a\ne b$ in $X^*$, then $f(a)\ne f(b)$; take disjoint open $U\ni f(a)$, $V\ni f(b)$; then $f^{-1}(U)$, $f^{-1}(V)$ are disjoint open sets separating $a$ and $b$. $\blacksquare$</p>`,
'23.1': R`<p>Suppose $A,B$ separate $Y$ (disjoint, nonempty, open in $Y$, union $Y$). Then $A=Y\setminus B$ is also closed in $Y$, so $A=\overline A\cap Y$ (17.4); since $B\cap A=\varnothing$ and $B\subseteq Y$, $B\cap\overline A=\varnothing$: $B$ contains no limit point of $A$. Symmetrically for $A$. Conversely, if $A,B$ are disjoint, nonempty, with union $Y$ and neither containing a limit point of the other, then $\overline A\cap Y=A$, so $A$ is closed in $Y$ and $B=Y\setminus A$ is open in $Y$; likewise $A$ is open. So $A,B$ separate $Y$. $\blacksquare$</p>`,
'23.2': R`<p>$Y\cap C$ and $Y\cap D$ are open in $Y$ (subspace topology), disjoint, and their union is $Y$. If both were nonempty they would separate $Y$, contradicting connectedness. So one is empty: $Y\subseteq D$ or $Y\subseteq C$. $\blacksquare$</p>`,
'23.3': R`<p>Let $Y=\bigcup A_\alpha$ with each $A_\alpha$ connected and $p\in\bigcap A_\alpha$. Suppose $C,D$ separate $Y$; say $p\in C$. Each $A_\alpha$ is connected and lies in $Y$, so by 23.2 it lies in $C$ or in $D$; it contains $p\in C$, so $A_\alpha\subseteq C$. Then $Y\subseteq C$ and $D=\varnothing$, a contradiction. $\blacksquare$</p>`,
'23.4': R`<p>Suppose $C,D$ separate $B$. By 23.2, $A\subseteq C$ or $A\subseteq D$; say $A\subseteq C$. Then $\overline A\subseteq\overline C$. By 23.1, $\overline C\cap D=\varnothing$ (D contains no limit point of C). So $B\subseteq\overline A\subseteq\overline C$ misses $D$, i.e. $D=\varnothing$: contradiction. $\blacksquare$</p>`,
'23.5': R`<p>Let $f:X\to Y$ be continuous, $X$ connected. Restricting the range, $f:X\to f(X)$ is continuous and surjective (18.2). If $A,B$ separated $f(X)$, then $f^{-1}(A),f^{-1}(B)$ would be open (continuity), disjoint, nonempty (surjectivity) and cover $X$: a separation of $X$. $\blacksquare$</p>`,
'23.6': R`<p>For $X\times Y$: choose $(a,b)$. For each $x$, the set $T_x=(X\times\{b\})\cup(\{x\}\times Y)$ is connected: the two slices are connected (homeomorphic to $X$ and $Y$) and meet at $(x,b)$ (23.3). All $T_x$ contain $(a,b)$, and $\bigcup_x T_x=X\times Y$, so $X\times Y$ is connected (23.3). For $n$ factors use induction: $X_1\times\dots\times X_n$ is homeomorphic to $(X_1\times\dots\times X_{n-1})\times X_n$. $\blacksquare$</p>`,
'24.1': R`<p>For an interval $Y$ in $\mathbb R$ (the general linear continuum is the same argument): suppose $A,B$ separate $Y$; pick $a\in A$, $b\in B$, say $a\lt b$. Then $[a,b]\subseteq Y$, and $A_0=A\cap[a,b]$, $B_0=B\cap[a,b]$ separate $[a,b]$. Let $c=\sup A_0$, which exists by the least upper bound property; $c\in[a,b]$. If $c\in B_0$: $c\gt a$ and $B_0$ is open in $[a,b]$, so some $(d,c]\subseteq B_0$, making $d$ a smaller upper bound for $A_0$: contradiction. If $c\in A_0$: $c\lt b$ and $A_0$ is open, so some $[c,e)\subseteq A_0$, contradicting that $c$ is an upper bound. Either way a contradiction. $\blacksquare$</p>`,
'24.2': R`<p>$\mathbb R$ has the least upper bound property and between any two reals there is another, so it is a linear continuum; apply 24.1 to $\mathbb R$ and to its intervals and rays. $\blacksquare$</p>`,
'24.3': R`<p>Suppose no $c$ has $f(c)=r$. Then $A=f(X)\cap(-\infty,r)$ and $B=f(X)\cap(r,\infty)$ are open in $f(X)$, disjoint, cover $f(X)$, and are nonempty (one contains $f(a)$, the other $f(b)$). They separate $f(X)$, but $f(X)$ is connected by 23.5: contradiction. $\blacksquare$</p>`

var THM = {
'13.1': ['Lemma', 'Open sets from a basis', R`If $\mathcal B$ is a basis for a topology $\mathcal T$ on $X$, then $\mathcal T$ is the collection of all unions of elements of $\mathcal B$.`, 'generated-topology'],
'13.2': ['Lemma', 'Recognising a basis', R`If $\mathcal C$ is a collection of open sets of $X$ such that for each open $U$ and each $x\in U$ there is $C\in\mathcal C$ with $x\in C\subseteq U$, then $\mathcal C$ is a basis for the topology of $X$.`, 'generated-topology'],
'13.3': ['Lemma', 'Comparing topologies through bases', R`Let $\mathcal B,\mathcal B'$ be bases for $\mathcal T,\mathcal T'$ on $X$. Then $\mathcal T'$ is finer than $\mathcal T$ iff for each $x$ and each $B\in\mathcal B$ containing $x$ there is $B'\in\mathcal B'$ with $x\in B'\subseteq B$.`, 'lemma-13-3'],
'13.4': ['Lemma', 'The lower limit and K-topologies', R`The topologies of $\mathbb R_\ell$ and $\mathbb R_K$ are each strictly finer than the standard topology on $\mathbb R$, but are not comparable with one another.`, 'lemma-13-3'],
'15.1': ['Theorem', 'Basis for a product', R`If $\mathcal B$ is a basis for $X$ and $\mathcal C$ a basis for $Y$, then $\{B\times C: B\in\mathcal B, C\in\mathcal C\}$ is a basis for the product topology on $X\times Y$.`, 'product-topology'],
'15.2': ['Theorem', 'Subbasis for a product', R`The sets $\pi_1^{-1}(U)$ ($U$ open in $X$) and $\pi_2^{-1}(V)$ ($V$ open in $Y$) form a subbasis for the product topology on $X\times Y$.`, 'product-topology'],
'16.1': ['Lemma', 'Basis for a subspace', R`If $\mathcal B$ is a basis for $X$, then $\{B\cap Y: B\in\mathcal B\}$ is a basis for the subspace topology on $Y\subseteq X$.`, 'subspace-topology'],
'16.2': ['Lemma', 'Open in an open subspace', R`If $Y$ is a subspace of $X$, $U$ is open in $Y$ and $Y$ is open in $X$, then $U$ is open in $X$.`, 'subspace-topology'],
'16.3': ['Theorem', 'Products of subspaces', R`If $A$ is a subspace of $X$ and $B$ a subspace of $Y$, the product topology on $A\times B$ equals the topology $A\times B$ inherits as a subspace of $X\times Y$.`, 'subspace-topology'],
'17.1': ['Theorem', 'Closed sets', R`In a topological space $X$: (1) $\varnothing$ and $X$ are closed; (2) arbitrary intersections of closed sets are closed; (3) finite unions of closed sets are closed.`, 'closed-set', R`Take complements of the open-set axioms: $X\setminus\bigcap C_\alpha=\bigcup(X\setminus C_\alpha)$ is a union of open sets (De Morgan), and $X\setminus(C_1\cup\dots\cup C_n)=\bigcap(X\setminus C_i)$ is a finite intersection of open sets.`],
'17.2': ['Theorem', 'Closed sets of a subspace', R`Let $Y$ be a subspace of $X$. A set $A$ is closed in $Y$ iff $A=C\cap Y$ for some closed set $C$ of $X$.`, 'subspace-topology'],
'17.3': ['Theorem', 'Closed in a closed subspace', R`If $Y$ is a subspace of $X$, $A$ is closed in $Y$ and $Y$ is closed in $X$, then $A$ is closed in $X$.`, 'subspace-topology'],
'17.4': ['Theorem', 'Closure in a subspace', R`If $Y$ is a subspace of $X$ and $A\subseteq Y$, the closure of $A$ in $Y$ is $\overline A\cap Y$, where $\overline A$ is the closure in $X$.`, 'closure'],
'17.5': ['Theorem', 'The closure test', R`$x\in\overline A$ iff every open set containing $x$ meets $A$; if the topology is given by a basis, iff every basis element containing $x$ meets $A$.`, 'closure-test'],
'17.6': ['Theorem', 'Closure and limit points', R`$\overline A=A\cup A'$, where $A'$ is the set of limit points of $A$.`, 'closure-limit-points'],
'17.7': ['Corollary', 'Closed iff it contains its limit points', R`A subset of a topological space is closed iff it contains all its limit points.`, 'closure-limit-points'],
'17.8': ['Theorem', 'Finite sets in Hausdorff spaces', R`Every finite set in a Hausdorff space is closed.`, 'hausdorff', R`For one point $x$: each $y\ne x$ has an open set missing $x$, so $X\setminus\{x\}$ is open. A finite set is a finite union of points (17.1).`],
'17.9': ['Theorem', 'Limit points in a T₁ space', R`In a $T_1$ space, $x$ is a limit point of $A$ iff every neighbourhood of $x$ contains infinitely many points of $A$.`, 't1'],
'17.10': ['Theorem', 'Unique limits', R`In a Hausdorff space, a sequence converges to at most one point.`, 'hausdorff'],
'17.11': ['Theorem', 'Building Hausdorff spaces', R`Every simply ordered set in the order topology is Hausdorff; the product of two Hausdorff spaces is Hausdorff; a subspace of a Hausdorff space is Hausdorff.`, 'hausdorff'],
'18.1': ['Theorem', 'Equivalent forms of continuity', R`For $f:X\to Y$ the following are equivalent: (1) $f$ is continuous; (2) $f(\overline A)\subseteq\overline{f(A)}$ for every $A\subseteq X$; (3) $f^{-1}(B)$ is closed for every closed $B\subseteq Y$; (4) for each $x$ and each neighbourhood $V$ of $f(x)$ there is a neighbourhood $U$ of $x$ with $f(U)\subseteq V$.`, 'continuity-equivalents', R`(1)$\Leftrightarrow$(3): $f^{-1}(Y\setminus B)=X\setminus f^{-1}(B)$, so preimages of open sets are open iff preimages of closed sets are closed.`],
'18.2': ['Theorem', 'Rules for continuous functions', R`Constant maps, inclusions of subspaces and composites of continuous maps are continuous; restricting the domain, or restricting or expanding the range, keeps a map continuous; a map is continuous if its restrictions to the sets of an open cover are.`, 'continuous'],
'18.3': ['Theorem', 'The pasting lemma', R`If $X=A\cup B$ with $A,B$ closed in $X$, and $f:A\to Y$, $g:B\to Y$ are continuous and agree on $A\cap B$, then the combined map $h:X\to Y$ is continuous.`, 'pasting-lemma'],
'18.4': ['Theorem', 'Maps into a product of two spaces', R`$f:A\to X\times Y$, $f(a)=(f_1(a),f_2(a))$, is continuous iff $f_1$ and $f_2$ are continuous.`, 'maps-into-products'],
'19.1': ['Theorem', 'Box versus product topology', R`The box topology on $\prod X_\alpha$ has as basis all products $\prod U_\alpha$ with each $U_\alpha$ open in $X_\alpha$. The product topology has as basis those products $\prod U_\alpha$ with each $U_\alpha$ open and $U_\alpha=X_\alpha$ for all but finitely many $\alpha$.`, 'product-vs-box', R`The product topology is generated by the sets $\pi_\beta^{-1}(U_\beta)$, and finite intersections of these restrict only finitely many coordinates.`],
'19.2': ['Theorem', 'Bases for products from bases of the factors', R`If each $X_\alpha$ has basis $\mathcal B_\alpha$, the products $\prod B_\alpha$ with $B_\alpha\in\mathcal B_\alpha$ form a basis for the box topology; the products with $B_\alpha\in\mathcal B_\alpha$ for finitely many $\alpha$ and $B_\alpha=X_\alpha$ otherwise form a basis for the product topology.`, 'product-vs-box'],
'20.1': ['Lemma', 'The standard bounded metric', R`If $d$ is a metric on $X$, then $\bar d(x,y)=\min\{d(x,y),1\}$ is a metric inducing the same topology as $d$.`, 'metric-topology', R`Balls of radius $\varepsilon\lt1$ are the same for $d$ and $\bar d$, and small balls are all that matter for the topology.`],
'20.2': ['Lemma', 'Comparing metric topologies', R`Let $d,d'$ be metrics on $X$ with topologies $\mathcal T,\mathcal T'$. Then $\mathcal T'$ is finer than $\mathcal T$ iff for each $x\in X$ and $\varepsilon>0$ there is $\delta>0$ with $B_{d'}(x,\delta)\subseteq B_d(x,\varepsilon)$.`, 'metric-topology', R`It is Lemma 13.3 with balls as the basis elements.`],
'20.3': ['Theorem', 'Metrics on ℝⁿ', R`The euclidean metric and the square metric $\rho(x,y)=\max_i|x_i-y_i|$ on $\mathbb R^n$ both induce the product topology.`, 'metric-topology'],
'20.4': ['Theorem', 'The uniform topology', R`On $\mathbb R^J$ the uniform topology is finer than the product topology and coarser than the box topology; if $J$ is infinite, the three are all different.`, 'product-vs-box'],
'21.4': ['Lemma', 'Arithmetic is continuous', R`Addition, subtraction and multiplication $\mathbb R\times\mathbb R\to\mathbb R$ are continuous, and so is the quotient $(x,y)\mapsto x/y$ on $\mathbb R\times(\mathbb R\setminus\{0\})$.`, 'continuous'],
'21.5': ['Theorem', 'Sums and products of real functions', R`If $f,g:X\to\mathbb R$ are continuous, so are $f+g$, $f-g$ and $f\cdot g$, and $f/g$ is continuous where $g(x)\ne0$ for all $x$.`, 'continuous', R`$f+g$ is the composite of $x\mapsto(f(x),g(x))$, continuous by Theorem 18.4, with addition, continuous by 21.4.`],
'22.1': ['Theorem', 'Restricting a quotient map', R`Let $p:X\to Y$ be a quotient map, $A\subseteq X$ saturated with respect to $p$, and $q:A\to p(A)$ the restriction. If $A$ is open or closed in $X$, or if $p$ is an open map or a closed map, then $q$ is a quotient map.`, 'quotient-map', R`Without these conditions a restriction can fail to be a quotient map; [[hw7-q5]] is such a case.`],
'22.3': ['Corollary', 'The quotient by the fibres of a map', R`Let $g:X\to Z$ be a continuous surjection and $X^*=\{g^{-1}(\{z\}): z\in Z\}$ with the quotient topology. Then $g$ induces a continuous bijection $f:X^*\to Z$, which is a homeomorphism iff $g$ is a quotient map; and if $Z$ is Hausdorff, so is $X^*$.`, 'maps-out-of-quotients', R`Part (b) is [[hw6-q5]]: pull back disjoint open sets of $Z$ through $f$.`],
'24.2': ['Corollary', 'The real line is connected', R`$\mathbb R$ is connected, and so is every interval and ray in $\mathbb R$.`, 'connected-reals'],
'19.3': ['Theorem', 'Products of subspaces', R`If $A_\alpha$ is a subspace of $X_\alpha$ for each $\alpha$, then $\prod A_\alpha$ is a subspace of $\prod X_\alpha$ when both carry the product topology (or both the box topology).`, 'products-and-subspaces'],
'19.4': ['Theorem', 'Products of Hausdorff spaces', R`A product of Hausdorff spaces is Hausdorff, in the box or the product topology.`, 'products-hausdorff-closure'],
'19.5': ['Theorem', 'Closure in a product', R`$\overline{\prod A_\alpha}=\prod\overline{A_\alpha}$, in the box or the product topology.`, 'products-hausdorff-closure'],
'19.6': ['Theorem', 'Maps into products', R`$f:A\to\prod X_\alpha$, $f(a)=(f_\alpha(a))_\alpha$, with the product topology on the target: $f$ is continuous iff every coordinate function $f_\alpha$ is continuous.`, 'maps-into-products', R`$f^{-1}(\pi_\beta^{-1}(U))=f_\beta^{-1}(U)$, and the sets $\pi_\beta^{-1}(U)$ form a subbasis for the product topology. The box topology has no such subbasis, which is why the theorem fails there.`],
'20.5': ['Theorem', 'A metric for the product topology on ℝ^ω', R`$D(x,y)=\sup_i \bar d(x_i,y_i)/i$, with $\bar d(a,b)=\min(|a-b|,1)$, induces the product topology on $\mathbb R^\omega$.`, 'metrizable'],
'21.1': ['Theorem', 'ε–δ continuity', R`For metric spaces, $f:X\to Y$ is continuous iff for each $x$ and $\varepsilon>0$ there is $\delta>0$ with $d_X(x,y)\lt\delta\Rightarrow d_Y(f(x),f(y))\lt\varepsilon$.`, 'epsilon-delta'],
'21.2': ['Lemma', 'The sequence lemma', R`If a sequence of points of $A$ converges to $x$, then $x\in\overline A$; the converse holds if $X$ is metrizable.`, 'sequence-lemma'],
'21.3': ['Theorem', 'Continuity by sequences', R`If $f$ is continuous, then $x_n\to x$ implies $f(x_n)\to f(x)$; the converse holds if $X$ is metrizable.`, 'sequence-lemma'],
'21.6': ['Theorem', 'Uniform limit theorem', R`A uniform limit of continuous functions into a metric space is continuous.`, 'uniform-limit'],
'22.2': ['Theorem', 'Maps out of a quotient', R`Let $p:X\to Y$ be a quotient map and $g:X\to Z$ continuous and constant on each fibre $p^{-1}(\{y\})$. Then $g$ induces $f:Y\to Z$ with $f\circ p=g$; $f$ is continuous iff $g$ is, and $f$ is a quotient map iff $g$ is.`, 'maps-out-of-quotients'],
'23.1': ['Lemma', 'Separations of a subspace', R`If $Y$ is a subspace of $X$, a separation of $Y$ is a pair of disjoint nonempty sets $A,B$ with $A\cup B=Y$, neither containing a limit point of the other. $Y$ is connected iff it has no separation.`, 'connected'],
'23.2': ['Lemma', 'Connected pieces lie on one side', R`If $C,D$ form a separation of $X$ and $Y$ is a connected subspace of $X$, then $Y\subseteq C$ or $Y\subseteq D$.`, 'connected', R`Otherwise $Y\cap C$ and $Y\cap D$ would be disjoint nonempty sets, open in $Y$, covering $Y$: a separation of $Y$.`],
'23.3': ['Theorem', 'Unions through a common point', R`The union of a collection of connected subspaces of $X$ that have a point in common is connected.`, 'connected', R`If $U,V$ separated the union, the common point $p$ lies in one of them, say $U$; by 23.2 each piece lies in $U$, so $V$ is empty.`],
'23.4': ['Theorem', 'Between a set and its closure', R`If $A$ is a connected subspace of $X$ and $A\subseteq B\subseteq\overline A$, then $B$ is connected.`, 'connected'],
'23.5': ['Theorem', 'Continuous images', R`The image of a connected space under a continuous map is connected.`, 'connected', R`If $U,V$ separated $f(X)$, then $f^{-1}(U),f^{-1}(V)$ would separate $X$.`],
'23.6': ['Theorem', 'Finite products', R`A finite Cartesian product of connected spaces is connected.`, 'connected', R`For $X\times Y$: fix $(a,b)$; each $T_x=(X\times\{b\})\cup(\{x\}\times Y)$ is connected (23.3) and contains $(a,b)$; their union is $X\times Y$. Compare [[hw8-q5]].`],
'24.1': ['Theorem', 'Intervals are connected', R`A linear continuum in the order topology is connected, and so are its intervals and rays. In particular $\mathbb R$ and every interval and ray in $\mathbb R$ are connected.`, 'connected-reals'],
'24.3': ['Theorem', 'Intermediate value theorem', R`If $f:X\to Y$ is continuous, $X$ connected and $Y$ ordered (order topology), then for $a,b\in X$ and any $r$ between $f(a)$ and $f(b)$ there is $c\in X$ with $f(c)=r$.`, 'connected-reals'],
'26.2': ['Theorem', 'Closed in compact', R`Every closed subspace of a compact space is compact.`, 'compact'],
'26.3': ['Theorem', 'Compact in Hausdorff', R`Every compact subspace of a Hausdorff space is closed.`, 'compact'],
'26.5': ['Theorem', 'Continuous images', R`The image of a compact space under a continuous map is compact.`, 'compact'],
'26.6': ['Theorem', 'Compact to Hausdorff', R`A continuous bijection from a compact space to a Hausdorff space is a homeomorphism.`, 'compact'],
'26.7': ['Theorem', 'Finite products', R`The product of finitely many compact spaces is compact.`, 'compact'],
'27.1': ['Theorem', 'Closed intervals are compact', R`In an ordered set with the least upper bound property, every closed interval is compact; in particular $[a,b]\subset\mathbb R$.`, 'compact-reals'],
'27.3': ['Theorem', 'Heine–Borel', R`A subspace of $\mathbb R^n$ is compact iff it is closed and bounded.`, 'compact-reals'],
'27.4': ['Theorem', 'Extreme value theorem', R`A continuous $f:X\to Y$ from a compact space to an ordered space attains a minimum and a maximum.`, 'compact-reals'],
'27.5': ['Lemma', 'Lebesgue number lemma', R`For an open cover of a compact metric space there is $\delta>0$ such that every set of diameter less than $\delta$ lies in one member of the cover.`, 'compact-reals'],
'27.6': ['Theorem', 'Uniform continuity', R`A continuous map from a compact metric space to a metric space is uniformly continuous.`, 'compact-reals'],
'28.1': ['Theorem', 'Compact implies limit point compact', R`Compactness implies limit point compactness, but not conversely.`, 'limit-point-compact'],
'28.2': ['Theorem', 'Compactness in metric spaces', R`For a metrizable space, compact, limit point compact and sequentially compact are equivalent.`, 'limit-point-compact']
