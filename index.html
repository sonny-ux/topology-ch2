A['coordinate-function'] = {title: 'Coordinate functions', kind: 'definition', where: '§18–19', pre: ['projections', 'product-topology'],
  lede: R`The pieces of a map into a product: for $f:A\to\prod X_\alpha$, the coordinate function $f_\alpha=\pi_\alpha\circ f$ records only the $\alpha$-th coordinate of $f(a)$.`,
  sections: [
  ['What it is', R`<p>A point of a product is a list of coordinates, one from each factor. So a map <em>into</em> a product produces, for each input, a whole list. The coordinate functions read off that list one entry at a time: $f_1$ gives the first coordinate, $f_2$ the second, and so on. Knowing all of them is the same as knowing $f$.</p>`],
  ['Definition', R`<p>Let $f:A\to\prod_{\alpha\in J}X_\alpha$ and let $\pi_\beta:\prod X_\alpha\to X_\beta$ be the projection onto the $\beta$-th factor ([[projections]]). The <b>coordinate function</b> of $f$ for the index $\beta$ is</p>$$f_\beta=\pi_\beta\circ f:A\to X_\beta,\qquad f_\beta(a)=\text{the }\beta\text{-th coordinate of } f(a).$$<p>The small circle $\circ$ is <b>composition</b>, read aloud as "$\pi_\beta$ composed with $f$" or "$\pi_\beta$ after $f$". It means: do $f$ first, then $\pi_\beta$. So $(\pi_\beta\circ f)(a)=\pi_\beta(f(a))$: take the point $a$, send it into the product with $f$, then read off coordinate $\beta$. Composites are read right to left, in the order the maps are applied.</p><p>Conversely, any family of functions $f_\alpha:A\to X_\alpha$ defines one map into the product, $f(a)=(f_\alpha(a))_{\alpha\in J}$, and its coordinate functions are the $f_\alpha$ (Munkres §19). For two factors one writes $f(a)=(f_1(a),f_2(a))$ (Theorem 18.4).</p>`],
  ['Facts to keep in mind', R`<ul class="facts"><li><b>A map into a product is the same thing as a family of coordinate functions</b>: $f\leftrightarrow(f_\alpha)_\alpha$.</li><li><b>Continuity is checked coordinate by coordinate</b> (Theorem 19.6, product topology only): $f$ is continuous iff every $f_\alpha$ is ([[maps-into-products]]).</li><li>The coordinate functions of a projection $\pi_\beta$ itself: only one, and it is $\pi_\beta$. The coordinate functions of the identity of $X\times Y$ are $\pi_1$ and $\pi_2$.</li><li>Constant maps and the identity are the most common coordinate functions: they make slices and diagonals continuous.</li><li>In the box topology, continuous coordinate functions do <em>not</em> make $f$ continuous ([[product-vs-box]]).</li></ul>`],
  ['Worked examples', R`<p><b>A slice.</b> $i:Y\to X\times Y$, $i(y)=(x_0,y)$. Its coordinate functions are the constant map $y\mapsto x_0$ and the identity $y\mapsto y$, both continuous, so $i$ is continuous and its image $\{x_0\}\times Y$ is a copy of $Y$ ([[hw8-q5]]).</p>
<p><b>A path in a product.</b> $\gamma(t)=(\gamma_j(t))_{j\in J}$: the coordinate functions are the paths $\gamma_j$, so $\gamma$ is continuous ([[hw8-q3]]).</p>
<p><b>A straight line in the plane.</b> $\gamma(t)=((1-t)x_1+ty_1,\ (1-t)x_2+ty_2)$: each coordinate is a polynomial in $t$, so $\gamma$ is continuous ([[path-connected]]).</p>
<p><b>The diagonal.</b> $\Delta:X\to X\times X$, $\Delta(x)=(x,x)$: both coordinate functions are the identity, so $\Delta$ is continuous.</p>`],
  ['Why it is set up this way', R`<p>The product topology is designed so that a map into a product is continuous exactly when its coordinates are (it is the coarsest topology making all projections continuous; [[defining-by-maps]]). This turns a hard question about open sets in a product into several easy questions about the factors.</p>`],
  ['Where it sits', R`<p>Introduced with products (§15, two factors; §19, any number). It is used whenever a map lands in a product: paths in $\mathbb R^n$, slices, homeomorphisms between products ([[hw4-q2]]), and later in homotopies $X\times[0,1]\to Y$.</p>`]]};
A['ex-rationals'] = {title: 'ℚ, the rationals', kind: 'example', where: '§23', pre: ['subspace-topology', 'connected'],
  lede: R`The rational numbers as a subspace of $\mathbb R$: dense in the line, yet broken into single points.`,
  sections: [['What it is', R`<p>$\mathbb Q\subset\mathbb R$ with the subspace topology. Its open sets are $\mathbb Q\cap U$ for $U$ open in $\mathbb R$.</p>`],
   ['Facts to keep in mind', R`<ul class="facts"><li><b>Not connected:</b> $\mathbb Q\cap(-\infty,\sqrt2)$ and $\mathbb Q\cap(\sqrt2,\infty)$ separate it, because $\sqrt2\notin\mathbb Q$.</li><li><b>Totally disconnected:</b> the only connected subsets are single points; any two rationals have an irrational between them, which splits any set containing both.</li><li><b>No single point is open</b> ([[mt-q1]]): every interval around a rational contains other rationals. So it is far from discrete even though its components are points.</li><li>Hausdorff and metrizable (a subspace of $\mathbb R$); dense in $\mathbb R$: $\overline{\mathbb Q}=\mathbb R$.</li></ul>`],
   ['Why it matters', R`<p>It shows that connectedness of intervals (Theorem 24.1) depends on the completeness of $\mathbb R$: remove the irrationals and the line falls apart. It is also the standard counterexample for "every point open" versus "every component a point".</p>`]]};
A['ex-sine-curve'] = {title: "The topologist's sine curve", kind: 'example', where: '§24', pre: ['connected', 'path-connected', 'closure'],
  lede: R`The graph of $\sin(1/x)$ for $0\lt x\le1$ together with the segment $\{0\}\times[-1,1]$: connected, but not path connected.`,
  sections: [['What it is', R`<p>Let $S=\{(x,\sin\tfrac1x): 0\lt x\le1\}$, the graph, which oscillates faster and faster as $x\to0$. Its closure in $\mathbb R^2$ is $\overline S=S\cup(\{0\}\times[-1,1])$: the wiggles pile up on the whole vertical segment.</p>`],

olor">segment {0} × [−1, 1]</text><text x="323" y="24" font-size="15" text-anchor="middle" fill="currentColor">graph S: y = sin(1/x), 0 &lt; x ≤ 1</text></svg><p>The graph (thin) and the segment it piles up on (thick). Every point of the segment is a limit of points of the graph, which is why the closure adds it, and why a path can never cross from one to the other.</p>`],
   ['Facts to keep in mind', R`<ul class="facts"><li><b>Connected:</b> $S$ is a continuous image of $(0,1]$, hence connected (23.5); $\overline S$ is the closure of a connected set, so it is connected too (23.4).</li><li><b>Not path connected:</b> no path joins a point of the segment to a point of the graph. The full proof is below.</li><li>Compact, Hausdorff and metrizable (a closed bounded subset of $\mathbb R^2$).</li><li><b>One component, two [[path-components|path components]]:</b> the graph $S$ and the segment. The graph's path component is not closed.</li><li><b>Not [[local-connectedness|locally connected]]:</b> a small ball around a point of the segment meets the curve in infinitely many separate arcs.</li></ul>`],
   ['In lecture (11/9)', R`<p>The lecture writes the curve as the image of $f:(0,\infty)\to\mathbb R^2$, $f(t)=(t,\sin\tfrac1t)$: $S=\{(t,\sin\tfrac1t): t\gt0\}$. $f$ is continuous (its coordinates are continuous) and $(0,\infty)$ is connected, so $S$ is connected (23.5); its closure adds the segment $\{0\}\times[-1,1]$. Whether the domain is $(0,1]$ (Munkres) or $(0,\infty)$ (lecture) changes nothing near $t=0$, which is where everything happens.</p>`],
  ['Proof that it is not path connected', R`<p>Suppose $\gamma:[0,1]\to\overline S$ is a path from a point of the segment $\{0\}\times[-1,1]$ to a point of the graph $S$. Write $\gamma(t)=(x(t),y(t))$; both coordinates are continuous.</p>
<p><b>The last moment on the segment.</b> The set of times spent on the segment, $\{t: x(t)=0\}$, is closed (the preimage of the closed set $\{0\}$ under the continuous $x$) and nonempty, so it has a largest element $T\lt1$. For every $t\gt T$ the point $\gamma(t)$ is on the graph, so $x(t)\gt0$ and $y(t)=\sin(1/x(t))$.</p>
<p><b>Forcing wild values just after $T$.</b> Fix $n$. On $[T,T+\tfrac1n]$ the continuous function $x$ goes from $x(T)=0$ to some positive value $x(T+\tfrac1n)=b$. By the intermediate value theorem ([[ivt]]) it takes every value in $(0,b]$ on that interval. Choose $u$ in $(0,b]$ with $\sin(1/u)=(-1)^n$ (such $u$ exist arbitrarily close to $0$: $u=1/(\tfrac\pi2+k\pi)$ for large $k$, with $k$ chosen to get the right sign). So there is $t_n\in(T,T+\tfrac1n]$ with $x(t_n)=u$, hence $y(t_n)=(-1)^n$.</p>
<p><b>Contradiction.</b> $t_n\to T$, so by continuity $y(t_n)\to y(T)$. But $y(t_n)$ alternates between $1$ and $-1$ and converges to nothing. So no such path exists. $\blacksquare$</p>
<p>In words: to reach the segment, the path would have to follow the curve's oscillations, which become infinitely fast near $x=0$, and a continuous path can only make finitely fast progress.</p>`],
  ['Why it matters', R`<p>It is the standard example that connected does not imply path connected, so the two notions really are different ([[path-connected]]).</p>`]]};
A['ex-box-rw'] = {title: 'ℝ^ω with the box topology', kind: 'example', where: '§19', pre: ['product-vs-box'],
  lede: R`Countably many copies of $\mathbb R$, with every coordinate allowed to be restricted at once. Theorem 19.6 fails here.`,
  sections: [['What it is', R`<p>$\mathbb R^\omega=\prod_{n\ge1}\mathbb R$, the sequences $(x_1,x_2,\dots)$, with basis all products $\prod(a_n,b_n)$ ([[product-vs-box]]).</p>`],
   ['Facts to keep in mind', R`<ul class="facts"><li><b>Maps into it are not checked coordinatewise:</b> $f(t)=(t,t,t,\dots)$ has continuous coordinates, but $f^{-1}(\prod(-\tfrac1n,\tfrac1n))=\{0\}$ is not open in $\mathbb R$.</li><li><b>Not connected</b> (Munkres §23): the bounded sequences and the unbounded sequences are both open and together cover it.</li><li>Hausdorff (19.4), but not metrizable (Munkres §21).</li></ul>`],
   ['Why it matters', R`<p>It is the reason the product topology, not the box topology, is the standard one on infinite products: the box topology breaks the theorems you want ([[maps-into-products]]).</p>`]]};
A['gallery'] = {title: 'Gallery of spaces', kind: 'idea', where: 'Reference', pre: [],
  lede: 'The standard and strange spaces of the course in one place, with what each one is good for. Most true-or-false questions are settled by testing them against this list.',
  sections: [
  ['How to use it', R`<p>When a claim says "every space with property $P$ has property $Q$", run through these spaces before trying to prove it; a counterexample usually appears in the first few ([[m-true-false]]). When proving, they show which hypotheses are really needed.</p>`],
  ['At a glance', R`<table><tr><th>Space</th><th>Connected</th><th>Path conn.</th><th>Hausdorff</th><th>Metrizable</th></tr>
<tr><td>[[ex-real-line|ℝ]], $[0,1]$, $\mathbb R^n$</td><td>yes</td><td>yes</td><td>yes</td><td>yes</td></tr>
<tr><td>[[ex-rationals|ℚ]]</td><td>no</td><td>no</td><td>yes</td><td>yes</td></tr>
<tr><td>$\mathbb R\setminus\{0\}$</td><td>no</td><td>no</td><td>yes</td><td>yes</td></tr>
<tr><td>[[ex-discrete|Discrete]] (2+ points)</td><td>no</td><td>no</td><td>yes</td><td>yes</td></tr>
<tr><td>[[ex-indiscrete|Indiscrete]] (2+ points)</td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td>[[ex-sierpinski|Sierpiński space]]</td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td>[[ex-finite-complement|Finite complement]] (infinite set)</td><td>yes</td><td>depends on size</td><td>no</td><td>no</td></tr>
<tr><td>[[ex-lower-limit|ℝ_ℓ]]</td><td>no</td><td>no</td><td>yes</td><td>no</td></tr>
<tr><td>[[ex-two-origins|Line with two origins]]</td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td>[[ex-crush-open|ℝ/(0,1)]]</td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td>[[ex-circle|Circle]] $[0,1]/(0\sim1)$</td><td>yes</td><td>yes</td><td>yes</td><td>yes</td></tr>
<tr><td>[[ex-sine-curve|Topologist's sine curve]]</td><td>yes</td><td>no</td><td>yes</td><td>yes</td></tr>
<tr><td>[[ex-box-rw|ℝ^ω, box topology]]</td><td>no</td><td>no</td><td>yes</td><td>no</td></tr></table>`],
  ['Model spaces', R`<p><b>[[ex-real-line|ℝ]] and its intervals.</b> The space every definition is first tested on: connected, Hausdorff, metric. <b>$[0,1]$</b> adds compactness and is the domain of every path. <b>$\mathbb R^n$</b> is the product of $n$ lines (20.3). <b>The [[ex-circle|circle]]</b> is $[0,1]$ with its ends glued; it is the first space with a hole, which the fundamental group (Ch. 9) detects.</p>`],
  ['Small spaces that break rules', R`<p><b>[[ex-discrete|Discrete]]:</b> every set open; every map out of it continuous; falls apart into points. <b>[[ex-indiscrete|Indiscrete]]:</b> only $\varnothing$ and $X$ open; every map into it continuous; cannot tell points apart. <b>[[ex-sierpinski|Sierpiński space]]:</b> two points, one open; connected and path connected but not Hausdorff ([[hw8-q4]]). Finite spaces are where to check a definition by hand ([[m-finite]]).</p>`],
  ['Strange topologies on the line', R`<p><b>[[ex-lower-limit|ℝ_ℓ]]:</b> basis $[a,b)$; finer than the usual line, Hausdorff, but not connected, since $[a,b)$ is both open and closed. <b>[[ex-k-topology|ℝ_K]]:</b> the usual line with $K=\{1/n\}$ made closed; Hausdorff, finer than $\mathbb R$, incomparable with ℝ_ℓ (Lemma 13.4). <b>[[ex-finite-complement|Finite complement topology]]:</b> open sets are complements of finite sets; points are closed but no two nonempty open sets are disjoint, so it is $T_1$ but not Hausdorff, and a sequence of distinct points converges to every point.</p>`],
  ['Built by gluing', R`<p><b>[[ex-crush-open|ℝ/(0,1)]]:</b> crushing a set that is not closed gives a quotient of a Hausdorff space that is not Hausdorff. <b>[[ex-two-origins|Line with two origins]]:</b> looks like $\mathbb R$ near every point, yet two points cannot be separated. <b>The sign map quotient</b> $\{-1,0,1\}$ ([[hw6-q1]]): a three-point space where $0$ is stuck to both sides. <b>The square pieces</b> of [[hw6-q3]] and [[hw7-q5]]: quotient and subspace topologies on the same set can differ.</p>`],
  ['Connected, but not in the way you expect', R`<p><b>[[ex-sine-curve|Topologist's sine curve]]:</b> connected but not path connected. <b>[[ex-rationals|ℚ]]:</b> dense in the line, but only single points are connected. <b>$(X\times Y)\setminus(A\times B)$</b> ([[hw8-q5]]): stays connected however much is removed, as long as $A$ and $B$ are proper subsets.</p>`],
  ['Infinite products', R`<p><b>[[ex-box-rw|ℝ^ω with the box topology]]:</b> coordinatewise continuity fails, and the space is not connected. <b>$\prod_J\{0,1\}$ with the product topology</b> ([[hw3-q5]], [[hw4-q4]]): points are subsets of $J$; neighbourhoods restrict finitely many coordinates; not metrizable when $J$ is uncountable. <b>The hyperbola $xy=1$</b> in $\mathbb R^2$ ([[hw7-q3]]): a closed set whose projection is not closed.</p>`]]};
A['ivt'] = {title: 'The intermediate value theorem (Theorem 24.3)', kind: 'theorem', where: '§24', pre: ['connected', 'continuous', 'connected-reals'],
  lede: R`A continuous real function on a connected space takes every value between any two of its values. The calculus theorem, seen as a fact about connectedness.`,
  sections: [
  ['Statement', R`<p><b>Theorem 24.3 (Munkres).</b> Let $f:X\to Y$ be continuous, where $X$ is connected and $Y$ is an ordered set with the [[order-topology|order topology]] (for instance $Y=\mathbb R$). The order on $Y$ is what gives "between" a meaning; the order topology is the topology built from that order, whose basic open sets are the open intervals $(a,b)=\{y: a\lt y\lt b\}$. For $Y=\mathbb R$ it is the usual topology. If $a,b\in X$ and $r$ lies between $f(a)$ and $f(b)$, then there is $c\in X$ with $f(c)=r$.</p>`],
  ['From calculus to topology', R`<p>In calculus the theorem reads: a continuous $f:[a,b]\to\mathbb R$ takes every value between $f(a)$ and $f(b)$. Its usual proof uses least upper bounds directly. The topological version splits that proof into two independent facts:</p><ol><li><b>$[a,b]$ is connected</b> (Theorem 24.1). This is where the completeness of $\mathbb R$ is used, once and for all.</li><li><b>A continuous image of a connected space is connected</b> (Theorem 23.5), and a connected subset of $\mathbb R$ cannot skip a value.</li></ol><p>Nothing about intervals, derivatives or formulas is needed beyond these. So the theorem holds for any connected domain: a disc, a sphere, a path connected space, the [[ex-sine-curve|topologist's sine curve]].</p>`],
  ['Proof', R`<p><b>What $r$ is.</b> $r$ is not an arbitrary number. It is the particular value in the statement: a point of $Y$ lying strictly between $f(a)$ and $f(b)$. By relabelling $a$ and $b$ if necessary, assume $f(a)\lt r\lt f(b)$. (If $r$ equals $f(a)$ or $f(b)$, take $c=a$ or $c=b$ and there is nothing to prove.) The proof is by contradiction: assume $r$ is <em>not</em> a value of $f$, that is, $f(c)\ne r$ for every $c\in X$.</p>
<p><b>Step 1: the image is connected.</b> Give $f(X)$ the subspace topology from $Y$. The map $f:X\to f(X)$, with its range restricted to the image, is still continuous (Theorem 18.2) and is surjective. $X$ is connected, so its continuous image $f(X)$ is connected (Theorem 23.5). <em>This is the only place connectedness is used.</em></p>
<p><b>Step 2: cut the image at $r$.</b> Define</p>$$A=f(X)\cap(-\infty,r),\qquad B=f(X)\cap(r,\infty),$$<p>the values of $f$ below $r$ and the values above $r$. We check that $A,B$ form a separation of $f(X)$; each of the four requirements has its own reason.</p>
<p><b>Open in $f(X)$.</b> This is about the topology of $Y$, not about connectedness. In the [[order-topology|order topology]], the ray $(-\infty,r)=\{y: y\lt r\}$ is open: it is the union of the open intervals $(a',r)$ over all $a'\lt r$ (together with $[a_0,r)$ if $Y$ has a least element $a_0$), and unions of basis elements are open. Likewise $(r,\infty)$ is open. In the subspace topology on $f(X)$, a set of the form $f(X)\cap U$ with $U$ open in $Y$ is open in $f(X)$ by definition ([[subspace-topology]]). So $A$ and $B$ are open in $f(X)$.</p>
<p><b>Disjoint.</b> No $y$ satisfies both $y\lt r$ and $y\gt r$, so $A\cap B=\varnothing$.</p>
<p><b>Cover $f(X)$.</b> In a simple order every $y$ satisfies exactly one of $y\lt r$, $y=r$, $y\gt r$. For $y\in f(X)$ the middle case is excluded by the assumption that $r$ is not a value of $f$. So every $y\in f(X)$ lies in $A$ or in $B$: $A\cup B=f(X)$. <em>This is where the assumption is used.</em></p>
<p><b>Nonempty.</b> $f(a)\in f(X)$ and $f(a)\lt r$, so $f(a)\in A$. $f(b)\in f(X)$ and $f(b)\gt r$, so $f(b)\in B$. <em>This is where "$r$ lies between $f(a)$ and $f(b)$" is used.</em></p>
<p><b>Step 3: contradiction.</b> $A,B$ are disjoint nonempty open subsets of $f(X)$ whose union is $f(X)$: a separation of $f(X)$. This contradicts Step 1. Hence the assumption was false, and some $c\in X$ has $f(c)=r$. $\blacksquare$</p>
<p><b>Where each hypothesis went.</b> Continuity of $f$ and connectedness of $X$: Step 1. The order on $Y$: to cut at $r$ and to know the rays are open. "$r$ between $f(a)$ and $f(b)$": nonemptiness. The contradiction assumption: covering. A missed value would be a cut in the image, and a connected set cannot be cut.</p>`],
  ['Examples', R`<p><b>Roots.</b> $f(x)=x^3+x-1$ on $[0,1]$: $f(0)=-1\lt0\lt1=f(1)$, so $f$ has a root in $(0,1)$.</p><p><b>A fixed point theorem.</b> Every continuous $g:[0,1]\to[0,1]$ has a point with $g(c)=c$. Apply the theorem to $f(x)=g(x)-x$: $f(0)=g(0)\ge0$ and $f(1)=g(1)-1\le0$, so $f(c)=0$ somewhere. (This is the one-dimensional case of Brouwer's fixed point theorem.)</p><p><b>On a non-interval.</b> If $f:S^1\to\mathbb R$ is continuous on the circle, then some pair of opposite points has equal values: apply the theorem to $h(x)=f(x)-f(-x)$, which takes both signs or is zero, on the connected circle.</p>`],
  ['Non-examples, and why they fail', R`<p><b>A disconnected domain.</b> $f(x)=x/|x|$ on $\mathbb R\setminus\{0\}$ is continuous, takes the values $-1$ and $1$, and never takes $0$. The domain is not connected, so the theorem does not apply.</p><p><b>The rationals.</b> $f(x)=x^2-2$ on $\mathbb Q\cap[0,2]$ is continuous, with $f(0)=-2\lt0\lt2=f(2)$, but no rational $c$ has $c^2=2$. The domain $\mathbb Q\cap[0,2]$ is not connected ([[ex-rationals]]): the missing point $\sqrt2$ is exactly where the value $0$ would be.</p>`],
  ['History: from Bolzano to connectedness', R`<p><b>Before proofs.</b> Simon Stevin (late 16th century) handled the polynomial case by an algorithm that produces the root's decimal expansion digit by digit. For two centuries afterwards the general statement was treated as geometrically obvious: a curve that starts below a line and ends above it must cross it.</p>
<p><b>Bolzano, 1817.</b> Bernard Bolzano gave the first proof, in a paper titled "purely analytic proof", meaning a proof from a definition of continuity by inequalities rather than from pictures. The theorem is still sometimes called <b>Bolzano's theorem</b>. His argument rested on a property of the real numbers he could not fully establish: that sequences whose terms get arbitrarily close together converge (what are now called Cauchy sequences).</p>
<p><b>Cauchy, 1821.</b> Augustin-Louis Cauchy gave the formulation taught in calculus, with a proof, in his <em>Cours d'analyse</em>, accepting that same convergence property without proof. Both Bolzano and Cauchy were trying to put analysis on definitions instead of geometric intuition.</p>
<p><b>Completeness of ℝ, 1870s.</b> The missing foundation, a precise construction of the real numbers with no gaps, came from Richard Dedekind (cuts, 1872) and others. This is the least upper bound property that Munkres uses to prove intervals are connected (Theorem 24.1).</p>
<p><b>Connectedness, 1911–1921.</b> The definition used today, "cannot be split into two disjoint nonempty open pieces", was given by N. J. Lennes in 1911, while working on the Jordan curve theorem, and independently by Frigyes Riesz and Felix Hausdorff, whose 1914 <em>Grundzüge der Mengenlehre</em> spread it in Europe; it is sometimes called the Hausdorff–Lennes condition. Bronisław Knaster and Kazimierz Kuratowski (1921) were among the first to study connected sets for their own sake, including how connectedness behaves under unions and in subspaces, the facts behind Theorems 23.3 and 23.1.</p>
<p><b>How the old theorem fits the new idea.</b> Once connectedness is defined and continuous images of connected spaces are known to be connected, Bolzano's theorem splits into two pieces: the completeness of ℝ makes intervals connected, and continuity carries connectedness to the image. This is the arrangement in Munkres §23–24. Describing it as "the topological meaning" of the theorem is an interpretation of that arrangement rather than a claim made by any one of the people above.</p>
<p class="foot">Sources for the dates and attributions: Wikipedia, "Intermediate value theorem" (Stevin, Bolzano 1817, Cauchy 1821); Anderson and Katz, "Evolution of the topological concept of 'connected'", in <em>Who Gave You the Epsilon?</em> (MAA), and Wikipedia, "Connected space" (Lennes 1911, Riesz, Hausdorff 1914, Knaster–Kuratowski 1921). Dedekind 1872 is standard history of analysis.</p>`],
  ['Why it matters', R`<p>It shows what the theorem is really about: not functions or limits, but the shape of the domain. Connectedness is the property that makes "you cannot get from one value to another without passing through everything in between" true. It is also the first use of connectedness to distinguish spaces: a continuous injection from an interval cannot skip values, which underlies arguments such as "removing a point disconnects $\mathbb R$ but not $\mathbb R^2$, so they are not homeomorphic".</p>`]]};
A['components'] = {title: 'Components', kind: 'definition', where: '§25', pre: ['connected', 'relation-equivalence', 'partition'],
  lede: 'The maximal connected pieces of a space. Every space splits into them, in exactly one way.',
  sections: [
  ['What it is', R`<p>A space that is not connected still falls into pieces that are. The <b>components</b> are those pieces taken as large as possible: the component of a point is everything that can be reached from it without crossing a cut. $\mathbb R\setminus\{0\}$ has two components, the two half-lines; $\mathbb R$ has one; a discrete space has one for each point.</p>`],
  ['Definition', R`<p>On a space $X$, write $x\sim y$ if there is a connected subspace of $X$ containing both $x$ and $y$. This is an [[relation-equivalence|equivalence relation]]; its classes are the <b>components</b> (or connected components) of $X$ (Munkres §25).</p>`],
  ['Examples', R`<ul class="facts"><li>$\mathbb R$, $[0,1]$, $\mathbb R^n$, any connected space: one component, the whole space.</li><li>$\mathbb R\setminus\{0\}$: two components, $(-\infty,0)$ and $(0,\infty)$.</li><li>A discrete space: each point is its own component.</li><li>[[ex-rationals|ℚ]]: each point is its own component, although no point is open (totally disconnected).</li><li>The [[ex-sine-curve|topologist's sine curve]]: one component (it is connected), but two [[path-components]].</li><li>$\{0,1,2\}$ with open sets $\varnothing,\{0,1\},\{2\},X$ ([[mt2-q4]]): two components, $\{0,1\}$ and $\{2\}$.</li><li>$\mathbb R\setminus\mathbb Z=\bigcup_{n\in\mathbb Z}(n,n+1)$: the open intervals are both the components and the path components (lecture 11/9).</li><li><b>A component that is not open</b> (lecture 11/9): $X=\{0\}\cup\{\tfrac1n: n\ge1\}\subset\mathbb R$. Each $\tfrac1n$ is isolated (a small interval around it meets $X$ only in $\tfrac1n$), so $\{\tfrac1n\}$ is open and closed in $X$ and is a component. The point $0$ cannot be joined to anything: any set containing $0$ and some $\tfrac1n$ is split by the open-and-closed set $\{\tfrac1n\}$. So $\{0\}$ is the component of $0$, and it is <em>not</em> open in $X$, since every interval around $0$ contains points $\tfrac1n$. A space with infinitely many components, not discrete.</li></ul>`],
  ['Why this is an equivalence relation', R`<p><b>Reflexive:</b> $\{x\}$ is connected and contains $x$. <b>Symmetric:</b> the definition does not care about order. <b>Transitive:</b> if $A$ is connected and contains $x,y$, and $B$ is connected and contains $y,z$, then $A\cup B$ is connected, since both contain $y$ (Theorem 23.3), and it contains $x$ and $z$.</p>`],
  ['Facts to keep in mind', R`<ul class="facts"><li>The components are connected, pairwise disjoint, and their union is $X$: they <b>partition</b> $X$ (Theorem 25.1).</li><li>Every connected subspace lies inside exactly one component (25.1). So the component of $x$ is the <b>largest</b> connected subspace containing $x$.</li><li><b>Components are closed:</b> the closure of a connected set is connected (23.4), so a component already contains its closure.</li><li>Components need not be open: in ℚ the components are single points, which are not open; in $\{0\}\cup\{\tfrac1n\}$ the component $\{0\}$ is not open (lecture 11/9). They are open when $X$ is [[local-connectedness|locally connected]] (25.3).</li><li>$X$ is connected iff it has exactly one component.</li><li>Homeomorphisms carry components to components, so the number of components is a topological invariant: $\mathbb R\setminus\{0\}$ (two) is not homeomorphic to $\mathbb R$ (one).</li></ul>`],
  ['Link to HW8 Q2', R`<p>The relation of [[hw8-q2]], "every continuous map to $\{0,1\}$ agrees on $x$ and $x'$", is coarser than "lie in a common connected set": a continuous map to $\{0,1\}$ is constant on any connected set ([[hw8-q1]]). So each component lies inside one class of HW8 Q2. <em>Intuition, beyond Munkres's text:</em> those classes are called quasi-components; they are closed for the same reason components are, and can be strictly larger.</p>`],
  ['How to find the components of a space', R`<ol class="facts"><li><b>Guess the pieces</b> from a picture.</li><li><b>Show each piece is connected</b> (an interval, a continuous image of one, a union through a common point: 23.3–23.5).</li><li><b>Show the pieces cannot be joined:</b> each is open and closed in $X$, or a continuous map to $\{0,1\}$ separates them ([[hw8-q1]]). A connected set lies inside one of them.</li><li>Then they are the components (25.1): connected, and each connected set lies in one.</li></ol><p>Example: in $X=[0,1]\cup[2,3]$ the pieces are the two intervals, each connected (24.1) and each open and closed in $X$ ($[0,1]=X\cap(-1,\tfrac32)$ and also $X\cap[-1,\tfrac32]$).</p>`],
  ['Why components are closed', R`<p>Let $C$ be a component. Its closure $\overline C$ is connected, since adding limit points never disconnects (23.4), and it contains $C$. The component $C$ is the largest connected set containing its points (25.1), so $\overline C\subseteq C$. Hence $C=\overline C$ is closed. Open is a different matter: see the examples above, and [[local-connectedness]] for when it holds.</p>`],
  ['Where it sits', R`<p>§25, after connectedness (§23) and path connectedness (§24). It turns the yes/no question "connected?" into a count, "how many pieces?", which is the first numerical invariant of a space. Path components ([[path-components]]) do the same for paths, and lead to the fundamental group (Ch. 9).</p>`]]};
A['path-components'] = {title: 'Path components', kind: 'definition', where: '§25', pre: ['path-connected', 'components'],
  lede: 'The maximal path connected pieces of a space: the classes of "joined by a path".',
  sections: [
  ['What it is', R`<p>The same idea as [[components]], with paths instead of connected sets: the path component of $x$ is everything you can walk to from $x$.</p>`],
  ['Definition', R`<p>Write $x\simeq y$ if there is a path in $X$ from $x$ to $y$. This is an equivalence relation; its classes are the <b>path components</b> of $X$ (Munkres §25).</p>`],
  ['Examples', R`<ul class="facts"><li>A path connected space has one path component.</li><li>$\mathbb R\setminus\{0\}$: two, the same as its components.</li><li>The [[ex-sine-curve|topologist's sine curve]]: one component but <b>two</b> path components, the wiggly graph and the vertical segment.</li></ul>`],
  ['Why this is an equivalence relation', R`<p><b>Reflexive:</b> the constant path. <b>Symmetric:</b> run a path backwards, $t\mapsto\gamma(1-t)$. <b>Transitive:</b> join a path $\gamma$ from $x$ to $y$ and a path $\delta$ from $y$ to $z$ end to end: $\eta(t)=\gamma(2t)$ for $t\le\tfrac12$ and $\eta(t)=\delta(2t-1)$ for $t\ge\tfrac12$. Both pieces are continuous on closed sets and agree at $t=\tfrac12$ (both equal $y$), so $\eta$ is continuous by the [[pasting-lemma]].</p>`],
  ['Facts to keep in mind', R`<ul class="facts"><li>Path components are path connected, pairwise disjoint, and cover $X$; every path connected subspace lies in exactly one (Theorem 25.2).</li><li>Each path component lies inside a component (path connected sets are connected), so there are at least as many path components as components.</li><li>Path components need not be closed or open (the [[ex-sine-curve|sine curve]]'s graph is not closed).</li><li>In a [[local-path-connectedness|locally path connected]] space, such as any open subset of $\mathbb R^n$, components and path components are the same (25.5), and they are open.</li><li><b>Each component is the union of the path components inside it</b> (lecture 11/9): every path component lies in exactly one component, and the path components partition $X$, so a component $C$ is $\bigcup\{A: A \text{ a path component}, A\subseteq C\}$.</li></ul>`],
  ['Components and path components side by side', R`<ul class="facts"><li><b>Defined by:</b> lying in a common connected set; lying on a common path.</li><li><b>Closed?</b> components always; path components not always (the sine curve's graph).</li><li><b>Open?</b> neither in general; components when $X$ is [[local-connectedness|locally connected]] (25.3), path components when $X$ is [[local-path-connectedness|locally path connected]] (25.4).</li><li><b>How many?</b> at least as many path components as components; equal numbers, and the same sets, when $X$ is locally path connected (25.5).</li></ul>`],
  ['Where it sits', R`<p>§25. Path components are the classes of "joined by a path"; counting them is the first step toward the fundamental group (Chapter 9), which studies the paths themselves.</p>`]]};
A['local-connectedness'] = {title: 'Local connectedness', kind: 'definition', where: '§25', pre: ['connected', 'components'],
  lede: 'Connected in the small: every point has arbitrarily small connected neighbourhoods.',
  sections: [
  ['What it is', R`<p>Connectedness is a property of the whole space: it cannot be cut in two. Local connectedness is a property of the view near each point: however closely you zoom in on a point, you can find a connected piece of the space around it. The two are independent. A space can be connected but jagged up close (the [[ex-sine-curve|topologist's sine curve]] near its segment, the [[ex-comb|comb space]] near its left tooth), or disconnected but tidy up close ($\mathbb R\setminus\{0\}$: two pieces, but each point sits inside a small interval).</p>`],
  ['Definition', R`<p>Recall that a <b>neighbourhood</b> of $x$ means an open set containing $x$. A space $X$ is <b>locally connected at $x$</b> if for every neighbourhood $U$ of $x$ there is a <b>connected</b> neighbourhood $V$ of $x$ with $V\subseteq U$. $X$ is <b>locally connected</b> if it is locally connected at every point (Munkres §25).</p>
<p>In words: every neighbourhood of $x$, however small, contains a smaller one that is connected.</p>`],
  ['Examples', R`<ul class="facts"><li><b>The standard example:</b> $\mathbb R$. Any neighbourhood $U$ of $x$ contains an interval $(x-\varepsilon,x+\varepsilon)$, which is connected (24.1). The same works in $\mathbb R^n$ with balls, which are convex, hence connected.</li><li><b>Its contrast:</b> the [[ex-sine-curve|topologist's sine curve]]. It is connected, but at a point $p$ of the vertical segment it is not locally connected: a small ball around $p$ meets the curve in infinitely many separate arcs together with a piece of the segment, and no neighbourhood of $p$ inside that ball is connected.</li><li>$\mathbb R\setminus\{0\}$: locally connected but not connected. The cut at $0$ is global; near any point the space looks like $\mathbb R$.</li><li>Every open subset of $\mathbb R^n$, and every interval: locally connected.</li><li>A discrete space: locally connected, since $\{x\}$ is a connected neighbourhood of $x$ inside any neighbourhood.</li><li>[[ex-rationals|ℚ]]: not locally connected at any point; its only connected subsets are single points, which are not open.</li><li>$X=\{0\}\cup\{\tfrac1n:n\ge1\}$: locally connected at each $\tfrac1n$ (isolated) but not at $0$; every neighbourhood of $0$ contains infinitely many isolated points, so it is not connected.</li><li>The [[ex-comb|comb space]]: path connected, yet not locally connected at the points of its left tooth.</li></ul>`],
  ['Why it is defined this way', R`<p>"Local" properties in topology all have this shape: <em>every neighbourhood of $x$ contains a smaller neighbourhood with the property</em>. Asking for just one connected neighbourhood would say nothing, because the whole of a connected space is a connected neighbourhood of every point; the comb space would pass. The definition asks for connected neighbourhoods at every scale, so it detects what happens as you zoom in.</p>`],
  ['The main theorem: components of open sets are open', R`<p><b>Theorem 25.3.</b> $X$ is locally connected if and only if, for every open set $U$ of $X$, each [[components|component]] of $U$ is open in $X$.</p>
<p><b>Why ($\Rightarrow$).</b> Let $U$ be open and $C$ a component of $U$. Take $x\in C$. Since $U$ is a neighbourhood of $x$ and $X$ is locally connected, there is a connected neighbourhood $V$ of $x$ with $V\subseteq U$. The component $C$ is the largest connected subset of $U$ containing $x$ (25.1), so $V\subseteq C$. Thus every point of $C$ has a neighbourhood inside $C$: $C$ is open.</p>
<p><b>Why ($\Leftarrow$).</b> Let $U$ be a neighbourhood of $x$ and $C$ the component of $U$ containing $x$. By hypothesis $C$ is open, and it is connected and contains $x$. So $C$ is a connected neighbourhood of $x$ inside $U$.</p>
<p><b>How it is used.</b> It turns a local condition into a statement about pieces: in a locally connected space, cutting out any open set leaves open pieces. With $U=X$: <b>the components of a locally connected space are open</b> (and closed, as all components are).</p>`],
  ['A consequence: open subsets of ℝ', R`<p>Every open set $U\subseteq\mathbb R$ is a disjoint union of countably many open intervals. <b>Why:</b> $\mathbb R$ is locally connected, so each component of $U$ is open (25.3); a connected subset of $\mathbb R$ is an interval (24.1 and its converse), so each component is an open interval; they are disjoint (25.1), and each contains a rational number, so there are at most countably many.</p>`],
  ['Connected and locally connected: all four combinations', R`<ul class="facts"><li><b>Both:</b> $\mathbb R$, $[0,1]$, $\mathbb R^n$.</li><li><b>Connected, not locally connected:</b> the [[ex-sine-curve|topologist's sine curve]]; the [[ex-comb|comb space]].</li><li><b>Locally connected, not connected:</b> $\mathbb R\setminus\{0\}$; a discrete space with two or more points.</li><li><b>Neither:</b> [[ex-rationals|ℚ]].</li></ul>`],
  ['Facts to keep in mind', R`<ul class="facts"><li>Local connectedness is a topological property: a homeomorphism carries connected neighbourhoods to connected neighbourhoods.</li><li>It is not preserved by continuous maps in general (unlike connectedness), but it is preserved by quotient maps (an exercise in Munkres §25).</li><li>[[local-path-connectedness|Locally path connected]] implies locally connected, since path connected sets are connected.</li><li>In a locally connected space the components are open; together with "components are closed", each component is open and closed.</li></ul>`],
  ['History', R`<p>The idea grew out of a question raised by Giuseppe Peano's 1890 space-filling curve: if a continuous image of an interval can fill a square, which sets are continuous images of an interval at all? Around 1913–1914 Hans Hahn and Stefan Mazurkiewicz answered it independently, and Hahn's 1914 paper introduced local connectedness ("connected in the small") for the purpose. The answer, the <b>Hahn–Mazurkiewicz theorem</b>, says that a Hausdorff space is a continuous image of $[0,1]$ exactly when it is compact, connected, locally connected and metrizable. The war kept the two from learning of each other's work until about 1920.<sup>1</sup> <em>Interpretation:</em> the sine curve and the comb, connected but not locally connected, are exactly the kind of set the theorem rules out as images of a path.</p>
<p class="fn"><sup>1</sup> MacTutor biography of Hans Hahn (mathshistory.st-andrews.ac.uk); J. M. McGrew, <em>The Origins of Connectedness im Kleinen</em> (dissertation, Michigan State University, 1976); S. Mardešić, survey in the proceedings of Toposym 2 (1966).</p>`],
  ['Where it sits', R`<p>§25, after [[components]]. It is the first <em>local</em> property in the course; compactness has a local version in §29 (local compactness), with the same "every neighbourhood contains a small one" shape. Its main use here is to control components: in nice spaces they are open, and with paths ([[local-path-connectedness]]) they coincide with path components.</p>`]]};
A['local-path-connectedness'] = {title: 'Local path connectedness', kind: 'definition', where: '§25', pre: ['path-connected', 'local-connectedness', 'path-components'],
  lede: 'Path connected in the small: every point has arbitrarily small path connected neighbourhoods. In such spaces components and path components are the same.',
  sections: [
  ['What it is', R`<p>The same idea as [[local-connectedness]], with paths: near every point, however closely you zoom in, there is a neighbourhood in which any two points can be joined by a path that stays inside it.</p>`],
  ['Definition', R`<p>$X$ is <b>locally path connected at $x$</b> if for every neighbourhood $U$ of $x$ there is a [[path-connected|path connected]] neighbourhood $V$ of $x$ with $V\subseteq U$. $X$ is <b>locally path connected</b> if it is so at every point (Munkres §25).</p>`],
  ['Examples', R`<ul class="facts"><li><b>The standard example:</b> $\mathbb R^n$, and every open subset of it. Inside any neighbourhood of $x$ there is a ball $B(x,\varepsilon)$, and a ball is convex: the straight segment $t\mapsto(1-t)a+tb$ joins any two of its points without leaving it.</li><li><b>Its contrast:</b> the [[ex-sine-curve|topologist's sine curve]], which is not even locally connected at the segment.</li><li>$\mathbb R\setminus\{0\}$: locally path connected, not path connected.</li><li>The [[ex-comb|comb space]]: path connected, but not locally path connected.</li><li>Spheres, tori and other manifolds: every point has a neighbourhood homeomorphic to an open ball, so they are locally path connected.</li></ul>`],
  ['The main theorem: path components of open sets are open', R`<p><b>Theorem 25.4.</b> $X$ is locally path connected if and only if, for every open set $U$ of $X$, each [[path-components|path component]] of $U$ is open in $X$.</p>
<p><b>Why ($\Rightarrow$).</b> Let $P$ be a path component of the open set $U$, and $x\in P$. There is a path connected neighbourhood $V$ of $x$ with $V\subseteq U$. Every point of $V$ is joined to $x$ by a path in $V\subseteq U$, so $V\subseteq P$. So $P$ is open.</p>
<p><b>Why ($\Leftarrow$).</b> Given a neighbourhood $U$ of $x$, the path component of $U$ containing $x$ is open (hypothesis) and path connected: a path connected neighbourhood of $x$ inside $U$.</p>`],
  ['Components equal path components', R`<p><b>Theorem 25.5.</b> Each path component of $X$ lies in a component. If $X$ is locally path connected, the components and the path components of $X$ are the same.</p>
<p><b>Why.</b> A path component is path connected, hence connected, so it lies in one component (25.1). Now let $X$ be locally path connected, $C$ a component and $P$ a path component inside it. Let $Q$ be the union of the other path components that meet $C$; each lies in $C$, so $C=P\cup Q$, a disjoint union. By 25.4 with $U=X$, every path component of $X$ is open, so $P$ and $Q$ are open. If $Q$ were nonempty, $P$ and $Q$ would separate the connected set $C$. So $Q=\varnothing$ and $C=P$.</p>`],
  ['The payoff: connected open sets in ℝⁿ are path connected', R`<p>An open subset $U$ of $\mathbb R^n$ is locally path connected (balls), so by 25.5: <b>if $U$ is connected, it is path connected</b>. To show an open set in the plane is path connected it is enough to show it is connected, and the reverse. This is why the [[ex-sine-curve|sine curve]], which is not open and not locally path connected, is needed to separate the two notions.</p>`],
  ['Facts to keep in mind', R`<ul class="facts"><li>Locally path connected $\Rightarrow$ locally connected (path connected sets are connected); the converse fails, though the examples are harder to draw.</li><li>Path connected does not imply locally path connected: the [[ex-comb|comb space]].</li><li>In a locally path connected space the path components are open, so each is open and closed.</li><li>Connected and locally path connected together imply path connected (25.5: one component, so one path component).</li></ul>`],
  ['Where it sits', R`<p>§25. Local path connectedness is the hypothesis that makes paths and connectedness agree, and it returns in Chapter 9: covering space theory and the fundamental group are developed for spaces that are path connected and locally path connected.</p>`]]};
A['ex-comb'] = {title: 'The comb space', kind: 'example', where: '§25', pre: ['path-connected', 'local-connectedness'],
  lede: 'A base segment with teeth at $x=0$ and $x=1/n$: path connected, but not locally connected.',
  sections: [['What it is', R`<p>In $\mathbb R^2$ take the base $[0,1]\times\{0\}$, the tooth $\{0\}\times[0,1]$, and the teeth $\{\tfrac1n\}\times[0,1]$ for $n\ge1$. Their union $C$ is the <b>comb space</b>.</p>`],
  ['Picture', R`<svg viewBox="0 0 520 250" style="width:100%;max-width:520px;display:block;margin:10px auto" role="img" aria-label="The comb space: a base segment, a vertical tooth at x = 0, and teeth at x = 1/n"><line x1="60" y1="200" x2="460" y2="200" stroke="currentColor" stroke-width="2.4"/><line x1="60" y1="200" x2="60" y2="40" stroke="currentColor" stroke-width="3.4"/><line x1="460.0" y1="200" x2="460.0" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="260.0" y1="200" x2="260.0" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="193.3" y1="200" x2="193.3" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="160.0" y1="200" x2="160.0" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="140.0" y1="200" x2="140.0" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="126.7" y1="200" x2="126.7" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="117.1" y1="200" x2="117.1" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="110.0" y1="200" x2="110.0" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="104.4" y1="200" x2="104.4" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="100.0" y1="200" x2="100.0" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="96.4" y1="200" x2="96.4" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="93.3" y1="200" x2="93.3" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="90.8" y1="200" x2="90.8" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="88.6" y1="200" x2="88.6" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="86.7" y1="200" x2="86.7" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="85.0" y1="200" x2="85.0" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="83.5" y1="200" x2="83.5" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="82.2" y1="200" x2="82.2" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="81.1" y1="200" x2="81.1" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="80.0" y1="200" x2="80.0" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="79.0" y1="200" x2="79.0" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="78.2" y1="200" x2="78.2" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="77.4" y1="200" x2="77.4" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="76.7" y1="200" x2="76.7" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="76.0" y1="200" x2="76.0" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="75.4" y1="200" x2="75.4" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="74.8" y1="200" x2="74.8" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="74.3" y1="200" x2="74.3" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="73.8" y1="200" x2="73.8" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="73.3" y1="200" x2="73.3" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="72.9" y1="200" x2="72.9" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="72.5" y1="200" x2="72.5" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="72.1" y1="200" x2="72.1" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="71.8" y1="200" x2="71.8" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="71.4" y1="200" x2="71.4" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="71.1" y1="200" x2="71.1" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="70.8" y1="200" x2="70.8" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="70.5" y1="200" x2="70.5" y2="40" stroke="currentColor" stroke-width="1.6"/><line x1="70.3" y1="200" x2="70.3" y2="40" stroke="currentColor" stroke-width="1.6"/><circle cx="60" cy="110" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="60" cy="110" r="24" fill="none" stroke="currentColor" stroke-dasharray="4 4"/><text x="52" y="226" font-size="15" text-anchor="middle" fill="currentColor">0</text><text x="460" y="226" font-size="15" text-anchor="middle" fill="currentColor">1</text><text x="250" y="226" font-size="15" text-anchor="middle" fill="currentColor">1/2</text><text x="96" y="30" font-size="14" fill="currentColor">teeth at x = 1/n pile up on the tooth at x = 0</text></svg><p>The dashed circle is a small ball around a point of the left tooth: it meets that tooth and pieces of infinitely many other teeth, which are joined to each other only through the base, far below.</p>`],
  ['Facts to keep in mind', R`<ul class="facts"><li><b>Path connected:</b> from any point, go down its tooth to the base, along the base, and up the other tooth.</li><li><b>Not locally connected</b> at a point $p=(0,y)$ with $y\gt0$: a ball around $p$ of radius less than $y$ meets $C$ in a vertical segment of the left tooth and segments of infinitely many teeth $x=\tfrac1n$, and these pieces are not joined inside the ball. No neighbourhood of $p$ inside it is connected.</li><li>So "connected" and even "path connected" say nothing about the local picture.</li></ul>`],
  ['Why it matters', R`<p>It separates the global and local notions in the other direction from $\mathbb R\setminus\{0\}$: globally as good as possible (path connected), locally bad. Compare the [[ex-sine-curve|topologist's sine curve]], which is bad in both senses near its segment. <em>Note:</em> the comb space is a standard example in topology texts; this article is a supplement to Munkres's text.</p>`]]};

function PB(title, where, stmt, pre, meth, idea, extra){ return {title: title, kind: 'problem', where: where, pre: pre, method: meth, lede: stmt, sections: [['Concepts and method', ''], ['Key idea', idea]].concat(extra || [])}; }
Object.assign(A, {
'hw1-q1': PB('HW1 Q1 · Topology axioms on a 3-point set', 'Homework 1 · §12', R`$X=\{a,b,c\}$, $\mathcal T=\{\{b\},\{a,b\},\{b,c\}\}$: which topology axioms hold?`, ['topology'], ['m-topology', 'm-finite'], R`<p>Axiom (1) fails: $\varnothing$ and $X$ are missing. Check unions and intersections pair by pair; $\{a,b\}\cup\{b,c\}=X\notin\mathcal T$.</p>`),
'hw1-q2': PB('HW1 Q2 · Basis axioms on a 3-point set', 'Homework 1 · §13', R`Same $X$; does $\mathcal B=\{\{b\},\{a,b\},\{b,c\}\}$ satisfy the basis axioms?`, ['basis'], ['m-finite'], R`<p>Every point lies in some element; for the intersection axiom, $\{a,b\}\cap\{b,c\}=\{b\}$ is itself in $\mathcal B$. Both hold.</p>`),
'hw1-q3': PB('HW1 Q3 · Rational intervals generate ℝ', 'Homework 1 · §13', R`Intervals with rational endpoints form a basis that generates the standard topology.`, ['basis', 'lemma-13-3'], ['m-compare', 'm-open'], R`<p>Between any two reals there is a rational, so inside any $(a,b)\ni x$ there is a rational interval around $x$: [[lemma-13-3]] in both directions.</p>`),
'hw1-q4': PB('HW1 Q4 · Subspace of a subspace', 'Homework 1 · §16', R`For $A\subseteq Y\subseteq X$, the topology $A$ inherits from $Y$ equals the one from $X$.`, ['subspace-topology', 'set-equality'], ['m-set-equality'], R`<p>$A\cap(Y\cap U)=A\cap U$ because $A\subseteq Y$. Two inclusions of topologies.</p>`),
'hw1-q5': PB('HW1 Q5 · Open in ℝ versus open in [−1, 1]', 'Homework 1 · §16', R`Decide which sets defined by $\tfrac12<|x|<1$ and variants are open in $\mathbb R$ and in $Y=[-1,1]$.`, ['subspace-topology', 'open-set'], ['m-open'], R`<p>An endpoint $\pm1$ is harmless in $Y$ (nothing beyond it), but not in $\mathbb R$. Write each set as $Y\cap U$ when it is open in $Y$.</p>`),
'hw1-q6': PB('HW1 Q6 · A subspace topology on a finite set', 'Homework 1 · §16', R`Compute $\mathcal T_A$ for $A=\{0,1,3\}$ in a 4-point space.`, ['subspace-topology'], ['m-finite'], R`<p>Intersect each of the five open sets with $A$ and list the distinct results.</p>`),
'hw2-q1': PB('HW2 Q1 · Products of discrete and indiscrete spaces', 'Homework 2 · §15', R`Products of discrete spaces are discrete; of indiscrete spaces, indiscrete.`, ['product-topology', 'standard-topologies'], ['m-open'], R`<p>Discrete: each point $\{(x,y)\}=\{x\}\times\{y\}$ is a basis element. Indiscrete: the only boxes are $\varnothing$ and $X\times Y$.</p>`),
'hw2-q2': PB('HW2 Q2 · Projections are open', 'Homework 2 · §15', R`If $W\subseteq X\times Y$ is open, then $\pi_1(W)$ is open.`, ['projections'], ['m-open-map'], R`<p>Around each $(x,y)\in W$ fits a box $U\times V$; then $x\in U\subseteq\pi_1(W)$.</p>`),
'hw2-q3': PB('HW2 Q3 · Closure in the cofinite topology', 'Homework 2 · §17', R`On an infinite set with the finite complement topology, describe $\overline A$.`, ['closure', 'ex-finite-complement'], ['m-closure'], R`<p>Closed sets are the finite sets and $X$. So $\overline A=A$ if $A$ is finite, and $\overline A=X$ if $A$ is infinite.</p>`),
'hw2-q4': PB('HW2 Q4 · Closure and interior in a finite space', 'Homework 2 · §17', R`Closure and interior of $B=\{1,3\}$ in $X$, and in the subspace $A$.`, ['closure', 'interior', 'subspace-topology'], ['m-finite', 'm-closure'], R`<p>Compute in $X$ first; in $A$ use $\mathcal T_A$, or $\overline B^{\,A}=\overline B\cap A$ (Theorem 17.4).</p>`),
'hw2-q5': PB('HW2 Q5 · Closure of a union', 'Homework 2 · §17', R`$\bigcup\overline{A_j}\subseteq\overline{\bigcup A_j}$, with equality for finite unions but not in general.`, ['closure', 'set-equality'], ['m-set-equality', 'm-closure'], R`<p>Finite unions of closed sets are closed, which gives the reverse inclusion when $J$ is finite. Counterexample: $A_n=\{1/n\}$, whose closures miss $0$.</p>`),
'hw2-q6': PB('HW2 Q6 · Products and subspaces of Hausdorff spaces', 'Homework 2 · §17', R`Products and subspaces of Hausdorff spaces are Hausdorff (prove Theorem 17.11, do not cite it).`, ['hausdorff', 'product-topology', 'subspace-topology'], ['m-hausdorff'], R`<p>Product: points differ in some coordinate; separate there and take boxes. Subspace: intersect the separating sets with $Y$.</p>`),
'hw3-q1': PB('HW3 Q1 · f × g is continuous', 'Homework 3 · §18', R`If $f,g$ are continuous, so is $h(a,c)=(f(a),g(c))$.`, ['continuous', 'product-topology'], ['m-continuous'], R`<p>Check basis elements: $h^{-1}(U\times V)=f^{-1}(U)\times g^{-1}(V)$, open.</p>`),
'hw3-q2': PB('HW3 Q2 · The identity and finer topologies', 'Homework 3 · §18', R`$\mathrm{id}:(X,\mathcal T)\to(X,\mathcal T')$ is continuous iff $\mathcal T$ is finer; a homeomorphism iff $\mathcal T=\mathcal T'$.`, ['continuous', 'finer-coarser', 'homeomorphism'], ['m-continuous', 'm-compare'], R`<p>$\mathrm{id}^{-1}(U)=U$, so continuity says exactly $\mathcal T'\subseteq\mathcal T$.</p>`),
'hw3-q3': PB('HW3 Q3 · Maps agreeing on a dense set', 'Homework 3 · §17–18', R`Continuous maps into a Hausdorff space agreeing on a dense set are equal; give a counterexample without Hausdorff.`, ['dense', 'hausdorff', 'continuous'], ['m-hausdorff', 'm-counterexample'], R`<p>$\{x: f(x)=g(x)\}$ is closed when $Y$ is Hausdorff and contains $A$. Without Hausdorff: maps into an [[ex-indiscrete|indiscrete]] space.</p>`),
'hw3-q4': PB('HW3 Q4 · Retractions and embeddings', 'Homework 3 · §18', R`With $g\circ f=\mathrm{id}$: $\{y: f(g(y))=y\}=f(X)$, which is closed if $Y$ is Hausdorff, and $f$ is an embedding.`, ['embedding', 'set-equality', 'hausdorff'], ['m-set-equality', 'm-closed'], R`<p>Two inclusions for the set equality; closedness is the HW3 Q3 argument with $f\circ g$ and $\mathrm{id}$.</p>`),
'hw3-q5': PB('HW3 Q5 · Convergence in ∏{0,1}', 'Homework 3 · §19', R`If $A_1\subseteq A_2\subseteq\cdots$ then $x(A_n)\to x(\bigcup A_n)$ in the product topology.`, ['product-vs-box', 'convergence'], ['m-continuous'], R`<p>In the product topology, convergence is coordinatewise; each coordinate is eventually constant.</p>`),
'hw3-q6': PB('HW3 Q6 · The max function on an infinite product', 'Homework 3 · §19', R`$m(x)=\max_j x_j$ on $\prod\{0,\dots,n\}$ is not continuous unless $J$ is finite.`, ['product-vs-box', 'continuous'], ['m-continuous'], R`<p>$m^{-1}(\{0\})=\{(0,0,\dots)\}$ would have to be open, but a product-topology basis element restricts only finitely many coordinates.</p>`),
'mt-q1': PB('MT Q1 · {0} is not open in ℚ', 'Midterm 1 practice · §16', R`State the subspace topology; prove $\{0\}$ is not open in $\mathbb Q$.`, ['subspace-topology'], ['m-open'], R`<p>If $\{0\}=\mathbb Q\cap U$ with $U$ open, $U\supseteq(a,b)\ni0$, which contains other rationals.</p>`),

'hw7-q2': PB('HW7 Q2 · Is the sign map open? closed?', 'Homework 7 · §22', R`Decide whether $p:\mathbb R\to\{-1,0,1\}$ from HW6 is an open map and whether it is a closed map.`, ['open-map', 'quotient-map'], ['m-open-map'], R`<p>Use the topology from [[hw6-q1]]. Test small sets: what is the image of an open interval containing $0$? Of a closed set like $\{0\}$ or $[1,2]$? Decide which images are open or closed in the finite topology.</p>`),

// ===== Book order: every section holds its concepts, then its methods, then its problems. Plus the articles that fill the gaps.
Object.assign(A, {
// ---------- Chapter 1
'de-morgan': {title: 'Unions, intersections, complements (De Morgan)', kind: 'idea', where: 'Ch. 1, §1', pre: [],
  lede: R`$X\setminus\bigcup A_\alpha=\bigcap(X\setminus A_\alpha)$ and $X\setminus\bigcap A_\alpha=\bigcup(X\setminus A_\alpha)$.`,
  sections: [['Statement', R`<p>Complement turns unions into intersections and back. It holds for any indexed family.</p>`],
    ['Why it matters', R`<p>It converts every fact about [[open-set|open sets]] into one about [[closed-set|closed sets]]: arbitrary unions of open sets become arbitrary intersections of closed sets (Theorem 17.1). MT Q5 is a direct use.</p>`]]},
'functions': {title: 'Injective, surjective, bijective', kind: 'definition', where: 'Ch. 1, §2', pre: ['image-preimage'],
  lede: 'One-to-one, onto, and both; a bijection has an inverse function.',
  sections: [['Definition', R`<p>$f:X\to Y$ is <b>injective</b> if $f(x)=f(x')\Rightarrow x=x'$, <b>surjective</b> if $f(X)=Y$, <b>bijective</b> if both; then $f^{-1}:Y\to X$ exists.</p>`],
    ['Useful identities', R`<p>$f(f^{-1}(B))\subseteq B$ with equality when $f$ is surjective; $A\subseteq f^{-1}(f(A))$ with equality when $f$ is injective. The second is the [[saturated]] condition in disguise.</p>`],
    ['Where it appears', R`<p>MT Q4 (injective maps), [[homeomorphism|homeomorphisms]], HW7 Q6 (bijections).</p>`]]},
'indexed-products': {title: 'Cartesian products of indexed families', kind: 'definition', where: 'Ch. 1, §5', pre: ['functions'],
  lede: R`$\prod_{\alpha\in J}X_\alpha$ is the set of $J$-tuples $(x_\alpha)$ with $x_\alpha\in X_\alpha$, i.e. functions $J\to\bigcup X_\alpha$.`,
  sections: [['Definition', R`<p>A point of $\prod X_\alpha$ is a choice of one $x_\alpha\in X_\alpha$ for each index $\alpha$. The [[projections|projection]] $\pi_\beta$ reads off the $\beta$ coordinate ([[coordinate-function|coordinate functions]] do the same for maps into the product).</p>`],
    ['Example', R`<p>$\prod_{j\in J}\{0,1\}$ is the set of functions $J\to\{0,1\}$, equivalently of subsets of $J$ ($x(A)_j=1$ iff $j\in A$; HW3 Q5, HW4 Q1).</p>`],
    ['Topologies on it', R`<p>[[product-vs-box]].</p>`]]},
'countable': {title: 'Countable sets', kind: 'definition', where: 'Ch. 1, §7', pre: ['functions'],
  lede: R`$J$ is countable if there is an injection $J\to\mathbb N$; a countable union of finite sets is countable.`,
  sections: [['Definition', R`<p>$J$ is <b>countable</b> if it is finite or in bijection with $\mathbb Z_+$; equivalently, there is an injective map $J\to\mathbb N$.</p>`],
    ['Facts', R`<p>Subsets and countable unions of countable sets are countable; $\mathbb Q$ is countable; $\mathbb R$ and $\mathcal P(\mathbb N)$ are not.</p>`],
    ['Where it appears', R`<p>HW4 Q4: if the point $z$ of $\prod_J\{0,1\}$ has a countable neighbourhood base, $J$ is countable. Hence $\prod_{\mathbb R}\{0,1\}$ is not [[metrizable]].</p>`]]},
// ---------- the connecting idea
'defining-by-maps': {title: 'Subspace, product, quotient: topologies defined by maps', kind: 'idea', where: '§15–22', pre: ['continuous'],
  lede: 'Each new topology is the one that makes a natural map continuous, and no more (or no less) than needed.',
  sections: [['The pattern', R`<p><b>[[subspace-topology|Subspace]]:</b> the coarsest topology on $Y$ making the inclusion $Y\hookrightarrow X$ continuous.<br><b>[[product-vs-box|Product]]:</b> the coarsest topology on $\prod X_\alpha$ making every projection continuous.<br><b>[[quotient-topology|Quotient]]:</b> the finest topology on $X^*$ making $p:X\to X^*$ continuous.</p>`],
    ['What it buys you', R`<p>Each comes with a rule for maps. Into a subspace: $f:Z\to Y$ is continuous iff it is continuous into $X$. Into a product: iff every coordinate is ([[maps-into-products|Theorem 19.6]]). Out of a quotient: iff the composite with $p$ is ([[maps-out-of-quotients|Theorem 22.2]]).</p>`],
    ['Why coarsest or finest', R`<p>Maps <em>out of</em> $Y$ or the product pull open sets back, so the fewest open sets that still make them continuous. The map <em>into</em> the quotient must pull open sets back to open sets, so the most open sets possible.</p>`],
    ['Order matters', R`<p>Taking a subspace and a quotient in different orders can give different topologies (HW6 Q3, HW7 Q5). Taking subspaces and products in either order gives the same one ([[products-and-subspaces]]).</p>`]]},
// ---------- §19 fill-in
'maps-into-products': {title: 'Maps into products (Theorem 19.6)', kind: 'theorem', where: '§19', pre: ['product-vs-box', 'continuous'],
  lede: R`$f:A\to\prod X_\alpha$ is continuous iff every [[coordinate-function|coordinate function]] $f_\alpha=\pi_\alpha\circ f$ is.`,
  sections: [['Statement', R`<p>In the product topology, $f=(f_\alpha)$ is continuous iff each $f_\alpha$ is. (For two factors this is Theorem 18.4.) It fails for the box topology.</p>`],
    ['Why', R`<p>Projections are continuous, so $f$ continuous gives each $f_\alpha$ continuous. Conversely the product topology has [[subbasis]] $\pi_\alpha^{-1}(U)$, and $f^{-1}(\pi_\alpha^{-1}(U))=f_\alpha^{-1}(U)$ is open.</p>`],
    ['Use', R`<p>HW4 Q2: rearranging $(X_1\times X_2)\times X_3\to\prod X_\alpha$ is continuous because each coordinate is a composite of projections; the inverse likewise, so it is a [[homeomorphism]], without mentioning open sets. Method: [[m-product-maps]].</p>`]]},
'products-and-subspaces': {title: 'Products of subspaces (Theorem 19.3)', kind: 'theorem', where: '§19', pre: ['product-vs-box', 'subspace-topology'],
  lede: R`If $A_\alpha\subseteq X_\alpha$, then $\prod A_\alpha$ gets the same topology as a subspace of $\prod X_\alpha$ or as a product of subspaces.`,
  sections: [['Statement', R`<p>For both the product and the box topology. For two factors this is Theorem 16.3; HW4 Q3 asks for the proof in general.</p>`],
    ['Why', R`<p>Compare bases. A basis element of the subspace topology is $(\prod U_\alpha)\cap\prod A_\alpha=\prod(U_\alpha\cap A_\alpha)$, with $U_\alpha$ open and $U_\alpha=X_\alpha$ for all but finitely many $\alpha$; for those, $U_\alpha\cap A_\alpha=A_\alpha$. That is exactly a basis element of the product of the subspaces, and every such element arises this way. The bases are the same collection, so the topologies are equal ([[generated-topology]]).</p>`]]},
'products-hausdorff-closure': {title: 'Hausdorff and closures in products (Theorems 19.4, 19.5)', kind: 'theorem', where: '§19', pre: ['product-vs-box', 'hausdorff', 'closure'],
  lede: R`Products of Hausdorff spaces are Hausdorff, and $\overline{\prod A_\alpha}=\prod\overline{A_\alpha}$.`,
  sections: [['Statements', R`<p>Both hold in the product and the box topology. In particular a product of closed sets is closed (MT Q5).</p>`],
    ['Why Hausdorff', R`<p>Distinct points differ in some coordinate $\beta$; separate there by $U,V$ and use $\pi_\beta^{-1}(U),\pi_\beta^{-1}(V)$.</p>`]]},
'product-convergence': {title: 'Convergence in a product', kind: 'theorem', where: '§19', pre: ['product-vs-box', 'convergence'],
  lede: 'In the product topology a sequence converges exactly when every coordinate converges.',
  sections: [['Statement', R`<p>$x_n\to x$ in $\prod X_\alpha$ (product topology) iff $\pi_\alpha(x_n)\to\pi_\alpha(x)$ for every $\alpha$ (Munkres §19, exercise).</p>`],
    ['Why', R`<p>A basis element around $x$ restricts finitely many coordinates; each of those is eventually satisfied, and finitely many "eventually"s have a common tail.</p>`],
    ['Use', R`<p>HW3 Q5 and HW4 Q1: each coordinate of $x(A_n)$ is eventually constant, so the sequence converges to the set of indices eventually in the $A_n$.</p>`]]},
// ---------- §21 fill-in
'first-countable': {title: 'Countable neighbourhood bases', kind: 'definition', where: '§21, §30', pre: ['basis', 'countable'],
  lede: R`$x$ has a countable basis at $x$ if countably many neighbourhoods $U_1\supseteq U_2\supseteq\cdots$ fit inside every neighbourhood of $x$.`,
  sections: [['Definition', R`<p>A countable collection of neighbourhoods of $x$ such that every neighbourhood of $x$ contains one of them. Every metric space has one: the [[ball|balls]] $B(x,1/n)$.</p>`],
    ['Why it matters', R`<p>It makes sequences enough: the [[sequence-lemma]] needs it. Failing it is a quick proof that a space is not [[metrizable]] (HW4 Q4 with uncountable $J$).</p>`]]},
'sequence-lemma': {title: 'The sequence lemma (Lemma 21.2)', kind: 'theorem', where: '§21', pre: ['closure', 'convergence'],
  lede: R`If a sequence in $A$ converges to $x$, then $x\in\overline A$; the converse holds in metric spaces.`,
  sections: [['Statement', R`<p>If $x_n\in A$ and $x_n\to x$ then $x\in\overline A$. If $X$ is metrizable (more generally has [[first-countable|countable bases at points]]) the converse holds: pick $x_n\in B(x,1/n)\cap A$.</p>`],
    ['Theorem 21.3', R`<p>In the same setting, $f$ is continuous iff $x_n\to x$ implies $f(x_n)\to f(x)$.</p>`]]},
'metrizable': {title: 'Metrizable spaces', kind: 'definition', where: '§20–21', pre: ['metric-topology'],
  lede: 'A space whose topology comes from some metric.',
  sections: [['Necessary conditions', R`<p>Metrizable spaces are [[hausdorff|Hausdorff]] and have [[first-countable|countable bases at points]]. So the [[ex-finite-complement|cofinite]] line, $\mathbb R^\omega$ in the box topology, and $\prod_{\mathbb R}\{0,1\}$ are not metrizable.</p>`],
    ['Positive examples', R`<p>$\mathbb R^n$; countable products of metric spaces (Theorem 20.5 for $\mathbb R^\omega$).</p>`]]},
'uniform-limit': {title: 'Uniform limits (Theorem 21.6)', kind: 'theorem', where: '§21', pre: ['epsilon-delta'],
  lede: 'A uniform limit of continuous functions into a metric space is continuous.',
  sections: [['Statement', R`<p>If $f_n:X\to Y$ are continuous, $Y$ is metric, and $f_n\to f$ uniformly, then $f$ is continuous.</p>`], ['Why', R`<p>The $\varepsilon/3$ argument: $d(f(x),f(y))\le d(f(x),f_N(x))+d(f_N(x),f_N(y))+d(f_N(y),f(y))$.</p>`]]},
// ---------- Chapter 3
'connected': {title: 'Connected space', kind: 'definition', where: '§23', pre: ['open-set'],
  lede: 'A space that cannot be split into two disjoint nonempty open sets.',
  sections: [['Definition', R`<p>A <b>separation</b> of $X$ is a pair of disjoint nonempty open sets $U,V$ with $U\cup V=X$. $X$ is <b>connected</b> if it has none; equivalently, the only sets that are <b>both open and closed</b> are $\varnothing$ and $X$ (other open sets may exist; they just cannot also be closed).</p>`],
    ['Theorems', R`<p>Continuous images of connected spaces are connected (23.5); a union of connected sets with a common point is connected (23.3); finite products of connected spaces are connected (23.6); if $A$ is connected and $A\subseteq B\subseteq\overline A$, then $B$ is connected (23.4).</p>`],
    ['Examples', R`<p>Intervals in $\mathbb R$ ([[connected-reals]]). Not connected: $\mathbb Q$; [[ex-lower-limit|ℝ_ℓ]] ($[a,b)$ is open and closed).</p>`],

'connected-reals': {title: 'Connected subsets of ℝ; intermediate values (§24)', kind: 'theorem', where: '§24', pre: ['connected'],
  lede: R`Intervals are connected, and so a continuous real function on a connected space takes every intermediate value.`,
  sections: [['Statements', R`<p>The connected subspaces of $\mathbb R$ are exactly the intervals and rays (Theorem 24.1 and its converse). <b>Intermediate value theorem (24.3):</b> if $f:X\to\mathbb R$ is continuous and $X$ connected, $f$ takes every value between any two of its values.</p>`],
    ['Path connected', R`<p>Full article: [[path-connected]]. $X$ is path connected if any two points are joined by a continuous path $[0,1]\to X$. Path connected implies connected; the [[ex-sine-curve|topologist's sine curve]] is connected but not path connected.</p>`]]},
'compact': {title: 'Compact space', kind: 'definition', where: '§26', pre: ['open-set'],
  lede: 'Every open cover has a finite subcover.',
  sections: [['Definition', R`<p>$X$ is <b>compact</b> if every collection of open sets whose union is $X$ has a finite subcollection whose union is $X$.</p>`],
    ['Theorems', R`<p>A closed subspace of a compact space is compact (26.2). A compact subspace of a Hausdorff space is closed (26.3). The continuous image of a compact space is compact (26.5). A continuous bijection from a compact space to a Hausdorff space is a [[homeomorphism]] (26.6). Finite products of compact spaces are compact (26.7, via the tube lemma).</p>`],
    ['Connections', R`<p>26.6 finishes [[gluing-examples|the circle as a quotient of an interval]]. Compare 26.3 with [[t1]]: in a Hausdorff space compact sets behave like points.</p>`],
    ['Method', R`<p>[[m-compact]].</p>`]]},
'compact-reals': {title: 'Compact subsets of ℝⁿ; extreme values (§27)', kind: 'theorem', where: '§27', pre: ['compact', 'metric'],
  lede: R`In $\mathbb R^n$ compact means closed and bounded, and continuous real functions on compact spaces attain a maximum and a minimum.`,
  sections: [['Statements', R`<p>$[a,b]$ is compact (27.1). <b>Heine–Borel (27.3):</b> $A\subseteq\mathbb R^n$ is compact iff closed and bounded. <b>Extreme value theorem (27.4).</b> <b>Lebesgue number lemma (27.5)</b> and <b>uniform continuity (27.6)</b> for maps out of compact metric spaces.</p>`]]},
'limit-point-compact': {title: 'Limit point and sequential compactness (§28)', kind: 'definition', where: '§28', pre: ['compact', 'limit-point'],
  lede: 'Every infinite set has a limit point; every sequence has a convergent subsequence. In metric spaces both equal compactness.',
  sections: [['Statements', R`<p>Compact implies limit point compact (28.1). For metrizable spaces, compact, limit point compact and sequentially compact are equivalent (28.2).</p>`]]},
'local-compact': {title: 'Local compactness and one-point compactification (§29)', kind: 'definition', where: '§29', pre: ['compact', 'hausdorff'],
  lede: R`Every point has a compact set containing a neighbourhood; such Hausdorff spaces embed in a compact space by adding one point.`,
  sections: [['Example', R`<p>$\mathbb R$ is locally compact; its one-point compactification is the circle. $\mathbb Q$ is not locally compact.</p>`]]},
'm-connected': {title: 'Show a space is (not) connected', kind: 'method', where: '§23–24', pre: ['connected'],
  lede: 'Not connected: exhibit a separation. Connected: assume a separation and reach a contradiction, or build the space from connected pieces.',
  steps: [['To disprove: find disjoint nonempty open $U,V$ covering $X$.', R`E.g. $\mathbb Q=(\mathbb Q\cap(-\infty,\sqrt2))\cup(\mathbb Q\cap(\sqrt2,\infty))$.`], ['To prove: suppose $U,V$ separate $X$ and contradict something known to be connected.', 'A connected subspace lies entirely in $U$ or in $V$ (Lemma 23.2).'], ['Or assemble it: continuous images, unions through a common point, closures, finite products.', R`Theorems 23.3–23.6; [[connected]].`]],
  sections: []},
'm-compact': {title: 'Show a space is (not) compact', kind: 'method', where: '§26–27', pre: ['compact'],
  lede: 'Not compact: an open cover with no finite subcover. Compact: closed in a compact space, a continuous image, a product, or closed and bounded in ℝⁿ.',
  steps: [['To disprove: give an open cover with no finite subcover.', R`$(0,1)=\bigcup(\tfrac1n,1)$.`], ['To prove directly: take any open cover and extract finitely many sets.', 'Often via a point or a compact piece that needs only one set.'], ['Or reduce: closed subset of compact; image of compact; finite product; Heine–Borel.', R`[[compact]], [[compact-reals]].`]],
  sections: []},

  sections: [['Where it appears', R`<p>HW4 Q2, HW3 Q1.</p>`]]},

'hw4-q1': PB('HW4 Q1 · Decreasing sets in ∏{0,1}', 'Homework 4 · §19', R`If $A_1\supseteq A_2\supseteq\cdots$, then $x(A_n)$ converges; find the limit.`, ['product-convergence', 'indexed-products'], ['m-product-maps'], R`<p>Coordinate $j$ is $1$ while $j\in A_n$ and $0$ once it leaves, so it is eventually constant. The limit is $x(\bigcap_n A_n)$.</p>`),
'hw4-q2': PB('HW4 Q2 · Regrouping a triple product', 'Homework 4 · §19', R`$((x_1,x_2),x_3)\mapsto(x_1,x_2,x_3)$ is continuous and a homeomorphism.`, ['maps-into-products', 'homeomorphism'], ['m-product-maps'], R`<p>Each coordinate is a composite of projections, so continuous by Theorem 19.6; the inverse $(x_\alpha)\mapsto((x_1,x_2),x_3)$ has continuous coordinates by Theorem 18.4 twice. No open sets needed.</p>`),

'hw4-q4': PB('HW4 Q4 · Neighbourhoods of 0 in ∏{0,1}', 'Homework 4 · §19', R`(a) Every neighbourhood of $z=(0)$ contains a finite intersection $\bigcap_{j\in J_V}U_j$. (b) A countable decreasing neighbourhood base at $z$ forces $J$ countable.`, ['product-vs-box', 'first-countable', 'countable'], ['m-open'], R`<p>(a) A basis element around $z$ restricts finitely many coordinates, each to $\{0\}$. (b) Take $J_n$ for $U_n$. If $j\notin\bigcup J_n$, the point with a single $1$ at $j$ lies in every $\bigcap_{J_n}U_i\subseteq U_n$, hence in $\bigcap U_n=\{z\}$, a contradiction. So $J=\bigcup J_n$, a countable union of finite sets.</p>`)

A['saturated'].sections.push(['Connections', R`<p>The quotient analogue of the subspace move: a subspace intersects open sets with $Y$; a quotient keeps only open sets that are unions of whole classes. See [[defining-by-maps]].</p>`]);

A['closed-set'].sections.push(['Connections', R`<p>Closed is to [[limit-point|limit points]] what open is to "room around every point". Under [[continuous]] maps, preimages of closed sets are closed; in a [[compact]] Hausdorff setting, images of closed sets are closed too.</p>`]);
A['hausdorff'].sections.push(['Connections', R`<p>Hausdorff makes limits unique, makes points closed, makes compact sets closed ([[compact|26.3]]), and is what quotients can destroy ([[crushing-a-set]]).</p>`]);
A['quotient-topology'].sections.push(['Connections', R`<p>The finest topology making $p$ continuous, as the subspace and product topologies are the coarsest making their maps continuous: [[defining-by-maps]].</p>`]);
A['product-vs-box'].sections.push(['Connections', R`<p>The product topology is the coarsest making all projections continuous ([[defining-by-maps]]); that is why [[maps-into-products]] and [[product-convergence]] work for it and fail for the box topology.</p>`]);
A['homeomorphism'].sections.push(['Connections', R`<p>Checking the inverse is often the hard part; [[compact|Theorem 26.6]] removes it when the domain is compact and the target Hausdorff.</p>`]);
