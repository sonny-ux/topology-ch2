// ===== Relation, and more on what equivalence classes are for
A['relation'] = {title: 'Relation', kind: 'definition', where: 'Ch. 1, §3', pre: ['indexed-products'],
  lede: R`A relation on $X$ is a set of ordered pairs from $X$: the pairs $(x,y)$ for which "$x$ is related to $y$" is true.`,
  sections: [
  ['What it is', R`<p>A relation is <b>a yes-or-no question about pairs</b>: for each pair of elements $x,y$ of $X$, is $x$ related to $y$? "Is less than", "has the same sign as" and "is equal to" are relations on $\mathbb R$. The relation is recorded by listing the pairs that get the answer yes.</p>`],
  ['Definition', R`<p>A <b>relation</b> on a set $X$ is a subset $C\subseteq X\times X$. One writes $x\,C\,y$, or $x\sim y$, to mean $(x,y)\in C$.</p>`],
  ['Reading the definition', R`<p>"$X\times X$" is the set of all ordered pairs $(x,y)$ with $x,y\in X$ ([[indexed-products]]). "A subset $C$" is a choice of some of these pairs. Nothing else is required: any choice of pairs is a relation. Munkres defines a relation as a set, rather than as a "rule", so that it is an exact object; two rules that say yes to the same pairs are the same relation.</p>`],
  ['Why it is defined this way', R`<p>Mathematics prefers to build everything out of sets. A function is also defined this way, as a set of pairs (its graph) in which each $x$ appears exactly once as a first entry. A relation drops that condition: $x$ may be related to many $y$, or to none.</p>`],
  ['Examples', R`<ul><li>$x\lt y$ on $\mathbb R$: the pairs with first entry smaller; in the plane, the region above the line $y=x$.</li>
<li>$x=y$ on $X$: only the pairs $(x,x)$, the <b>diagonal</b> $\Delta$ of $X\times X$.</li>
<li>On $\{1,2,3\}$, the set $C=\{(1,2),(3,3)\}$: $1$ is related to $2$, $3$ to $3$, and nothing else. It has no meaning beyond the list, and it is still a relation.</li></ul>`],
  ['What depends on it', R`<p>The relations that behave like "sameness" are the [[relation-equivalence|equivalence relations]]; their [[equivalence-class|classes]] form a [[partition]], from which a [[quotient-topology|quotient space]] is built. Order relations ($\lt$) give the [[order-topology]].</p>`],
  ['Where it sits', R`<p>Relations, functions and orders are all subsets of a product $X\times X$ or $X\times Y$. This is the set-theoretic foundation of Chapter 1: every later object (a topology, a metric, a map) is a set with a structure, and relations are the simplest structure there is.</p>`]]};
A['relation-equivalence'].pre = ['relation'];
A['relation-equivalence'].sections.splice(A['relation-equivalence'].sections.length - 1, 0,
  ['What counts as the same', R`<p>Nothing counts as the same automatically: the equivalence relation is a <em>choice</em> of which differences to ignore. On the same set $\mathbb R$:</p>
<table><tr><th>$x\sim y$ when</th><th>Classes</th></tr>
<tr><td>$x=y$</td><td>each point alone, $\{x\}$</td></tr>
<tr><td>same sign</td><td>$(-\infty,0)$, $\{0\}$, $(0,\infty)$</td></tr>
<tr><td>$x-y$ is an integer</td><td>one class for each decimal part $t\in[0,1)$</td></tr>
<tr><td>$x=y$, or both in $A$</td><td>$A$, and $\{x\}$ for each $x\notin A$</td></tr>
<tr><td>always</td><td>one class, all of $\mathbb R$</td></tr></table>
<p>The points never change; only the chosen sameness does. Equality ignores nothing and "always" ignores everything. In a problem the relation is given (as $\sim_A$ in [[hw7-q1]]); in building a space it is the list of what you want glued. The one constraint is the three rules, and transitivity is the one that bites: declaring $0\sim1$ and $1\sim2$ also declares $0\sim2$.</p>`]);
A['equivalence-class'].sections.splice(1, 0,
  ['Why classes do not overlap', R`<p>Suppose $z\in[x]$ and $z\in[y]$, so $z\sim x$ and $z\sim y$. Symmetry gives $x\sim z$, and transitivity with $z\sim y$ gives $x\sim y$. Then anything related to $x$ is related to $y$ and conversely, so $[x]=[y]$. Hence two classes are either equal or disjoint, and the classes sort $X$ into bins: a [[partition]].</p>`],
  ['What a class is for', R`<p>A class lets a whole group of things that count as the same be treated as <b>one object</b>. Many familiar objects are built this way: the number $\tfrac12$ is the class of pairs $(1,2),(2,4),(3,6),\ldots$; "3 o'clock" is the class $\{\ldots,-9,3,15,27,\ldots\}$.</p>
<p>In topology this is how spaces are glued. The relation says what is glued to what, and each class becomes one point of the [[quotient-topology|quotient]]: for the circle, $0$ and $1$ form one class; for [[crushing-a-set]], all of $A$ does.</p>
<p>Once things are glued, anything done on the new space may depend only on the class, not on the element chosen from it. A function descends to the quotient only if it is constant on each class ([[maps-out-of-quotients]]); a set has a picture downstairs only if it takes whole classes ([[saturated]]).</p>`]);
// ===== HW7 Q4: a picture of A and of the map q, right after the problem
(function(){ var a = A['hw7-q4'], i = a.sections.findIndex(function(x){ return x[0] === 'The problem'; }); a.sections.splice(i + 1, 0, ['Picture of A', R`<svg viewBox="0 0 460 300" class="q4fig" role="img" aria-label="The set A: the closed right half-plane together with the left half of the x-axis, and the map q squashing it onto the line">

// ===== HW7 Q4: the breakdown split by part, each with its goal, short steps, and the reason folded under each
(function(){
  function st(rows){ return '<ol class="steps">' + rows.map(function(r){ return '<li><details><summary>' + r[0] + '</summary><div class="why"><b>Why:</b> ' + r[1] + '</div></details></li>'; }).join('') + '</ol>'; }
  function goal(g){ return '<p class="goal"><b>Goal.</b> ' + g + '</p>'; }
  var parts = [
   ['Breakdown of (a): the sketch', goal(R`Draw $A$.`) + st([
     [R`Shade the half-plane $x\ge0$, including its edge, the $y$-axis.`, R`$[0,\infty)\times\mathbb R$ is every point whose first coordinate is $\ge 0$, with any second coordinate. $0\in[0,\infty)$, so the edge belongs to it.`],
     [R`Add the negative $x$-axis as a single line.`, R`$\mathbb R\times\{0\}$ adds the points with $y=0$. Its right half is already shaded, so what is new is the half-line $\{(x,0):x\lt0\}$, with nothing above or below it. See the picture above.`]])],
   ['Breakdown of (b): q is a quotient map', goal(R`Three things: $q$ is surjective; $q$ is continuous; and if $q^{-1}(U)$ is open in $A$, then $U$ is open in $\mathbb R$.`) + st([
     [R`<b>Surjective.</b> Every $x$ is hit, by the point $(x,0)$.`, R`The whole $x$-axis lies in $A$, so $(x,0)\in A$ for every $x$, and $q(x,0)=x$.`],
     [R`<b>Continuous.</b> $q$ is the projection $\pi_1$, restricted to $A$.`, R`$\pi_1:\mathbb R^2\to\mathbb R$ is continuous, and restricting a continuous map to a subspace keeps it continuous (Theorem 18.2).`],
     [R`<b>The third condition: the idea.</b> Carry openness back down along the $x$-axis, using a map going the other way.`, R`This is the hint: HW6 Q2 showed that a continuous surjection with a continuous <em>section</em> (a map $j$ back with $q\circ j=\mathrm{id}$) is a quotient map ([[hw6-q2]], [[m-quotient-map]]).`],
     [R`<b>The section.</b> $j:\mathbb R\to A$, $j(x)=(x,0)$. It is continuous, and $q(j(x))=x$.`, R`Its two coordinates, $x$ and $0$, are continuous, so $j$ is continuous into $\mathbb R^2$ (Theorem 18.4). Its image lies on the axis, inside $A$, so it is continuous into $A$ (Theorem 18.2).`],
     [R`<b>Finish.</b> If $q^{-1}(U)$ is open in $A$, then $U=j^{-1}\big(q^{-1}(U)\big)$, which is open.`, R`Because $q\circ j=\mathrm{id}$, pulling $U$ back through $q$ and then through $j$ returns $U$ itself: $j^{-1}(q^{-1}(U))=(q\circ j)^{-1}(U)=U$. And $j$ is continuous, so it pulls the open set $q^{-1}(U)$ back to an open set.`]])],
   ['Breakdown of (c): q is not open', goal(R`One open set of $A$ whose image is <em>not</em> open in $\mathbb R$.`) + st([
     [R`<b>Where to look:</b> on the edge $x=0$, above the axis.`, R`There $A$ simply stops: it has no points to the left. An open set of $A$ around such a point is cut off along $x=0$, and squashing it down keeps the cut.`],
     [R`<b>The set:</b> $W=A\cap B\big((0,1),\tfrac12\big)$, a small disc around $(0,1)$ cut down to $A$.`, R`A set of the form $A\cap(\text{open set of }\mathbb R^2)$ is open in $A$; that is the subspace topology ([[subspace-topology]]).`],
     [R`<b>What $W$ is:</b> the right half of the disc, the points with $x\ge0$.`, R`Every point of the disc has $y\gt\tfrac12$, so none of it is on the axis; inside $A$ only the part with $x\ge0$ survives.`],
     [R`<b>Its image:</b> $q(W)=[0,\tfrac12)$.`, R`The right half of a disc of radius $\tfrac12$ centred on the $y$-axis has first coordinates from $0$ up to (not including) $\tfrac12$.`],
     [R`<b>Not open:</b> $0\in q(W)$, but no interval $(-\varepsilon,\varepsilon)$ lies inside $[0,\tfrac12)$. So $q$ is not an open map.`, R`Open in $\mathbb R$ means room around every point; $0$ has no room to its left.`]])],
   ['Breakdown of (c): q is not closed', goal(R`One closed set of $A$ whose image is <em>not</em> closed in $\mathbb R$.`) + st([
     [R`<b>Where to look:</b> far up the half-plane, a closed set that hugs the edge $x=0$ without touching it.`, R`The same idea as [[hw7-q3]](b): a closed set can approach the edge only by climbing to infinity, and squashing away the height leaves a hole at $0$.`],
     [R`<b>The set:</b> $C=\{(x,y): x\gt0,\ xy=1\}$, the right branch of the hyperbola $y=1/x$.`, R`Each of its points has $x\gt0$, so it lies in the half-plane, inside $A$.`],
     [R`<b>$C$ is closed in $A$.</b>`, R`$\{xy=1\}$ is closed in $\mathbb R^2$ (the preimage of $\{1\}$ under the continuous map $(x,y)\mapsto xy$), and so is $\{x\ge0\}$. Their intersection is exactly $C$ (no point with $x=0$ has $xy=1$), so $C$ is closed in $\mathbb R^2$, and $C=C\cap A$ is closed in $A$ (Theorem 17.2).`],
     [R`<b>Its image:</b> $q(C)=(0,\infty)$.`, R`Each $x\gt0$ is hit, by $(x,1/x)$; no $x\le0$ is.`],
     [R`<b>Not closed:</b> $0$ is a limit point of $(0,\infty)$ (the points $1/n$ close in on it) but is not in it. So $q$ is not a closed map.`, R`A closed set must contain all of its limit points ([[closure-limit-points]]).`]])]];
  var a = A['hw7-q4'], i = a.sections.findIndex(function(x){ return x[0] === 'Breakdown'; });
  if (i >= 0) a.sections.splice.apply(a.sections, [i, 1].concat(parts.map(function(p){ return [p[0], p[1]]; })));
})();
</script>
<script>
A['relations-map'] = {title: 'Relations in topology: the map', kind: 'idea', where: 'Reference', pre: ['relation', 'relation-equivalence'],
  lede: 'A relation compares two things. Topology uses two kinds, equivalence relations (which sort) and order relations (which rank), on four kinds of object: points, topologies, spaces and maps.',
  sections: [
  ['What a relation is', R`<p>A [[relation|relation]] on a set $X$ is a set of ordered pairs from $X$: the pairs $(x,y)$ for which "$x$ is related to $y$" is true. It is a yes-or-no question about pairs. A relation can also go between two sets: a subset of $X\times Y$. A function is the special relation in which each $x$ is related to exactly one $y$.</p>`],
  ['The properties a relation can have', R`<p>Five properties do almost all the sorting. For all $x,y,z$:</p><ul class="facts"><li><b>Reflexive:</b> $x\sim x$.</li><li><b>Symmetric:</b> $x\sim y$ implies $y\sim x$.</li><li><b>Antisymmetric:</b> $x\sim y$ and $y\sim x$ imply $x=y$.</li><li><b>Transitive:</b> $x\sim y$ and $y\sim z$ imply $x\sim z$.</li><li><b>Total</b> (comparable): $x\sim y$ or $y\sim x$, for every pair.</li></ul>`],
  ['The two great kinds', R`<ul class="facts"><li><b>Equivalence relations</b> (reflexive, symmetric, transitive) <b>sort</b>: they say when two things count as the same, and cut the set into classes ([[relation-equivalence|equivalence relation]], [[equivalence-class|equivalence class]], [[partition|partition]]).</li><li><b>Order relations</b> (transitive, plus antisymmetry or strictness) <b>rank</b>: they say which of two things comes first or is larger ([[relation-order|order relations]]).</li></ul><p>Symmetry is what separates them. An equivalence relation cannot tell $x$ from $y$ when they are related; an order relation always can, unless $x=y$.</p>`],
  ['Where relations live in this course', R`<p>Sort the relations of topology by <em>what</em> they compare.</p><ol class="facts"><li><b>Points of one space.</b> Equivalence relations that cut a space into pieces: lying in a common connected set ([[components]]), being joined by a path ([[path-components]]), being glued by a map ([[relation-induced]], [[quotient-topology]]). Order relations that build a topology: $\lt$ on $\mathbb R$ gives the [[order-topology]].</li><li><b>Topologies on one set.</b> "Finer than" is an order relation ([[finer-coarser]]): it ranks topologies, and two of them need not be comparable ([[lemma-13-4]]).</li><li><b>Spaces.</b> "Is homeomorphic to" is an equivalence relation on spaces ([[homeomorphism-relation]]); its classes are the spaces topology cannot tell apart.</li><li><b>Maps.</b> Coming in Chapter 9: two paths are <em>path homotopic</em> if one can be deformed into the other. This equivalence relation on paths gives the fundamental group.</li></ol>`],
  ['The pattern every equivalence relation follows', R`<ol class="facts"><li><b>Check it.</b> Reflexive and symmetric are usually immediate. <b>Transitivity is where the topology does the work</b>: a theorem about unions (23.3), the [[pasting-lemma]] for joining paths, or composition of continuous maps.</li><li><b>Name the classes.</b> The classes, not the relation, get the name: components, path components, fibres, homeomorphism types ([[equivalence-catalogue]]).</li><li><b>Form the set of classes.</b> It is a [[partition|partition]] of the original set; for points of a space it can be given the [[quotient-topology|quotient topology]].</li><li><b>Ask what the classes are like.</b> Closed? Open? How many? Each answer is a theorem (25.1–25.5 for components).</li></ol>`],
  ['Invariants: how relations turn into tools', R`<p>A property is <b>invariant</b> under an equivalence relation if related things share it. Properties invariant under homeomorphism (connectedness, compactness, Hausdorff, the number of components) are the tools for proving two spaces are <em>not</em> homeomorphic: find a property one has and the other lacks. That is how $\mathbb R\not\cong\mathbb R\setminus\{0\}$ is proved, and how the fundamental group will later tell the circle from the disc.</p>`],
  ['Where it sits', R`<p>Relations are set up in Chapter 1 (Munkres §3) and look like bookkeeping there. In topology they become the organising idea: the subject's main question, "when are two spaces the same?", is a question about one equivalence relation, homeomorphism. <em>Interpretation:</em> this article's sorting by what is compared (points, topologies, spaces, maps) is the guide's, not Munkres's.</p>`]]};

A['relation-order'] = {title: 'Order relations', kind: 'definition', where: 'Ch. 1, §3', pre: ['relation'],
  lede: 'Relations that rank: strict orders like < and partial orders like ⊆. In topology they build the order topology and compare topologies.',
  sections: [
  ['Definition', R`<p>Munkres (§3) calls a relation $\lt$ on $A$ an <b>order relation</b> (or simple order) if it has three properties:</p><ul class="facts"><li><b>Comparability:</b> for $x\ne y$, either $x\lt y$ or $y\lt x$.</li><li><b>Nonreflexivity:</b> $x\lt x$ never holds.</li><li><b>Transitivity:</b> $x\lt y$ and $y\lt z$ imply $x\lt z$.</li></ul><p>A <b>partial order</b> $\le$ drops comparability and uses the non-strict form: reflexive, antisymmetric ($x\le y$ and $y\le x$ give $x=y$) and transitive. Some pairs may be incomparable.</p>`],
  ['Examples', R`<ul class="facts"><li><b>The standard example:</b> $\lt$ on $\mathbb R$, a simple order.</li><li><b>Its contrast:</b> $\subseteq$ on the subsets of a set, a partial order: $\{1\}$ and $\{2\}$ are incomparable.</li><li>The dictionary order on $\mathbb R\times\mathbb R$: compare first coordinates, and second coordinates only on a tie. A simple order.</li><li>"Finer than" on the topologies of a set $X$: a partial order ([[finer-coarser]]), with incomparable pairs ([[lemma-13-4]]).</li></ul>`],
  ['Where they are used in topology', R`<ul class="facts"><li><b>To build a topology:</b> a simple order gives open intervals $(a,b)$, which generate the [[order-topology]]. The standard topology on $\mathbb R$ is the order topology of $\lt$.</li><li><b>To compare topologies:</b> finer and coarser.</li><li><b>To state theorems:</b> the [[ivt]] and the extreme value theorem need an ordered target; the least upper bound property makes $[a,b]$ connected and compact (24.1, 27.1).</li></ul>`],
  ['Compared with equivalence relations', R`<p>Both are transitive. An [[relation-equivalence|equivalence relation]] is symmetric and sorts things into classes; an order relation is antisymmetric (or strict) and ranks them. Equality $=$ is the one relation that is both an equivalence relation and a partial order. See [[relations-map]].</p>`]]};

A['relation-induced'] = {title: 'The relation induced by a map', kind: 'definition', where: '§22', pre: ['relation-equivalence', 'image-preimage', 'quotient-map'],
  lede: 'Any function f gives an equivalence relation: x ~ y when f(x) = f(y). Its classes are the fibres, and every equivalence relation arises this way.',
  sections: [
  ['Definition', R`<p>Let $f:X\to Y$ be a function. Define $x\sim_f y$ if $f(x)=f(y)$. The class of $x$ is the <b>fibre</b> $f^{-1}(f(x))$: everything $f$ sends to the same place.</p>`],
  ['Why it is an equivalence relation', R`<p>It is equality, pulled back through $f$: $f(x)=f(x)$ (reflexive); $f(x)=f(y)$ gives $f(y)=f(x)$ (symmetric); $f(x)=f(y)=f(z)$ gives $f(x)=f(z)$ (transitive). Here transitivity costs nothing, because equality is already transitive.</p>`],
  ['Examples', R`<ul class="facts"><li><b>The standard example:</b> $p:[0,1]\to S^1$, $p(t)=(\cos2\pi t,\sin2\pi t)$. Its fibres are $\{0,1\}$ and the single points $\{t\}$ for $0\lt t\lt1$: the relation glues the two ends of the interval ([[ex-circle]]).</li><li>$\pi_1:\mathbb R^2\to\mathbb R$: the fibres are the vertical lines.</li><li>A constant map: one fibre, everything related.</li><li>An injective map: every fibre is one point, so $\sim_f$ is equality.</li></ul>`],
  ['Every equivalence relation is induced by a map', R`<p>Given any equivalence relation $\sim$ on $X$, let $\pi:X\to X/{\sim}$ send $x$ to its class $[x]$. Then $\pi(x)=\pi(y)$ exactly when $x\sim y$. So "equivalence relation on $X$", "partition of $X$" and "surjection out of $X$, up to renaming the target" are three descriptions of the same thing.</p>`],
  ['In topology: quotients', R`<p>When $X$ is a space, $X/{\sim}$ gets the [[quotient-topology]]: the finest topology making $\pi$ continuous. If $p:X\to Y$ is a [[quotient-map]], then $Y$ is homeomorphic to $X/{\sim_p}$; this is how gluing descriptions such as "an interval with its ends identified" become actual spaces ([[gluing-examples]]). Maps out of a quotient are exactly the maps that are constant on the classes ([[maps-out-of-quotients]]).</p>`]]};

A['homeomorphism-relation'] = {title: 'Homeomorphism as an equivalence relation', kind: 'theorem', where: '§18', pre: ['homeomorphism', 'relation-equivalence'],
  lede: '"X is homeomorphic to Y" is an equivalence relation on spaces. Its classes are what topology cannot tell apart, and its invariants are how spaces are told apart.',
  sections: [
  ['Statement', R`<p>Write $X\cong Y$ if there is a [[homeomorphism]] $X\to Y$. Then $\cong$ is reflexive, symmetric and transitive.</p>`],
  ['Why', R`<ul class="facts"><li><b>Reflexive:</b> the identity $X\to X$ is a homeomorphism.</li><li><b>Symmetric:</b> if $f:X\to Y$ is a homeomorphism, so is $f^{-1}:Y\to X$; the definition is symmetric in $f$ and $f^{-1}$.</li><li><b>Transitive:</b> if $f:X\to Y$ and $g:Y\to Z$ are homeomorphisms, so is $g\circ f$: it is a bijection, continuous as a composite of continuous maps, with continuous inverse $f^{-1}\circ g^{-1}$.</li></ul><p>(Strictly, the spaces do not form a set, so this is a relation in a slightly wider sense; nothing in the course depends on the distinction.)</p>`],
  ['The classes', R`<p>A class consists of all spaces homeomorphic to a given one, its <b>homeomorphism type</b>. Examples: $(-1,1)$, $(0,1)$ and $\mathbb R$ are in one class; $[0,1]$ is in another; $S^1$ and the square's boundary are in one class.</p>`],
  ['Invariants', R`<p>A <b>topological property</b> (topological invariant) is one shared by homeomorphic spaces. To prove $X\not\cong Y$, find an invariant that one has and the other lacks.</p><ul class="facts"><li><b>Connected</b> (23.5): $[0,1]\not\cong[0,1]\cup[2,3]$.</li><li><b>Number of components:</b> $\mathbb R\not\cong\mathbb R\setminus\{0\}$.</li><li><b>Cut points:</b> removing a point from $\mathbb R$ disconnects it, removing a point from $\mathbb R^2$ does not; a homeomorphism would carry one situation to the other, so $\mathbb R\not\cong\mathbb R^2$.</li><li><b>Compact</b> (26.5): $[0,1]\not\cong(0,1)$.</li><li><b>Hausdorff</b>, path connected, locally connected: all invariant.</li></ul><p>Not invariant: boundedness, completeness, distances. These depend on a metric, not on the topology alone.</p>`],
  ['Where it sits', R`<p>Classifying spaces up to homeomorphism is the guiding problem of topology. Invariants answer "not homeomorphic"; explicit maps answer "homeomorphic". The fundamental group (Chapter 9) is a stronger invariant built from another equivalence relation, path homotopy. See [[relations-map]].</p>`]]};

A['equivalence-catalogue'] = {title: 'Equivalence relations in topology: a catalogue', kind: 'idea', where: 'Reference', pre: ['relation-equivalence'],
  lede: 'Each equivalence relation the course uses, what makes it transitive, and the name of its classes.',
  sections: [
  ['How to read this', R`<p>For each relation: what it says, where transitivity comes from (the one step that needs a theorem), and the name of its classes. Usually only the classes have a name; the relation is written $x\sim y$ and described in words. See [[relations-map]] for how they fit together.</p>`],
  ['On points of a space', R`<ol class="facts"><li><b>Lie in a common connected set</b> (§25). Transitive by Theorem 23.3: two connected sets through a common point have a connected union. Classes: <b>[[components]]</b>.</li><li><b>Joined by a path</b> (§25). Transitive by joining paths end to end, continuous by the [[pasting-lemma]]. Classes: <b>[[path-components]]</b>.</li><li><b>Not separated by any continuous map to $\{0,1\}$</b> ([[hw8-q2]]). Transitive because equality of values is. Classes: <b>quasi-components</b> (a name from outside Munkres's text); each is a union of components.</li><li><b>Same value under a map</b> $f$ ([[relation-induced]]). Transitive because equality is. Classes: the <b>fibres</b> of $f$; with the quotient topology, the set of fibres is a quotient space.</li><li><b>Crushing a set</b> $A$: $x\sim y$ iff $x=y$ or both lie in $A$ ([[crushing-a-set]]). Classes: $A$, and single points.</li></ol>`],
  ['On spaces', R`<ol class="facts" start="6"><li><b>Homeomorphic</b>, $X\cong Y$ ([[homeomorphism-relation]]). Transitive by composing homeomorphisms. Classes: <b>homeomorphism types</b>.</li></ol>`],
  ['Coming next', R`<ol class="facts" start="7"><li><b>Path homotopic</b>, $f\simeq_p g$ (§51): two paths with the same ends, one deformable into the other with the ends held fixed. Transitive by stacking the deformations, again by the pasting lemma. Classes: <b>path-homotopy classes</b> $[f]$, the elements of the fundamental group.</li><li><b>Homotopic maps</b> $f\simeq g$ (§51), and <b>homotopy equivalent spaces</b> (§58): coarser cousins of equality and homeomorphism.</li></ol>`],
  ['What the catalogue shows', R`<p>The relations that are pulled back from equality (fibres, maps to $\{0,1\}$) are transitive for free. The ones defined by <em>joining</em> things (connected sets, paths, homotopies) need a gluing theorem for transitivity, and that theorem is always the same idea: two pieces that agree where they meet fit together. <em>Interpretation, beyond Munkres.</em></p>`]]};
// ===== Homework 10 (§26–29: compactness, the one-point compactification, compact-to-Hausdorff maps)
A['compact'] = {title: 'Compact space', kind: 'definition', where: '§26', pre: ['open-set', 'hausdorff'],
  lede: 'Every open cover has a finite subcover: whatever infinitely many open sets cover the space, finitely many of them already do.',
  sections: [
  ['What it is', R`<p>Compactness is the topological form of "finite" for spaces that have infinitely many points. A compact space cannot be spread out forever, and cannot have a point it creeps toward without containing it: any covering of it by open sets can be cut down to finitely many. Arguments that work point by point can then be finished with finitely many steps, which is how local facts become global ones.</p>`],
  ['Definition', R`<p>A collection $\mathcal A$ of subsets of $X$ <b>covers</b> $X$ if the union of its members is $X$; it is an <b>open cover</b> if its members are open. $X$ is <b>compact</b> if every open cover of $X$ has a finite subcollection that also covers $X$ (Munkres §26).</p>
<p><b>For a subspace $Y\subseteq X$</b> (Lemma 26.1): $Y$ is compact iff every cover of $Y$ by sets <em>open in $X$</em> has a finite subcollection covering $Y$. So you may cover a subset with open sets of the big space.</p>`],
  ['Examples', R`<ul class="facts"><li><b>The standard example:</b> $[0,1]$ is compact (27.1). This is the heart of the analysis theorems (extreme values, uniform continuity).</li><li><b>Its contrast:</b> $(0,1)$ is not compact. The open sets $(\tfrac1n,1)$, $n\ge2$, cover it, but finitely many of them have a largest $\tfrac1n$ and miss $(0,\tfrac1n]$.</li><li>$\mathbb R$ is not compact: the intervals $(-n,n)$ cover it with no finite subcover.</li><li>Every finite space is compact, whatever its topology.</li><li>An infinite discrete space is not compact: the one-point sets cover it.</li><li>$\{0\}\cup\{\tfrac1n:n\ge1\}$ is compact: the open set containing $0$ contains all but finitely many $\tfrac1n$.</li><li>$\prod_{n\ge1}\{0,1\}$ with the product topology is compact (Tychonoff's theorem, §37; used in [[hw10-q6]]).</li></ul>`],
  ['Why it is defined this way', R`<p>The definition takes the property of $[a,b]$ that makes the analysis proofs work (Heine–Borel: every open cover of $[a,b]$ has a finite subcover) and makes it the definition. Sequences would also do in metric spaces (28.2), but open covers use only open sets, so they make sense in every topological space.</p>`],
  ['The basic theorems, with proofs', R`<p><b>26.2 Closed in compact is compact.</b> Let $Y$ be closed in compact $X$, and cover $Y$ by sets open in $X$. Add the open set $X-Y$: now all of $X$ is covered. Take a finite subcover; dropping $X-Y$ from it leaves finitely many sets covering $Y$.</p>
<p><b>26.3 Compact in Hausdorff is closed.</b> Let $Y$ be compact in Hausdorff $X$ and $x_0\notin Y$. For each $y\in Y$ choose disjoint open $U_y\ni x_0$ and $V_y\ni y$. The $V_y$ cover $Y$; take finitely many, $V_{y_1},\dots,V_{y_n}$. Then $U=U_{y_1}\cap\dots\cap U_{y_n}$ is open, contains $x_0$, and misses $V_{y_1}\cup\dots\cup V_{y_n}\supseteq Y$. So $X-Y$ is open.</p>
<p><b>26.5 Continuous images of compact sets are compact.</b> Let $f:X\to Y$ be continuous, $X$ compact, and cover $f(X)$ by open sets $V_\alpha$ of $Y$. The preimages $f^{-1}(V_\alpha)$ are open and cover $X$; finitely many do, and the matching $V_\alpha$ cover $f(X)$.</p>
<p><b>26.6 and the closed map lemma.</b> A continuous map from a compact space to a Hausdorff space is closed; so a continuous bijection is a homeomorphism, and a continuous surjection is a quotient map ([[closed-map-lemma]]).</p>
<p><b>A finite union of compact sets is compact:</b> take a finite subcover for each and put them together.</p>`],
  ['Facts to keep in mind', R`<ul class="facts"><li>In a Hausdorff space, compact sets behave like points: they are closed, and two disjoint compact sets can be separated by disjoint open sets (26.4 and its proof).</li><li>In a metric space a compact set is bounded ([[bounded-metric]], [[hw10-q1]]); in $\mathbb R^n$, compact means closed and bounded ([[compact-reals|Heine–Borel]]).</li><li>Compactness is a topological property: a homeomorphism carries open covers to open covers.</li><li>Finite products of compact spaces are compact (26.7, via the tube lemma); so are arbitrary products (Tychonoff, §37).</li></ul>`],
  ['History', R`<p>The idea comes from analysis. Émile Borel (in his 1894 thesis, published 1895) showed that a countable cover of a closed bounded interval by open intervals has a finite subcover; Pierre Cousin (1895) and Henri Lebesgue (1904) extended it to arbitrary covers. Maurice Fréchet introduced the word "compact" (1904–1906), in a sequential sense, to carry the Bolzano–Weierstrass theorem over to spaces of functions. Pavel Alexandroff and Pavel Urysohn made the open-cover property the definition (formulated in 1923, published in their 1929 memoir; they called it "bicompact"). <em>Interpretation:</em> the modern definition keeps Borel's finite-subcover property and drops the sequences, which is why it works in every topological space.<sup>1</sup></p><p class="fn"><sup>1</sup> M. Raman-Sundström, "A pedagogical history of compactness", <em>American Mathematical Monthly</em> 122 (2015), arXiv:1006.4131; the 1923/1929 dates for Alexandroff and Urysohn differ between sources.</p>`],
  ['Where it sits', R`<p>§26 opens the second half of Chapter 3. With [[connected|connectedness]] it gives the two great properties that recast real analysis: connectedness behind the intermediate value theorem, compactness behind the extreme value theorem and uniform continuity (§27). Method: [[m-compact]].</p>`]]};

A['closed-map-lemma'] = {title: 'Compact to Hausdorff: closed maps, quotients, homeomorphisms', kind: 'theorem', where: '§26', pre: ['compact', 'hausdorff', 'quotient-map'],
  lede: 'A continuous map from a compact space to a Hausdorff space sends closed sets to closed sets. So a continuous surjection of this kind is a quotient map, and a continuous bijection is a homeomorphism.',
  sections: [
  ['Statement', R`<p>Let $f:X\to Y$ be continuous, $X$ compact, $Y$ Hausdorff. Then $f$ is a <b>closed map</b>: $f(A)$ is closed in $Y$ for every closed $A\subseteq X$.</p><ul class="facts"><li>If $f$ is also surjective, it is a [[quotient-map]] ([[hw10-q4]]).</li><li>If $f$ is also bijective, it is a [[homeomorphism]] (Theorem 26.6).</li></ul>`],
  ['Proof', R`<p>Three theorems in a row. Let $A$ be closed in $X$.</p><ol class="facts"><li>$A$ is compact, as a closed subset of a compact space (26.2).</li><li>$f(A)$ is compact, as a continuous image of a compact space (26.5).</li><li>$f(A)$ is closed, as a compact subset of a Hausdorff space (26.3).</li></ol>`],
  ['Why closed gives quotient', R`<p>A quotient map can be described with closed sets instead of open ones: a surjection $f$ is a quotient map iff $C\subseteq Y$ is closed exactly when $f^{-1}(C)$ is closed (take complements, since $f^{-1}(Y-C)=X-f^{-1}(C)$). Continuity gives one direction. For the other, if $f^{-1}(C)$ is closed, then $f(f^{-1}(C))$ is closed because $f$ is a closed map, and $f(f^{-1}(C))=C$ because $f$ is surjective.</p>`],
  ['Why closed gives homeomorphism', R`<p>For a bijection, $f$ being closed says $(f^{-1})^{-1}(A)=f(A)$ is closed for every closed $A$: the inverse is continuous.</p>`],
  ['Examples', R`<ul class="facts"><li>$p:[0,1]\to S^1$, $p(t)=(\cos2\pi t,\sin2\pi t)$: continuous, surjective, $[0,1]$ compact, $S^1$ Hausdorff, so $p$ is a quotient map. The circle really is the interval with its ends glued ([[gluing-examples]]).</li><li>The same map on $[0,1)$ is a continuous bijection that is <em>not</em> a homeomorphism: $[0,1)$ is not compact, and the lemma does not apply.</li><li>The binary-digits map $\prod\{0,1\}\to[0,1]$ ([[hw10-q6]]).</li></ul>`],
  ['Where it sits', R`<p>It is the most-used consequence of compactness for building spaces: to recognise a quotient or a homeomorphism, check only continuity and surjectivity (or bijectivity), provided the domain is compact and the target Hausdorff. Compare the hard way, [[m-quotient-map]].</p>`]]};

A['bounded-metric'] = {title: 'Bounded sets and diameter in a metric space', kind: 'definition', where: '§20', pre: ['metric', 'ball'],
  lede: 'A set is bounded if its points are all within some fixed distance of each other; compact sets are bounded, but bounded sets need not be compact.',
  sections: [
  ['Definition', R`<p>A subset $A$ of a metric space $(X,d)$ is <b>bounded</b> if there is $M$ with $d(a,b)\le M$ for all $a,b\in A$. Its <b>diameter</b> is the least such bound, $\operatorname{diam}A=\sup\{d(a,b):a,b\in A\}$ (Munkres §20). Equivalently, for a nonempty $A$ and any point $x$: $A$ lies in some ball $B(x,r)$.</p>`],
  ['Examples', R`<ul class="facts"><li><b>The standard example:</b> $[0,1]$ and $(0,1)$ in $\mathbb R$, both bounded, diameter $1$. Only $[0,1]$ is compact.</li><li><b>Its contrast:</b> $\mathbb R$ itself is not bounded.</li><li>Every compact metric space is bounded ([[hw10-q1]]).</li></ul>`],
  ['Boundedness is not topological', R`<p>The <b>standard bounded metric</b> $\bar d(x,y)=\min\{d(x,y),1\}$ gives the same topology as $d$ (Theorem 20.1), yet every set is bounded for $\bar d$. So $\mathbb R$ with $\bar d$ is bounded but not compact. Boundedness depends on the metric; compactness depends only on the topology.</p>`],
  ['Where it sits', R`<p>Heine–Borel (27.3) says that in $\mathbb R^n$ with the usual metric, compact means closed <em>and</em> bounded; the second condition is metric, the first topological. See [[compact-reals]].</p>`]]};

A['local-compact'] = {title: 'Local compactness and the one-point compactification (§29)', kind: 'definition', where: '§29', pre: ['compact', 'hausdorff'],
  lede: 'Every point has a compact set containing a neighbourhood of it. A locally compact Hausdorff space becomes a compact Hausdorff space by adding one point, ∞.',
  sections: [
  ['Definition', R`<p>$X$ is <b>locally compact at $x$</b> if there is a compact $C\subseteq X$ containing a neighbourhood of $x$: an open $U$ with $x\in U\subseteq C$. $X$ is <b>locally compact</b> if it is so at every point (Munkres §29).</p>`],
  ['Examples', R`<ul class="facts"><li><b>The standard example:</b> $\mathbb R$: $x\in(x-1,x+1)\subseteq[x-1,x+1]$, a compact interval. Likewise $\mathbb R^n$ with closed balls or cubes.</li><li><b>Its contrast:</b> [[ex-rationals|ℚ]] is not locally compact: no neighbourhood of a point of $\mathbb Q$ lies in a compact subset of $\mathbb Q$.</li><li>Every compact space (take $C=X$); every discrete space (take $C=\{x\}$).</li><li>$\mathbb R^\omega$ in the product topology is not locally compact.</li></ul>`],
  ['The one-point compactification', R`<p>Let $X$ be Hausdorff. Add one new point, $X^+=X\cup\{\infty\}$, and take as open sets</p>
$$\mathcal T^+=\mathcal T\cup\{X^+-K: K\subseteq X\text{ compact}\}.$$
<p>The new open sets are the "neighbourhoods of infinity": everything outside a compact set, plus $\infty$. Then:</p><ul class="facts"><li>$\mathcal T^+$ is a topology ([[hw10-q2]]); 26.3 and 26.2 are what make it work.</li><li>$X^+$ is always compact ([[hw10-q3]]): the open set around $\infty$ leaves only a compact set to cover.</li><li>$X^+$ is Hausdorff exactly when $X$ is locally compact ([[hw10-q3]](b) for the "if").</li><li>$X$ sits inside $X^+$ as a subspace. Theorem 29.1: $X$ is locally compact Hausdorff iff there is a compact Hausdorff $Y$ containing $X$ as a subspace with $Y-X$ a single point, and such a $Y$ is unique up to a homeomorphism fixing $X$.</li></ul>`],
  ['Examples of compactifications', R`<ul class="facts"><li>$\mathbb R^+\cong S^1$: going far out in either direction approaches the same new point.</li><li>$\mathbb N^+\cong\{0\}\cup\{\tfrac1n\}$: the new point is the limit of the sequence.</li><li>$(\mathbb R^2)^+\cong S^2$, by stereographic projection (the Riemann sphere).</li><li>If $X$ is already compact, $\infty$ is an isolated point: $\{\infty\}=X^+-X$ is open.</li></ul>`],
  ['History', R`<p>The construction is due to Pavel Alexandroff (1924), and is also called the Alexandroff compactification. The Riemann sphere of complex analysis, the plane with one point at infinity, is its best-known earlier case.<sup>1</sup></p><p class="fn"><sup>1</sup> nLab, "one-point compactification"; the Riemann sphere dates from Riemann's work in the 1850s.</p>`],
  ['Where it sits', R`<p>§29 closes the compactness sections. Local compactness is the third local property of the course, after [[local-connectedness]] and [[local-path-connectedness]], with the same "a good set around every point" shape.</p>`]]};

A['ex-cantor-product'] = {title: 'The product ∏{0,1} (sequences of 0s and 1s)', kind: 'example', where: '§19', pre: ['product-vs-box', 'indexed-products'],
  lede: 'Infinite sequences of 0s and 1s, with the product topology: compact, totally disconnected, and mapped onto [0,1] by reading the sequence as a binary expansion.',
  sections: [
  ['What it is', R`<p>$X=\prod_{n\ge1}\{0,1\}$, each factor discrete: a point is a sequence $x=(x_1,x_2,\dots)$ of $0$s and $1$s. In the <b>product topology</b> a basis element restricts finitely many coordinates. The basic open sets used most are the <b>cylinders</b></p>
$$W=\{x': x'_n=x_n\text{ for all }n\le N\}=\pi_1^{-1}(\{x_1\})\cap\dots\cap\pi_N^{-1}(\{x_N\}),$$
<p>the sequences that agree with $x$ in the first $N$ places. Each is open, as a finite intersection of preimages of open sets under the continuous projections.</p>`],
  ['Facts to keep in mind', R`<ul class="facts"><li>Two sequences are close when they agree for a long time: every neighbourhood of $x$ contains a cylinder around $x$.</li><li><b>Compact</b>, by Tychonoff's theorem (§37); HW10 allows this without proof.</li><li><b>Totally disconnected:</b> each cylinder is open and closed, so the only connected sets are points.</li><li>The map $f(x)=\sum x_n2^{-n}$ reads $x$ as a binary expansion. It is continuous ([[hw10-q5]]) and maps $X$ onto $[0,1]$ as a quotient map ([[hw10-q6]]). It is not injective: $0111\ldots$ and $1000\ldots$ both go to $\tfrac12$.</li><li>A standard fact beyond Munkres's §19: $X$ is homeomorphic to the Cantor set, by $x\mapsto\sum 2x_n3^{-n}$.</li></ul>`],
  ['Why it matters', R`<p>It shows a compact space mapping onto $[0,1]$, which gives a second proof that $[0,1]$ is compact. The quotient identifies exactly the pairs of binary expansions of the same number, so $[0,1]$ is $X$ with those pairs glued ([[relation-induced]]).</p>`]]};

'hw10-q2': PB10('HW10 Q2 · The one-point compactification is a topology', R`For Hausdorff $X$, $\mathcal T^+=\mathcal T\cup\{X^+-K: K\subseteq X\text{ compact}\}$ satisfies (a) axiom (2), unions, and (b) axiom (3), finite intersections.`, ['local-compact', 'topology', 'compact', 'hausdorff'], ['m-topology']),

Object.assign(VERBATIM, {
'hw10-q1': R`<p>Let $d:X\times X\to\mathbb R$ be a metric, and let $X$ have the metric topology.</p><p>(a) Let $x\in X$. Prove that $\bigcup_{r\in\mathbb R}B_d(x,r)=X$.</p><p>(b) Prove that if $X$ is compact, then there exists an $r\in\mathbb R$ such that $B_d(x,r)=X$.</p><p>(c) Give an example of a metric space for which $B_d(x,1)=X$ for some $x\in X$, but $X$ is not compact.</p>`,
'hw10-q2': R`<p>For a Hausdorff topological space $X$ with topology $\mathcal T$, let $X^+=X\cup\{\infty\}$ be the union of $X$ and a one-element set $\{\infty\}$ disjoint from $X$. Let</p>$$\mathcal T^+=\mathcal T\cup\{X^+\setminus K\mid K\subset X\text{ compact}\}.$$<p>(a) Prove that $\mathcal T^+$ satisfies axiom (2) for a topology on $X^+$.</p><p>(b) Prove that $\mathcal T^+$ satisfies axiom (3) for a topology on $X^+$.</p>`,
'hw10-q3': R`<p><i>This question is a continuation of the previous.</i></p><p>(a) Prove that the topology $\mathcal T^+$ on $X^+$ is compact.</p><p>(b) Assume that for any $x\in X$, there exists an open $U\subset X$ and a compact $K\subset X$ such that $x\in U\subset K$. Prove that the topology $\mathcal T^+$ is Hausdorff.</p>`,
'hw10-q4': R`<p>Let $X$ and $Y$ be topological spaces, and assume $X$ is compact and $Y$ is Hausdorff. Prove that if $f:X\to Y$ is continuous and surjective, then it is a quotient map.</p>`,
'hw10-q5': R`<p>Let $\{0,1\}$ have the discrete topology, let $J=\{1,2,\dots\}$ be the positive integers, and let</p>$$X=\prod_{j\in J}\{0,1\}$$<p>have the product topology. Let $f:X\to\mathbb R$ be the function defined as</p>$$f(x)=\sum_{n=1}^\infty x_n2^{-n}.$$<p>(a) Prove that if $x,x'\in X$ satisfy $x_n=x'_n$ for all $n\le N$, then $|f(x)-f(x')|\le2^{-N}$.</p><p>(b) Deduce that $f$ is continuous.</p>`,
'hw10-q6': R`<p><i>This question is a continuation of the previous.</i> In this question, it may be used without proof that $X$ is compact.</p><p>(a) Let $Y=f(X)$ be the image of $X$, and give it the subspace topology from the standard topology on $\mathbb R$. Prove that $Y$ is compact and that $f:X\to Y$ is a quotient map.</p><p>(b) Explain why $Y=[0,1]$.</p><p><i>This gives a different path to proving that closed intervals are compact. This route relies on Tychonoff's theorem, which we have not proves in class.</i></p>`
});
var PDF10 = '<p class="foot">Word for word from the assignment PDF (Homework 10, due Monday 11/23/26, before 11:59 PM, Gradescope; 2% of the grade; six questions on two pages). The assignment asks for all steps with a clear explanation, and no results beyond what the class has covered.</p>';
function hub10(id, parts){ A[id].sections = [['The problem', VERBATIM[id] + PDF10], ['Concepts and method', '']].concat(parts); }

hub10('hw10-q1', [
 ['How the terms are used', R`<p>The <b>open ball</b> ([[ball]]):</p>$$B_d(x,r)=\{y\in X: d(x,y)\lt r\};$$<p>for $r\le0$ it is empty. Balls are open in the [[metric-topology]], and a larger radius gives a larger ball:</p>$$r\le s\ \Longrightarrow\ B_d(x,r)\subseteq B_d(x,s).$$<p>[[compact|Compact]]: every open cover has a finite subcover. (b) says a compact metric space is <b>bounded</b> ([[bounded-metric]]); (c) says the converse fails.</p>`],
 ['Breakdown', steps([
  [R`<b>(a) Two inclusions.</b> Each ball is a subset of $X$, so the union is contained in $X$.`, R`A set equality is two inclusions ([[set-equality]]); this one is immediate.`],
  [R`<b>(a) Every point lies in some ball:</b> for $y\in X$ take $r=d(x,y)+1$.`, R`$d(x,y)$ is a real number, and $d(x,y)\lt d(x,y)+1$, so $y\in B_d(x,r)$.`],
  [R`<b>(b) The balls around $x$ are an open cover.</b>`, R`Each is open (metric topology) and by (a) they cover $X$.`],
  [R`<b>(b) Compactness gives finitely many:</b> $B_d(x,r_1),\dots,B_d(x,r_k)$ cover $X$.`, R`The definition of compact.`],
  [R`<b>(b) Nested balls:</b> with $r=\max r_i$, every $B_d(x,r_i)\subseteq B_d(x,r)$, so $B_d(x,r)=X$.`, R`Finitely many radii have a largest; this is the step that needs finiteness.`],
  [R`<b>(c) Example:</b> $X=(0,1)$ with $d(a,b)=|a-b|$, and $x=\tfrac12$.`, R`Every point of $(0,1)$ is within $\tfrac12\lt1$ of $\tfrac12$, so $B_d(\tfrac12,1)=X$; but $(0,1)$ is not compact.`],
  [R`<b>(c) Not compact:</b> the cover $\{(\tfrac1n,1): n\ge2\}$ has no finite subcover.`, R`Finitely many have a largest index $N$, and their union $(\tfrac1N,1)$ misses $\tfrac1{2N}$.`]])],
 ['Clean solution', R`<p><b>(a)</b> Each $B_d(x,r)$ is a subset of $X$, so $\bigcup_{r}B_d(x,r)\subseteq X$. Conversely, let $y\in X$ and put $r=d(x,y)+1\in\mathbb R$. Then $d(x,y)\lt r$, so $y\in B_d(x,r)$. Hence $X\subseteq\bigcup_rB_d(x,r)$, and the two sets are equal.</p>
<p><b>(b)</b> Each ball $B_d(x,r)$ is open in the metric topology, and by (a) the collection $\{B_d(x,r):r\in\mathbb R\}$ covers $X$. Since $X$ is compact, finitely many of them, $B_d(x,r_1),\dots,B_d(x,r_k)$, cover $X$ (with $k\ge1$, since $x\in X$). Let $r=\max\{r_1,\dots,r_k\}$. If $d(x,y)\lt r_i$ then $d(x,y)\lt r$, so $B_d(x,r_i)\subseteq B_d(x,r)$ for each $i$. Therefore $X=\bigcup_{i}B_d(x,r_i)\subseteq B_d(x,r)\subseteq X$, and $B_d(x,r)=X$.</p>
<p><b>(c)</b> Let $X=(0,1)$ with $d(a,b)=|a-b|$ and $x=\tfrac12$. For $y\in(0,1)$, $|y-\tfrac12|\lt\tfrac12\lt1$, so $B_d(\tfrac12,1)=X$. But $X$ is not compact: the sets $(\tfrac1n,1)$, $n\ge2$, are open and cover $(0,1)$ (each $y\gt0$ exceeds some $\tfrac1n$), while any finite subcollection has a largest index $N$, and its union $(\tfrac1N,1)$ does not contain $\tfrac1{2N}\in X$. $\blacksquare$</p>`]]);

hub10('hw10-q2', [
 ['How the terms are used', R`<p>The axioms for a topology on $X^+$ (Munkres §12): (1) $\varnothing$ and $X^+$ are open; (2) <b>any union</b> of open sets is open; (3) <b>any finite intersection</b> of open sets is open.</p><p>$\mathcal T^+$ has two kinds of set. <b>Type I:</b> $U\in\mathcal T$, open in $X$; these do not contain $\infty$. <b>Type II:</b> $X^+-K$ with $K\subseteq X$ compact; these contain $\infty$.</p><p>The two facts about compact sets that make it work: in a Hausdorff space a compact set is closed (26.3), and a closed subset of a compact set is compact (26.2). Also: a finite union of compact sets is compact ([[compact]]).</p>`],
 ['Breakdown', steps([
  [R`<b>Translate type II into complements:</b> $X^+-K$ is the complement of $K$.`, R`Unions of complements are complements of intersections; intersections of complements are complements of unions (De Morgan).`],
  [R`<b>(a) Only type I sets:</b> their union is in $\mathcal T$.`, R`Axiom (2) for $\mathcal T$.`],
  [R`<b>(a) At least one type II set:</b> write the union as $U\cup\bigcup_\beta(X^+-K_\beta)$, with $U$ the union of the type I sets.`, R`$U\in\mathcal T$ (possibly empty).`],
  [R`<b>(a) It equals $X^+-C$ with $C=\big(\bigcap_\beta K_\beta\big)\cap(X-U)$.</b>`, R`$\bigcup_\beta(X^+-K_\beta)=X^+-\bigcap_\beta K_\beta$; adding $U$ removes $U$ from what is left out.`],
  [R`<b>(a) $C$ is compact.</b> Each $K_\beta$ is closed (26.3), so $\bigcap K_\beta$ is closed, and $X-U$ is closed; so $C$ is a closed subset of $X$ lying in one compact $K_{\beta_0}$.`, R`A closed subset of $X$ inside $K_{\beta_0}$ is closed in $K_{\beta_0}$, so compact by 26.2.`],
  [R`<b>(b) Two sets suffice</b>, then induct; three cases.`, R`A finite intersection is built from intersections of two.`],

 ['Clean solution', R`<p>Call the members of $\mathcal T$ <em>type I</em> and the sets $X^+-K$, $K\subseteq X$ compact, <em>type II</em>. Since $X$ is Hausdorff, every compact $K\subseteq X$ is closed in $X$ (Theorem 26.3).</p>

<p><b>(b)</b> For every $x$, $0\le f(x)\le\sum_{n\ge1}2^{-n}=1$, so $Y\subseteq[0,1]$. Conversely let $t\in[0,1]$. Define $b_n\in\{0,1\}$ inductively, with $s_n=\sum_{k\le n}b_k2^{-k}$ and $s_0=0$: put $b_n=1$ if $s_{n-1}+2^{-n}\le t$, and $b_n=0$ otherwise. We show by induction that $0\le t-s_n\le2^{-n}$. For $n=0$, $0\le t\le1$. If $0\le t-s_{n-1}\le2^{-(n-1)}$: when $b_n=1$, $t-s_n=(t-s_{n-1})-2^{-n}\in[0,2^{-n}]$; when $b_n=0$, $t-s_n=t-s_{n-1}\lt2^{-n}$. Hence $s_n\to t$, so $f(b)=t$ for $b=(b_1,b_2,\dots)\in X$. Thus $[0,1]\subseteq Y$, and $Y=[0,1]$.</p>

 [R`<b>(a) Write the difference as one series</b> and watch the first $N$ terms cancel.`, R`<p>Both sums converge, since every term is between $0$ and $2^{-n}$. Subtracting them term by term,</p>$$f(x)-f(x')=\sum_{n=1}^\infty(x_n-x'_n)2^{-n}.$$<p>For $n\le N$ the digits agree, so those terms are zero. Only the tail, from $n=N+1$ on, can contribute: the early digits, which carry the most weight, are identical.</p>`],
 [R`<b>(a) Bound the tail</b> by the worst case, where every remaining digit differs.`, R`<p>Each difference $x_n-x'_n$ is $-1$, $0$ or $1$, so its size is at most $1$. Using the triangle inequality on the series,</p>$$|f(x)-f(x')|\le\sum_{n=N+1}^\infty|x_n-x'_n|\,2^{-n}\le\sum_{n=N+1}^\infty2^{-n}=2^{-N}.$$<p>The last sum is the tail of the geometric series: $2^{-(N+1)}+2^{-(N+2)}+\dots$ adds up to $2^{-N}$. So agreeing on the first $N$ digits pins the value down to within $2^{-N}$.</p>`],
 [R`<b>(b) Given a target accuracy $\varepsilon$, choose how many digits to fix.</b>`, R`<p>Pick $N$ so large that $2^{-N}\lt\varepsilon$. Let $W$ be the set of all sequences that agree with $x$ in the first $N$ places. By (a), every $x'\in W$ has</p>$$|f(x')-f(x)|\le2^{-N}\lt\varepsilon.$$<p>So fixing enough early digits keeps the value within $\varepsilon$.</p>`],
 [R`<b>(b) Check that $W$ is open</b> in the product topology.`, R`<p>$W$ restricts only finitely many coordinates, the first $N$, and leaves all the others free:</p>$$W=\pi_1^{-1}(\{x_1\})\cap\dots\cap\pi_N^{-1}(\{x_N\}).$$<p>Each $\{x_n\}$ is open in the discrete space $\{0,1\}$, each projection $\pi_n$ is continuous, and a finite intersection of open sets is open. This is the product topology's basic open set; in the box topology many more sets would be open, but here this is all that is needed.</p>`],
 [R`<b>(b) Conclude continuity</b> from "every point has a small open set around it".`, R`<p>Let $V\subseteq\mathbb R$ be open and $x\in f^{-1}(V)$. Choose $\varepsilon$ so that the interval $(f(x)-\varepsilon,f(x)+\varepsilon)$ lies in $V$. The open set $W$ from the previous steps contains $x$ and is mapped into that interval, hence into $V$. So every point of $f^{-1}(V)$ has an open set around it inside $f^{-1}(V)$, which makes $f^{-1}(V)$ open. That is continuity.</p>`]],
'hw10-q6': [
 [R`<b>(a) Get compactness of $Y$ from the compactness of $X$.</b>`, R`<p>$f$ is continuous (question 5), and restricting its target to the subspace $Y=f(X)$ keeps it continuous. The image of a compact space under a continuous map is compact (26.5), and $X$ is compact by Tychonoff's theorem, which the question lets you use. So $Y$ is compact.</p>`],
 [R`<b>(a) Get "quotient map" from question 4.</b>`, R`<p>Question 4 needs three things: a compact domain ($X$), a Hausdorff target, and a continuous surjection. $Y$ is a subspace of $\mathbb R$, and subspaces of Hausdorff spaces are Hausdorff. $f:X\to Y$ is onto $Y$ by the definition of $Y$. So question 4 applies, and $f$ is a quotient map. No open sets need to be checked by hand.</p>`],
 [R`<b>(b) Show $Y\subseteq[0,1]$:</b> every value of $f$ is between $0$ and $1$.`, R`<p>All terms $x_n2^{-n}$ are at least $0$ and at most $2^{-n}$, so</p>$$0\le f(x)\le\sum_{n=1}^\infty2^{-n}=1.$$`],
 [R`<b>(b) Show $[0,1]\subseteq Y$:</b> build the binary digits of a given $t$ one at a time.`, R`<p>Given $t\in[0,1]$, choose the digits greedily: at step $n$, set $b_n=1$ if adding $2^{-n}$ to the sum so far does not go past $t$, and $b_n=0$ otherwise. Each choice keeps the partial sum $s_n$ at or below $t$, and within $2^{-n}$ of it:</p>$$0\le t-s_n\le2^{-n}.$$<p>As $n$ grows, $2^{-n}\to0$, so $s_n\to t$, which says $f(b)=t$. Every $t$ is reached, so $Y=[0,1]$.</p><p>Putting (a) and (b) together, $[0,1]$ is compact: a second proof, routed through the compactness of the switch space.</p>`]]

'hw10-q1': R`<p>Stand at a point $x$ and draw circles around it, larger and larger. Every point of the space is some finite distance from $x$, so sooner or later each point is caught inside one of the circles.</p><p>The interesting question is whether a single circle is ever enough. In the plane it never is: the plane goes on forever. On a closed disc it always is. What separates the two is compactness. In a compact space, the growing circles can be cut down to finitely many, and finitely many circles around one point amount to the biggest of them. So a compact space always fits inside one circle.</p><p>The last part is a caution in the other direction: a space can fit inside one circle and still fail to be compact. Being bounded is a consequence of compactness, never a replacement for it.</p>
<p><b>Recall</b> the open ball around $x$ of radius $r$:</p>
$$B_d(x,r)=\{y\in X:\ d(x,y)\lt r\}.$$
<p>Balls are open in the metric topology ([[ball]]), and they are <b>nested</b>: a larger radius gives a larger ball,</p>
$$r\le s\ \Longrightarrow\ B_d(x,r)\subseteq B_d(x,s).$$
<p><b>Recall</b> compactness: every open cover has a finite subcover ([[compact]]). The whole problem turns on one fact about finite sets of numbers: they have a largest element.</p>`,
'hw10-q2': R`<p>Think of the real line as a road running off in both directions. Far to the left and far to the right, it never arrives anywhere. The one-point compactification adds a single destination, a new point called $\infty$, that both ends of the road approach. Bend the line round so that its two ends meet at that point and you have a circle; the plane, treated the same way, closes up into a sphere.</p><p>To make this precise, you have to say which sets count as open around the new point. The answer: a set is a neighbourhood of $\infty$ when it contains everything outside some compact piece of $X$. Being near infinity means being far out, beyond any compact region. This question checks that the new open sets, together with the old ones, still obey the rules every topology must obey.</p>
<p>Axiom (1) is immediate: $\varnothing\in\mathcal T$, and $X^+=X^+-\varnothing$ with $\varnothing$ compact. The work is in unions and intersections, and there the new sets are best handled as complements. <b>Recall</b> De Morgan's laws, written for these sets:</p>
$$\bigcup_\beta\,(X^+-K_\beta)=X^+-\bigcap_\beta K_\beta,$$
$$(X^+-K_1)\cap(X^+-K_2)=X^+-(K_1\cup K_2).$$
<p>So the problem becomes: are $\bigcap K_\beta$ (cut down by an open set) and $K_1\cup K_2$ still compact? <b>Recall</b> the two theorems that answer it: in a Hausdorff space compact sets are closed (26.3), and a closed subset of a compact set is compact (26.2). This is where the hypothesis "$X$ Hausdorff" is used.</p>`,
'hw10-q3': R`<p>Adding the point $\infty$ pays off in two ways. First, the new space is compact. Whatever open sets you use to cover it, the one that covers $\infty$ already takes care of everything except a compact piece, and a compact piece needs only finitely many more.</p><p>Second, provided each point of $X$ has some compact region around it, the new point can be kept apart from the old ones, so the space is Hausdorff. For the real line, this is the circle from question 2, now shown to be a well-behaved space.</p>
<p><b>Recall</b> compactness for a subspace (Lemma 26.1): $K$ is compact iff every cover of $K$ by sets open in the big space has a finite subcover. <b>Recall</b> Hausdorff: distinct points have disjoint open neighbourhoods. And from question 2, the two kinds of open set in $X^+$:</p>
$$U\in\mathcal T\quad(\infty\notin U),\qquad X^+-K,\ K\text{ compact}\quad(\infty\in X^+-K).$$
<p>In (b), the hypothesis gives, for each $x$, sets with</p>
$$x\in U\subseteq K,$$
<p>and $U$ and $X^+-K$ are then automatically disjoint.</p>`,
'hw10-q4': R`<p>A quotient map is the precise form of gluing: it says that the target space is exactly the domain with certain points identified. Checking that a map is a quotient map is usually fiddly, because you have to check every set whose preimage happens to be open.</p><p>This question removes the fiddliness in the most common situation. Start from a compact space, land in a Hausdorff one, and any continuous map that covers the whole target is automatically a quotient map. The reason is that compactness carries closed sets forward: a closed set is compact, its image is compact, and in a Hausdorff space compact sets are closed. It is the tool that shows, for instance, that gluing the ends of $[0,1]$ really produces a circle.</p>
<p><b>Recall</b> the definition: a surjection $f:X\to Y$ is a quotient map when</p>
$$V\text{ open in }Y\iff f^{-1}(V)\text{ open in }X.$$
<p>The same can be said with closed sets, because preimages respect complements:</p>
$$f^{-1}(Y-C)=X-f^{-1}(C).$$
<p><b>Recall</b> the three compactness theorems that will be chained: closed in compact is compact (26.2); continuous images of compact sets are compact (26.5); compact in Hausdorff is closed (26.3).</p>`,
'hw10-q5': R`<p>Imagine an infinite row of switches, each set to $0$ or $1$. The space $X$ is the collection of every possible setting of the whole row. Two settings count as close when their first many switches agree; what happens far down the row hardly matters.</p><p>The function $f$ reads a setting as a binary number between $0$ and $1$: the first switch is worth a half, the second a quarter, the third an eighth, and so on. Switches far down the row are worth very little, so changing them barely moves the number. That is all continuity means here, and this question makes it precise.</p>
<p><b>Recall</b> the basic open sets of the product: fixing finitely many coordinates gives an open set, because each projection $\pi_n$ is continuous and $\{0,1\}$ is discrete. In particular, the sequences agreeing with $x$ up to place $N$ form an open set:</p>
$$W=\{x':\ x'_n=x_n\text{ for }n\le N\}=\pi_1^{-1}(\{x_1\})\cap\dots\cap\pi_N^{-1}(\{x_N\}).$$
<p><b>Recall</b> the tail of the geometric series:</p>
$$\sum_{n=N+1}^{\infty}2^{-n}=2^{-N}.$$
<p><b>Recall</b> continuity into $\mathbb R$: it is enough that for every $x$ and every $\varepsilon\gt0$ there is an open $W\ni x$ with $f(W)\subseteq(f(x)-\varepsilon,\,f(x)+\varepsilon)$.</p>`,
'hw10-q6': R`<p>Every number between $0$ and $1$ can be written in binary, so every such number is $f$ of some row of switches. That makes $[0,1]$ the image of the space of switch settings. That space is compact (you may assume it), and images of compact spaces are compact, so $[0,1]$ is compact: a new proof of a fact you already know.</p><p>Question 4 then says more. $[0,1]$ is not just an image but a quotient: the interval is the space of switch settings with a few pairs glued together, the pairs such as $0111\ldots$ and $1000\ldots$ that name the same number.</p>
<p><b>Recall</b> Theorem 26.5: a continuous image of a compact space is compact. <b>Recall</b> that a subspace of a Hausdorff space is Hausdorff, so $Y\subseteq\mathbb R$ is Hausdorff. <b>Recall</b> binary expansions: every $t\in[0,1]$ can be written</p>
$$t=\sum_{n=1}^{\infty}b_n2^{-n},\qquad b_n\in\{0,1\},$$
<p>and every such sum lies in $[0,1]$, since</p>
$$0\le\sum_{n=1}^{\infty}b_n2^{-n}\le\sum_{n=1}^{\infty}2^{-n}=1.$$`

 S.splice(k, 1, ['Work-through', R`<div class="wk">
<h4>Naming the maps</h4>
<p>Every statement in this problem is about "all continuous maps $f:X\to\{0,1\}$", so it helps to give that collection a name. Let $\mathcal F$ be the set of all continuous $f:X\to\{0,1\}$. The relation then reads</p>
$$x\sim x'\iff f(x)=f(x')\ \text{ for every } f\in\mathcal F.$$
<p>Written this way, $x\sim x'$ is a whole list of equations, one for each map in $\mathcal F$. Each equation compares two values in $\{0,1\}$, and comparing values needs nothing more than ordinary equality. That observation is the entire idea of part (a).</p>

<h4>(a) Reflexive</h4>
<p>To show $x\sim x$ we have to show $f(x)=f(x)$ for every $f\in\mathcal F$. A claim about every $f$ is proved by taking one arbitrary $f$ and showing it there. So let $f\in\mathcal F$. Any value equals itself, so $f(x)=f(x)$. Since $f$ was arbitrary, this holds for all $f$, and $x\sim x$.</p>

<h4>(a) Symmetric</h4>
<p>Now suppose $x\sim x'$, which means $f(x)=f(x')$ for every $f$. We want $x'\sim x$, that is, $f(x')=f(x)$ for every $f$. Take an arbitrary $f\in\mathcal F$. The hypothesis, applied to this $f$, gives $f(x)=f(x')$, and an equation can be read in either direction, so $f(x')=f(x)$. Since $f$ was arbitrary, $x'\sim x$.</p>

<h4>(a) Transitive</h4>
<p>This is the step that needs care, because there are two hypotheses, each about all maps: $f(x)=f(x')$ for every $f$, and $f(x')=f(x'')$ for every $f$. The way to combine them is to fix <em>one</em> arbitrary $f\in\mathcal F$ and apply <em>both</em> hypotheses to that same $f$. Then $f(x)=f(x')$ and $f(x')=f(x'')$ are two equations sharing the middle value $f(x')$, so $f(x)=f(x'')$. Since $f$ was arbitrary, $x\sim x''$.</p>
<p>So $\sim$ is reflexive, symmetric and transitive, and is an equivalence relation. Notice that each property of $\sim$ came straight from the same property of $=$; the phrase "for every $f$" was simply carried along.</p>

<h4>(b) Deciding how to prove a set is closed</h4>
<p>Let $A$ be an equivalence class. There are two standard ways to show a set is closed ([[closed-set]]): show its complement is open, or build the set out of closed sets using operations that keep sets closed. The operations available are taking preimages under continuous maps (Theorem 18.1) and taking intersections of any number of closed sets (Theorem 17.1).</p>
<p>Which to use is decided by what we know. We know nothing at all about the topology of $X$; the only information about $X$ in the problem is that the maps in $\mathcal F$ are continuous. So whatever makes $A$ closed has to come from those maps, which means through preimages. The plan is therefore to write $A$ using preimages.</p>

<h4>(b) Writing the class as an intersection of preimages</h4>
<p>A class is easiest to work with once a point in it is named. Choose $x\in A$; then $A$ is the class of $x$, and by the definition of $\sim$,</p>
$$A=\{x'\in X:\ f(x')=f(x)\ \text{ for every } f\in\mathcal F\}.$$
<p>A point belongs to $A$ when it passes one test for each $f$. Look at a single test first. The points $x'$ with $f(x')=f(x)$ are the points that $f$ sends to the value $f(x)$, which is a preimage: $f^{-1}(\{f(x)\})$ ([[image-preimage]]). Passing every test means lying in every one of these preimages, and "lying in every one of a family of sets" is exactly lying in their intersection. So</p>
$$A=\bigcap_{f\in\mathcal F}f^{-1}(\{f(x)\}).$$
<p>To be sure of the equality, check both inclusions ([[m-set-equality]]). If $x'\in A$, then $f(x')=f(x)$ for each $f$, so $x'$ is in each preimage and therefore in the intersection. If $x'$ is in the intersection, then $f(x')=f(x)$ for each $f$, which says $x'\sim x$, so $x'\in A$.</p>

<h4>(b) Why "for every $f$" becomes an intersection</h4>
<p>"For every $f$" is the word "and" repeated once for each map, and in set language "and" is intersection. By definition, $\bigcap_f S_f=\{x': x'\in S_f\ \text{for every } f\}$: the points lying in <em>all</em> the sets. Compare $A=\{x': f(x')=f(x)\ \text{for every } f\}$. Both are "the points that pass a test for every $f$"; with $S_f=f^{-1}(\{f(x)\})$ the two tests are the same, since $f(x')=f(x)$ says exactly that $x'\in f^{-1}(\{f(x)\})$.</p>
<p>A small case makes it concrete. If only two maps $g,h$ were continuous, then</p>
$$x'\sim x\iff g(x')=g(x)\ \text{and}\ h(x')=h(x)\iff x'\in g^{-1}(\{g(x)\})\cap h^{-1}(\{h(x)\}).$$
<p>More maps add more "and"s, so more sets are intersected; infinitely many maps give an intersection of infinitely many sets, which is why the last step needs Theorem 17.1 for <em>any</em> number of closed sets.</p>
<p>A union would be wrong: $\bigcup_f S_f$ is the set of points in <em>at least one</em> $S_f$, which says "<em>some</em> map agrees on $x'$ and $x$". That is far weaker; a constant map agrees on every pair, so the union would be all of $X$.</p>
<table><tr><th>Logic</th><th>Sets</th></tr><tr><td>and; for every</td><td>$\cap$; $\bigcap$</td></tr><tr><td>or; for some</td><td>$\cup$; $\bigcup$</td></tr><tr><td>not</td><td>complement</td></tr></table>
<p>The last row explains the second proof below: "not in $A$" means "<em>some</em> map separates $x'$ from $x$", so the complement is a union (De Morgan's law).</p>
<h4>(b) Why each preimage is closed</h4>
<p>The value $f(x)$ is $0$ or $1$, so $\{f(x)\}$ is $\{0\}$ or $\{1\}$. In the discrete topology every subset is open, and so, taking complements, every subset is also closed ([[ex-discrete]]). In particular $\{f(x)\}$ is closed in $\{0,1\}$. Since $f$ is continuous, the preimage of this closed set is closed in $X$ (Theorem 18.1).</p>

<h4>(b) Finishing</h4>
<p>$A$ is now an intersection of closed sets, one for each $f\in\mathcal F$. There are usually infinitely many such maps, which is why it matters that Theorem 17.1 allows intersections of any number of closed sets, not just finitely many. So $A$ is closed. $\blacksquare$</p>

<h4>The same proof from the outside</h4>
<p>The argument can also be run on the complement. A point $x'$ is outside $A$ exactly when some map tells it apart from $x$, that is, $f(x')\ne f(x)$ for some $f$; since there are only two values, this means $f(x')=1-f(x)$. So</p>
$$X\setminus A=\bigcup_{f\in\mathcal F}f^{-1}(\{1-f(x)\}),$$
<p>a union of preimages of open sets, which is open. Hence $A$ is closed. This is the first proof with De Morgan's law applied: the complement of an intersection is the union of the complements. Either version is a complete answer.</p>
</div>`]); })();

<h4>What has to be produced</h4>
<p>Path connected is a "for every pair" statement: for any two points of $X=\prod_{j\in J}X_j$ we must produce a path between them ([[path-connected]]). So the proof starts by naming two arbitrary points, and its job is to construct one continuous map $\gamma:[0,1]\to X$ with $\gamma(0)$ the first point and $\gamma(1)$ the second.</p>
<p>A point of the product is a family of coordinates, one in each factor. Write the two points as $x=(x_j)_{j\in J}$ and $y=(y_j)_{j\in J}$, with $x_j,y_j\in X_j$. The index set $J$ can be anything: two indices, countably many, uncountably many. The argument should not depend on which.</p>

<h4>Where the paths come from</h4>
<p>The only hypothesis is that each factor $X_j$ is path connected. Applied to the two points $x_j$ and $y_j$ of $X_j$, it gives a path in that factor: a continuous $\gamma_j:[0,1]\to X_j$ with $\gamma_j(0)=x_j$ and $\gamma_j(1)=y_j$. We do this for every $j$ at once, so we now have one path in each coordinate.</p>

<h4>Combining them into one path</h4>
<p>To move a point of the product, move all of its coordinates. Run all the coordinate paths at the same time, on the same clock $t$:</p>
$$\gamma(t)=(\gamma_j(t))_{j\in J}.$$
<p>At time $t$, the $j$-th coordinate of $\gamma(t)$ is wherever the path $\gamma_j$ has reached. This is a function from $[0,1]$ into $X$, since each $\gamma_j(t)$ lies in $X_j$.</p>

<h4>Why $\gamma$ is continuous</h4>
<p>Checking continuity directly would mean taking open sets of the product, which are unions of basis elements restricting finitely many coordinates. There is a theorem that does this work once and for all. <b>Recall</b> Theorem 19.6 ([[maps-into-products]]): a map into a product with the <em>product</em> topology is continuous exactly when each coordinate function is continuous. The [[coordinate-function|coordinate functions]] of $\gamma$ are $\pi_j\circ\gamma=\gamma_j$, and each $\gamma_j$ is a path, hence continuous. So $\gamma$ is continuous.</p>
<p>It is worth saying "product topology" in the write-up, because Theorem 19.6 is false for the box topology (see "Why it makes sense").</p>

<h4>Checking the endpoints, and concluding</h4>
<p>Two families are equal when they agree in every coordinate. At $t=0$ every coordinate is $\gamma_j(0)=x_j$, so $\gamma(0)=(x_j)_j=x$; at $t=1$ every coordinate is $\gamma_j(1)=y_j$, so $\gamma(1)=y$. Thus $\gamma$ is a path from $x$ to $y$. Since $x$ and $y$ were arbitrary, $X$ is path connected. $\blacksquare$</p>`);

wkSet('hw8-q4', R`
<h4>Listing what is open</h4>
<p>The space is small enough to write everything down. The open sets are $\varnothing$, $\{0\}$ and $X=\{0,1\}$. So $\{1\}$ is <em>not</em> open, and the only open set containing $1$ is all of $X$. That last fact is what will make the problem work: $1$ cannot be given a small neighbourhood that avoids $0$.</p>

<h4>What continuity means for a path into this space</h4>
<p>A path is a continuous $\gamma:[0,1]\to X$. <b>Recall</b> continuity ([[continuous]]): the preimage of every open set must be open, here in $[0,1]$. There are three open sets to check. $\gamma^{-1}(\varnothing)=\varnothing$ and $\gamma^{-1}(X)=[0,1]$ are always open, whatever $\gamma$ is. So the whole condition is:</p>
$$\gamma^{-1}(\{0\}),\ \text{the set of times at which the path is at } 0,\ \text{is open in } [0,1].$$
<p>"Open in $[0,1]$" uses the subspace topology ([[subspace-topology]]): a set is open in $[0,1]$ when it is $[0,1]\cap U$ for some open $U\subseteq\mathbb R$. So $[0,1)=[0,1]\cap(-1,1)$ is open in $[0,1]$, even though it is not open in $\mathbb R$; there is nothing to the left of $0$ to worry about.</p>

<h4>Finding the path from $0$ to $1$</h4>
<p>The path has to start at $0$ and end at $1$, so it must change value at some moment. The condition above says the times spent at $0$ must form an open set. So stay at $0$ for an open stretch of time, $[0,1)$, and arrive at $1$ only at the final instant:</p>
$$\gamma(t)=0\ \text{ for } 0\le t\lt1,\qquad \gamma(1)=1.$$
<p>Then $\gamma^{-1}(\{0\})=[0,1)$, which is open in $[0,1]$, so $\gamma$ is continuous; and $\gamma(0)=0$, $\gamma(1)=1$.</p>
<p>The jump cannot go the other way. If the path sat at $1$ and jumped to $0$ at the end, the time spent at $0$ would be the single point $\{1\}$, which is not open in $[0,1]$. The open point, $0$, has to be the one that occupies an open stretch of time.</p>

<h4>The other pairs of points</h4>
<p>Path connected asks for a path between every pair, so the remaining pairs need a line each. From $1$ to $0$, run the path backwards: $\delta(t)=\gamma(1-t)$. It is at $0$ for $0\lt t\le1$, and $\delta^{-1}(\{0\})=(0,1]=[0,1]\cap(0,2)$ is open in $[0,1]$, so $\delta$ is continuous, with $\delta(0)=1$ and $\delta(1)=0$. From a point to itself, use the constant path; every preimage under a constant map is $\varnothing$ or $[0,1]$, so it is continuous.</p>
<p>Every pair of points is joined by a path, so $X$ is path connected. $\blacksquare$</p>`);

wkSet('hw8-q5', R`
<h4>Which points are in $Z$</h4>
<p>Start by reading the set. A point $(x,y)$ is in $A\times B$ when $x\in A$ <em>and</em> $y\in B$. Removing those points leaves the points where this fails, and "not (both)" is "at least one fails":</p>
$$(x,y)\in Z\iff x\notin A\ \text{ or }\ y\notin B.$$
<p>So every point of $Z$ is of one of two kinds, and the proof will treat them in turn.</p>

<h4>Choosing a strategy for connectedness</h4>
<p>To show a space is connected you can assume a separation and reach a contradiction, or build the space out of pieces already known to be connected ([[m-connected]]). Here we know $X$ and $Y$ are connected and nothing else, so building is natural. The tool for gluing is Theorem 23.3: connected subspaces that all share one point have a connected union. So the plan is to find one point of $Z$, and for every point of $Z$ a connected subset of $Z$ joining it to that one point.</p>

<h4>Slices are connected copies of $X$ and $Y$</h4>
<p>The natural connected pieces of a product are its slices. For a fixed $x_0$, the vertical slice $\{x_0\}\times Y$ is the image of the map $Y\to X\times Y$, $y\mapsto(x_0,y)$. Its [[coordinate-function|coordinate functions]] are the constant map $x_0$ and the identity of $Y$, both continuous, so the map is continuous by Theorem 19.6. A continuous image of a connected space is connected (Theorem 23.5), so $\{x_0\}\times Y$ is connected. In the same way every horizontal slice $X\times\{y_0\}$ is connected.</p>
<p>A slice lies in $Z$ when its fixed coordinate is outside the removed set: if $x_0\notin A$, every point of $\{x_0\}\times Y$ has first coordinate outside $A$, so the whole vertical slice is in $Z$. Likewise $X\times\{y_0\}\subseteq Z$ when $y_0\notin B$. (A subset of $Z$ gets the same topology from $Z$ as from $X\times Y$, by [[hw1-q4]], so these slices are connected as subspaces of $Z$ too.)</p>

<h4>The hub</h4>
<p>This is where "proper subset" is used. Since $A\ne X$ there is a point $a\in X\setminus A$, and since $B\ne Y$ there is $b\in Y\setminus B$. By the previous paragraph the vertical slice $\{a\}\times Y$ and the horizontal slice $X\times\{b\}$ both lie in $Z$. They cross at $(a,b)$, which will be the common point every piece passes through.</p>

<h4>Joining every point to the hub</h4>
<p>Take any $(x,y)\in Z$. If $x\notin A$, its vertical slice $\{x\}\times Y$ lies in $Z$ and meets the horizontal arm $X\times\{b\}$ at $(x,b)$. Put</p>
$$C_{(x,y)}=(\{x\}\times Y)\cup(X\times\{b\}).$$
<p>It lies in $Z$, contains $(x,y)$ and $(a,b)$, and is connected by Theorem 23.3, since its two slices are connected and share $(x,b)$.</p>
<p>If instead $x\in A$, then $y\notin B$ (the point is in $Z$), so its horizontal slice $X\times\{y\}$ lies in $Z$ and meets the vertical arm $\{a\}\times Y$ at $(a,y)$. Put $C_{(x,y)}=(X\times\{y\})\cup(\{a\}\times Y)$; for the same reasons it lies in $Z$, is connected, and contains $(x,y)$ and $(a,b)$.</p>

<h4>Concluding</h4>
<p>Every point of $Z$ lies in its own $C_{(x,y)}$, and every $C_{(x,y)}$ lies in $Z$, so $Z=\bigcup_{(x,y)\in Z}C_{(x,y)}$. This is a union of connected subspaces all containing $(a,b)$, so $Z$ is connected by Theorem 23.3. $\blacksquare$</p>`);
A['set-equality'].sections.push(['Logic into sets', R`<p>Statements about points translate into operations on sets. Reading a set description in this way tells you which operation to use.</p>

<p><b>Little pi, $\pi_j$,</b> is something else: the <b>projection</b> onto the $j$-th factor, read "pi sub $j$" or "the $j$-th projection" ([[projections]]). It takes a point of the product and returns its $j$-th coordinate: $\pi_j((x_k)_k)=x_j$.</p>`]);

(function(){ var a = A['product-vs-box'], S = a.sections;
