<style>
:root{--bg:#000;--surf:#0c0c0c;--card:#0f0f0f;--card2:#171717;--border:#262626;--border2:#3a3a3a;--text:#f2f2f2;--text2:#c2c2c2;--muted:#7d7d7d;--link:#f2f2f2;color-scheme:dark;}
:root[data-theme="light"]{--bg:#fff;--surf:#fff;--card:#fafafa;--card2:#f1f1f1;--border:#e2e2e2;--border2:#cfcfcf;--text:#111;--text2:#3f3f3f;--muted:#8a8a8a;--link:#111;color-scheme:light;}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--text);font:17px/1.65 Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:var(--link);}
.top{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px calc(10px);padding-top:max(10px, env(safe-area-inset-top));}
.toprow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;}
.logo{font-size:26px;line-height:1;text-decoration:none;font-style:italic;font-family:'KaTeX_Caligraphic',Georgia,serif;width:34px;text-align:center;}
.brand{font:600 12px/1.2 -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.search{flex:1;position:relative;min-width:0;}
#q{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);font:16px -apple-system,system-ui,sans-serif;}
.tb{border:1px solid var(--border2);background:var(--card);color:var(--text2);border-radius:8px;padding:8px 10px;font:13px -apple-system,system-ui,sans-serif;cursor:pointer;}
#sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--border2);border-radius:8px;overflow:hidden;display:none;z-index:60;}
#sugg.on{display:block;}
#sugg a{display:block;padding:9px 12px;text-decoration:none;border-bottom:1px solid var(--border);}
#sugg a:last-child{border-bottom:none;}
#sugg .sk{font:11px -apple-system,system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:8px;}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 80px;}
.trail{font:13px -apple-system,system-ui,sans-serif;color:var(--muted);margin-bottom:14px;line-height:1.8;}
.trail a{color:var(--muted);text-decoration:none;}
.trail a:hover{color:var(--text);}
.trail .sep{margin:0 6px;opacity:.6;}
.meta{font:12px -apple-system,system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
h1{font-size:1.75rem;line-height:1.25;font-weight:normal;margin-bottom:10px;}
.lede{font-size:1.12rem;color:var(--text);border-left:3px solid var(--text);padding:2px 0 2px 14px;margin:6px 0 18px;}
details.sec{border-top:1px solid var(--border);}
details.sec:last-of-type{border-bottom:1px solid var(--border);}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 2px;font:600 14px -apple-system,system-ui,sans-serif;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;}
details.sec>summary::-webkit-details-marker{display:none;}
details.sec>summary::after{content:'+';color:var(--muted);font-size:18px;}
details.sec[open]>summary::after{content:'−';}
.secb{padding:0 2px 16px;color:var(--text2);}
.secb p{margin-bottom:.7em;} .secb ul,.secb ol{padding-left:22px;margin-bottom:.7em;} .secb li{margin:.25em 0;}
.steps{counter-reset:s;list-style:none;padding-left:0!important;}
.steps>li{counter-increment:s;position:relative;padding-left:30px;margin:10px 0;}
.steps>li::before{content:counter(s);position:absolute;left:0;top:1px;width:21px;height:21px;border:1px solid var(--border2);border-radius:50%;font:12px/21px -apple-system,system-ui,sans-serif;text-align:center;color:var(--text2);}
.steps details summary{cursor:pointer;color:var(--text);list-style:none;}
.steps details summary::-webkit-details-marker{display:none;}
.steps details summary::after{content:' why ›';font:12px -apple-system,system-ui,sans-serif;color:var(--muted);white-space:nowrap;}
.steps details[open] summary::after{content:' why ⌄';}
.steps .why{font-size:.93em;color:var(--text2);padding:6px 0 2px;}
a.wl{text-decoration:none;border-bottom:1px dotted var(--text2);color:var(--text);}
a.wl:hover{border-bottom-style:solid;}
.links{margin-top:22px;}
.links h3{font:600 12px -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-block;border:1px solid var(--border2);border-radius:999px;padding:4px 11px;font-size:.88rem;text-decoration:none;color:var(--text2);background:var(--card);}
.chip:hover{color:var(--text);border-color:var(--text2);}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:26px;font:13px -apple-system,system-ui,sans-serif;}
.pn a{text-decoration:none;color:var(--text2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;flex:1;}
.pn a span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
.pn a.nx{text-align:right;}
/* home */
.intro{color:var(--text2);margin-bottom:20px;}
.start{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 24px;}
.topic{margin:22px 0;}
.topic h2{font:600 13px -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px;}
.tlist a{display:block;text-decoration:none;padding:9px 0;border-bottom:1px solid var(--border);}
.tlist a b{font-weight:normal;color:var(--text);}
.tlist a i{display:block;font-style:normal;color:var(--muted);font-size:.9rem;line-height:1.45;}
.kind{font:10px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--border2);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px;}
.foot{color:var(--muted);font-size:.85rem;margin-top:30px;}
/* preview sheet */
#pv{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--card);border-top:1px solid var(--border2);box-shadow:0 -10px 30px rgba(0,0,0,.35);padding:16px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-width:760px;margin:0 auto;border-radius:14px 14px 0 0;}
#pv.on{transform:none;}
#pv .pm{font:11px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
#pv .pt{font-size:1.25rem;margin:2px 0 6px;}
#pv .pl{color:var(--text2);margin-bottom:12px;}
#pv .pb{display:flex;gap:8px;}
#pv .pb a,#pv .pb button{flex:1;text-align:center;border:1px solid var(--border2);border-radius:8px;padding:10px;font:14px -apple-system,system-ui,sans-serif;background:var(--card2);color:var(--text);text-decoration:none;cursor:pointer;}
.figc{width:100%;max-width:560px;height:auto;display:block;border:1px solid var(--border);border-radius:6px;touch-action:pan-y;}
.figctl{display:flex;gap:18px;align-items:center;margin:10px 0;font-size:.92em;color:var(--text2);flex-wrap:wrap;}
.figctl input[type=range]{width:200px;vertical-align:middle;}
.figmsg{font-size:.92em;color:var(--text2);min-height:3em;}
.katex{font-size:1.04em;}
.katex-display{overflow-x:auto;overflow-y:hidden;}
</style>

<script>
// ===== The articles. Each: title, kind, where (Munkres §), lede (one sentence), sections [[label, html], ...], pre (prerequisite ids).
// Links inside text: [[id]] or [[id|shown text]]. The first section opens by default; the rest stay folded.
var R = String.raw;
var TOPICS = [
  ['Foundations', ['relation-equivalence', 'equivalence-class', 'partition', 'image-preimage']],
  ['Open sets and bases', ['topology', 'open-set', 'standard-topologies', 'finer-coarser', 'basis', 'generated-topology', 'lemma-13-3', 'subbasis']],
  ['Building new spaces', ['order-topology', 'product-topology', 'subspace-topology', 'quotient-topology']],
  ['Closed sets and limits', ['closed-set', 'closure', 'interior', 'limit-point', 'closure-test', 'closure-limit-points', 'convergence']],
  ['Separation', ['hausdorff', 't1']],
  ['Continuous maps', ['continuous', 'continuity-equivalents', 'pasting-lemma', 'homeomorphism']],
  ['Metric spaces', ['metric', 'ball', 'metric-topology', 'metric-hausdorff', 'epsilon-delta']],
  ['Quotients', ['quotient-topology', 'saturated', 'quotient-map', 'maps-out-of-quotients', 'crushing-a-set', 'gluing-examples']],
  ['Methods', ['m-topology', 'm-open', 'm-closed', 'm-closure', 'm-continuous', 'm-hausdorff', 'm-quotient', 'm-compare', 'm-counterexample']],
  ['Example spaces', ['ex-real-line', 'ex-lower-limit', 'ex-k-topology', 'ex-finite-complement', 'ex-discrete', 'ex-indiscrete', 'ex-sierpinski', 'ex-crush-open', 'ex-circle', 'ex-two-origins']],
  ['Worked problems', ['hw7-q1']]
];
// reading order, roughly following Munkres
var ORDER = ['relation-equivalence', 'equivalence-class', 'partition', 'image-preimage', 'topology', 'open-set', 'standard-topologies', 'finer-coarser', 'basis', 'generated-topology', 'lemma-13-3', 'subbasis', 'order-topology', 'product-topology', 'subspace-topology', 'closed-set', 'closure', 'interior', 'closure-test', 'limit-point', 'closure-limit-points', 'hausdorff', 't1', 'convergence', 'continuous', 'continuity-equivalents', 'pasting-lemma', 'homeomorphism', 'metric', 'ball', 'metric-topology', 'metric-hausdorff', 'epsilon-delta', 'quotient-topology', 'saturated', 'quotient-map', 'maps-out-of-quotients', 'crushing-a-set', 'gluing-examples'];
var A = {
// ---------- foundations
'relation-equivalence': {title: 'Equivalence relation', kind: 'definition', where: 'Ch. 1, §3', pre: [],
  lede: R`A rule for when two points count as "the same": reflexive, symmetric and transitive.`,
  sections: [['Definition', R`<p>A relation $\sim$ on $X$ is an <b>equivalence relation</b> if for all $x,y,z\in X$:</p><ul><li><b>reflexive:</b> $x\sim x$;</li><li><b>symmetric:</b> $x\sim y\Rightarrow y\sim x$;</li><li><b>transitive:</b> $x\sim y$ and $y\sim z\Rightarrow x\sim z$.</li></ul>`],
    ['Example', R`<p>On a metric space with $A\subseteq X$: $x\sim_A y$ iff $x=y$ or both $x,y\in A$. This crushes $A$ to a point; see [[crushing-a-set]].</p>`],
    ['Non-example', R`<p>$x<y$ on $\mathbb R$: not reflexive ($x<x$ fails) and not symmetric.</p>`],
    ['Why it matters', R`<p>Its [[equivalence-class|classes]] form a [[partition]], and a partition is exactly what a [[quotient-topology|quotient space]] is built from.</p>`]]},
'equivalence-class': {title: 'Equivalence class', kind: 'definition', where: 'Ch. 1, §3', pre: ['relation-equivalence'],
  lede: R`$[x]=\{y\in X: y\sim x\}$, everything that counts as the same as $x$.`,
  sections: [['Definition', R`<p>For an [[relation-equivalence|equivalence relation]] $\sim$ on $X$ and $x\in X$, the class of $x$ is $[x]=\{y\in X : y\sim x\}$. Two classes are either equal or disjoint.</p>`],
    ['Example', R`<p>For $\sim_A$: if $a\in A$ then $[a]=A$ (every point of $A$ is related to $a$ by the "both in $A$" clause); if $x\notin A$ then $[x]=\{x\}$.</p>`],
    ['Watch out', R`<p>$[x]$ is a <em>set</em> of points of $X$, but a single <em>point</em> of the quotient $X/{\sim}$.</p>`]]},
'partition': {title: 'Partition', kind: 'definition', where: 'Ch. 1, §3', pre: ['equivalence-class'],
  lede: R`Cutting a set into nonempty pieces with no overlaps and nothing left out.`,
  sections: [['Definition', R`<p>A collection of nonempty, pairwise disjoint subsets of $X$ whose union is $X$.</p>`],
    ['Relation to equivalence', R`<p>The [[equivalence-class|classes]] of any equivalence relation form a partition; conversely, "being in the same piece" is an equivalence relation. They are two descriptions of one thing.</p>`],
    ['Non-example', R`<p>$\{[0,1],[1,2]\}$ on $[0,2]$: the pieces overlap at $1$.</p>`]]},
'image-preimage': {title: 'Image and preimage', kind: 'definition', where: 'Ch. 1, §2', pre: [],
  lede: R`$f(A)$ is where $A$ goes; $f^{-1}(B)$ is everything that lands in $B$.`,
  sections: [['Definition', R`<p>For $f:X\to Y$: $f(A)=\{f(a):a\in A\}$ and $f^{-1}(B)=\{x\in X: f(x)\in B\}$. The preimage makes sense even when $f$ has no inverse.</p>`],
    ['Why preimages', R`<p>Preimages preserve unions, intersections and complements: $f^{-1}(\bigcup B_\alpha)=\bigcup f^{-1}(B_\alpha)$, $f^{-1}(Y\setminus B)=X\setminus f^{-1}(B)$. Images do not preserve intersections. That is why [[continuous|continuity]] is defined with preimages.</p>`]]},
// ---------- open sets and bases
'topology': {title: 'Topology', kind: 'definition', where: '§12', pre: [],
  lede: R`A choice of which subsets of $X$ are called open, closed under unions and finite intersections.`,
  sections: [['Definition', R`<p>A <b>topology</b> on $X$ is a collection $\mathcal T$ of subsets with</p><ol><li>$\varnothing, X\in\mathcal T$;</li><li>any union of members of $\mathcal T$ is in $\mathcal T$;</li><li>any <em>finite</em> intersection of members is in $\mathcal T$.</li></ol><p>The members are the [[open-set|open sets]]; $(X,\mathcal T)$ is a topological space.</p>`],
    ['Intuition', R`<p>These are exactly the properties of open sets in $\mathbb R$ that analysis uses. Taking them as the definition lets the same arguments run where there is no distance at all.</p>`],
    ['Why only finite intersections', R`<p>$\bigcap_n(-\tfrac1n,\tfrac1n)=\{0\}$ is not open in $\mathbb R$, so infinite intersections cannot be allowed.</p>`],
    ['Examples', R`<p>See [[standard-topologies]]. To check a candidate, follow [[m-topology]].</p>`]]},
'open-set': {title: 'Open set', kind: 'definition', where: '§12', pre: ['topology'],
  lede: R`A member of the topology. What "open" means depends entirely on which topology you chose.`,
  sections: [['Definition', R`<p>$U\subseteq X$ is open if $U\in\mathcal T$.</p>`],
    ['In practice', R`<p>Topologies are usually given by a [[basis]], and then $U$ is open iff around each point of $U$ a basis element fits inside $U$ ([[generated-topology]]). In a metric space: a whole [[ball]] fits.</p>`],
    ['Watch out', R`<p>Open is not the opposite of [[closed-set|closed]]. $[0,1)$ is neither in $\mathbb R$; $\varnothing$ and $X$ are both.</p>`]]},
'standard-topologies': {title: 'Discrete, indiscrete and finite-complement topologies', kind: 'example', where: '§12', pre: ['topology'],
  lede: R`The extreme topologies, and one in between that is useful for counterexamples.`,
  sections: [['Discrete', R`<p>Every subset is open. The finest possible topology. See [[ex-discrete]].</p>`],
    ['Indiscrete', R`<p>Only $\varnothing$ and $X$. The coarsest possible. See [[ex-indiscrete]].</p>`],
    ['Finite complement', R`<p>$U$ is open iff $X\setminus U$ is finite, or $U=\varnothing$. On an infinite set any two nonempty open sets meet, so it is [[t1|T₁]] but not [[hausdorff|Hausdorff]]. See [[ex-finite-complement]].</p>`]]},
'finer-coarser': {title: 'Finer and coarser', kind: 'definition', where: '§12', pre: ['topology'],
  lede: R`$\mathcal T'$ is finer than $\mathcal T$ if it has every $\mathcal T$-open set, and possibly more.`,
  sections: [['Definition', R`<p>$\mathcal T'$ is <b>finer</b> than $\mathcal T$ (and $\mathcal T$ <b>coarser</b>) if $\mathcal T\subseteq\mathcal T'$.</p>`],
    ['Intuition', R`<p>More open sets means the topology can tell more points apart, and fewer sequences converge.</p>`],
    ['How to check', R`<p>With bases, use [[lemma-13-3]]; the recipe is [[m-compare]]. Example: [[ex-lower-limit]] is strictly finer than [[ex-real-line|ℝ]].</p>`]]},
'basis': {title: 'Basis', kind: 'definition', where: '§13', pre: ['topology'],
  lede: R`A collection of building blocks: every open set is a union of them.`,
  sections: [['Definition', R`<p>A collection $\mathcal B$ of subsets of $X$ is a <b>basis</b> if</p><ol><li>every $x\in X$ lies in some $B\in\mathcal B$;</li><li>if $x\in B_1\cap B_2$, there is $B_3\in\mathcal B$ with $x\in B_3\subseteq B_1\cap B_2$.</li></ol><p>It generates a topology: see [[generated-topology]].</p>`],
    ['Examples', R`<p>Open intervals in $\mathbb R$; [[ball|open balls]] in a metric space; $[a,b)$ for [[ex-lower-limit]]; open boxes for the [[product-topology]].</p>`],
    ['Non-example', R`<p>Closed intervals $[a,b]$ in $\mathbb R$: $[0,1]\cap[1,2]=\{1\}$ contains no closed interval of positive length around $1$.</p>`],
    ['Watch out', R`<p>A basis is not a topology. It is not closed under unions; its unions are the topology.</p>`]]},
'generated-topology': {title: 'Topology generated by a basis (Lemmas 13.1, 13.2)', kind: 'theorem', where: '§13', pre: ['basis'],
  lede: R`$U$ is open iff around each of its points a basis element fits inside it; equivalently, iff $U$ is a union of basis elements.`,
  sections: [['Statement', R`<p>$U$ is open in the topology generated by $\mathcal B$ iff for every $x\in U$ there is $B\in\mathcal B$ with $x\in B\subseteq U$. <b>Lemma 13.1:</b> these are exactly the unions of elements of $\mathcal B$.</p><p><b>Lemma 13.2:</b> conversely, a collection $\mathcal C$ of open sets is a basis for a given topology if every open $U$ and every $x\in U$ have some $C\in\mathcal C$ with $x\in C\subseteq U$.</p>`],
    ['Why', R`<p>If each $x\in U$ has $B_x$ with $x\in B_x\subseteq U$, then $U=\bigcup_x B_x$. Conversely a union of basis elements has, at each of its points, the basis element that point came from.</p>`],
    ['Use', R`<p>This is the definition used in [[m-open]].</p>`]]},
'lemma-13-3': {title: 'Comparing topologies through bases (Lemma 13.3)', kind: 'theorem', where: '§13', pre: ['basis', 'finer-coarser'],
  lede: R`$\mathcal T'$ is finer than $\mathcal T$ iff every basis element of $\mathcal T$ around $x$ contains a basis element of $\mathcal T'$ around $x$.`,
  sections: [['Statement', R`<p>Let $\mathcal B,\mathcal B'$ generate $\mathcal T,\mathcal T'$. Then $\mathcal T'$ is finer than $\mathcal T$ iff for each $x$ and each $B\in\mathcal B$ with $x\in B$, there is $B'\in\mathcal B'$ with $x\in B'\subseteq B$.</p>`],
    ['Why', R`<p>If $U$ is $\mathcal T$-open and $x\in U$: pick $B$ with $x\in B\subseteq U$, then $B'$ with $x\in B'\subseteq B\subseteq U$. So $U$ is $\mathcal T'$-open by [[generated-topology]].</p>`],
    ['Lemma 13.4', R`<p>[[ex-lower-limit|ℝ_ℓ]] and [[ex-k-topology|ℝ_K]] are each strictly finer than ℝ and not comparable with each other.</p>`]]},
'subbasis': {title: 'Subbasis', kind: 'definition', where: '§13', pre: ['basis'],
  lede: R`Smaller ingredients still: intersect finitely many, then take unions.`,
  sections: [['Definition', R`<p>A collection $\mathcal S$ of subsets whose union is $X$. The topology it generates consists of all unions of finite intersections of elements of $\mathcal S$.</p>`],
    ['Examples', R`<p>Rays $(-\infty,a)$ and $(b,\infty)$ for $\mathbb R$; preimages $\pi_1^{-1}(U),\pi_2^{-1}(V)$ for the [[product-topology]] (Theorem 15.2).</p>`],
    ['Use', R`<p>To check [[continuous|continuity]] it suffices to check preimages of subbasis elements.</p>`]]},
// ---------- building spaces
'order-topology': {title: 'Order topology', kind: 'definition', where: '§14', pre: ['basis'],
  lede: R`On an ordered set, the topology of open intervals (half-open at an end point).`,
  sections: [['Definition', R`<p>Basis: open intervals $(a,b)$; plus $[a_0,b)$ if there is a least element $a_0$, and $(a,b_0]$ if there is a greatest $b_0$.</p>`],
    ['Examples', R`<p>$\mathbb R$ with its order gives the standard topology. Order topologies are [[hausdorff|Hausdorff]] (Theorem 17.11).</p>`]]},
'product-topology': {title: 'Product topology on X × Y', kind: 'definition', where: '§15', pre: ['basis'],
  lede: R`Open sets are unions of open boxes $U\times V$.`,
  sections: [['Definition', R`<p>The topology on $X\times Y$ with [[basis]] all $U\times V$, $U$ open in $X$, $V$ open in $Y$. Theorem 15.1: products of basis elements also form a basis.</p>`],
    ['Watch out', R`<p>Not every open set is a box: an open disc in $\mathbb R^2$ is a union of boxes.</p>`],
    ['Facts', R`<p>The projections are [[continuous]]; a map into a product is continuous iff its components are (Theorem 18.4); products of Hausdorff spaces are [[hausdorff|Hausdorff]].</p>`]]},
'subspace-topology': {title: 'Subspace topology', kind: 'definition', where: '§16', pre: ['topology'],
  lede: R`Open in $Y$ means: what an open set of $X$ cuts out of $Y$.`,
  sections: [['Definition', R`<p>For $Y\subseteq X$: $\mathcal T_Y=\{Y\cap U : U\in\mathcal T\}$. Lemma 16.1: $\{B\cap Y\}$ is a basis when $\mathcal B$ is.</p>`],
    ['Watch out', R`<p>Open in $Y$ is not open in $X$: $[0,\tfrac12)$ is open in $[0,1]$ but not in $\mathbb R$. Lemma 16.2: it is, if $Y$ itself is open in $X$.</p>`],
    ['Related', R`<p>Closed sets of $Y$ are $C\cap Y$ with $C$ closed in $X$, and closures in $Y$ are $\overline A\cap Y$ (Theorems 17.2, 17.4); see [[closed-set]].</p>`]]},
// ---------- closed sets
'closed-set': {title: 'Closed set', kind: 'definition', where: '§17', pre: ['open-set'],
  lede: R`A set whose complement is open.`,
  sections: [['Definition', R`<p>$A$ is <b>closed</b> if $X\setminus A$ is open.</p>`],
    ['Properties (Theorem 17.1)', R`<p>$\varnothing$ and $X$ are closed; arbitrary intersections and finite unions of closed sets are closed. (De Morgan turns the axioms for open sets into these.)</p>`],
    ['Characterization', R`<p>$A$ is closed iff it contains all its [[limit-point|limit points]] ([[closure-limit-points|Corollary 17.7]]).</p>`],
    ['In subspaces', R`<p>Closed in $Y$ iff of the form $C\cap Y$, $C$ closed in $X$ (17.2); if $Y$ is closed in $X$, closed in $Y$ implies closed in $X$ (17.3).</p>`],
    ['Where it matters', R`<p>Closedness of $A$ is what makes [[crushing-a-set]] give a Hausdorff space. Recipe: [[m-closed]].</p>`]]},
'closure': {title: 'Closure', kind: 'definition', where: '§17', pre: ['closed-set'],
  lede: R`$\overline A$: the smallest closed set containing $A$.`,
  sections: [['Definition', R`<p>$\overline A$ is the intersection of all closed sets containing $A$. It is closed, and $A\subseteq\overline A$.</p>`],
    ['Working test', R`<p>$x\in\overline A$ iff every open set (or basis element) containing $x$ meets $A$: the [[closure-test]].</p>`],
    ['Examples', R`<p>$\overline{(0,1)}=[0,1]$ in $\mathbb R$, but $[0,1)$ in [[ex-lower-limit|ℝ_ℓ]]. $\overline{\mathbb Q}=\mathbb R$.</p>`],
    ['Related', R`<p>[[closure-limit-points|$\overline A = A\cup A'$]]; recipe [[m-closure]]; the dual notion is [[interior]].</p>`]]},
'interior': {title: 'Interior', kind: 'definition', where: '§17', pre: ['open-set'],
  lede: R`$\operatorname{Int}A$: the largest open set inside $A$.`,
  sections: [['Definition', R`<p>The union of all open sets contained in $A$.</p>`], ['Example', R`<p>$\operatorname{Int}[0,1]=(0,1)$ in $\mathbb R$; $\operatorname{Int}\mathbb Q=\varnothing$.</p>`], ['Relation to closure', R`<p>$X\setminus\operatorname{Int}A=\overline{X\setminus A}$.</p>`]]},
'closure-test': {title: 'The closure test (Theorem 17.5)', kind: 'theorem', where: '§17', pre: ['closure'],
  lede: R`$x\in\overline A$ iff every open set containing $x$ meets $A$.`,
  sections: [['Statement', R`<p>$x\in\overline A$ iff every open $U\ni x$ intersects $A$. If the topology is given by a [[basis]], "every basis element containing $x$" suffices.</p>`],
    ['Why', R`<p>If some open $U\ni x$ misses $A$, then $X\setminus U$ is a closed set containing $A$ and not $x$, so $x\notin\overline A$. If $x\notin\overline A$, some closed $C\supseteq A$ misses $x$, and $X\setminus C$ is an open set around $x$ missing $A$.</p>`],
    ['Use', R`<p>The main tool in [[m-closure]].</p>`]]},
'limit-point': {title: 'Limit point', kind: 'definition', where: '§17', pre: ['open-set'],
  lede: R`Points of $A$ crowd in on $x$: every neighbourhood of $x$ meets $A$ somewhere other than $x$.`,
  sections: [['Definition', R`<p>$x$ is a <b>limit point</b> of $A$ if every neighbourhood of $x$ contains a point of $A$ other than $x$. $A'$ denotes the set of limit points.</p>`],
    ['Examples', R`<p>$0$ is a limit point of $(0,1)$ and of $\{1/n\}$. In $\{0\}\cup[1,2]$, the point $0$ is not a limit point (it is isolated).</p>`],
    ['In a metric space', R`<p>For $x\notin A$: $x$ is a limit point iff $d(x,A)=\inf_{a\in A}d(x,a)=0$. This is the gap that closedness guarantees in [[crushing-a-set]].</p>`],
    ['Related', R`<p>[[closure-limit-points]]; in [[t1|T₁]] spaces every neighbourhood then meets $A$ in infinitely many points (Theorem 17.9).</p>`]]},
'closure-limit-points': {title: 'Closure = set plus limit points (Theorem 17.6)', kind: 'theorem', where: '§17', pre: ['closure', 'limit-point'],
  lede: R`$\overline A=A\cup A'$, so $A$ is closed exactly when it contains its limit points.`,
  sections: [['Statement', R`<p>$\overline A=A\cup A'$. <b>Corollary 17.7:</b> $A$ is closed iff $A'\subseteq A$.</p>`],
    ['Why', R`<p>Both sides consist of the points every neighbourhood of which meets $A$ ([[closure-test]]): either the point is in $A$, or the neighbourhoods meet $A$ elsewhere.</p>`],
    ['Example', R`<p>$A=(0,1)$: $A'=[0,1]$, so $A$ is not closed; its missing limit points $0,1$ are what break [[ex-crush-open]].</p>`]]},
'convergence': {title: 'Convergence of sequences', kind: 'definition', where: '§17', pre: ['open-set'],
  lede: R`$x_n\to x$ if every neighbourhood of $x$ contains all but finitely many $x_n$.`,
  sections: [['Definition', R`<p>$x_n\to x$ if for every open $U\ni x$ there is $N$ with $x_n\in U$ for all $n\ge N$.</p>`],
    ['Uniqueness (Theorem 17.10)', R`<p>In a [[hausdorff|Hausdorff]] space a sequence has at most one limit: disjoint neighbourhoods of two limits cannot both contain the tail.</p>`],
    ['Non-example', R`<p>In the [[ex-indiscrete|indiscrete]] topology every sequence converges to every point.</p>`]]},
// ---------- separation
'hausdorff': {title: 'Hausdorff space', kind: 'definition', where: '§17', pre: ['open-set'],
  lede: R`Any two distinct points have disjoint open neighbourhoods.`,
  sections: [['Definition', R`<p>$X$ is <b>Hausdorff</b> if for all $x\neq y$ there are open $U\ni x$, $V\ni y$ with $U\cap V=\varnothing$.</p>`],
    ['Intuition', R`<p>Points can be put in separate bubbles. This is what makes limits unique ([[convergence|Theorem 17.10]]) and single points closed (Theorem 17.8).</p>`],
    ['Examples', R`<p>[[metric-hausdorff|Every metric space]]; [[order-topology|order topologies]], subspaces and [[product-topology|products]] of Hausdorff spaces (17.11); a [[crushing-a-set|closed set crushed to a point]].</p>`],
    ['Non-examples', R`<p>[[ex-finite-complement]], [[ex-indiscrete]], [[ex-crush-open]], [[ex-two-origins]].</p>`],
    ['How to prove it', R`<p>[[m-hausdorff]].</p>`]]},
't1': {title: 'T₁ space', kind: 'definition', where: '§17', pre: ['closed-set'],
  lede: R`Every single point is a closed set. Weaker than Hausdorff.`,
  sections: [['Definition', R`<p>$X$ is T₁ if every finite set (equivalently every point) is closed.</p>`],
    ['Relation', R`<p>[[hausdorff|Hausdorff]] implies T₁ (Theorem 17.8). Not conversely: [[ex-finite-complement]] is T₁ but not Hausdorff.</p>`]]},
// ---------- continuity
'continuous': {title: 'Continuous function', kind: 'definition', where: '§18', pre: ['open-set', 'image-preimage'],
  lede: R`Preimages of open sets are open.`,
  sections: [['Definition', R`<p>$f:X\to Y$ is <b>continuous</b> if $f^{-1}(V)$ is open in $X$ for every open $V\subseteq Y$. It is enough to check [[basis]] (or [[subbasis]]) elements of $Y$.</p>`],
    ['Intuition', R`<p>Points near $x$ go near $f(x)$, said with open sets instead of distances. In metric spaces it is exactly [[epsilon-delta]].</p>`],
    ['Examples', R`<p>Constants, the identity, inclusions of subspaces, projections from products, compositions of continuous maps (Theorem 18.2).</p>`],
    ['Non-example', R`<p>The identity $\mathbb R\to\mathbb R_\ell$: $[0,1)$ is open in [[ex-lower-limit|ℝ_ℓ]] but its preimage is not open in $\mathbb R$.</p>`],
    ['Related', R`<p>[[continuity-equivalents]], [[pasting-lemma]], [[homeomorphism]], recipe [[m-continuous]].</p>`]]},
'continuity-equivalents': {title: 'Equivalent forms of continuity (Theorem 18.1)', kind: 'theorem', where: '§18', pre: ['continuous', 'closure'],
  lede: R`Continuity can be checked with closures, closed sets, or neighbourhoods.`,
  sections: [['Statement', R`<p>For $f:X\to Y$ these are equivalent: (1) $f$ is continuous; (2) $f(\overline A)\subseteq\overline{f(A)}$ for every $A\subseteq X$; (3) preimages of [[closed-set|closed sets]] are closed; (4) for each $x$ and each open $V\ni f(x)$ there is an open $U\ni x$ with $f(U)\subseteq V$.</p>`],
    ['Why (1)⇔(3)', R`<p>$f^{-1}(Y\setminus C)=X\setminus f^{-1}(C)$; see [[image-preimage]].</p>`]]},
'pasting-lemma': {title: 'Pasting lemma (Theorem 18.3)', kind: 'theorem', where: '§18', pre: ['continuous', 'closed-set'],
  lede: R`Two continuous pieces on closed sets that agree on the overlap glue into a continuous map.`,
  sections: [['Statement', R`<p>If $X=A\cup B$ with $A,B$ closed, and $f:A\to Y$, $g:B\to Y$ are continuous and agree on $A\cap B$, then $h=f\cup g:X\to Y$ is continuous.</p>`],
    ['Why', R`<p>For closed $C$: $h^{-1}(C)=f^{-1}(C)\cup g^{-1}(C)$. Each piece is closed in $A$ or $B$, hence in $X$ (Theorem 17.3), and a finite union of closed sets is closed.</p>`],
    ['Watch out', R`<p>It fails for non-closed pieces: $f=0$ on $(-\infty,0)$ and $g=1$ on $[0,\infty)$.</p>`]]},
'homeomorphism': {title: 'Homeomorphism', kind: 'definition', where: '§18', pre: ['continuous'],
  lede: R`A bijection that is continuous both ways: the same space with the points renamed.`,
  sections: [['Definition', R`<p>A bijection $f:X\to Y$ with $f$ and $f^{-1}$ both [[continuous]].</p>`],
    ['Examples', R`<p>$(-1,1)\cong\mathbb R$ via $x\mapsto x/(1-x^2)$. [[ex-circle|An interval with ends glued]] is a circle.</p>`],
    ['Watch out', R`<p>$[0,1)\to S^1$, $t\mapsto(\cos2\pi t,\sin2\pi t)$, is a continuous bijection whose inverse is not continuous: it tears the circle open at $(1,0)$.</p>`]]},
// ---------- metric
'metric': {title: 'Metric', kind: 'definition', where: '§20', pre: [],
  lede: R`A distance function: positive, symmetric, with the triangle inequality.`,
  sections: [['Definition', R`<p>$d:X\times X\to\mathbb R$ with $d(x,y)\ge0$, equality iff $x=y$; $d(x,y)=d(y,x)$; and the <b>triangle inequality</b> $d(x,z)\le d(x,y)+d(y,z)$.</p>`],
    ['What it gives', R`<p>[[ball|Balls]], and from them the [[metric-topology]].</p>`],
    ['Examples', R`<p>Euclidean distance on $\mathbb R^n$; the discrete metric ($d=1$ for distinct points), which gives the [[ex-discrete|discrete topology]].</p>`]]},
'ball': {title: 'Open ball', kind: 'definition', where: '§20', pre: ['metric'],
  lede: R`$B(x,\varepsilon)=\{y: d(x,y)<\varepsilon\}$.`,
  sections: [['Definition', R`<p>The set of points at distance less than $\varepsilon$ from $x$.</p>`],
    ['Balls are open', R`<p>If $y\in B(x,\varepsilon)$, set $\delta=\varepsilon-d(x,y)>0$. For $z\in B(y,\delta)$: $d(x,z)\le d(x,y)+d(y,z)<d(x,y)+\delta=\varepsilon$. So $B(y,\delta)\subseteq B(x,\varepsilon)$.</p>`],
    ['Use', R`<p>The basis of the [[metric-topology]]; the standard tool in [[m-open]] and [[m-hausdorff]].</p>`]]},
'metric-topology': {title: 'Metric topology', kind: 'definition', where: '§20', pre: ['ball', 'basis'],
  lede: R`Open means: around each point, a whole ball fits inside.`,
  sections: [['Definition', R`<p>The topology with [[basis]] the open balls. $U$ is open iff for each $x\in U$ some $B(x,\varepsilon)\subseteq U$.</p>`],
    ['Metrizable', R`<p>A space is metrizable if its topology comes from some metric. Metrizable spaces are [[hausdorff|Hausdorff]], so [[ex-finite-complement]] is not metrizable.</p>`]]},
'metric-hausdorff': {title: 'Every metric space is Hausdorff', kind: 'theorem', where: '§20', pre: ['metric-topology', 'hausdorff'],
  lede: R`Balls of radius $d(x,y)/2$ around $x$ and $y$ are disjoint.`,
  sections: [['Proof', R`<p>Let $x\neq y$ and $r=d(x,y)/2>0$. If $z\in B(x,r)\cap B(y,r)$, then $d(x,y)\le d(x,z)+d(z,y)<2r=d(x,y)$, a contradiction.</p>`],
    ['Where it is used', R`<p>Case 1 of [[hw7-q1]] is this argument with the radius also shrunk to avoid $A$.</p>`]]},
'epsilon-delta': {title: 'ε–δ continuity (Theorem 21.1)', kind: 'theorem', where: '§21', pre: ['continuous', 'metric-topology'],
  lede: R`Between metric spaces, continuity is the familiar ε–δ condition.`,
  sections: [['Statement', R`<p>$f:X\to Y$ between metric spaces is [[continuous]] iff for every $x$ and $\varepsilon>0$ there is $\delta>0$ with $d(x,y)<\delta\Rightarrow d(f(x),f(y))<\varepsilon$.</p>`],
    ['Why', R`<p>The condition says $f(B(x,\delta))\subseteq B(f(x),\varepsilon)$: form (4) of [[continuity-equivalents]] with [[ball|balls]] as neighbourhoods.</p>`]]},
// ---------- quotients
'quotient-topology': {title: 'Quotient topology', kind: 'definition', where: '§22', pre: ['partition', 'open-set'],
  lede: R`Glue points together; a set of glued points is open iff everything lying over it is open.`,
  sections: [['Definition', R`<p>Let $X^*$ be a [[partition]] of $X$ and $p:X\to X^*$ send each point to its piece. Then $U\subseteq X^*$ is open iff $p^{-1}(U)$ is open in $X$. $X^*$ is the <b>quotient space</b>.</p>`],
    ['Intuition', R`<p>It is the largest topology for which $p$ is [[continuous]]. Openness upstairs is decided entirely downstairs.</p>`],
    ['Getting open sets in', R`<p>Push down open sets that are [[saturated]]. Recipe: [[m-quotient]].</p>`],
    ['Watch out', R`<p>Quotients of nice spaces can be badly behaved: [[ex-crush-open]] is not Hausdorff.</p>`],
    ['Examples', R`<p>[[crushing-a-set]], [[gluing-examples]].</p>`]]},
'saturated': {title: 'Saturated set', kind: 'definition', where: '§22', pre: ['quotient-topology'],
  lede: R`A union of whole pieces; it never contains part of a glued piece without the rest.`,
  sections: [['Definition', R`<p>$C\subseteq X$ is saturated if $C=p^{-1}(p(C))$.</p>`],
    ['Key fact', R`<p>If $C$ is open and saturated, then $p^{-1}(p(C))=C$ is open, so $p(C)$ is open in $X^*$. This is how open sets of a quotient are built.</p>`],
    ['Why pulling back can grow a set', R`<p>$p^{-1}(p(C))$ is everything equivalent to something in $C$. If $C$ contains part of a piece, the pullback drags in the rest.</p>`],
    ['Example', R`<p>For a crushed set $A$: any set containing all of $A$ or none of it. Used in both cases of [[hw7-q1]].</p>`]]},
'quotient-map': {title: 'Quotient map', kind: 'definition', where: '§22', pre: ['quotient-topology', 'continuous'],
  lede: R`A surjection for which $U$ is open exactly when $p^{-1}(U)$ is open.`,
  sections: [['Definition', R`<p>A surjective $p:X\to Y$ such that $U\subseteq Y$ is open iff $p^{-1}(U)$ is open in $X$. Stronger than [[continuous]], which is only the "if $U$ open then $p^{-1}(U)$ open" half.</p>`],
    ['Sufficient conditions', R`<p>A continuous surjection that is an open map, or a closed map, is a quotient map.</p>`]]},
'maps-out-of-quotients': {title: 'Maps out of a quotient (Theorem 22.2)', kind: 'theorem', where: '§22', pre: ['quotient-map'],
  lede: R`A map on $X$ that is constant on each piece descends to a continuous map on the quotient.`,
  sections: [['Statement', R`<p>Let $p:X\to Y$ be a quotient map and $h:X\to Z$ continuous and constant on each $p^{-1}(\{y\})$. Then $h$ induces $g:Y\to Z$ with $g\circ p=h$, and $g$ is continuous.</p>`],
    ['Use', R`<p>Define maps on a glued space by defining them upstairs. Example in [[gluing-examples]].</p>`]]},
'crushing-a-set': {title: 'Crushing a set to a point', kind: 'idea', where: '§22 · HW7', pre: ['quotient-topology', 'saturated', 'closed-set'],
  lede: R`Collapse $A\subseteq X$ to one point. The result is Hausdorff when $A$ is closed in a metric space, and can fail otherwise.`,
  sections: [['Setup', R`<p>$x\sim_A y$ iff $x=y$ or both in $A$. The points of $X/{\sim_A}$ are $[A]$ and $\{x\}$ for $x\notin A$ ([[equivalence-class]]).</p>`],
    ['Picture', '<canvas id="qfig" class="figc" width="560" height="170" aria-label="Crushing A to a point"></canvas><div class="figctl"><label>x <input id="qx" type="range" min="0" max="1000" value="180"></label><label><input id="qclosed" type="checkbox" checked> A closed</label></div><p id="qmsg" class="figmsg"></p>'],
    ['Why closed matters', R`<p>For $x\notin A$ with $A$ closed there is $r>0$ with $B(x,r)\cap A=\varnothing$, a gap. For $A=(0,1)$ and $x=0$ there is no gap: $d(0,A)=0$, every open set around $\{0\}$ contains $[A]$, and the quotient is not Hausdorff ([[ex-crush-open]]).</p>`],
    ['The proof', R`<p>Written out in [[hw7-q1]].</p>`]]},
'gluing-examples': {title: 'Gluing examples', kind: 'example', where: '§22', pre: ['quotient-topology', 'homeomorphism'],
  lede: R`Circles, cones and tori come from gluing simple pieces.`,
  sections: [['Circle', R`<p>$[0,1]/\{0\sim1\}\cong S^1$: $h(t)=(\cos2\pi t,\sin2\pi t)$ is constant on $\{0,1\}$, so it induces a continuous bijection $[0,1]/{\sim}\to S^1$ ([[maps-out-of-quotients]]); compactness (Ch. 3) makes it a [[homeomorphism]]. See [[ex-circle]].</p>`],
    ['Torus', R`<p>The square with opposite sides glued (both pairs, same direction) is the torus.</p>`],
    ['Line with two origins', R`<p>See [[ex-two-origins]]: a quotient that is not Hausdorff even though it looks like $\mathbb R$ near every point.</p>`]]},
// ---------- methods
'm-topology': {title: 'Check that a collection is a topology', kind: 'method', where: '§12', pre: ['topology'],
  lede: 'Check the three axioms, with arbitrary unions and finite intersections.',
  steps: [[R`Check $\varnothing$ and $X$ are in it.`, 'Axiom (1); easy to forget when the collection is given by a rule.'], [R`Take an arbitrary family and show its union is in it.`, 'Axiom (2) is for any number of sets.'], ['Take two members and show their intersection is in it.', R`Two suffice by induction; infinite intersections are not required ([[topology]]).`]],
  sections: [['To disprove', R`<p>Produce one union or one finite intersection that falls outside.</p>`]]},
'm-open': {title: 'Show a set is open', kind: 'method', where: '§13, §20', pre: ['generated-topology'],
  lede: 'Take a point, fit a basis element (a ball) around it inside the set.',
  steps: [[R`Take an arbitrary $x\in U$.`, 'Openness is a condition at every point.'], [R`Produce a [[basis]] element $B$, in a metric space a [[ball]] $B(x,r)$, with $x\in B\subseteq U$. Say how $r$ depends on $x$.`, R`This is the definition ([[generated-topology]]).`], [R`Prove $B\subseteq U$: take $y\in B$ and show $y\in U$.`, 'Usually with the triangle inequality.']],
  sections: [['Other routes', R`<p>Write $U$ as a union of open sets, or as $f^{-1}(V)$ for a [[continuous]] $f$ and open $V$.</p>`], ['Common mistakes', R`<p>Using one radius for all points; showing $x\in B$ but not $B\subseteq U$.</p>`]]},
'm-closed': {title: 'Show a set is closed', kind: 'method', where: '§17', pre: ['closed-set'],
  lede: 'Complement open, or contains its limit points, or a preimage of a closed set.',
  steps: [[R`Show $X\setminus A$ is open ([[m-open]]).`, 'The definition.'], ['Or show $A$ contains its limit points.', R`[[closure-limit-points|Corollary 17.7]].`], [R`Or write $A=f^{-1}(C)$ with $f$ continuous and $C$ closed.`, R`[[continuity-equivalents|Theorem 18.1]]. Example: $\{z: d(z,x)\ge r\}$.`]],
  sections: [['Common mistake', R`<p>Concluding closed from "not open".</p>`]]},
'm-closure': {title: 'Find a closure', kind: 'method', where: '§17', pre: ['closure-test'],
  lede: 'Guess from a picture, then confirm each point with the closure test.',
  steps: [['Guess the answer from a picture.', ''], [R`For $x$ in the guess: every basis element around $x$ meets $A$.`, R`[[closure-test]].`], [R`For $x$ outside the guess: find one basis element around $x$ that misses $A$.`, 'The same theorem, negated.']],
  sections: [['Watch out', R`<p>The answer depends on the topology: $\overline{(0,1)}$ is $[0,1]$ in $\mathbb R$ and $[0,1)$ in [[ex-lower-limit|ℝ_ℓ]].</p>`]]},
'm-continuous': {title: 'Show a function is continuous', kind: 'method', where: '§18, §21', pre: ['continuous'],
  lede: 'Pull back basis elements, or use ε–δ, or build it from continuous pieces.',
  steps: [[R`Take a basis element $B$ of $Y$ and show $f^{-1}(B)$ is open.`, R`Preimages preserve unions ([[image-preimage]]).`], [R`In metric spaces: given $x$ and $\varepsilon$, produce $\delta$.`, R`[[epsilon-delta]].`], ['Or assemble $f$ from continuous pieces: compositions, restrictions, the pasting lemma, maps into products.', R`Theorems 18.2–18.4; [[pasting-lemma]].`]],
  sections: [['Out of a quotient', R`<p>$g$ on $X^*$ is continuous iff $g\circ p$ is ([[maps-out-of-quotients]]).</p>`], ['Common mistakes', R`<p>Checking images instead of preimages; for a [[homeomorphism]], forgetting the inverse.</p>`]]},
'm-hausdorff': {title: 'Show a space is Hausdorff', kind: 'method', where: '§17', pre: ['hausdorff'],
  lede: 'Take two points, split into cases if they come in kinds, and build disjoint open sets in each case.',
  steps: [[R`Take $x\neq y$; if the points come in kinds, split into cases.`, 'Different kinds of pairs may need different constructions.'], ['In each case write down two open sets, one around each point.', R`In a metric space, balls of radius $d(x,y)/2$ ([[metric-hausdorff]]).`], [R`Prove they are disjoint: suppose $z$ is in both and reach a contradiction.`, R`Typically $d(x,y)\le d(x,z)+d(z,y)<2r\le d(x,y)$.`]],
  sections: [['To disprove', R`<p>Find two points such that every neighbourhood of one meets every neighbourhood of the other, as in [[ex-crush-open]].</p>`], ['Worked', R`<p>[[hw7-q1]].</p>`]]},
'm-quotient': {title: 'Work with a quotient', kind: 'method', where: '§22', pre: ['quotient-topology', 'saturated'],
  lede: 'Describe the classes, test openness by pulling back, and build open sets from saturated ones.',
  steps: [['Describe the classes: the points of the quotient.', R`You need to know what you are separating or mapping ([[equivalence-class]]).`], [R`To show $V\subseteq X^*$ is open, check $p^{-1}(V)$ is open in $X$.`, R`The definition ([[quotient-topology]]).`], [R`To produce open sets in $X^*$, take open [[saturated]] sets of $X$ and push them down.`, R`$p^{-1}(p(C))=C$ is open.`], [R`To map out of $X^*$, define a continuous map on $X$ constant on each class.`, R`[[maps-out-of-quotients]].`]],
  sections: [['Worked', R`<p>[[hw7-q1]] combines this with [[m-hausdorff]].</p>`]]},
'm-compare': {title: 'Compare two topologies', kind: 'method', where: '§13', pre: ['lemma-13-3'],
  lede: 'Inside every old basis element around a point, find a new one around the same point.',
  steps: [['Write down bases for both.', ''], [R`For each $x$ and each basis element $B\ni x$ of the coarser candidate, find $B'\ni x$ of the finer one with $B'\subseteq B$.`, R`[[lemma-13-3]].`], ['For "strictly finer", exhibit one open set of the finer topology not open in the other.', R`E.g. $[0,1)$ in [[ex-lower-limit|ℝ_ℓ]].`]],
  sections: [['Common mistake', R`<p>Reversing the direction: the finer topology supplies the smaller sets.</p>`]]},
'm-counterexample': {title: 'Find a counterexample', kind: 'method', where: 'all', pre: [],
  lede: 'Try a small finite space, one of the standard odd topologies, or drop a hypothesis.',
  steps: [['Try a small finite space with a hand-made topology.', 'You can list every open set.'], [R`Try [[ex-lower-limit|ℝ_ℓ]], [[ex-finite-complement]], [[ex-indiscrete]], [[ex-sierpinski]].`, 'Each breaks a different property.'], ['Drop a hypothesis, e.g. crush a set that is not closed.', R`[[ex-crush-open]] shows exactly where closedness is used.`]],
  sections: []},
// ---------- examples
'ex-real-line': {title: 'ℝ, the standard line', kind: 'example', where: '§13', pre: ['basis'], lede: 'Basis: open intervals. Metric, Hausdorff, connected: the baseline.', sections: [['Facts', R`<p>Its topology is the [[order-topology]] and the [[metric-topology]] of $|x-y|$.</p>`]]},
'ex-lower-limit': {title: 'ℝ_ℓ, the lower limit topology', kind: 'example', where: '§13', pre: ['basis'], lede: R`Basis: $[a,b)$. Strictly finer than ℝ.`, sections: [['Facts', R`<p>[[hausdorff|Hausdorff]]; $[a,b)$ is both open and closed; strictly finer than ℝ by [[lemma-13-3]]. The identity $\mathbb R\to\mathbb R_\ell$ is not [[continuous]].</p>`]]},
'ex-k-topology': {title: 'ℝ_K, the K-topology', kind: 'example', where: '§13', pre: ['basis'], lede: R`Basis: $(a,b)$ and $(a,b)\setminus K$ with $K=\{1/n\}$.`, sections: [['Facts', R`<p>Strictly finer than ℝ, not comparable with ℝ_ℓ (Lemma 13.4); Hausdorff. $K$ is closed in ℝ_K.</p>`]]},
'ex-finite-complement': {title: 'Finite complement topology', kind: 'example', where: '§12', pre: ['standard-topologies'], lede: 'Open sets: complements of finite sets. T₁ but not Hausdorff on an infinite set.', sections: [['Why not Hausdorff', R`<p>Two nonempty open sets have finite complements; on an infinite set their complements cannot cover $X$, so the sets meet.</p>`], ['Convergence', R`<p>A sequence of distinct points converges to every point.</p>`]]},
'ex-discrete': {title: 'Discrete space', kind: 'example', where: '§12', pre: ['standard-topologies'], lede: 'Every subset is open; every map out of it is continuous.', sections: [['Facts', R`<p>Metrizable by the discrete metric; Hausdorff.</p>`]]},
'ex-indiscrete': {title: 'Indiscrete space', kind: 'example', where: '§12', pre: ['standard-topologies'], lede: R`Only $\varnothing$ and $X$; every map into it is continuous.`, sections: [['Facts', R`<p>Not Hausdorff if it has two points; every sequence converges to every point.</p>`]]},
'ex-sierpinski': {title: 'Sierpiński space', kind: 'example', where: '§12', pre: ['topology'], lede: R`$\{0,1\}$ with open sets $\varnothing,\{1\},\{0,1\}$.`, sections: [['Facts', R`<p>Not [[t1|T₁]]: $\{1\}$ is open, so $\{0\}$ is closed, but $\{1\}$ is not closed. The smallest space that is neither discrete nor indiscrete.</p>`]]},
'ex-crush-open': {title: 'ℝ/(0,1): crushing a set that is not closed', kind: 'example', where: '§22', pre: ['quotient-topology', 'limit-point'], lede: R`Collapsing $(0,1)$ to a point gives a non-Hausdorff space.`, sections: [['Why', R`<p>Any open $V\ni\{0\}$ has $p^{-1}(V)$ open in $\mathbb R$ containing $0$, so containing $(-\varepsilon,\varepsilon)$, which meets $(0,1)$. So $[(0,1)]\in V$. Every neighbourhood of $\{0\}$ contains the crushed point.</p>`], ['Also', R`<p>$\{[(0,1)]\}$ is not closed, since its preimage $(0,1)$ is not closed: the space is not even [[t1|T₁]].</p>`]]},
'ex-circle': {title: 'Circle from an interval', kind: 'example', where: '§22', pre: ['gluing-examples'], lede: R`$[0,1]$ with $0\sim1$ is homeomorphic to $S^1$.`, sections: [['Why', R`<p>See [[gluing-examples]].</p>`]]},
'ex-two-origins': {title: 'Line with two origins', kind: 'example', where: '§22', pre: ['quotient-topology'], lede: 'Two copies of ℝ glued everywhere except 0. Looks like ℝ near each point but is not Hausdorff.', sections: [['Why not Hausdorff', R`<p>Any neighbourhoods of the two origins contain intervals $(-\varepsilon,0)\cup(0,\varepsilon)$ that are glued together, so they meet.</p>`]]},
// ---------- worked
'hw7-q1': {title: 'HW7 Q1: crushing a closed set', kind: 'worked', where: 'Homework 7', pre: ['crushing-a-set', 'm-quotient', 'm-hausdorff'],
  lede: R`For a closed $A$ in a metric space, $X/{\sim_A}$ is Hausdorff. Set up as in our session; check the wording on the sheet.`,
  sections: [['(a) The classes', R`<p>If $a\in A$: every $y\in A$ is related to $a$ by the "both in $A$" clause, and no $y\notin A$ is. So $[a]=A$. If $x\notin A$, only $y=x$ is related, so $[x]=\{x\}$. Hence $X/{\sim_A}=\{A\}\cup\{\{x\}:x\in X\setminus A\}$.</p>`],
    ['(b) Setup', R`<p>$\pi:X\to X/{\sim_A}$, $\pi(z)=[z]$. $U$ is open in $X/{\sim_A}$ iff $\pi^{-1}(U)$ is open in $X$. If $W\subseteq X$ is open and contains all of $A$ or none of it, it is [[saturated]], so $\pi(W)$ is open.</p>`],
    ['(b) Case 1: two singletons', R`<p>$\{x\},\{y\}$ with $x\ne y$, $x,y\notin A$. Since $A$ is closed there are $r_x,r_y>0$ with $B(x,r_x)\cap A=\varnothing=B(y,r_y)\cap A$. Let $r=\min(\tfrac{d(x,y)}2,r_x,r_y)$. The balls $B(x,r),B(y,r)$ miss $A$, so their images are open; if $z$ were in both, $d(x,y)<2r\le d(x,y)$. So the images are disjoint open sets around $\{x\},\{y\}$.</p>`],
    ['(b) Case 2: [A] and a singleton', R`<p>Choose $r>0$ with $B(x,r)\cap A=\varnothing$. Let $U=B(x,\tfrac r2)$ and $W=\{z: d(z,x)>\tfrac r2\}$. Both are open; $U$ misses $A$ and $A\subseteq W$, so both are saturated; they are disjoint. So $\pi(U)\ni\{x\}$ and $\pi(W)\ni[A]$ separate the points.</p>`],
    ['Conclusion', R`<p>Every pair of distinct points is separated, so $X/{\sim_A}$ is [[hausdorff|Hausdorff]]. $\blacksquare$</p>`],
    ['Why the hypothesis', R`<p>Without closedness it fails: [[ex-crush-open]].</p>`]]}
};

</script>
<script>
// ===== The encyclopedia: home page, articles, link previews, a trail of where you have been, search.
var KIND = {definition: 'Definition', theorem: 'Theorem', method: 'Method', example: 'Example', idea: 'Idea', worked: 'Worked problem'};
var BACK = {}, MENTION = {};
Object.keys(A).forEach(function(id){ (A[id].pre || []).forEach(function(p){ (BACK[p] = BACK[p] || []).push(id); });
  var txt = JSON.stringify(A[id]); (txt.match(/\[\[([a-z0-9-]+)/g) || []).forEach(function(m){ var t = m.slice(2); if (t !== id){ MENTION[t] = MENTION[t] || []; if (MENTION[t].indexOf(id) < 0) MENTION[t].push(id); } }); });
function wiki(h){ return h.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, function(_, id, label){ var a = A[id]; return '<a class="wl" href="#a/' + id + '" data-id="' + id + '">' + (label || (a ? a.title : id)) + '</a>'; }); }
function plain(h){ return h.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, function(_, id, l){ return l || (A[id] ? A[id].title : id); }).replace(/<[^>]+>/g, ''); }
function math(el){ if (window.renderMathInElement) renderMathInElement(el, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false}); }
function chip(id){ var a = A[id]; return a ? '<a class="chip" href="#a/' + id + '">' + a.title + '</a>' : ''; }
var TRAIL = []; try { TRAIL = JSON.parse(sessionStorage.getItem('tg-trail') || '[]'); } catch(e){}
function home(){
  var recent = []; try { recent = JSON.parse(localStorage.getItem('tg-recent') || '[]'); } catch(e){}
  var h = '<h1>Topology Reference Guide</h1><p class="intro">An encyclopedia of the course, one article per idea. Each article opens to a one-line summary and its definition; everything else unfolds when you want it. Underlined terms are links: tap one for a preview, then read on or stay where you are. At the end of each article you will find what it depends on and what builds on it, and the next article in Munkres order.</p>';
  h += '<div class="start"><a class="chip" href="#a/topology">Start at the beginning</a><a class="chip" href="#a/crushing-a-set">Current: quotients</a><a class="chip" href="#a/hw7-q1">HW7 Q1</a><a class="chip" href="tabs/">Quick-reference tabs</a></div>';
  if (recent.length) h += '<div class="topic"><h2>Recently read</h2><div class="chips">' + recent.slice(0, 8).map(chip).join('') + '</div></div>';
  TOPICS.forEach(function(tp){ h += '<div class="topic"><h2>' + tp[0] + '</h2><div class="tlist">' + tp[1].map(function(id){ var a = A[id]; return '<a href="#a/' + id + '"><b>' + a.title + '</b><span class="kind">' + KIND[a.kind] + '</span><i>' + wiki(a.lede).replace(/<a [^>]*>|<\/a>/g, '') + '</i></a>'; }).join('') + '</div></div>'; });
  h += '<p class="foot">Theorem numbers follow Munkres, <em>Topology</em>, 2nd ed.; check them against your copy. Earlier notes and quiz: <a href="classic/">classic</a>.</p>';
  return h;
}
function article(id){
  var a = A[id]; if (!a) return '<p>No article called “' + id + '”.</p>';
  TRAIL = TRAIL.filter(function(x){ return x !== id; }); TRAIL.push(id); TRAIL = TRAIL.slice(-4); try { sessionStorage.setItem('tg-trail', JSON.stringify(TRAIL)); var r = JSON.parse(localStorage.getItem('tg-recent') || '[]').filter(function(x){ return x !== id; }); r.unshift(id); localStorage.setItem('tg-recent', JSON.stringify(r.slice(0, 12))); } catch(e){}
  var h = '<div class="trail"><a href="#">Home</a>' + TRAIL.slice(0, -1).map(function(t){ return '<span class="sep">›</span><a href="#a/' + t + '">' + A[t].title + '</a>'; }).join('') + '<span class="sep">›</span>' + a.title + '</div>';
  h += '<div class="meta">' + KIND[a.kind] + ' · ' + a.where + '</div><h1>' + a.title + '</h1><div class="lede">' + wiki(a.lede) + '</div>';
  if (a.steps) h += '<details class="sec" open><summary>Steps</summary><div class="secb"><ol class="steps">' + a.steps.map(function(s){ return '<li>' + (s[1] ? '<details><summary>' + wiki(s[0]) + '</summary><div class="why"><b>Why:</b> ' + wiki(s[1]) + '</div></details>' : wiki(s[0])) + '</li>'; }).join('') + '</ol></div></details>';
  (a.sections || []).forEach(function(s, i){ h += '<details class="sec"' + (i === 0 && !a.steps ? ' open' : '') + (s[0] === 'Picture' ? ' open' : '') + '><summary>' + s[0] + '</summary><div class="secb">' + wiki(s[1]) + '</div></details>'; });
  h += '<div class="links">';
  if ((a.pre || []).length) h += '<h3>Depends on</h3><div class="chips">' + a.pre.map(chip).join('') + '</div>';
  if ((BACK[id] || []).length) h += '<h3>Builds toward</h3><div class="chips">' + BACK[id].map(chip).join('') + '</div>';
  var men = (MENTION[id] || []).filter(function(m){ return (BACK[id] || []).indexOf(m) < 0 && (a.pre || []).indexOf(m) < 0; });
  if (men.length) h += '<h3>Mentioned in</h3><div class="chips">' + men.map(chip).join('') + '</div>';
  h += '</div>';
  var k = ORDER.indexOf(id);
  if (k >= 0) h += '<div class="pn">' + (k > 0 ? '<a href="#a/' + ORDER[k - 1] + '"><span>Previous</span>' + A[ORDER[k - 1]].title + '</a>' : '<span style="flex:1"></span>') + (k < ORDER.length - 1 ? '<a class="nx" href="#a/' + ORDER[k + 1] + '"><span>Next in Munkres order</span>' + A[ORDER[k + 1]].title + '</a>' : '') + '</div>';
  return h;
}
function route(){
  var hsh = location.hash.replace(/^#/, ''), v = document.getElementById('view');
  closePv();
  if (hsh.indexOf('a/') === 0){ var id = hsh.slice(2); v.innerHTML = article(id); document.title = (A[id] ? A[id].title + ' · ' : '') + 'Topology Reference Guide'; }
  else { v.innerHTML = home(); document.title = 'Topology Reference Guide'; }
  math(v); window.scrollTo(0, 0); if (document.getElementById('qfig')) quotFig();
}
// previews: a tap on an underlined term inside an article shows its summary first
function closePv(){ document.getElementById('pv').classList.remove('on'); }
document.addEventListener('click', function(e){
  var l = e.target.closest('a.wl');
  if (l && !e.metaKey && !e.ctrlKey){ e.preventDefault(); var a = A[l.dataset.id]; if (!a) return; var pv = document.getElementById('pv');
    pv.querySelector('.pm').textContent = KIND[a.kind] + ' · ' + a.where; pv.querySelector('.pt').textContent = a.title; pv.querySelector('.pl').innerHTML = wiki(a.lede).replace(/<a [^>]*>|<\/a>/g, '');
    pv.querySelector('.pgo').setAttribute('href', '#a/' + l.dataset.id); math(pv); pv.classList.add('on'); return; }
  if (e.target.closest('#pv .px')) closePv();
  else if (!e.target.closest('#pv')) closePv();
});
// search: titles, summaries and text
var IDX = Object.keys(A).map(function(id){ var a = A[id]; return {id: id, t: a.title.toLowerCase(), l: plain(a.lede).toLowerCase(), b: plain(JSON.stringify(a.sections || []) + JSON.stringify(a.steps || [])).toLowerCase()}; });
function search(q){ q = q.trim().toLowerCase(); if (!q) return []; return IDX.map(function(e){ var s = e.t.indexOf(q) === 0 ? 0 : e.t.indexOf(q) >= 0 ? 1 : e.l.indexOf(q) >= 0 ? 2 : e.b.indexOf(q) >= 0 ? 3 : 9; return [s, e.id]; }).filter(function(x){ return x[0] < 9; }).sort(function(a, b){ return a[0] - b[0]; }).slice(0, 8).map(function(x){ return x[1]; }); }
var q = document.getElementById('q'), sg = document.getElementById('sugg');
q.addEventListener('input', function(){ var r = search(q.value); sg.innerHTML = r.map(function(id){ return '<a href="#a/' + id + '"><span class="sk">' + KIND[A[id].kind] + '</span>' + A[id].title + '</a>'; }).join('') || (q.value ? '<a href="#"><span class="sk">no match</span>Try another word</a>' : ''); sg.classList.toggle('on', !!q.value); });
q.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ var r = search(q.value); if (r.length){ location.hash = 'a/' + r[0]; q.value = ''; sg.classList.remove('on'); q.blur(); } } if (e.key === 'Escape'){ q.value = ''; sg.classList.remove('on'); } });
sg.addEventListener('click', function(){ setTimeout(function(){ q.value = ''; sg.classList.remove('on'); }, 0); });
document.addEventListener('click', function(e){ if (!e.target.closest('.search')) sg.classList.remove('on'); });
// theme
var tb = document.getElementById('themeBtn'); function setTb(){ tb.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? 'Dark' : 'Light'; } setTb();
tb.addEventListener('click', function(){ var l = document.documentElement.getAttribute('data-theme') === 'light'; if (l) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'light'); try { localStorage.setItem('tg-theme', l ? 'dark' : 'light'); } catch(e){} setTb(); if (document.getElementById('qfig')) quotFig(); });
// the crushing picture
function quotFig(){
  var cv = document.getElementById('qfig'); if (!cv) return; var g = cv.getContext('2d'), xs = document.getElementById('qx'), cl = document.getElementById('qclosed'), out = document.getElementById('qmsg');
  function col(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#888'; }
  function draw(){ var W = cv.width, H = cv.height, L = 30, Rr = W - 30, a = 0.35, b = 0.65, x = +xs.value/1000, closed = cl.checked, fg = col('--text'), mu = col('--muted'), bg = col('--card');
    function X(u){ return L + (Rr - L)*u; }
    g.fillStyle = bg; g.fillRect(0, 0, W, H); g.font = '14px Georgia, serif';
    var y0 = 50; g.strokeStyle = mu; g.lineWidth = 2; g.beginPath(); g.moveTo(L, y0); g.lineTo(Rr, y0); g.stroke();
    g.strokeStyle = '#e0947a'; g.lineWidth = 6; g.beginPath(); g.moveTo(X(a), y0); g.lineTo(X(b), y0); g.stroke();
    [a, b].forEach(function(e){ g.beginPath(); g.arc(X(e), y0, 6, 0, 7); g.fillStyle = closed ? '#e0947a' : bg; g.fill(); g.strokeStyle = '#e0947a'; g.lineWidth = 2; g.stroke(); });
    g.fillStyle = mu; g.fillText('ℝ', L, 24); g.fillText(closed ? 'A = [a, b], closed' : 'A = (a, b), not closed', X(a) - 10, 24);
    var inA = closed ? (x >= a && x <= b) : (x > a && x < b), gap = inA ? 0 : Math.min(Math.abs(x - a), Math.abs(x - b)), touches = !inA && !closed && gap < 0.004;
    var y1 = 132, shift = X(b) - X(a); g.strokeStyle = mu; g.lineWidth = 2; g.beginPath(); g.moveTo(L, y1); g.lineTo(Rr - shift, y1); g.stroke();
    var pA = X(a); g.fillStyle = '#e0947a'; g.beginPath(); g.arc(pA, y1, 7, 0, 7); g.fill(); g.fillStyle = mu; g.fillText('X/∼ : A is one point [A]', L, y1 - 24);
    function down(u){ return u <= a ? X(u) : u >= b ? X(u) - shift : pA; }
    if (inA){ out.innerHTML = 'x is in A, so in the quotient it is the point [A]. Move it outside A.'; }
    else if (touches){ var e = 0.06; g.fillStyle = 'rgba(201,73,90,.4)'; g.fillRect(X(x - e), y0 - 10, X(x + e) - X(x - e), 20); g.fillRect(Math.min(down(x - e), down(x + e)) - 2, y1 - 10, Math.abs(down(x + e) - down(x - e)) + 4, 20);
      out.innerHTML = 'x is a limit point of A that A leaves out, so every interval around x reaches into A and its image contains [A]. The points cannot be separated: <b>not Hausdorff</b>.'; }
    else { var U = gap/2; g.fillStyle = 'rgba(95,184,138,.45)'; g.fillRect(X(x - U), y0 - 10, X(x + U) - X(x - U), 20); g.fillRect(down(x - U), y1 - 10, down(x + U) - down(x - U), 20);
      g.fillStyle = 'rgba(91,155,213,.4)'; g.fillRect(L, y0 + 9, X(x - U) - L, 6); g.fillRect(X(x + U), y0 + 9, Rr - X(x + U), 6); g.fillRect(L, y1 + 9, down(x - U) - L, 6); g.fillRect(down(x + U), y1 + 9, Rr - shift - down(x + U), 6);
      out.innerHTML = 'r = d(x, A) > 0. Green: U = B(x, r/2), missing A. Blue: W = {z : d(z, x) > r/2}, containing all of A. Both are saturated, so their images are disjoint open sets around {x} and [A].'; }
    g.fillStyle = fg; g.beginPath(); g.arc(X(x), y0, 4, 0, 7); g.fill(); g.fillText('x', X(x) - 3, y0 + 26); if (!inA){ g.beginPath(); g.arc(down(x), y1, 4, 0, 7); g.fill(); g.fillText('{x}', down(x) - 8, y1 + 28); } }
  xs.oninput = draw; cl.onchange = function(){ if (!cl.checked) xs.value = 350; draw(); }; draw();
}
window.addEventListener('hashchange', route);
window.addEventListener('load', route);
</script>
