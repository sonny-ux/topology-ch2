hub9('hw9-q2', [
 ['How the terms are used', R`<p>The relation from [[hw8-q2]]: $x\sim y$ means $f(x)=f(y)$ for <b>every</b> continuous $f:X\to\{0,1\}$, where $\{0,1\}$ is discrete. So to prove $x\sim y$, take an arbitrary continuous $f$ and show $f(x)=f(y)$.</p>
<p>The component $C$ containing $x$ and $y$ is connected (it is a connected subset of $X$, with the subspace topology). [[hw8-q1]](a) says: on a connected space, every continuous map to $\{0,1\}$ is constant.</p>
<p><b>[[restriction|Restriction]].</b> Restricting a function keeps its rule but uses it only on a subset: $f|_C:C\to Y$, $f|_C(c)=f(c)$ for $c\in C$. If $f:X\to Y$ is continuous and $C\subseteq X$, then $f|_C:C\to Y$ is continuous (Theorem 18.2(d)): $(f|_C)^{-1}(V)=C\cap f^{-1}(V)$, which is open in $C$.</p>`],
 ['Breakdown', steps([
  [R`<b>Take an arbitrary continuous</b> $f:X\to\{0,1\}$.`, R`$x\sim y$ is a statement about every such $f$.`],
  [R`<b>Restrict it to the component</b> $C$: $f|_C$ is continuous.`, R`Theorem 18.2(d); see [[restriction]].`],
  [R`<b>$C$ is connected, so $f|_C$ is constant.</b>`, R`HW8 Q1(a), applied to the space $C$.`],
  [R`<b>So $f(x)=f|_C(x)=f|_C(y)=f(y)$.</b>`, R`$x,y\in C$. Since $f$ was arbitrary, $x\sim y$.`]])],
 ['Clean solution', R`<p>Let $C$ be the component of $X$ containing $x$ and $y$; it is connected. Let $f:X\to\{0,1\}$ be any continuous map. Its restriction $f|_C:C\to\{0,1\}$ is continuous (Theorem 18.2(d)). Since $C$ is connected, $f|_C$ is constant by HW8 Q1(a). As $x,y\in C$, $f(x)=f|_C(x)=f|_C(y)=f(y)$. This holds for every continuous $f:X\to\{0,1\}$, so $x\sim y$. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>A map to $\{0,1\}$ is a way of cutting $X$ into two open pieces; a connected set can never be cut, so it lands on one side. Q3 shows the converse fails: two points can be on the same side of every cut and still lie in different components.</p>`]]);

// ---------- Q3
hub9('hw9-q3', [
 ['The picture', R`<p>Vertical segments of height $1$ at $x=1,\tfrac12,\tfrac13,\dots$, crowding toward the $y$-axis, plus just two points on the $y$-axis: $(0,0)$ and $(0,1)$. There is no segment at $x=0$.</p>
<svg viewBox="-20 -15 260 140" style="max-width:420px;width:100%" role="img" aria-label="Sketch of X">
<g stroke="currentColor" stroke-width="2">
<line x1="200" y1="10" x2="200" y2="110"/><line x1="100" y1="10" x2="100" y2="110"/><line x1="66.7" y1="10" x2="66.7" y2="110"/><line x1="50" y1="10" x2="50" y2="110"/><line x1="40" y1="10" x2="40" y2="110"/><line x1="33.3" y1="10" x2="33.3" y2="110"/><line x1="28.6" y1="10" x2="28.6" y2="110"/><line x1="25" y1="10" x2="25" y2="110"/><line x1="22.2" y1="10" x2="22.2" y2="110"/><line x1="20" y1="10" x2="20" y2="110"/></g>
<g fill="currentColor"><circle cx="0" cy="110" r="3.5"/><circle cx="0" cy="10" r="3.5"/></g>
<g font-size="10" fill="currentColor"><text x="-18" y="124">(0,0)</text><text x="-18" y="5">(0,1)</text><text x="194" y="124">1</text><text x="94" y="124">½</text><text x="61" y="124">⅓</text></g></svg>`],
 ['How the terms are used', R`<p><b>(b)</b> is about the relation $\sim$ from [[hw8-q2]]: show every continuous $f:X\to\{0,1\}$ takes the same value at $x$ and $y$. <b>(c)</b> is about [[components]]: show no connected subset of $X$ contains both. Together with [[hw9-q2]], this shows that "same component" is strictly stronger than $\sim$.</p>
<p><b>Each segment $S_n=\{\tfrac1n\}\times[0,1]$ is connected:</b> $t\mapsto(\tfrac1n,t)$ is continuous from $[0,1]$ onto $S_n$, and $[0,1]$ is connected ([[connected-reals]]); continuous images of connected spaces are connected (Theorem 23.5).</p>
<p><b>Continuity carries convergence forward</b> (Theorem 21.3, the direction that holds in every space): if $f$ is continuous and $p_n\to p$, then $f(p_n)\to f(p)$. See [[convergence]].</p>
<p><b>Limits in $\{0,1\}$.</b> In the discrete space $\{0,1\}$, a sequence converges to $L$ exactly when it is eventually equal to $L$, because $\{L\}$ is an open set around $L$. So a sequence there has at most one limit: it cannot be eventually all $0$ and eventually all $1$. (This is Theorem 17.10, unique limits in a [[hausdorff|Hausdorff]] space, in its simplest case.)</p>
<p><b>Why connectedness alone cannot do (b).</b> $(0,0)$ and $(0,1)$ lie on no segment, and by (c) no connected subset of $X$ contains both. So the argument needs a second ingredient besides connectedness: the segments come arbitrarily close to the two points. Sequences express that closeness.</p>
<p><b>Open in $X$</b> means $X\cap W$ with $W$ open in $\mathbb R^2$ ([[subspace-topology]]); for example $X\cap B((0,0),r)$, or $X\cap\big((-\infty,r)\times\mathbb R\big)$. Part (c) uses sets of the second kind.</p>`],
 ['Breakdown', steps([
  [R`<b>(b) Fix a continuous</b> $f:X\to\{0,1\}$. On each segment $S_n$ it is constant; call the value $c_n$.`, R`$S_n$ is connected and $f|_{S_n}$ is continuous, so HW8 Q1(a) applies. This gives a sequence $c_1,c_2,c_3,\dots$ of $0$s and $1$s.`],
  [R`<b>(b) The bottoms of the segments converge to $(0,0)$:</b> $(\tfrac1n,0)\to(0,0)$.`, R`The distance from $(\tfrac1n,0)$ to $(0,0)$ is $\tfrac1n$, which goes to $0$. All the points and the limit lie in $X$, so the convergence holds in the subspace $X$.`],
  [R`<b>(b) Apply continuity:</b> $c_n=f(\tfrac1n,0)\to f(0,0)$.`, R`Theorem 21.3; and $f(\tfrac1n,0)=c_n$ because $(\tfrac1n,0)$ lies on $S_n$.`],
  [R`<b>(b) The same at the tops:</b> $(\tfrac1n,1)\to(0,1)$, so $c_n=f(\tfrac1n,1)\to f(0,1)$.`, ''],
  [R`<b>(b) One sequence, one limit:</b> $f(0,0)=f(0,1)$. So $(0,0)\sim(0,1)$.`, R`$c_n$ is eventually equal to $f(0,0)$ and eventually equal to $f(0,1)$, which forces the two to be equal. $f$ was arbitrary.`],
  [R`<b>(c) Suppose $C\subseteq X$ is connected and contains $x$ and $y$.</b>`, R`Proof by contradiction: components are the maximal connected sets, so "same component" means some connected set contains both.`],
  [R`<b>(c) If $C$ contains a point $(\tfrac1n,t)$,</b> pick $r$ with $\tfrac1{n+1}\lt r\lt\tfrac1n$ and cut $C$ by the vertical line $x=r$.`, R`$U=C\cap\big((r,\infty)\times\mathbb R\big)$ and $V=C\cap\big((-\infty,r)\times\mathbb R\big)$ are open in $C$ and disjoint; they cover $C$ because no point of $X$ has first coordinate $r$; $U\ni(\tfrac1n,t)$ and $V\ni x$. A separation of $C$: contradiction.`],
  [R`<b>(c) Otherwise $C=\{x,y\}$,</b> which is not connected.`, R`$\{x\}=C\cap B(x,\tfrac12)$ and $\{y\}=C\cap B(y,\tfrac12)$ are open in $C$, disjoint, nonempty, and cover $C$.`]])],
 ['Clean solution', R`<p><b>(a)</b> See the picture: the segments $S_n=\{\tfrac1n\}\times[0,1]$ for $n=1,2,3,\dots$, accumulating at the $y$-axis, together with the two points $(0,0)$ and $(0,1)$.</p>
<p><b>(b)</b> Let $f:X\to\{0,1\}$ be continuous. Each $S_n$ is connected, as the image of the connected space $[0,1]$ under the continuous map $t\mapsto(\tfrac1n,t)$; so $f|_{S_n}$, which is continuous, is constant by HW8 Q1(a). Call its value $c_n$.</p>
<p>The points $(\tfrac1n,0)$ converge to $x=(0,0)$, since their distance to it is $\tfrac1n\to0$; all of them lie in $X$. As $f$ is continuous, $f(\tfrac1n,0)\to f(x)$ (Theorem 21.3). Since $(\tfrac1n,0)\in S_n$, $f(\tfrac1n,0)=c_n$, so $c_n\to f(x)$. In the same way $(\tfrac1n,1)\to y=(0,1)$ gives $c_n\to f(y)$. In the discrete space $\{0,1\}$ a sequence converging to $L$ is eventually equal to $L$, so $c_n$ is eventually equal to both $f(x)$ and $f(y)$; hence $f(x)=f(y)$. Since $f$ was arbitrary, $x\sim y$.</p>
<p><b>(c)</b> Suppose, for a contradiction, that $C\subseteq X$ is connected and contains $x$ and $y$.</p>
<p>If $C$ contains a point $p=(\tfrac1n,t)$, choose $r$ with $\tfrac1{n+1}\lt r\lt\tfrac1n$. Let $U=C\cap\big((r,\infty)\times\mathbb R\big)$ and $V=C\cap\big((-\infty,r)\times\mathbb R\big)$. These are open in $C$ and disjoint. No point of $X$ has first coordinate $r$, since $r$ is neither $0$ nor of the form $\tfrac1m$, so $U\cup V=C$. Also $p\in U$ and $x\in V$. So $U,V$ separate $C$, a contradiction.</p>
<p>Otherwise $C\subseteq\{x,y\}$, so $C=\{x,y\}$. Then $C\cap B(x,\tfrac12)=\{x\}$ and $C\cap B(y,\tfrac12)=\{y\}$ are disjoint nonempty open subsets of $C$ covering it, again a separation, a contradiction.</p>
<p>So no connected subset of $X$ contains both $x$ and $y$: they lie in different components. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>A continuous map to $\{0,1\}$ cannot tell $x$ from $y$, because both are limits of the same crowd of segments, and each segment is stuck on one value. But a connected set has to actually <em>contain</em> a bridge between them, and the only bridges in sight, the segments, never reach the $y$-axis. The missing segment at $x=0$ is what makes $\sim$ and "same component" differ.</p>`]]);

// ---------- Q4
hub9('hw9-q4', [
 ['How the terms are used', R`<p>$\Gamma_f$ carries the [[subspace-topology]] from the product $X\times Y$. A <b>[[homeomorphism]]</b> is a continuous bijection with continuous inverse ([[m-homeomorphic]]).</p>
<p><b>Maps into a product</b> ([[maps-into-products|Theorem 18.4 / 19.6]]): $h(x)=(h_1(x),h_2(x))$ is continuous iff $h_1$ and $h_2$ are. A continuous map whose image lies in a subspace is continuous into that subspace (Theorem 18.2(e)), and the restriction of a continuous map is continuous (18.2(d)).</p>
<p><b>(b)</b> uses ε–δ continuity on $[0,1]\subseteq\mathbb R$ ([[epsilon-delta]]): $f$ is continuous at $x$ if for every $\epsilon\gt0$ there is $\delta\gt0$ with $|f(u)-f(x)|\lt\epsilon$ whenever $u\in[0,1]$ and $|u-x|\lt\delta$. The hint splits this into a left half $(x-\delta,x]$ and a right half $[x,x+\delta)$. The intermediate value theorem ([[ivt]]) is the other tool.</p>`],
 ['Breakdown', steps([
  [R`<b>(a) Define</b> $h:X\to\Gamma_f$, $h(x)=(x,f(x))$.`, R`It is the natural candidate: it hits each point of the graph exactly once.`],
  [R`<b>(a) $h$ is a bijection,</b> with inverse $\pi_1|_{\Gamma_f}:(x,f(x))\mapsto x$.`, R`Onto by the definition of $\Gamma_f$; one-to-one because the first coordinate recovers $x$.`],
  [R`<b>(a) $h$ is continuous:</b> its coordinates $\mathrm{id}_X$ and $f$ are continuous.`, R`Theorem 18.4 gives continuity into $X\times Y$; the image lies in $\Gamma_f$, so 18.2(e) gives continuity into $\Gamma_f$.`],
  [R`<b>(a) The inverse is continuous:</b> it is the projection $\pi_1$ restricted to $\Gamma_f$.`, R`$\pi_1$ is continuous ($\pi_1^{-1}(U)=U\times Y$); restrictions of continuous maps are continuous.`],
  [R`<b>(a) Deduce:</b> if $\gamma$ is a path in $X$ from $a$ to $b$, then $h\circ\gamma$ is a path in $\Gamma_f$ from $h(a)$ to $h(b)$.`, R`Composites of continuous maps are continuous, and every point of $\Gamma_f$ is $h(a)$ for some $a$.`],
  [R`<b>(b) Fix $x\in[0,1]$ and $\epsilon\gt0$. Left side, $x\gt0$:</b> take a path $\gamma=(\gamma_1,\gamma_2)$ in $\Gamma_f$ from $(0,f(0))$ to $(x,f(x))$. On the graph, $\gamma_2(t)=f(\gamma_1(t))$ for every $t$.`, R`Each point of $\Gamma_f$ has the form $(u,f(u))$. $\gamma_1=\pi_1\circ\gamma$ and $\gamma_2=\pi_2\circ\gamma$ are continuous.`],
  [R`<b>(b) Let $\tau$ be the first time with $\gamma_1(\tau)=x$.</b> Then $\tau\gt0$ and $\gamma_1(t)\lt x$ for $t\lt\tau$.`, R`$\gamma_1^{-1}(\{x\})$ is closed and nonempty in $[0,1]$, so it has a least element. Before $\tau$, $\gamma_1$ cannot exceed $x$ without passing through $x$ (IVT), and $\gamma_1(0)=0\lt x$.`],
  [R`<b>(b) Continuity of $\gamma_2$ at $\tau$:</b> there is $\eta\gt0$ with $|\gamma_2(t)-f(x)|\lt\epsilon$ for $t\in[0,1]$, $|t-\tau|\lt\eta$.`, R`$\gamma_2(\tau)=f(\gamma_1(\tau))=f(x)$.`],
  [R`<b>(b) Choose $t_0\in[0,\tau)$ with $\tau-t_0\lt\eta$, and let $\delta_L=x-\gamma_1(t_0)\gt0$.</b> Every $u\in(x-\delta_L,x)$ is $\gamma_1(t)$ for some $t\in(t_0,\tau)$, so $|f(u)-f(x)|=|\gamma_2(t)-f(x)|\lt\epsilon$.`, R`IVT for $\gamma_1$ on $[t_0,\tau]$, which runs from $\gamma_1(t_0)$ to $x$.`],
  [R`<b>(b) Right side:</b> the same argument with a path from $(1,f(1))$ to $(x,f(x))$ gives $\delta_R$ for $x\lt1$. Take $\delta=\min(\delta_L,\delta_R)$.`, R`At $x=0$ there is no left side to check; at $x=1$ no right side.`]])],
 ['Clean solution', R`<p><b>(a)</b> Define $h:X\to\Gamma_f$ by $h(x)=(x,f(x))$. Every point of $\Gamma_f$ is $(x,f(x))=h(x)$ for some $x$, so $h$ is onto; and $h(x)=h(x')$ forces $x=x'$ by comparing first coordinates, so $h$ is one-to-one. Its inverse is $g=\pi_1|_{\Gamma_f}$, since $g(h(x))=x$ and $h(g(x,f(x)))=(x,f(x))$.</p>
<p>The coordinate functions of $h$, as a map into $X\times Y$, are $\mathrm{id}_X$ and $f$, both continuous; so $h$ is continuous into $X\times Y$ (Theorem 18.4), and since its image lies in $\Gamma_f$ it is continuous into $\Gamma_f$ (Theorem 18.2(e)). The projection $\pi_1:X\times Y\to X$ is continuous, so its restriction $g$ is continuous (Theorem 18.2(d)). Hence $h$ is a homeomorphism and $\Gamma_f\cong X$.</p>
<p>Now let $X$ be path connected, and let $p,q\in\Gamma_f$. Write $p=h(a)$, $q=h(b)$ and take a path $\gamma:[0,1]\to X$ from $a$ to $b$. Then $h\circ\gamma$ is continuous, being a composite of continuous maps, with $h(\gamma(0))=p$ and $h(\gamma(1))=q$. So $\Gamma_f$ is path connected.</p>
<p><b>(b)</b> Suppose $\Gamma_f$ is path connected. Fix $x\in[0,1]$ and $\epsilon\gt0$.</p>
<p><i>Left side.</i> If $x=0$, set $\delta_L=1$. If $x\gt0$, take a path $\gamma=(\gamma_1,\gamma_2):[0,1]\to\Gamma_f$ from $(0,f(0))$ to $(x,f(x))$. The maps $\gamma_1=\pi_1\circ\gamma$ and $\gamma_2=\pi_2\circ\gamma$ are continuous, and since $\gamma(t)\in\Gamma_f$, $\gamma_2(t)=f(\gamma_1(t))$ for all $t$. The set $\gamma_1^{-1}(\{x\})$ is closed in $[0,1]$ and contains $1$, so it has a least element $\tau$; $\tau\gt0$ because $\gamma_1(0)=0\ne x$. For $t\lt\tau$ we have $\gamma_1(t)\lt x$: otherwise $\gamma_1(t)\gt x$, and the IVT on $[0,t]$ would give a time before $t$ at which $\gamma_1=x$. Since $\gamma_2$ is continuous at $\tau$ and $\gamma_2(\tau)=f(x)$, there is $\eta\gt0$ with $|\gamma_2(t)-f(x)|\lt\epsilon$ whenever $t\in[0,1]$ and $|t-\tau|\lt\eta$. Choose $t_0\in[0,\tau)$ with $\tau-t_0\lt\eta$ and set $\delta_L=x-\gamma_1(t_0)\gt0$. If $u\in[0,1]$ and $x-\delta_L\lt u\lt x$, then $\gamma_1(t_0)\lt u\lt\gamma_1(\tau)$, so by the IVT $u=\gamma_1(t)$ for some $t\in(t_0,\tau)$, and $|f(u)-f(x)|=|\gamma_2(t)-f(x)|\lt\epsilon$. Thus $f([0,1]\cap(x-\delta_L,x])\subseteq(f(x)-\epsilon,f(x)+\epsilon)$.</p>
<p><i>Right side.</i> In the same way, using a path from $(1,f(1))$ to $(x,f(x))$ when $x\lt1$ (and $\delta_R=1$ when $x=1$), there is $\delta_R\gt0$ with $f([0,1]\cap[x,x+\delta_R))\subseteq(f(x)-\epsilon,f(x)+\epsilon)$.</p>
<p>With $\delta=\min(\delta_L,\delta_R)$, every $u\in[0,1]$ with $|u-x|\lt\delta$ satisfies $|f(u)-f(x)|\lt\epsilon$. As $x$ and $\epsilon$ were arbitrary, $f$ is continuous (Theorem 21.1). $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>(a) The graph is a copy of $X$ drawn inside $X\times Y$; continuity of $f$ is exactly what keeps the copy from tearing. (b) runs the other way: if $f$ jumped at $x$, the graph would have a gap there, and a path along the graph would have to cross the gap; the first arrival time $\tau$ pins down where it crosses. For a converse to make sense you need the domain to be an interval: the IVT is what forces the path to visit every point just to the left of $x$.</p>`]]);

'mt2-q6': MP('MT2 Q6 · A connected space has no partition into open sets', R`(a) Define a partition. (b) If $X$ is connected and $\mathcal D$ is a partition of $X$ into open sets, then $\mathcal D=\{X\}$.`, ['partition', 'connected', 'open-set'], ['m-connected'])

Object.assign(VERBATIM, {
'mt2-q1': R`<p>Let $d:X\times X\to\mathbb R$ be a metric on the set $X$.</p><p>(a) State the definition of the metric topology $\mathcal T_d$ on $X$.</p><p>(b) Let $x\in X$. Prove that the subset $A=\{y\in X\mid d(x,y)\le1\}$ is closed in $X$.</p>`,
'mt2-q2': R`<p>Let $X$ and $Y$ be topological spaces, and let $f:X\to Y$ be a surjective function.</p><p>(a) State the definition of what it means for $f$ to be a <em>quotient map</em>.</p><p>(b) Let $X=\mathbb R$ have the standard topology, let $Y=\{0,1\}$, and define $f:X\to Y$ by</p>$$f(t)=\begin{cases}0 & \text{for } 1\le t\lt2,\\ 1 & \text{otherwise.}\end{cases}$$<p>Determine the quotient topology on $Y$ induced by $f$. <em>Justify your answer.</em></p>`,
'mt2-q3': R`<p>In this question, $[0,1]\subset\mathbb R$ is equipped with the subspace topology from the standard topology on $\mathbb R$.</p><p>(a) Let $X$ be a topological space, and define a relation $\sim$ on $X$ by declaring $x\sim y$ if and only if the following condition holds: $f(x)=f(y)$ for any continuous $f:X\to[0,1]$. Prove that $\sim$ is an equivalence relation.</p><p>(b) Let $\sim$ be the equivalence relation defined in (a). Prove that the quotient space $X/{\sim}$ is Hausdorff.</p>`,
'mt2-q4': R`<p>Let $X=\{0,1,2\}$ and $\mathcal T=\{\varnothing,\{0,1\},\{2\},X\}$. It may be used without proof that $\mathcal T$ is a topology on $X$.</p><p>(a) Prove that $A=\{0,1\}$, equipped with the subspace topology from $X$, is connected.</p><p>(b) Prove that $X$ is not connected.</p>`,
'mt2-q5': R`<p>For each of the following statements, mark if they are true or false. <em>In this problem, you do not need to justify your answers.</em></p><p>(a) If $X$ is a metrizable topological space, then $X$ is connected.</p><p>(b) If $f:X\to Y$ is continuous and surjective, and $X$ is connected, then $Y$ is also connected.</p><p>(c) If $X$ is connected, then it is also path connected.</p><p>(d) If $f:X\to Y$ is an open map and a surjection, then $f$ is continuous.</p><p>(e) If $X$ is a topological space and $Y\subset X$ is connected when given the subspace topology, then $X$ is also connected.</p><p>(f) If $f:X\to Y$ and $g:Y\to Z$ are surjective maps, such that both $f$ and $g\circ f:X\to Z$ are quotient maps, then $g$ is also a quotient map.</p>`,
'mt2-q6': R`<p>Let $X$ be a topological space and $\mathcal D\subset\mathcal P(X)$ a collection of subsets.</p><p>(a) State what it means for $\mathcal D$ to be a partition of $X$.</p><p>(b) Prove that if $X$ is connected and $\mathcal D$ is a partition consisting of open subsets, then $\mathcal D=\{X\}$.</p>`
});

function hubM(id, parts){ A[id].sections = [['The problem', VERBATIM[id] + PDFM2], ['Concepts and method', '']].concat(parts); }

hubM('mt2-q1', [
 ['How the terms are used', R`<p>A <b>metric</b> ([[metric]]) gives a distance $d(x,y)\ge0$, zero only when $x=y$, symmetric, with the triangle inequality $d(x,z)\le d(x,y)+d(y,z)$. The <b>open ball</b> ([[ball]]) is $B_d(x,\varepsilon)=\{y: d(x,y)\lt\varepsilon\}$. A set is <b>closed</b> ([[closed-set]]) when its complement is open, so (b) is really a statement about the set of points at distance more than $1$ from $x$.</p>`],
 ['Work-through', R`<div class="wk"><h4>(a) The definition</h4><p>The metric topology is the topology <b>generated by the open balls</b>: the balls $B_d(x,\varepsilon)$, for all $x\in X$ and $\varepsilon>0$, form a basis, and the open sets are the unions of balls. Equivalently, which is the form you use in proofs: $U$ is open iff for every $y\in U$ there is $\varepsilon>0$ with $B_d(y,\varepsilon)\subseteq U$.</p>
<h4>(b) What has to be shown</h4><p>$A$ is the closed ball of radius $1$ around $x$. To show it is closed, show its complement is open. The complement is the set of points far from $x$:</p>$$X\setminus A=\{z\in X:\ d(x,z)\gt1\}.$$<p>So take a point $z$ with $d(x,z)\gt1$ and find a ball around $z$ that stays in the complement.</p>
<h4>(b) Choosing the radius</h4><p>The point $z$ is farther from $x$ than $1$ by the margin $d(x,z)-1\gt0$. A ball around $z$ smaller than that margin cannot reach back to within distance $1$ of $x$. So set $r=d(x,z)-1$.</p>
<h4>(b) Checking it with the triangle inequality</h4><p>Let $w\in B_d(z,r)$, so $d(z,w)\lt r$. The triangle inequality $d(x,z)\le d(x,w)+d(w,z)$ rearranges to $d(x,w)\ge d(x,z)-d(z,w)$. Hence</p>$$d(x,w)\ge d(x,z)-d(z,w)\gt d(x,z)-r=1.$$<p>So $w\notin A$. Every point of the complement has a ball inside the complement, the complement is open, and $A$ is closed. $\blacksquare$ This is [[mt-q6]] again; on the exam it has to be written out in full.</p></div>`],
 ['Clean solution', R`<p><b>(a)</b> $\mathcal T_d$ is the topology on $X$ with basis the open balls $B_d(x,\varepsilon)=\{y\in X: d(x,y)\lt\varepsilon\}$, $x\in X$, $\varepsilon>0$. Equivalently, $U\subseteq X$ is open iff for each $y\in U$ there is $\varepsilon>0$ with $B_d(y,\varepsilon)\subseteq U$.</p>
<p><b>(b)</b> We show $X\setminus A=\{z: d(x,z)\gt1\}$ is open. Let $z\in X\setminus A$ and $r=d(x,z)-1\gt0$. If $w\in B_d(z,r)$, then by the triangle inequality $d(x,w)\ge d(x,z)-d(z,w)\gt d(x,z)-r=1$, so $w\in X\setminus A$. Thus $B_d(z,r)\subseteq X\setminus A$, so $X\setminus A$ is open and $A$ is closed. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>A closed ball contains its edge, the points at distance exactly $1$. Points outside are strictly farther away, and the gap $d(x,z)-1$ is room for a ball. The same argument shows $\{y: d(x,y)\gt r\}$ is open for any $r$.</p>`]]);

hubM('mt2-q2', [
 ['How the terms are used', R`<p>A <b>quotient map</b> ([[quotient-map]]) is a surjection $f:X\to Y$ such that a set $U\subseteq Y$ is open <b>exactly when</b> $f^{-1}(U)$ is open in $X$. The "if" direction is the extra condition; the "only if" direction is continuity. The <b>quotient topology</b> ([[quotient-topology]]) induced by a surjection is the topology that makes it a quotient map: declare $U$ open iff $f^{-1}(U)$ is open. On a two-point set there are only four subsets to test.</p>`],
 ['Work-through', R`<div class="wk"><h4>(a) The definition</h4><p>$f$ is a quotient map if it is surjective and, for every $U\subseteq Y$, $U$ is open in $Y$ if and only if $f^{-1}(U)$ is open in $X$.</p>
<h4>(b) The plan</h4><p>The quotient topology is decided set by set: $U\subseteq\{0,1\}$ is open iff its preimage is open in $\mathbb R$. There are four subsets, so compute four preimages.</p>
<h4>(b) The two easy subsets</h4><p>$f^{-1}(\varnothing)=\varnothing$ and $f^{-1}(\{0,1\})=\mathbb R$ are open, so $\varnothing$ and $Y$ are open, as in every topology.</p>
<h4>(b) The point $0$</h4><p>$f^{-1}(\{0\})=[1,2)$. This is not open in $\mathbb R$: it contains $1$, but every interval $(1-\varepsilon,1+\varepsilon)$ contains numbers below $1$, which are not in $[1,2)$. So $\{0\}$ is not open.</p>
<h4>(b) The point $1$</h4><p>$f^{-1}(\{1\})=(-\infty,1)\cup[2,\infty)$, the complement of $[1,2)$. It is not open either: it contains $2$, but every interval around $2$ contains numbers slightly below $2$, which lie in $[1,2)$. So $\{1\}$ is not open.</p>
<h4>(b) Conclusion</h4><p>The quotient topology is $\{\varnothing,\{0,1\}\}$: the indiscrete topology. The half-open interval has one closed end and one open end, so neither piece of $\mathbb R$ is open, and the two points of $Y$ cannot be told apart.</p></div>`],
 ['Clean solution', R`<p><b>(a)</b> A surjective map $f:X\to Y$ is a quotient map if for every $U\subseteq Y$: $U$ is open in $Y$ if and only if $f^{-1}(U)$ is open in $X$.</p>
<p><b>(b)</b> A subset $U\subseteq Y$ is open in the quotient topology iff $f^{-1}(U)$ is open in $\mathbb R$. We check all four subsets. $f^{-1}(\varnothing)=\varnothing$ and $f^{-1}(Y)=\mathbb R$ are open. $f^{-1}(\{0\})=[1,2)$ is not open, since no interval $(1-\varepsilon,1+\varepsilon)$ lies in it. $f^{-1}(\{1\})=(-\infty,1)\cup[2,\infty)$ is not open, since no interval $(2-\varepsilon,2+\varepsilon)$ lies in it (it contains points of $[1,2)$). Hence the quotient topology is $\{\varnothing,\{0,1\}\}$, the indiscrete topology. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>Compare [[hw6-q1]]: there the pieces $(-\infty,0)$ and $(0,\infty)$ were open, so their points became open points. Here each piece has an endpoint that belongs to it on one side only, so neither piece is open, and the quotient is as coarse as possible. Had $f$ been $0$ on the open interval $(1,2)$, $\{0\}$ would be open and $\{1\}$ not.</p>`]]);

hubM('mt2-q3', [
 ['What it builds on: HW8 Q2', R`<p>This is [[hw8-q2]] with $[0,1]$ in place of $\{0,1\}$. Part (a) is the same argument word for word. Part (b) asks for something new: not that classes are closed, but that the quotient space is Hausdorff, and for that the target $[0,1]$ being Hausdorff is what matters.</p>`],
 ['How the terms are used', R`<p>$[0,1]$ carries the [[subspace-topology]] of $\mathbb R$, so it is a metric space and in particular [[hausdorff|Hausdorff]]. The <b>quotient space</b> $X/{\sim}$ has the classes as points and the [[quotient-topology]]: with $p:X\to X/{\sim}$, $p(x)=[x]$, a set $W$ of classes is open iff $p^{-1}(W)$ is open in $X$. <b>Hausdorff</b> means: distinct points have disjoint open neighbourhoods.</p>`],
 ['Work-through', R`<div class="wk"><h4>(a) Equivalence relation</h4><p>Let $\mathcal F$ be the set of continuous $f:X\to[0,1]$, so $x\sim y$ iff $f(x)=f(y)$ for every $f\in\mathcal F$. Each property comes from the same property of equality. Reflexive: $f(x)=f(x)$ for every $f$. Symmetric: if $f(x)=f(y)$ for every $f$, then $f(y)=f(x)$ for every $f$. Transitive: if $x\sim y$ and $y\sim z$, fix one $f$; then $f(x)=f(y)=f(z)$; since $f$ was arbitrary, $x\sim z$.</p>
<h4>(b) Start with two different classes</h4><p>Let $[x]\ne[y]$ be two points of $X/{\sim}$. Different classes means $x\not\sim y$, and by the definition of $\sim$ that means <em>some</em> continuous $f:X\to[0,1]$ has $f(x)\ne f(y)$. This map is what will separate the two points.</p>
<h4>(b) Separate the values in $[0,1]$</h4><p>$[0,1]$ is Hausdorff, so there are disjoint open sets $U\ni f(x)$ and $V\ni f(y)$ in $[0,1]$. Pull them back: $f^{-1}(U)\ni x$ and $f^{-1}(V)\ni y$ are open in $X$ (continuity) and disjoint.</p>
<h4>(b) Carry them down to the quotient</h4><p>To get open sets downstairs, the sets upstairs must be unions of whole classes ([[saturated]]). They are: if $x'\in f^{-1}(U)$ and $x''\sim x'$, then $f(x'')=f(x')\in U$, because $f$ is one of the maps in the definition of $\sim$. So $f$ is constant on each class and $f^{-1}(U)$, $f^{-1}(V)$ are saturated. Let $W_U=p(f^{-1}(U))$ and $W_V=p(f^{-1}(V))$. Because the sets are saturated, $p^{-1}(W_U)=f^{-1}(U)$ is open, so $W_U$ is open in the quotient topology; likewise $W_V$.</p>
<h4>(b) Conclude</h4><p>$[x]\in W_U$ and $[y]\in W_V$. They are disjoint: a class in both would contain points of $f^{-1}(U)$ and of $f^{-1}(V)$, but $f$ takes a single value on the class, and $U\cap V=\varnothing$. So $X/{\sim}$ is Hausdorff. $\blacksquare$ (Equivalently: $f$ induces a continuous $\bar f:X/{\sim}\to[0,1]$ with $\bar f\circ p=f$ by Theorem 22.2, and $\bar f^{-1}(U)$, $\bar f^{-1}(V)$ separate $[x]$ and $[y]$.)</p></div>`],
 ['Clean solution', R`<p>Let $\mathcal F$ be the set of continuous maps $X\to[0,1]$.</p><p><b>(a)</b> For every $f\in\mathcal F$: $f(x)=f(x)$, so $x\sim x$. If $x\sim y$ then $f(y)=f(x)$ for all $f$, so $y\sim x$. If $x\sim y$ and $y\sim z$, then for each $f\in\mathcal F$, $f(x)=f(y)=f(z)$, so $x\sim z$. Hence $\sim$ is an equivalence relation. $\blacksquare$</p>
<p><b>(b)</b> Let $p:X\to X/{\sim}$ be the quotient map and $[x]\ne[y]$. Since $x\not\sim y$, there is $f\in\mathcal F$ with $f(x)\ne f(y)$. As $[0,1]$ is Hausdorff (a subspace of $\mathbb R$), choose disjoint open $U\ni f(x)$, $V\ni f(y)$ in $[0,1]$. Every $g\in\mathcal F$, in particular $f$, is constant on each class, so $f^{-1}(U)$ and $f^{-1}(V)$ are unions of classes; they are open in $X$ by continuity. Hence $W_U=p(f^{-1}(U))$ and $W_V=p(f^{-1}(V))$ satisfy $p^{-1}(W_U)=f^{-1}(U)$ and $p^{-1}(W_V)=f^{-1}(V)$, so they are open in $X/{\sim}$. They contain $[x]$ and $[y]$, and they are disjoint, since $f$ is constant on each class and $U\cap V=\varnothing$. So $X/{\sim}$ is Hausdorff. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>Two classes are different only because some map tells them apart, and a map into a Hausdorff space carries its separation back. The quotient identifies exactly the points no map can separate, so what is left is as separated as $[0,1]$ allows. Compare [[hw6-q5]] (the same idea with a single map $q$) and [[hw7-q1]].</p>`]]);

hubM('mt2-q4', [
 ['How the terms are used', R`<p>The <b>subspace topology</b> on $A$ ([[subspace-topology]]) consists of the sets $A\cap U$ for $U\in\mathcal T$. <b>Connected</b> ([[connected]]) means there is no separation: no pair of disjoint nonempty open sets whose union is the space. In a finite space everything can be listed ([[m-finite]]).</p>`],
 ['Work-through', R`<div class="wk"><h4>(a) The subspace topology on $A$</h4><p>Intersect each open set of $X$ with $A=\{0,1\}$: $A\cap\varnothing=\varnothing$, $A\cap\{0,1\}=A$, $A\cap\{2\}=\varnothing$, $A\cap X=A$. So the open sets of $A$ are only $\varnothing$ and $A$: $A$ has the indiscrete topology.</p>
<h4>(a) Why that makes $A$ connected</h4><p>A separation needs two nonempty open sets of $A$ that are disjoint. The only nonempty open set is $A$ itself, and $A\cap A\ne\varnothing$. So no separation exists, and $A$ is connected.</p>
<h4>(b) A separation of $X$</h4><p>Look for two disjoint nonempty open sets covering $X$. The list of open sets offers $\{0,1\}$ and $\{2\}$: both open, both nonempty, $\{0,1\}\cap\{2\}=\varnothing$, and $\{0,1\}\cup\{2\}=X$. That is a separation, so $X$ is not connected. $\blacksquare$</p></div>`],
 ['Clean solution', R`<p><b>(a)</b> The subspace topology on $A=\{0,1\}$ is $\{A\cap U: U\in\mathcal T\}=\{\varnothing,A\}$. A separation of $A$ would consist of two disjoint nonempty open subsets of $A$, but the only nonempty open subset is $A$. Hence $A$ is connected. $\blacksquare$</p><p><b>(b)</b> $\{0,1\}$ and $\{2\}$ are open in $X$, nonempty, disjoint, and their union is $X$. So they form a separation, and $X$ is not connected. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>The topology cannot tell $0$ from $1$ (every open set contains both or neither), so $\{0,1\}$ behaves like a single blob; but $\{2\}$ is open and closed, so it breaks away. A connected subspace (part (a)) does not make the whole space connected (part (b)): that is statement (e) of [[mt2-q5]].</p>`]]);

hubM('mt2-q5', [
 ['How to approach it', R`<p>No justification is required, but each answer should come from a reason you could give: a theorem for "true", a standard counterexample for "false". Test each statement against the [[gallery|Gallery of spaces]] ([[m-true-false]]).</p>`],
 ['Work-through', R`<div class="wk"><h4>(a) Metrizable implies connected: false</h4><p><b>What it says.</b> If some metric induces the topology of $X$, then $X$ is in one piece. <b>Recall:</b> $X$ is metrizable if there is a metric $d$ on $X$ whose metric topology is the topology of $X$ ([[metrizable]]); $X$ is connected if no two disjoint nonempty open sets cover it ([[connected]]).</p><p><b>Counterexample.</b> $X=\{0,1\}$ with the discrete topology. The metric $d(0,1)=1$ induces it: the ball $B(0,\tfrac12)=\{0\}$ and $B(1,\tfrac12)=\{1\}$, so every subset is open. Then $\{0\}$ and $\{1\}$ are disjoint, nonempty, open, and cover $X$: a separation. Another: $\mathbb R\setminus\{0\}$ with the usual metric, separated by $(-\infty,0)$ and $(0,\infty)$.</p><p><b>Why a metric does not force one piece.</b> The metric axioms only constrain distances between points: positive, symmetric, triangle inequality. None of them says there must be points <em>between</em> two given points, so nothing stops a space from having a gap. And a gap is exactly a separation: if $X=A\cup B$ with $A,B$ disjoint and nonempty, and every point of $A$ is at distance at least $c\gt0$ from every point of $B$, then for $a\in A$ the ball $B(a,c)$ contains no point of $B$, so it lies in $A$. Hence $A$ is open, likewise $B$, and $A,B$ separate $X$.</p>
<p><b>Every set is metrizable.</b> The discrete metric ($d(x,y)=1$ for $x\ne y$) works on any set and gives the discrete topology, in which every set with two or more points is disconnected. So most metrizable spaces are not connected.</p>
<p><b>Same distance formula, different answer.</b> $\mathbb R$ and $\mathbb Q$ both use $d(x,y)=|x-y|$. $\mathbb R$ is connected and $\mathbb Q$ is not ([[ex-rationals|ℚ]]). The difference is not the metric but which points are present: $\mathbb R$ has no holes (the least upper bound property, Theorem 24.1), while $\mathbb Q$ is missing $\sqrt2$ and so splits at it. Connectedness comes from completeness of the points, not from having a metric.</p>
<p><b>The lesson.</b> A metric gives Hausdorff and first countable, nothing about being in one piece. The converse fails too: a two-point indiscrete space is connected but not metrizable, since it is not Hausdorff.</p>
<h4>(b) Continuous surjective image of connected is connected: true</h4><p><b>What it says.</b> Connectedness is carried forward by continuous maps (Theorem 23.5). <b>Recall:</b> $f$ continuous means $f^{-1}(V)$ is open whenever $V$ is open.</p><p><b>Proof.</b> Suppose $U,V$ were a separation of $Y$. Then $f^{-1}(U)$ and $f^{-1}(V)$ are open (continuity), disjoint (preimages of disjoint sets are disjoint), and cover $X$ (because $U\cup V=Y$). They are nonempty: pick $u\in U$; since $f$ is surjective, some $x$ has $f(x)=u$, and $x\in f^{-1}(U)$; the same for $V$. So they separate $X$, contradicting that $X$ is connected.</p><p><b>Why each hypothesis is there.</b> Without surjectivity: a constant map from $[0,1]$ onto one point of the discrete space $\{0,1\}$ is continuous, but $\{0,1\}$ is not connected (Munkres states the theorem for the image $f(X)$). Without continuity: the identity from indiscrete $\{0,1\}$ to discrete $\{0,1\}$ is a surjection from a connected space onto a disconnected one.</p>
<h4>(c) Connected implies path connected: false</h4><p><b>What it says.</b> If $X$ cannot be split into two open pieces, then any two points can be joined by a path. <b>Recall:</b> a path from $x$ to $y$ is a continuous $\gamma:[0,1]\to X$ with $\gamma(0)=x$, $\gamma(1)=y$ ([[path-connected]]).</p><p><b>Counterexample.</b> The [[ex-sine-curve|topologist's sine curve]] $\overline S=\{(x,\sin\tfrac1x):0\lt x\le1\}\cup(\{0\}\times[-1,1])$. It is connected: the graph is the continuous image of the connected interval $(0,1]$, and $\overline S$ lies between the graph and its closure, so it is connected (Theorem 23.4). It is not path connected: no path joins a point of the segment to a point of the graph (Munkres §24).</p><p><b>The true direction.</b> Path connected implies connected (Munkres §24). The statement in (c) is that implication reversed.</p>
<h4>(d) An open surjection is continuous: false</h4><p><b>What it says.</b> If $f$ sends open sets to open sets and is onto, then $f$ pulls open sets back to open sets. <b>Recall:</b> $f$ is an [[open-map|open map]] if $f(U)$ is open for every open $U$ (images, going forward); $f$ is continuous if $f^{-1}(V)$ is open for every open $V$ (preimages, going backward).</p><p><b>Counterexample.</b> Let $f$ be the identity from $\{0,1\}$ with the indiscrete topology $\{\varnothing,\{0,1\}\}$ to $\{0,1\}$ with the discrete topology. It is a bijection, so surjective. It is open: the only open sets of the source are $\varnothing$ and $\{0,1\}$, whose images $\varnothing$ and $\{0,1\}$ are open. It is not continuous: $\{0\}$ is open in the target, and its preimage $\{0\}$ is not open in the source.</p><p><b>The lesson.</b> Open and continuous are independent: they look in opposite directions. The identity the other way (discrete to indiscrete) is continuous and not open. Compare [[hw7-q6]].</p>
<h4>(e) A connected subspace makes the space connected: false</h4><p><b>What it says.</b> If one part of $X$ is connected in its subspace topology, then all of $X$ is connected.</p><p><b>Counterexample.</b> $X=\{0,1\}$ discrete and $Y=\{0\}$. A one-point space is connected: there are not two disjoint nonempty sets in it. $X$ is not connected: $\{0\}$ and $\{1\}$ separate it. Another, from the same exam: in [[mt2-q4]], $A=\{0,1\}$ is a connected subspace of $X=\{0,1,2\}$, and $X$ is not connected.</p><p><b>What is true instead.</b> Connectedness passes upward only under extra conditions: if $Y$ is connected and $Y\subseteq X\subseteq\overline Y$ (for instance, $Y$ dense in $X$), then $X$ is connected (Theorem 23.4); and a union of connected sets with a point in common is connected (Theorem 23.3).</p>
<h4>(f) If $f$ and $g\circ f$ are quotient maps, so is $g$: true</h4><p><b>What it says.</b> In $X\xrightarrow{f}Y\xrightarrow{g}Z$, if the first map and the composite are quotient maps, the second is too. <b>Recall:</b> a [[quotient-map|quotient map]] $q:A\to B$ is a surjection such that $V\subseteq B$ is open iff $q^{-1}(V)$ is open in $A$. Also $(g\circ f)^{-1}(V)=f^{-1}(g^{-1}(V))$.</p><p><b>Proof.</b> $g$ is surjective by hypothesis. Two directions remain for $V\subseteq Z$.</p><ol><li><b>$V$ open $\Rightarrow$ $g^{-1}(V)$ open</b> (continuity of $g$). $f^{-1}(g^{-1}(V))=(g\circ f)^{-1}(V)$ is open, because $g\circ f$ is continuous. Since $f$ is a quotient map, a set whose $f$-preimage is open is open; so $g^{-1}(V)$ is open in $Y$.</li><li><b>$g^{-1}(V)$ open $\Rightarrow$ $V$ open.</b> $f$ is continuous (a quotient map is), so $f^{-1}(g^{-1}(V))=(g\circ f)^{-1}(V)$ is open in $X$. Since $g\circ f$ is a quotient map, $V$ is open in $Z$.</li></ol><p>So $g$ is a quotient map. Each direction uses the quotient property of one map and the continuity of the other.</p></div>`],
 ['Clean solution', R`<p><b>(a)</b> False. <b>(b)</b> True. <b>(c)</b> False. <b>(d)</b> False. <b>(e)</b> False. <b>(f)</b> True.</p>`],
 ['Why it makes sense', R`<p>The pattern: properties that go <em>forward</em> along continuous maps (connectedness) give "true"; claims that one property forces an unrelated one (metrizable ⇒ connected, open ⇒ continuous, part connected ⇒ whole connected) give "false", and a small or standard space breaks them.</p>`]]);

hubM('mt2-q6', [
 ['How the terms are used', R`<p>A <b>partition</b> ([[partition]]) of $X$ is a collection of subsets that are <b>nonempty</b>, <b>pairwise disjoint</b>, and whose <b>union is $X$</b>: every point lies in exactly one of them (Munkres §3). <b>Connected</b> ([[connected]]): no two disjoint nonempty open sets cover $X$. Part (b) says a connected space cannot be cut into more than one open piece.</p>`],
 ['Work-through', R`<div class="wk"><h4>(a) The definition</h4><p>$\mathcal D$ is a partition of $X$ if each $D\in\mathcal D$ is nonempty, any two distinct members of $\mathcal D$ are disjoint, and $\bigcup_{D\in\mathcal D}D=X$.</p>
<h4>(b) The idea</h4><p>If the partition had two or more pieces, take one piece on one side and all the others together on the other side. Both sides are open (unions of open sets), disjoint (pieces of a partition do not overlap), nonempty, and they cover $X$: a separation. Connectedness forbids that, so there is only one piece, and it must be $X$.</p>
<h4>(b) Writing it carefully</h4><p>Assume $X\ne\varnothing$, so $\mathcal D$ has at least one member $D_0$. Let $V=\bigcup_{D\in\mathcal D,\,D\ne D_0}D$. Then $D_0$ and $V$ are open, $D_0\cap V=\varnothing$ (distinct members are disjoint), and $D_0\cup V=X$ (the members cover $X$). $D_0$ is nonempty. If $V$ were nonempty, $D_0,V$ would be a separation of $X$; so $V=\varnothing$. Every member is nonempty, so there are no members other than $D_0$: $\mathcal D=\{D_0\}$, and since the union is $X$, $D_0=X$. $\blacksquare$</p>
<h4>A remark on the empty space</h4><p>If $X=\varnothing$, its only partition is the empty collection, which is not $\{X\}=\{\varnothing\}$. The statement is meant for nonempty $X$; one line saying "assume $X\ne\varnothing$" covers it.</p></div>`],
 ['Clean solution', R`<p><b>(a)</b> $\mathcal D$ is a partition of $X$ if its members are nonempty, any two distinct members are disjoint, and their union is $X$.</p>
<p><b>(b)</b> Let $X\ne\varnothing$ be connected and $\mathcal D$ a partition of $X$ into open sets. Choose $D_0\in\mathcal D$ and let $V=\bigcup\{D\in\mathcal D: D\ne D_0\}$. Then $V$ is open (a union of open sets), $D_0\cap V=\varnothing$, and $D_0\cup V=X$. Since $D_0\ne\varnothing$ and $X$ is connected, $V=\varnothing$. As every member of $\mathcal D$ is nonempty, $\mathcal D$ has no member other than $D_0$, so $\mathcal D=\{D_0\}$ and $D_0=\bigcup\mathcal D=X$. Hence $\mathcal D=\{X\}$. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>This is [[hw8-q1]] in another form: a partition into open sets is a way of colouring $X$ with each colour region open, and a connected space admits only one colour. With two pieces it is exactly a separation.</p>`]]);
// ===== How to approach a problem: the routine, the whole picture, and a drill on first moves
A['approach'] = {title: 'How to approach a problem', kind: 'idea', where: 'Start here', pre: ['describing-by-structure'],
  lede: 'Most proofs in this course are found the same way: read the shape of the claim, name the spaces and their open sets, unwind the goal and the hypotheses into definitions, test an example, then write the first and last lines before the middle.',
  sections: [
  ['Why a routine', R`<p>A problem in topology rarely needs a clever idea at the start. It needs the statement turned into something concrete enough to act on. Almost every statement is made of defined words (closed, Hausdorff, continuous, quotient map), and each defined word, unwound, says exactly what has to be produced. The routine below does that unwinding in a fixed order, so that the first move is never a blank page. The clever step, when there is one, comes late, and it is usually small: which radius, which box, which set.</p>`],
  ['1. Read the logical shape', R`<p>The grammar of the claim fixes the first line of the proof.</p>
<table><tr><th>The claim says</th><th>The proof starts</th></tr>
<tr><td>"for every $x$ …", "every $U$ …"</td><td>"Let $x$ be arbitrary." Keep it arbitrary: never pick a convenient one.</td></tr>
<tr><td>"there exists …"</td><td>Construct the object and say what it is; then check it works.</td></tr>
<tr><td>"$P$ if and only if $Q$"</td><td>Two proofs, $(\Rightarrow)$ and $(\Leftarrow)$, each with its own routine.</td></tr>
<tr><td>"$A=B$", "$A\subseteq B$"</td><td>Take an element of the left side and show it lies in the right ([[m-set-equality]]).</td></tr>
<tr><td>"need not", "show by example", "is not"</td><td>One counterexample, checked in full ([[m-counterexample]]).</td></tr>
<tr><td>"determine whether"</td><td>Decide first by testing; then either prove it or give a counterexample.</td></tr></table>
<p>Many quantifiers are hidden inside definitions. "$f$ is continuous" hides "for every open $V$"; "$X$ is Hausdorff" hides "for every pair $x\neq y$"; "$C$ is closed" hides "for every point outside $C$". Bring them to the surface: they decide what the first line names.</p>`],
  ['2. Name the spaces and their open sets', R`<p>Before using any open set, know what the open sets are. For each space in the problem ask: what are its points, which topology does it carry, and what does a basic open set look like there? Draw it when you can.</p>
<ul><li>A subspace $Y\subseteq X$: the sets $Y\cap U$, $U$ open in $X$ ([[subspace-topology]]).</li>
<li>A product $X\times Y$: unions of boxes $U\times V$ ([[product-topology]]).</li>
<li>A quotient $X/{\sim}$: the sets whose preimage is open upstairs ([[quotient-topology]]).</li>
<li>A metric space: unions of balls ([[ball]]).</li>
<li>A finite space: the list of open sets itself ([[m-finite]]).</li></ul>
<p>Most errors in this course come from using the wrong open sets: treating a subspace's open sets as open in the big space, or a quotient's as images of open sets.</p>`],
  ['3. Unwind the goal', R`<p>Replace the conclusion by its definition, and keep replacing until it says what you must <em>produce</em>.</p>
<ul><li>"$X/{\sim}$ is Hausdorff" → for distinct points $[x]\neq[y]$, open sets $U\ni[x]$, $V\ni[y]$ with $U\cap V=\varnothing$ → (by the quotient topology) two disjoint, saturated, open sets in $X$, one containing each class.</li>
<li>"$C$ is closed" → $X\setminus C$ is open → every point outside $C$ has a basic open set around it that misses $C$.</li>
<li>"$f$ is continuous" → for each open $V$ (it is enough to take each basis element), $f^{-1}(V)$ is open.</li></ul>
<p>Then write the <b>last line</b> of the proof now, for example: "Hence $U$ and $V$ are disjoint open sets containing $[x]$ and $[y]$, so $X/{\sim}$ is Hausdorff." The proof is whatever connects the first line to it.</p>`],
  ['4. Unwind the hypotheses', R`<p>Do the same for what you are given, and write down what each hypothesis hands you.</p>
<ul><li>"$A$ is closed" gives: each $x\notin A$ has a basic open set (in a metric space, a ball) missing $A$.</li>
<li>"$f$ is continuous" gives: preimages of open sets are open.</li>
<li>"$X$ is Hausdorff" gives: disjoint neighbourhoods for any two points you name.</li></ul>
<p>A proof is usually the goal's demand met by the hypotheses' supply. If at the end a hypothesis has not been used, either the statement is more general than needed or, more often, that hypothesis is where the missing step lives.</p>`],
  ['5. Choose the form of each definition', R`<p>Most notions have several equivalent forms, and the right one makes the proof short.</p>
<ul><li>Closed: complement open; contains its limit points; equals its closure.</li>
<li>In the closure: every neighbourhood, or every basic neighbourhood, meets the set ([[closure-test]]).</li>
<li>Continuous: preimages of open sets; of closed sets; of basis elements; in metric spaces, ε–δ ([[continuity-equivalents]], [[epsilon-delta]]).</li></ul>
<p>Match the form to the supply. Hypotheses about complements and closed sets suggest the closed-set forms; hypotheses about individual points suggest the neighbourhood forms. The full table is in [[whole-picture]].</p>`],
  ['6. Test before proving', R`<p>Try the statement on a picture or a standard space before writing: $\mathbb R$, the plane, a three-point space, $\mathbb R_\ell$ ([[ex-lower-limit]]), an indiscrete space ([[ex-indiscrete]]). The test does one of two things. It shows why the statement is true (the picture often contains the proof: which ball, which radius, which box), or it produces a counterexample. For a "determine whether" question, this step is where the answer comes from.</p>`],
  ['7. Write it', R`<p>Write the first line (from the shape: "Let $x\in X\setminus C$"), the last line (from the unwound goal), and fill the middle with the hypotheses' supply. Name every object when it first appears and say where it comes from: "Since $A$ is closed, $X\setminus A$ is open, so there is $r\gt0$ with $B(x,r)\cap A=\varnothing$."</p>`],
  ['When you are stuck', R`<ul><li>Find the hypothesis you have not used, and unwind it again.</li>
<li>Switch to another form of the definition (step 5).</li>
<li>Reduce to basis elements: to show a set is open, show each of its points has a basis element inside it.</li>
<li>Try the special case: $\mathbb R$, or a finite space where everything can be listed.</li>
<li>Redraw the picture with the specific points named.</li>
<li>Look up the method for the goal in [[whole-picture]] (Goal → method).</li></ul>`],
  ['A demonstration', R`<p><b>Problem</b> (Munkres §17, Exercise 13). Show that $X$ is Hausdorff if and only if the diagonal $\Delta=\{(x,x):x\in X\}$ is closed in $X\times X$.</p>
<p><b>Shape.</b> "If and only if": two implications.</p>
<p><b>Spaces.</b> $X\times X$ with the product topology, so basic open sets are boxes $U\times V$. In the plane, $\Delta$ is the line $y=x$.</p>
<p><b>Unwind the goal.</b> $\Delta$ closed means its complement $\{(x,y):x\neq y\}$ is open, which means every $(x,y)$ with $x\neq y$ lies in a box $U\times V$ that misses $\Delta$. And a box misses $\Delta$ exactly when no point lies in both $U$ and $V$, that is, when $U\cap V=\varnothing$.</p>
<p><b>Compare with the hypothesis.</b> "A box $U\times V$ around $(x,y)$ missing $\Delta$" now reads word for word as "disjoint open sets $U\ni x$ and $V\ni y$", which is Hausdorff. Once both sides are unwound, the two directions are the same translation read forwards and backwards.</p>
<p><b>Write it.</b> $(\Rightarrow)$ Let $(x,y)\notin\Delta$, so $x\neq y$. Hausdorff gives open $U\ni x$, $V\ni y$ with $U\cap V=\varnothing$. Then $U\times V$ is open, contains $(x,y)$, and misses $\Delta$; so the complement of $\Delta$ is open and $\Delta$ is closed. $(\Leftarrow)$ Let $x\neq y$. Then $(x,y)$ lies in the open complement of $\Delta$, so some box $U\times V$ around it misses $\Delta$, which means $U\cap V=\varnothing$: $U$ and $V$ separate $x$ and $y$.</p>`],
  ['Practise', R`<p>[[first-moves]] drills the first three steps on short problems, with the reasoning for each choice.</p>`]]};

A['whole-picture'] = {title: 'The whole picture: spaces, constructions, maps, properties', kind: 'idea', where: 'Start here', pre: ['defining-by-maps', 'approach'],
  lede: 'Everything in the course is one of four things: a space, a way of building spaces, a kind of map, or a property; most problems ask how two of them interact.',
  sections: [
  ['The four kinds of thing', R`<ul><li><b>Spaces</b>: a set with a topology, usually given by a basis. The ones that recur: $\mathbb R$, $\mathbb R_\ell$, $\mathbb R_K$, finite spaces, metric spaces, $\prod\{0,1\}$ ([[standard-topologies]], [[ex-real-line]]).</li>
<li><b>Constructions</b>: new spaces from old. Subspace, product, quotient; also the metric and order topologies, which build a topology from extra structure.</li>
<li><b>Maps</b>: continuous, open, closed, quotient, homeomorphism, embedding. Each says what a function does to open sets.</li>
<li><b>Properties</b>: Hausdorff, $T_1$, connected, compact, metrizable, first countable. Each is a statement made with open sets only, so homeomorphisms keep it.</li></ul>
<p>A typical problem names two of these and asks how they interact. "Is the quotient Hausdorff?" is a construction against a property. "Is the projection open?" is a construction against a kind of map. "Is the continuous image of a connected space connected?" is a map against a property. Recognizing which interaction is being asked about tells you which theorems and which examples are relevant before you start.</p>`],
  ['Constructions and their maps', R`<p>Each construction comes with a map, and its topology is chosen to make that map continuous in the most economical way ([[defining-by-maps]]).</p>
<table><tr><th>Construction</th><th>Its map</th><th>Topology</th><th>Open sets</th></tr>
<tr><td>Subspace $Y\subseteq X$</td><td>inclusion $i:Y\to X$</td><td>coarsest making $i$ continuous</td><td>$Y\cap U$</td></tr>
<tr><td>Product $X\times Y$</td><td>projections $\pi_1,\pi_2$</td><td>coarsest making both continuous</td><td>unions of boxes $U\times V$</td></tr>
<tr><td>Quotient $X/{\sim}$</td><td>$p:X\to X/{\sim}$</td><td>finest making $p$ continuous</td><td>$U$ with $p^{-1}(U)$ open</td></tr></table>
<p>Two consequences settle most continuity questions about constructions. A map <em>into</em> a product is continuous exactly when each coordinate is ([[maps-into-products]]), and a map into a subspace exactly when it is continuous into the big space. A map <em>out of</em> a quotient is continuous exactly when its composite with $p$ is, so it is tested upstairs ([[maps-out-of-quotients]]).</p>`],
  ['Pulling back and pushing forward', R`<table><tr><th>Notion</th><th>Direction</th><th>Condition</th></tr>
<tr><td>[[continuous|Continuous]]</td><td>back</td><td>$f^{-1}$(open) is open</td></tr>
<tr><td>[[open-map|Open map]]</td><td>forward</td><td>$f$(open) is open</td></tr>
<tr><td>Closed map</td><td>forward</td><td>$f$(closed) is closed</td></tr>
<tr><td>[[quotient-map|Quotient map]]</td><td>both</td><td>surjective, and $U$ open $\iff f^{-1}(U)$ open</td></tr>
<tr><td>[[homeomorphism|Homeomorphism]]</td><td>both</td><td>bijective, continuous, with continuous inverse</td></tr>
<tr><td>[[embedding|Embedding]]</td><td>both, onto the image</td><td>a homeomorphism onto $f(X)$</td></tr></table>
<p>Preimages respect every set operation ($f^{-1}(A\cap B)=f^{-1}(A)\cap f^{-1}(B)$, and the same for unions and complements); images do not ($f(A\cap B)$ can be smaller than $f(A)\cap f(B)$). That is why continuity is the basic notion and openness of a map has to be checked case by case. Useful links between the rows: a continuous surjection that is open, or closed, is a quotient map (§22); a continuous open bijection is a homeomorphism; and for a bijection, open and closed are the same condition ([[hw7-q6]]).</p>`],
  ['Which properties survive which constructions', R`<table><tr><th>Property</th><th>Subspace</th><th>Product</th><th>Quotient</th><th>Image</th></tr>
<tr><td>[[hausdorff|Hausdorff]]</td><td>yes</td><td>yes</td><td>not always</td><td>no</td></tr>
<tr><td>[[t1|$T_1$]]</td><td>yes</td><td>yes</td><td>iff every class is closed</td><td>no</td></tr>
<tr><td>[[connected|Connected]]</td><td>no</td><td>yes</td><td>yes</td><td>yes</td></tr>
<tr><td>[[compact|Compact]]</td><td>if closed</td><td>yes</td><td>yes</td><td>yes</td></tr>
<tr><td>[[metrizable|Metrizable]]</td><td>yes</td><td>countable</td><td>not always</td><td>no</td></tr>
<tr><td>[[first-countable|First countable]]</td><td>yes</td><td>countable</td><td>not always</td><td>no</td></tr></table>
<p>"Image" means the image under a continuous surjection; "if closed" means closed subspaces; "countable" means countable products.</p>
<p>The standard examples behind the "not always" and "no" entries: $\mathbb R/(0,1)$ ([[ex-crush-open]]) and the line with two origins ([[ex-two-origins]]) are quotients of Hausdorff spaces that are not Hausdorff; the quotient in [[hw6-q3]] is Hausdorff but, by the remark there, not metrizable; two points of $\mathbb R$ form a subspace of a connected space that is not connected; any map onto an indiscrete space is continuous, so continuous images lose separation.</p>
<p>How to use the table: when a problem asks whether a construction has a property, a "yes" means look for a proof, and the theorem behind it is the model; a "not always" means look for a counterexample, and the standard example is the one to adapt. For quotients, failures happen at glued points, so check neighbourhoods of the glued classes first ([[crushing-a-set]]). A positive quotient result needs a hypothesis that controls the gluing, such as crushing a <em>closed</em> set ([[hw7-q1]]).</p>`],
  ['Goal → method', R`<table><tr><th>You are asked to show</th><th>Method</th></tr>
<tr><td>a collection is a topology</td><td>[[m-topology]]</td></tr>
<tr><td>two sets or two topologies are equal</td><td>[[m-set-equality]]</td></tr>
<tr><td>one topology is finer than another</td><td>[[m-compare]]</td></tr>
<tr><td>a set is open</td><td>[[m-open]]</td></tr>
<tr><td>a set is closed</td><td>[[m-closed]]</td></tr>
<tr><td>what a closure is</td><td>[[m-closure]]</td></tr>
<tr><td>a space is Hausdorff</td><td>[[m-hausdorff]]</td></tr>
<tr><td>a function is continuous</td><td>[[m-continuous]]</td></tr>
<tr><td>a map into a product is continuous</td><td>[[m-product-maps]]</td></tr>
<tr><td>a map is open, or closed</td><td>[[m-open-map]]</td></tr>
<tr><td>a map is a quotient map</td><td>[[m-quotient-map]]</td></tr>
<tr><td>a map is not a quotient map</td><td>[[m-not-quotient]]</td></tr>
<tr><td>something about a quotient space</td><td>[[m-quotient]]</td></tr>
<tr><td>a space is (not) connected</td><td>[[m-connected]]</td></tr>
<tr><td>a space is (not) compact</td><td>[[m-compact]]</td></tr>
<tr><td>something fails, or "need not" hold</td><td>[[m-counterexample]]</td></tr>
<tr><td>a computation in a finite space</td><td>[[m-finite]]</td></tr>
<tr><td>true or false, quickly</td><td>[[m-true-false]]</td></tr></table>`],
  ['Switching between forms of a definition', R`<table><tr><th>Notion</th><th>Equivalent forms</th></tr>
<tr><td>$U$ is open</td><td>$U\in\mathcal T$; each $x\in U$ has a basis element $B$ with $x\in B\subseteq U$; $U$ is a union of basis elements</td></tr>
<tr><td>$C$ is closed</td><td>$X\setminus C$ is open; $C$ contains all its limit points; $C=\overline C$</td></tr>
<tr><td>$x\in\overline A$</td><td>every open set containing $x$ meets $A$; every basis element containing $x$ meets $A$; in a metric space, some sequence in $A$ converges to $x$</td></tr>
<tr><td>$f$ is continuous</td><td>preimages of open sets are open; preimages of closed sets are closed; preimages of basis (or subbasis) elements are open; $f(\overline A)\subseteq\overline{f(A)}$ for all $A$; for each $x$ and each neighbourhood $V$ of $f(x)$ there is a neighbourhood $U$ of $x$ with $f(U)\subseteq V$; in metric spaces, ε–δ</td></tr>
<tr><td>$X$ is Hausdorff</td><td>distinct points have disjoint neighbourhoods; the diagonal is closed in $X\times X$</td></tr>
<tr><td>$p$ is a quotient map</td><td>surjective, and $U$ open $\iff p^{-1}(U)$ open; the same with closed sets; open sets of the target correspond to saturated open sets upstairs</td></tr></table>
<p>The first form in each row is the definition; the others are theorems ([[continuity-equivalents]], [[closure-test]], [[closure-limit-points]], [[sequence-lemma]], and the demonstration in [[approach]]). A short proof is usually a matter of choosing the form whose ingredients you already have.</p>`],
  ['How the chapters fit', R`<p>Chapter 1 supplies the language: sets, functions, relations, products. Chapter 2 builds the setting: spaces and bases, the three constructions, closed sets and limits, continuous maps, separation, metrics. Chapter 3 studies connectedness and compactness, the two properties that make the intermediate and extreme value theorems of calculus true in general; both are defined with open sets alone and both are carried forward by continuous maps. The later chapters (the fundamental group, covering spaces, surfaces) tell spaces apart by the loops they contain. At every stage the question is the same: what can be said using only open sets, and what survives continuous maps.</p>`]]};

A['first-moves'] = {title: 'Practice: first moves', kind: 'idea', where: 'Start here', pre: ['approach'],
  lede: 'Short drills on the start of a proof: for each problem, read its shape, unwind the goal, and choose the first line; then compare with the reasoning.',
  sections: [['The drill', R`<div id="drill"></div>`],
  ['How to use it', R`<p>Answer each stage before reading the explanation. The point is the opening, not the whole proof: when the shape, the unwound goal and the first line are right, the rest usually follows by matching the hypotheses to the goal. Each problem ends with an outline of the proof and links to its concepts. The routine behind the stages is in [[approach]].</p>`]]};

// each drill: statement, source, links, three stages [question, options, correct index, explanation], outline
var DRILL = [
 {q: R`Show that $X$ is Hausdorff if and only if the diagonal $\Delta=\{(x,x):x\in X\}$ is closed in $X\times X$.`, src: 'Munkres §17, Ex. 13', links: ['hausdorff', 'product-topology', 'closed-set'],
  st: [[R`What is the shape of the claim?`, [R`One example`, R`Two implications, each proved on its own`, R`An element chase between two sets`, R`A construction`], 1, R`"If and only if" is two claims: Hausdorff gives $\Delta$ closed, and $\Delta$ closed gives Hausdorff. Each direction gets its own first and last line.`],
   [R`What does "$\Delta$ is closed" unwind to?`, [R`Every point of $\Delta$ has a box inside $\Delta$`, R`Each $(x,y)$ with $x\neq y$ has a box $U\times V$ around it missing $\Delta$`, R`$\Delta$ has a limit point`, R`$\Delta$ is a product of closed sets`], 1, R`Closed means the complement is open; open in $X\times X$ means a basic box around each point. A box misses $\Delta$ exactly when $U\cap V=\varnothing$, which is the Hausdorff condition in disguise.`],
   [R`For $(\Rightarrow)$, which first line?`, [R`Let $(x,x)\in\Delta$.`, R`Let $(x,y)\in X\times X$ with $x\neq y$.`, R`Suppose $\Delta$ is not closed.`, R`Let $U$ and $V$ be open in $X$.`], 1, R`The goal is about points of the complement, so the proof starts by naming one. Starting on $\Delta$ itself goes nowhere: closedness is shown from outside.`]],
  out: R`$(\Rightarrow)$ Hausdorff gives disjoint open $U\ni x$, $V\ni y$; then $U\times V$ contains $(x,y)$ and misses $\Delta$. $(\Leftarrow)$ For $x\neq y$, the open complement contains a box $U\times V$ around $(x,y)$; missing $\Delta$ means $U\cap V=\varnothing$.`},
 {q: R`Show that in a Hausdorff space every finite set is closed.`, src: 'Munkres Theorem 17.8', links: ['t1', 'hausdorff', 'closed-set'],
  st: [[R`What is the shape, and how can it be reduced?`, [R`For every finite set; since finite unions of closed sets are closed, it is enough to show each one-point set is closed`, R`There exists a closed finite set`, R`A counterexample`, R`If and only if`], 0, R`A finite set is a finite union of one-point sets, and a finite union of closed sets is closed. So the real claim is: each $\{x\}$ is closed.`],
   [R`What is the cleanest way to show $\{x\}$ is closed?`, [R`Show $\{x\}$ is open`, R`Show its complement is open: each $y\neq x$ has a neighbourhood missing $x$`, R`Show $x$ is a limit point of $\{x\}$`, R`Show every sequence converges to $x$`], 1, R`Closed via the complement. The hypothesis (Hausdorff) is about pairs of points, and so is this form of the goal: a point $y$ outside $\{x\}$, and the point $x$.`],
   [R`Which first line?`, [R`Let $y\in X$ with $y\neq x$.`, R`Let $y=x$.`, R`Let $U$ be an open set containing $x$.`], 0, R`Name a point of the complement. Hausdorff then gives disjoint $U\ni x$ and $V\ni y$, and $V$ is a neighbourhood of $y$ missing $x$.`]],
  out: R`For $y\neq x$, Hausdorff gives $V\ni y$ with $x\notin V$. So $X\setminus\{x\}$ is the union of such $V$, hence open, and $\{x\}$ is closed. A finite set is a finite union of such sets, so it is closed.`},
 {q: R`Show that if $A\subseteq B$, then $\overline A\subseteq\overline B$.`, src: 'Closure basics', links: ['closure', 'closure-test'],
  st: [[R`What is the shape?`, [R`An element chase: take $x$ in the left side and show it is in the right`, R`A counterexample`, R`If and only if`, R`Construct a set`], 0, R`An inclusion of sets is proved point by point. (There is also a one-line route; see the outline.)`],
   [R`What does "$x\in\overline B$" unwind to?`, [R`$x\in B$`, R`Every open set containing $x$ meets $B$`, R`$x$ is a limit point of $B$`, R`$B$ is closed`], 1, R`The neighbourhood form of closure (Theorem 17.5). "$x\in B$" is too strong, and "limit point" leaves out the points of $B$ itself.`],
   [R`Which first line?`, [R`Let $x\in\overline A$, and let $U$ be an open set containing $x$.`, R`Let $x\in B$.`, R`Suppose $\overline A=\overline B$.`], 0, R`Start with a point of the left side, and name the arbitrary neighbourhood that the unwound goal quantifies over.`]],
  out: R`$U$ meets $A$ because $x\in\overline A$; since $A\subseteq B$, $U$ meets $B$; so $x\in\overline B$. One-line alternative: $\overline B$ is a closed set containing $B\supseteq A$, and $\overline A$ is the smallest closed set containing $A$.`},
 {q: R`Let $f:X\to Y$ be continuous. Show that $f(\overline A)\subseteq\overline{f(A)}$ for every $A\subseteq X$.`, src: 'Munkres Theorem 18.1', links: ['continuity-equivalents', 'closure-test', 'image-preimage'],
  st: [[R`What is the shape?`, [R`For every $A$, an inclusion: take a point of $f(\overline A)$, which has the form $f(x)$ with $x\in\overline A$`, R`A counterexample`, R`There exists $A$`], 0, R`A point of an image is $f$ of something. Naming that something, $x\in\overline A$, puts the hypothesis about $\overline A$ into play.`],
   [R`What does "$f(x)\in\overline{f(A)}$" unwind to?`, [R`Every open $V$ containing $f(x)$ meets $f(A)$`, R`$f(x)\in f(A)$`, R`$f$ is a closed map`], 0, R`The neighbourhood form of closure again, now in $Y$.`],
   [R`Which first line?`, [R`Let $x\in\overline A$, and let $V$ be open in $Y$ with $f(x)\in V$.`, R`Let $y\in\overline{f(A)}$.`, R`Let $V$ be open in $X$.`], 0, R`Point of the left side, then the arbitrary neighbourhood. The next move is to pull $V$ back: continuity is the only hypothesis, and it speaks about preimages.`]],
  out: R`$f^{-1}(V)$ is open (continuity) and contains $x$, so it meets $A$ at some $a$ (as $x\in\overline A$). Then $f(a)\in V\cap f(A)$, so $V$ meets $f(A)$.`},
 {q: R`Show that the lower limit topology on $\mathbb R$ is strictly finer than the standard topology.`, src: 'Munkres Lemma 13.4', links: ['lemma-13-3', 'ex-lower-limit', 'finer-coarser', 'm-compare'],
  st: [[R`What is the shape?`, [R`Two claims: an inclusion of topologies, and one set showing the inclusion is strict`, R`A single example`, R`An element chase inside $\mathbb R$`, R`If and only if`], 0, R`"Finer" is $\mathcal T\subseteq\mathcal T_\ell$; "strictly" adds that some $\ell$-open set is not standard-open, which is shown by one example.`],
   [R`How are two topologies given by bases compared?`, [R`List all their open sets`, R`Lemma 13.3: for each basis element $(a,b)$ and each $x$ in it, find $[c,d)$ with $x\in[c,d)\subseteq(a,b)$`, R`Show each $[a,b)$ is a union of intervals $(c,d)$`, R`Show $\mathbb R_\ell$ is Hausdorff`], 1, R`Comparing bases point by point is the standard tool. The third option is the wrong direction: it would show the standard topology is finer, which is false.`],
   [R`Which first line?`, [R`Let $x\in(a,b)$.`, R`Let $x\in[a,b)$.`, R`Suppose $[0,1)$ is open in $\mathbb R$.`], 0, R`Start inside a basis element of the coarser topology. Then $[x,b)$ contains $x$ and lies in $(a,b)$.`]],
  out: R`For $x\in(a,b)$, the set $[x,b)$ works, so $\mathcal T\subseteq\mathcal T_\ell$. Strictness: $[0,1)$ is $\ell$-open, but no interval $(c,d)$ with $0\in(c,d)$ lies inside $[0,1)$, so it is not standard-open.`},
 {q: R`Show that $\overline{A\cap B}$ need not equal $\overline A\cap\overline B$.`, src: 'Munkres §17, Ex. 8', links: ['closure', 'm-counterexample'],
  st: [[R`What is the shape?`, [R`An element chase both ways`, R`One counterexample, checked in full`, R`A proof by contradiction`, R`If and only if`], 1, R`"Need not" denies a general statement; one example in which it fails is the whole answer.`],
   [R`What must the example show?`, [R`That $\overline{A\cap B}$ is bigger than $\overline A\cap\overline B$`, R`A point of $\overline A\cap\overline B$ that is not in $\overline{A\cap B}$ (the inclusion $\subseteq$ always holds)`, R`That $A\cap B=\varnothing$ always`], 1, R`$\overline{A\cap B}\subseteq\overline A\cap\overline B$ is always true, since $A\cap B$ lies in each of $A$ and $B$. So a failure must come from the other side.`],
   [R`Which first line?`, [R`Take $A=(0,1)$ and $B=(1,2)$ in $\mathbb R$.`, R`Let $x\in\overline{A\cap B}$.`, R`Take $A=B$.`], 0, R`Two sets that share an edge but no points. ($\mathbb Q$ and the irrationals work too.)`]],
  out: R`$A\cap B=\varnothing$, so $\overline{A\cap B}=\varnothing$; but $\overline A\cap\overline B=[0,1]\cap[1,2]=\{1\}$.`},
 {q: R`Let $Y$ be closed in $X$, and let $A$ be closed in the subspace $Y$. Show that $A$ is closed in $X$.`, src: 'Munkres Theorem 17.3', links: ['subspace-topology', 'closed-set'],
  st: [[R`Which hypothesis do you unwind first?`, [R`"$A$ is closed in $Y$": $A=Y\cap C$ for some $C$ closed in $X$`, R`"$Y$ is closed in $X$": $X\setminus Y$ is open`, R`"$A\subseteq X$"`], 0, R`The unfamiliar hypothesis is the one about the subspace; Theorem 17.2 turns "closed in $Y$" into a statement about closed sets of $X$, where the goal lives.`],

// where a concept sits among the four kinds of thing
// build a quotient by gluing; show two spaces are (not) homeomorphic  (11/10/26)
Object.assign(A, {
'm-build-quotient': {title: 'Build a quotient space by gluing', kind: 'method', where: '§22', pre: ['relation-equivalence', 'equivalence-class', 'quotient-topology'],
  lede: R`Six steps from a space and a gluing rule to a new space: start, choose the relation, sort into classes, merge each class into a point, map down, give it the quotient topology.`,
  steps: [
    [R`<b>Start</b> with a space $X$.`, R`Gluing never invents points; everything in the quotient comes from $X$.`],
    [R`<b>Choose</b> an [[relation-equivalence|equivalence relation]] $\sim$ on $X$: for each pair of points it answers yes or no to "should these count as the same point?"`, R`The relation only says <em>which</em> points to glue. It is chosen (by hand, or by a condition, as in [[mt2-q3]]). It must be reflexive, symmetric and transitive so that the points fall into separate classes.`],
    [R`<b>Sort</b> the points into classes: $[x]=\{a\in X: a\sim x\}$.`, R`Each class is one group of points to be glued together ([[equivalence-class]]).`],
    [R`<b>Merge</b> each class into one point. The new set is $X/{\sim}=\{[x]: x\in X\}$.`, R`A point of the quotient is a class, a subset of $X$. Read $X/{\sim}$ as "$X$ mod tilde". Munkres writes $X^*$ for the same set, viewed as a [[partition]].`],
    [R`<b>Map down</b> with the quotient map $p:X\to X/{\sim}$, $p(x)=[x]$.`, R`$p$ sends each point to its class. It is surjective; it is injective only if nothing was glued.`],
    [R`<b>Give it the topology:</b> $W\subseteq X/{\sim}$ is open iff $p^{-1}(W)$ is open in $X$.`, R`The [[quotient-topology]]. To test a set downstairs, lift it: $p^{-1}(W)$ is every original point glued into $W$.`]],
  sections: [
    ['Worked: the ends of a segment', R`<p><b>1. Start.</b> $X=[0,1]$ with the subspace topology from $\mathbb R$.</p>
<p><b>2. Choose.</b> $a\sim b$ iff $a=b$ or $\{a,b\}=\{0,1\}$. Every point is related to itself, and $0$ and $1$ to each other; nothing else.</p>
<p><b>3. Sort.</b> $[0]=[1]=\{0,1\}$, and $[t]=\{t\}$ for $0\lt t\lt1$.</p>
<p><b>4. Merge.</b> One two-point class and one single-point class for each interior point:</p>
$$X/{\sim}=\big\{\{0,1\}\big\}\cup\big\{\{t\}: 0\lt t\lt1\big\}.$$
<p>The glued point is the element $q=\{0,1\}$.</p>
<p><b>5. Map down.</b></p>
$$p(t)=\begin{cases}\{0,1\} & t=0 \text{ or } t=1,\\ \{t\} & 0\lt t\lt1.\end{cases}$$
<p>So $p(0)=p(1)=q$, the only place two points share an image.</p>
<p><b>6. Topology.</b> If $W$ does not contain $q$, then $W=\{\{t\}: t\in O\}$ with $O\subseteq(0,1)$ and $p^{-1}(W)=O$: open exactly when $O$ is, so nothing changes away from the glued point. If $W$ contains $q$, then $p^{-1}(W)$ contains both $0$ and $1$, and to be open in $[0,1]$ it must contain room around each: $p^{-1}(W)\supseteq[0,\varepsilon)\cup(1-\varepsilon,1]$ for some $\varepsilon\gt0$. An open set around $q$ reaches in from both ends.</p>
<p><b>Result.</b> A circle, up to [[homeomorphism]]: $t\mapsto(\cos2\pi t,\sin2\pi t)$ sends $0$ and $1$ to the same point, so it passes to the quotient ([[maps-out-of-quotients]]). See [[gluing-examples]].</p>`],
    ['Picture', R`<p>Draw $X$ on top ("upstairs") and $X/{\sim}$ underneath ("downstairs"), with arrows for $p$ from each point to its class. For the segment: bend it until the ends meet; the two endpoints become the single point $q$. "What lies over" a set $W$ downstairs is $p^{-1}(W)$, the upstairs points whose arrows land in $W$. (Intuition, beyond Munkres.)</p>`],
    ['A set that is not open', R`<p>$W=p([0,\varepsilon))$ contains $q$ but reaches in from one side only. Lifting it drags in the other endpoint: $p^{-1}(W)=[0,\varepsilon)\cup\{1\}$, which is not open in $[0,1]$ because every interval around $1$ contains points below $1$. So $W$ is not open. The set $[0,\varepsilon)$ was open upstairs but not [[saturated]]: it held $0$ without $1$.</p>`],
    ['The same steps in MT2 Q3', R`<p>Start with any space $X$; choose $x\sim y$ iff $f(x)=f(y)$ for every continuous $f:X\to[0,1]$; steps 3 to 6 are as above. The quotient merges exactly the points no such map can tell apart, and [[mt2-q3]] (b) shows it is Hausdorff.</p>`],
    ['Next', R`<p>Once the quotient is built, [[m-quotient]] shows how to work in it: test openness by lifting, build open sets from saturated ones, define maps out of it.</p>`]]},
'm-homeomorphic': {title: 'Show two spaces are homeomorphic, or not', kind: 'method', where: '§18', pre: ['homeomorphism', 'continuous'],
  lede: R`To show they are the same space, write down a bijection and check continuity both ways. To show they are different, find a topological property one has and the other lacks.`,
  steps: [
    [R`<b>Guess the map.</b> Picture how to deform one space into the other (stretch, bend, glue) and write the deformation as a formula $h:X\to Y$.`, R`Stretching a circle into an oval: $h(\cos\theta,\sin\theta)=(a\cos\theta,b\sin\theta)$.`],
    [R`<b>Check it is a bijection.</b> Each point of $Y$ is hit by exactly one point of $X$; usually by writing down the inverse $h^{-1}$.`, R`A [[homeomorphism]] matches points one to one.`],
    [R`<b>Check $h$ is continuous.</b>`, R`Formulas built from continuous pieces are continuous; or use [[m-continuous]].`],
    [R`<b>Check $h^{-1}$ is continuous.</b> Do not skip this.`, R`A continuous bijection can still tear: $[0,1)\to S^1$, $t\mapsto(\cos2\pi t,\sin2\pi t)$ has a discontinuous inverse at $(1,0)$.`],
    [R`<b>To show two spaces are not homeomorphic,</b> find a property preserved by homeomorphisms that one space has and the other does not.`, R`Connectedness ([[connected]]), Hausdorff ([[hausdorff]]), and counts such as "how many pieces are left after removing one point".`]],
  sections: [
    ['Worked: circle and oval', R`<p>Let $S^1$ be the unit circle and $E=\{(x,y): x^2/a^2+y^2/b^2=1\}$ an oval, $a,b\gt0$. Define $h(x,y)=(ax,by)$.</p>
<p><b>Into $E$:</b> if $x^2+y^2=1$ then $(ax)^2/a^2+(by)^2/b^2=x^2+y^2=1$. <b>Inverse:</b> $h^{-1}(u,v)=(u/a,v/b)$, which lands back on $S^1$ by the same computation. So $h$ is a bijection. <b>Continuity both ways:</b> each coordinate of $h$ and of $h^{-1}$ is a constant times a coordinate, which is continuous ([[maps-into-products]]). So $S^1\cong E$. Size and shape are not topological: topology keeps only nearness.</p>`],
    ['Worked: circle and figure eight', R`<p>Remove any one point from a circle: one connected piece remains. Remove the crossing point of a figure eight: four pieces remain. A homeomorphism $h$ would restrict to a homeomorphism from the circle minus a point onto the figure eight minus $h$ of that point, and homeomorphisms preserve the number of [[components]]. Taking the point that $h$ sends to the crossing gives $1=4$, a contradiction. So they are not homeomorphic.</p>`],
    ['Common mistakes', R`<p>Checking only that $h$ is continuous; forgetting surjectivity; using a property, such as being bounded, that homeomorphisms do not preserve ($(-1,1)\cong\mathbb R$).</p>`]]}
});
A['homeomorphism'].sections = [
  ['Definition', R`<p>A bijection $f:X\to Y$ with $f$ and $f^{-1}$ both [[continuous|continuous]]. If one exists, $X$ and $Y$ are <b>homeomorphic</b>, written $X\cong Y$.</p>`],
  ['Examples', R`<p><b>Standard example:</b> a circle and an oval, $h(x,y)=(ax,by)$; worked in [[m-homeomorphic]]. Also $(-1,1)\cong\mathbb R$ via $x\mapsto x/(1-x^2)$, and [[ex-circle|an interval with its ends glued]] is a circle ([[m-build-quotient]]).</p><p><b>Contrast:</b> $[0,1)\to S^1$, $t\mapsto(\cos2\pi t,\sin2\pi t)$, is a continuous bijection whose inverse is not continuous: it tears the circle open at $(1,0)$. Points near $(1,0)$ from below come from $t$ near $1$, while $(1,0)$ itself comes from $t=0$.</p>`],
  ['Why it is defined this way', R`<p>A topology records only nearness ([[topology]]). A homeomorphism matches the points one to one <em>and</em> matches nearness in both directions, so every statement about open sets in $X$ translates into the same statement in $Y$. Continuity one way is not enough: it only says nearness is not torn going forward, and the contrast above shows the backward direction can still tear. Distance, size and shape are not preserved, so they are not topological; a circle and an oval are the same space.</p>`],
  ['What depends on it', R`<p>A <b>topological property</b> is one preserved by homeomorphisms: [[hausdorff|Hausdorff]], [[connected]], compact. Such properties are how spaces are told apart ([[m-homeomorphic]]). "This quotient is a circle" means "this quotient is homeomorphic to $S^1$" ([[gluing-examples]]).</p>`],
  ['Where it sits', R`<p>Homeomorphism is the notion of sameness in topology, as isomorphism is in algebra: the classification questions of the subject are questions about which spaces are homeomorphic.</p>`],
  ['History', R`<p>Henri Poincaré introduced the word (<em>homéomorphisme</em>) in his 1895 paper <em>Analysis Situs</em>, which founded algebraic topology. His maps were between manifolds and assumed some smoothness; the definition by continuity in both directions belongs to the later point-set setting of open sets built up by Hausdorff and others in the 1910s. Calling this "the same notion made general" is an interpretation of that development.</p><p class="foot">Sources: Poincaré, "Analysis Situs", <em>Journal de l'École Polytechnique</em> (1895); Wikipedia, "Homeomorphism" and "Analysis Situs (paper)". The date should be checked against a history of topology before being cited.</p>`]];
A['quotient-topology'].sections.splice(1, 0, ['Building one', R`<p>The whole construction, step by step with the segment-to-circle example written out: [[m-build-quotient]].</p>`]);
