// Labels used: Reading the definition · Why it is defined this way · Worked example · Non-example, and why it fails · Common confusions
var DEEP = {
'topology': [
  ['Reading the definition', R`<p><b>"A collection of subsets."</b> A topology is not a shape or a distance. It is a list: some subsets of $X$ are placed on the list and called open, the rest are not. Two different lists on the same set $X$ are two different spaces.</p>
<p><b>Axiom (1), $\varnothing$ and $X$ are open.</b> The empty set and the whole space are always on the list. Without this, statements like "the preimage of $Y$ is $X$, which is open" would fail for no good reason.</p>
<p><b>Axiom (2), any union is open.</b> If you have open sets, however many (finitely many, countably many, uncountably many), the set of points lying in at least one of them is open. Gluing open regions together keeps them open.</p>
<p><b>Axiom (3), finite intersections are open.</b> The points lying in all of finitely many open sets form an open set. Only finitely many: the condition is about shrinking a little, not infinitely.</p>`],
  ['Why it is defined this way', R`<p>In $\mathbb R$, a set is open when every point has some room around it inside the set. Unions keep that room (each point keeps the room it had). Intersections of two open sets keep it too (take the smaller of the two rooms). But infinitely many intersections can squeeze the room to nothing: $\bigcap_n(-\tfrac1n,\tfrac1n)=\{0\}$. The three axioms are exactly what survives when you forget distance and keep only "which sets have room".</p>
<p>So a topology records <em>nearness without measurement</em>: which points are close to which sets, and nothing more. Continuity, convergence, closure and connectedness can all be defined from that record alone.</p>`],
  ['Worked example', R`<p>$X=\{a,b,c\}$, $\mathcal T=\{\varnothing,\{a\},\{a,b\},X\}$.</p>
<ol><li>(1): $\varnothing$ and $X$ are listed. ✓</li><li>(2): every union of listed sets: $\{a\}\cup\{a,b\}=\{a,b\}$, and anything with $X$ gives $X$. All listed. ✓</li><li>(3): $\{a\}\cap\{a,b\}=\{a\}$; intersections with $X$ change nothing. All listed. ✓</li></ol>
<p>So $\mathcal T$ is a topology. In it, $a$ is "close to everything" in a sense: every open set containing $b$ or $c$ also contains $a$.</p>`],
  ['Non-example, and why it fails', R`<p>$\{\varnothing,\{a\},\{b\},X\}$ on $\{a,b,c\}$: the union $\{a\}\cup\{b\}=\{a,b\}$ is not listed, so axiom (2) fails.</p>`],
  ['Common confusions', R`<p>Open is not the opposite of closed. A topology does not need to contain complements of its sets. The sets in $\mathcal T$ are open <em>by definition</em>; there is nothing more to check about them.</p>`]],
'open-set': [
  ['Reading the definition', R`<p>"$U$ is open" is shorthand for "$U\in\mathcal T$". It has no meaning until a topology is fixed. The same set $[0,1)$ is open in [[ex-lower-limit|ℝ_ℓ]] and not open in standard ℝ.</p>`],
  ['Why it is defined this way', R`<p>The open sets are the ones that contain a little room around each of their points. When a topology comes from a [[basis]] or a [[metric]], that is literally the test: around each point of $U$ fits a basis element (a ball) inside $U$.</p>`],
  ['Worked example', R`<p>Show $(0,\infty)$ is open in $\mathbb R$. Take $x>0$. The interval $(x/2,\,2x)$ contains $x$ and lies inside $(0,\infty)$ because $x/2>0$. Every point has room, so the set is open.</p>`],
  ['Non-example, and why it fails', R`<p>$[0,1)$ in $\mathbb R$: at the point $0$ every interval $(-\varepsilon,\varepsilon)$ sticks out to the left of $0$, outside the set. One point without room is enough to fail.</p>`]],
'basis': [
  ['Reading the definition', R`<p><b>Condition (1), every point is in some basis element.</b> The building blocks reach every point, so every point will have at least one open set around it.</p>
<p><b>Condition (2), intersections contain a block.</b> If $x$ sits in two blocks $B_1,B_2$, there is a third block $B_3$ around $x$ inside both. This is what makes the generated collection closed under intersections (axiom (3) of a [[topology]]).</p>`],
  ['Why it is defined this way', R`<p>Listing every open set of $\mathbb R$ is impossible; listing the open intervals is easy. A basis is a small, describable collection from which the whole topology is built by taking unions. The two conditions are exactly what is needed for those unions to form a topology.</p>`],
  ['Worked example', R`<p>Open intervals in $\mathbb R$. (1): $x\in(x-1,x+1)$. (2): if $x\in(a,b)\cap(c,d)$, then $(\max(a,c),\min(b,d))$ is an open interval around $x$ inside both.</p>`],
  ['Non-example, and why it fails', R`<p>Closed intervals $[a,b]$ with $a<b$. Condition (2) fails at $1\in[0,1]\cap[1,2]=\{1\}$: there is no closed interval of positive length around $1$ inside $\{1\}$.</p>`],
  ['Common confusions', R`<p>A basis is not itself a topology: $(0,1)\cup(2,3)$ is open but not an interval. A topology can have many bases (intervals with rational endpoints also work, HW1 Q3).</p>`]],
'subspace-topology': [
  ['Reading the definition', R`<p><b>$\mathcal T_Y=\{Y\cap U: U\in\mathcal T\}$.</b> To get an open set of $Y$, take any open set $U$ of the big space and keep only the part inside $Y$. Every open set of $Y$ arises this way, and only these.</p>`],
  ['Why it is defined this way', R`<p>$Y$ should be close to what $X$ says it is close to, seen from inside $Y$. Points of $X$ outside $Y$ simply are not there any more. Equivalently, it is the coarsest topology making the inclusion $Y\hookrightarrow X$ [[continuous]] ([[defining-by-maps]]).</p>`],
  ['Worked example', R`<p>$Y=[0,1]\subset\mathbb R$. Is $[0,\tfrac12)$ open in $Y$? Yes: $[0,\tfrac12)=Y\cap(-1,\tfrac12)$, and $(-1,\tfrac12)$ is open in $\mathbb R$. The point $0$ has no room to its left in $\mathbb R$, but inside $Y$ there is nothing to its left to need room for.</p>`],
  ['Non-example, and why it fails', R`<p>$\{0\}$ in $Y=\mathbb Q$: any open $U\ni0$ contains an interval around $0$, which contains other rationals, so $\mathbb Q\cap U\ne\{0\}$ (MT Q1).</p>`],
  ['Common confusions', R`<p>Always say "open in $Y$" or "open in $X$". A set open in $Y$ need not be open in $X$ unless $Y$ itself is open in $X$.</p>`]],
'product-topology': [
  ['Reading the definition', R`<p>An open set of $X\times Y$ is a union of <b>open boxes</b> $U\times V$: pick an open set in each factor and take all pairs.</p>`],
  ['Why it is defined this way', R`<p>It is the coarsest topology making both projections continuous: $\pi_1^{-1}(U)=U\times Y$ and $\pi_2^{-1}(V)=X\times V$ must be open, and their intersections $U\times V$ then are too ([[defining-by-maps]]). Nothing more is added.</p>`],
  ['Worked example', R`<p>In $\mathbb R^2$ the open disc $D$ is open: around each point of $D$ fits a small open square $(a,b)\times(c,d)$ inside $D$, so $D$ is a union of boxes.</p>`],
  ['Common confusions', R`<p>$D$ itself is not a box; open sets are unions of boxes. For infinitely many factors, see [[product-vs-box]].</p>`]],
'closed-set': [
  ['Reading the definition', R`<p>$A$ is closed when everything <em>outside</em> it is open: each point not in $A$ has room around it that avoids $A$ entirely.</p>`],
  ['Why it is defined this way', R`<p>A closed set is one you cannot leave by approaching its edge: if points of $A$ crowd in on some $x$, then $x$ is in $A$ already ([[closure-limit-points]]). Defining it through the complement makes this automatic from the open sets.</p>`],
  ['Worked example', R`<p>$[0,1]$ in $\mathbb R$: its complement $(-\infty,0)\cup(1,\infty)$ is a union of open intervals, so it is open, and $[0,1]$ is closed.</p>`],
  ['Non-example, and why it fails', R`<p>$(0,1]$: the complement contains $0$, and every interval around $0$ meets $(0,1]$. The complement is not open.</p>`],
  ['Common confusions', R`<p>"Not open" does not mean closed: $[0,1)$ is neither. $\varnothing$ and $X$ are both. In a [[subspace-topology|subspace]], closed means $C\cap Y$ for $C$ closed in $X$.</p>`]],
'closure': [
  ['Reading the definition', R`<p>"The intersection of all closed sets containing $A$" is the smallest closed set that still contains all of $A$. Anything smaller would either miss part of $A$ or fail to be closed.</p>`],
  ['Why it is defined this way', R`<p>It adds to $A$ exactly the points $A$ cannot be separated from: the points every open neighbourhood of which reaches into $A$ ([[closure-test]]). So it answers "which points are stuck to $A$?"</p>`],
  ['Worked example', R`<p>$A=(0,1)$ in $\mathbb R$. Guess $[0,1]$. It is closed and contains $A$. Nothing smaller works: $0$ is in the closure because every interval $(-\varepsilon,\varepsilon)$ meets $(0,1)$; likewise $1$. Points outside $[0,1]$, say $2$, have $(1.5,2.5)$ missing $A$.</p>`],
  ['Common confusions', R`<p>The closure depends on the topology: in [[ex-lower-limit|ℝ_ℓ]], $\overline{(0,1)}=[0,1)$, since $[1,2)$ is an open set around $1$ missing $A$.</p>`]],
'limit-point': [
  ['Reading the definition', R`<p><b>"Every neighbourhood of $x$"</b>: however small an open set around $x$ you take. <b>"Contains a point of $A$ other than $x$"</b>: points of $A$ can be found arbitrarily close to $x$, not counting $x$ itself.</p>`],
  ['Why it is defined this way', R`<p>It captures "$A$ accumulates at $x$". Excluding $x$ itself is what distinguishes a genuine accumulation from simply containing $x$.</p>`],
  ['Worked example', R`<p>$A=\{1/n\}$. Is $0$ a limit point? Any open $U\ni0$ contains some $(-\varepsilon,\varepsilon)$, and $1/n<\varepsilon$ for large $n$. Yes. Is $\tfrac12$ a limit point? The interval $(0.45,0.55)$ contains no other $1/n$. No.</p>`],
  ['Common confusions', R`<p>A limit point need not be in $A$, and a point of $A$ need not be a limit point (isolated points). The closure is $A$ together with its limit points.</p>`]],
'hausdorff': [
  ['Reading the definition', R`<p><b>"For all $x\ne y$"</b>: every pair of distinct points, not just some. <b>"Open $U\ni x$, $V\ni y$"</b>: a neighbourhood of each. <b>"$U\cap V=\varnothing$"</b>: they share no point at all.</p>`],
  ['Why it is defined this way', R`<p>Without it, two different points can be indistinguishable by open sets: every neighbourhood of one meets every neighbourhood of the other. Then a sequence can converge to both. Hausdorff is the condition that rules this out, and it holds in every space with a [[metric]].</p>`],
  ['Worked example', R`<p>$\mathbb R$: for $x<y$ let $r=(y-x)/2$. Then $(x-r,x+r)$ and $(y-r,y+r)$ meet only if some point is within $r$ of both, which would put $x,y$ within $2r=y-x$ of each other strictly, impossible.</p>`],
  ['Non-example, and why it fails', R`<p>[[ex-finite-complement|The cofinite line]]: two nonempty open sets each miss only finitely many points, so they share infinitely many. No pair can be separated.</p>`]],
'continuous': [
  ['Reading the definition', R`<p><b>"For every open $V\subseteq Y$"</b>: start in the target. <b>"$f^{-1}(V)$ is open in $X$"</b>: the set of all points that land in $V$ is open. Continuity is a statement about pulling open sets back, never pushing them forward.</p>`],
  ['Why it is defined this way', R`<p>In ε–δ form: for any target window around $f(x)$ (that is $V$) there is a source window around $x$ that lands inside it. "All points landing in $V$ form an open set" says exactly that every such $x$ has its window. The output window is chosen first, the input window found: the backward direction.</p>`],
  ['Worked example', R`<p>$\pi_1:\mathbb R^2\to\mathbb R$. For open $U\subseteq\mathbb R$, $\pi_1^{-1}(U)=U\times\mathbb R$, an open box. So $\pi_1$ is continuous.</p>`],
  ['Non-example, and why it fails', R`<p>$f(x)=0$ for $x<0$, $1$ for $x\ge0$. Take $V=(\tfrac12,\tfrac32)$. Then $f^{-1}(V)=[0,\infty)$, not open: the point $0$ has no room. That is the jump, seen through preimages.</p>`],
  ['Common confusions', R`<p>Images of open sets need not be open: that is a separate property, [[open-map|being an open map]]. A constant map is continuous but sends open sets to single points.</p>`]],
'homeomorphism': [
  ['Reading the definition', R`<p>Three requirements: a <b>bijection</b> (points correspond one to one), <b>continuous</b> (open sets of $Y$ pull back to open sets), and <b>continuous inverse</b> (open sets of $X$ pull back under $f^{-1}$, i.e. $f$ sends open sets to open sets).</p>`],
  ['Why it is defined this way', R`<p>Together these say $f$ matches up the points <em>and</em> the open sets exactly. Every topological statement true of $X$ is then true of $Y$. It is the notion of "the same space".</p>`],
  ['Worked example', R`<p>$(-1,1)\to\mathbb R$, $x\mapsto x/(1-x^2)$: continuous, strictly increasing, onto, with continuous inverse. An open interval and the whole line are the same space.</p>`],
  ['Non-example, and why it fails', R`<p>$[0,1)\to S^1$, $t\mapsto(\cos2\pi t,\sin2\pi t)$ is a continuous bijection, but $[0,\tfrac12)$ is open in $[0,1)$ while its image, an arc including $(1,0)$ but approaching it only from one side, is not open in $S^1$. The inverse is not continuous.</p>`]],
'open-map': [
  ['Reading the definition', R`<p>Open map: push an open set <em>forward</em> and it stays open. Closed map: push a closed set forward and it stays closed. Continuity is about pulling back; these are about pushing forward.</p>`],
  ['Why it is defined this way', R`<p>Continuity alone does not say how $f$ treats open sets of the source. Open and closed maps are the extra conditions that make a continuous surjection into a [[quotient-map]], and an open continuous bijection into a [[homeomorphism]].</p>`],
  ['Worked example', R`<p>$\pi_1:X\times Y\to X$ is open. For open $W$ and $x\in\pi_1(W)$, pick $(x,y)\in W$ and a box $U\times V\subseteq W$ around it. Then $U\subseteq\pi_1(W)$ and $x\in U$: room around $x$ inside $\pi_1(W)$.</p>`],
  ['Non-example, and why it fails', R`<p>$\pi_1$ is not closed: the hyperbola $\{xy=1\}$ is closed in $\mathbb R^2$, but $\pi_1$ of it is $\mathbb R\setminus\{0\}$, not closed. The branches approach the $y$-axis without reaching it.</p>`],
  ['Common confusions', R`<p>Open, closed and continuous are independent of each other in general. For bijections, open and closed coincide (HW7 Q6a).</p>`]],
'quotient-topology': [
  ['Reading the definition', R`<p><b>"A partition $X^*$ of $X$"</b>: we have decided which points to glue: each piece of the partition becomes a single point. <b>"$p:X\to X^*$"</b>: sends each point to the piece it belongs to. <b>"$U\subseteq X^*$ is open iff $p^{-1}(U)$ is open"</b>: a set of glued points is open exactly when all the original points lying over it form an open set of $X$.</p>`],
  ['Why it is defined this way', R`<p>We want $p$ [[continuous]], so every open $U$ must have $p^{-1}(U)$ open: that is one direction. Among all topologies with that property we take the largest one: every set whose preimage is open is declared open. This keeps as much of $X$'s topology as the gluing allows ([[defining-by-maps]]).</p>
<p>Picture it as looking down from above: $X$ is upstairs, $X^*$ downstairs. Downstairs has no topology of its own; each candidate set is tested by looking at what lies over it.</p>`],
  ['Worked example', R`<p>$p:\mathbb R\to\{-1,0,1\}$, the sign of $x$ (HW6 Q1). Test each subset by its preimage:</p>
<ul><li>$\{-1\}$: preimage $(-\infty,0)$, open. Open.</li><li>$\{1\}$: preimage $(0,\infty)$, open. Open.</li><li>$\{0\}$: preimage $\{0\}$, not open. Not open.</li><li>$\{-1,0\}$: preimage $(-\infty,0]$, not open. Not open.</li><li>$\{-1,1\}$: preimage $\mathbb R\setminus\{0\}$, open. Open.</li></ul>
<p>So the topology is $\{\varnothing,\{-1\},\{1\},\{-1,1\},\{-1,0,1\}\}$. The point $0$ cannot be separated from $\pm1$: every open set containing $0$ is the whole space.</p>`],
  ['Non-example, and why it fails', R`<p>The quotient topology does not inherit good properties: crushing $(0,1)$ in $\mathbb R$ gives a space that is not Hausdorff ([[ex-crush-open]]).</p>`],
  ['Common confusions', R`<p>The quotient set is a set of <em>pieces</em>, which are subsets of $X$. A "point" of $X^*$ like $[A]$ is a whole set upstairs.</p>`]],
'saturated': [
  ['Reading the definition', R`<p>$p^{-1}(p(C))$ is "everything glued to something in $C$": push $C$ down, then take everything lying over the result. $C$ is <b>saturated</b> when this adds nothing, i.e. whenever $C$ contains one point of a piece it contains the whole piece.</p>`],
  ['Why it is defined this way', R`<p>It is the exact condition under which pushing a set down and pulling it back returns the same set. For open saturated $C$ that means $p^{-1}(p(C))=C$ is open, so $p(C)$ is open downstairs. Saturated open sets are precisely the open sets of $X$ that correspond to open sets of $X^*$.</p>`],
  ['Worked example', R`<p>Crush $A=[0,1]$ in $\mathbb R$. $C=(2,3)$ misses $A$: saturated. $C=(-1,2)$ contains all of $A$: saturated. $C=(-1,\tfrac12)$ contains part of $A$: not saturated; pulling back after pushing down gives $(-1,\tfrac12)\cup[0,1]=(-1,1]$, which is not even open.</p>`],
  ['Common confusions', R`<p>Saturated is about $C$ relative to the gluing, not about openness: a set can be saturated and not open, or open and not saturated.</p>`]],
'quotient-map': [
  ['Reading the definition', R`<p>Three parts. <b>Surjective</b>: every point of $Y$ comes from somewhere, so every point downstairs has something over it. <b>If $U$ open then $p^{-1}(U)$ open</b>: continuity. <b>If $p^{-1}(U)$ open then $U$ open</b>: the reverse direction, which says $Y$ has no fewer open sets than the gluing allows.</p>`],
  ['Why it is defined this way', R`<p>It says $Y$ carries exactly the [[quotient-topology]] for the partition into fibres $p^{-1}(\{y\})$. So a quotient map is "gluing, with the right topology downstairs". It is how gluings that arise as maps (wrapping $[0,1]$ around a circle, projecting a product) are recognized as quotients.</p>`],
  ['Worked example', R`<p>$\pi_1:X\times Y\to X$ (HW6 Q2), with $Y\ne\varnothing$.</p>
<ol><li>Surjective: fix $y_0\in Y$; then $\pi_1(x,y_0)=x$.</li><li>Continuous: $\pi_1^{-1}(U)=U\times Y$ is open.</li><li>Reverse: suppose $\pi_1^{-1}(U)$ is open. The map $i(x)=(x,y_0)$ is continuous and $\pi_1\circ i=\mathrm{id}$, so $U=i^{-1}(\pi_1^{-1}(U))$ is open, a preimage of an open set under a continuous map.</li></ol>`],
  ['Non-example, and why it fails', R`<p>$g:[0,1)\cup\{2\}\to[0,1]$, $g(2)=1$ and $g(t)=t$ otherwise. It is a continuous bijection, but $g^{-1}(\{1\})=\{2\}$ is open (isolated) while $\{1\}$ is not open in $[0,1]$. The reverse direction fails: a point alone upstairs is crowded downstairs.</p>`],
  ['Common confusions', R`<p>The reverse direction is not the same as being an [[open-map]]: it only concerns full preimages $p^{-1}(U)$. Open (or closed) plus continuous surjective implies quotient, not conversely (HW7 Q4).</p>`]],
'maps-out-of-quotients': [
  ['Reading the definition', R`<p><b>"$h$ constant on each $p^{-1}(\{y\})$"</b>: $h$ does not distinguish points that get glued together, so it makes sense on the glued space. <b>"$g\circ p=h$"</b>: $g$ sends each glued point to the common value of $h$ on it. <b>"$g$ continuous"</b>: continuity comes for free.</p>`],
  ['Why it is true', R`<p>For open $V\subseteq Z$: $p^{-1}(g^{-1}(V))=h^{-1}(V)$ is open, because $h$ is continuous. By the definition of the quotient topology, $g^{-1}(V)$ is open. Openness downstairs is tested upstairs, and upstairs $h$ does the work.</p>`],
  ['Worked example', R`<p>HW6 Q5: to show $X/{\sim}$ is Hausdorff when $x\sim y$ iff $q(x)=q(y)$ for a map $q$ into a Hausdorff space, define $g([z])=q(z)$. It is well defined by the definition of $\sim$ and continuous by this theorem; distinct classes have distinct images, which have disjoint neighbourhoods, which pull back to disjoint neighbourhoods of the classes.</p>`]]
};
Object.keys(DEEP).forEach(function(id){ var a = A[id]; if (!a) return; var s = a.sections || []; var k = s.length && /^(Definition|Statement)$/.test(s[0][0]) ? 1 : 0; a.sections = s.slice(0, k).concat(DEEP[id], s.slice(k)); a.deep = 1; });

</script>
<script>
// ===== The encyclopedia: home page, articles, link previews, a trail of where you have been, search.
var KIND = {definition: 'Definition', theorem: 'Theorem', method: 'Method', example: 'Example', idea: 'Idea', worked: 'Worked problem', problem: 'Problem'};
// reading order follows the book; problems step through their own set
ORDER = []; var SECOF = {}; BOOK.forEach(function(c){ c[1].forEach(function(sx){ sx[1].forEach(function(id){ SECOF[id] = sx[0]; if (A[id].kind !== 'problem' && ORDER.indexOf(id) < 0) ORDER.push(id); }); }); });
var USEDIN = {}; Object.keys(A).forEach(function(id){ (A[id].method || []).forEach(function(m){ (USEDIN[m] = USEDIN[m] || []).push(id); }); });
var SETOF = {}; PROBSETS.forEach(function(ps){ ps[1].forEach(function(id){ SETOF[id] = ps[1]; }); });
var BACK = {}, MENTION = {};
Object.keys(A).forEach(function(id){ (A[id].pre || []).forEach(function(p){ (BACK[p] = BACK[p] || []).push(id); });
  var txt = JSON.stringify(A[id]); (txt.match(/\[\[([a-z0-9-]+)/g) || []).forEach(function(m){ var t = m.slice(2); if (t !== id){ MENTION[t] = MENTION[t] || []; if (MENTION[t].indexOf(id) < 0) MENTION[t].push(id); } }); });
function wiki(h){ return h.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, function(_, id, label){ var a = A[id]; return '<a class="wl" href="#a/' + id + '" data-id="' + id + '">' + (label || (a ? a.title : id)) + '</a>'; }); }
function plain(h){ return h.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, function(_, id, l){ return l || (A[id] ? A[id].title : id); }).replace(/<[^>]+>/g, ''); }
function math(el){ if (window.renderMathInElement) renderMathInElement(el, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false}); }
function chip(id){ var a = A[id]; return a ? '<a class="chip" href="#a/' + id + '">' + a.title + '</a>' : ''; }
var TRAIL = []; try { TRAIL = JSON.parse(sessionStorage.getItem('tg-trail') || '[]'); } catch(e){}
function home(){
  var recent = []; try { recent = JSON.parse(localStorage.getItem('tg-recent') || '[]'); } catch(e){}
  var h = '<h1>Topology Reference Guide</h1><p class="intro">An encyclopedia of the course in the order of Munkres. Each section holds its concepts, the methods its problems call for, and the assigned problems themselves, all linked to each other. Each article opens to a one-line summary and its definition; everything else unfolds when you want it. Underlined terms are links: tap one for a preview, then read on or stay where you are. At the end of each article you will find what it depends on and what builds on it, and the next article in the book.</p>';
  h += '<div class="start"><a class="chip" href="#a/image-preimage">Start at Chapter 1</a><a class="chip" href="#a/quotient-topology">Now: §22 quotients</a><a class="chip" href="#a/hw7-q2">Homework 7</a><a class="chip" href="tabs/">Quick-reference tabs</a></div>';
  if (recent.length) h += '<div class="topic"><h2>Recently read</h2><div class="chips">' + recent.slice(0, 8).map(chip).join('') + '</div></div>';
  function row(id){ var a = A[id]; return '<a href="#a/' + id + '"><b>' + a.title + '</b><span class="kind">' + KIND[a.kind] + '</span><i>' + wiki(a.lede).replace(/<a [^>]*>|<\/a>/g, '') + '</i></a>'; }
  function group(ids){ var g = {c: [], m: [], p: []}; ids.forEach(function(id){ var k = A[id].kind; (k === 'method' ? g.m : k === 'problem' ? g.p : g.c).push(id); });
    return (g.c.length ? '<div class="glab">Concepts</div>' + g.c.map(row).join('') : '') + (g.m.length ? '<div class="glab">Methods</div>' + g.m.map(row).join('') : '') + (g.p.length ? '<div class="glab">Problems</div>' + g.p.map(row).join('') : ''); }
  BOOK.forEach(function(ch){ h += '<h2 class="chap">' + ch[0] + '</h2>'; ch[1].forEach(function(sx){ var n = sx[1].length, np = sx[1].filter(function(id){ return A[id].kind === 'problem'; }).length;
    h += '<details class="topic"><summary>' + sx[0] + '<span class="cnt">' + (n ? (n - np) + (np ? ' · ' + np + ' problems' : '') : 'coming') + '</span></summary><div class="tlist">' + (n ? group(sx[1]) : '<p class="foot">Added as the course reaches it.</p>') + '</div></details>'; }); });
  h += '<h2 class="chap">Indexes</h2>';
  h += '<details class="topic"><summary>All methods<span class="cnt">' + METHODS.length + '</span></summary><div class="tlist">' + METHODS.map(function(id){ var a = A[id], n = (USEDIN[id] || []).length; return '<a href="#a/' + id + '"><b>' + a.title + '</b>' + (n ? '<span class="kind">' + n + ' problem' + (n > 1 ? 's' : '') + '</span>' : '') + '<i>' + wiki(a.lede).replace(/<a [^>]*>|<\/a>/g, '') + '</i></a>'; }).join('') + '</div></details>';
  PROBSETS.forEach(function(ps){ h += '<details class="topic"><summary>' + ps[0] + '<span class="cnt">' + ps[1].length + '</span></summary><div class="tlist">' + ps[1].map(row).join('') + '</div></details>'; });
  h += '<details class="topic"><summary>Example spaces<span class="cnt">' + EXAMPLES.length + '</span></summary><div class="tlist">' + EXAMPLES.map(row).join('') + '</div></details>';
  h += '<p class="foot">Theorem numbers follow Munkres, <em>Topology</em>, 2nd ed.; check them against your copy. Earlier notes and quiz: <a href="classic/">classic</a>.</p>';
  return h;
}
function article(id){
  var a = A[id]; if (!a) return '<p>No article called “' + id + '”.</p>';
  TRAIL = TRAIL.filter(function(x){ return x !== id; }); TRAIL.push(id); TRAIL = TRAIL.slice(-3); try { sessionStorage.setItem('tg-trail', JSON.stringify(TRAIL)); var r = JSON.parse(localStorage.getItem('tg-recent') || '[]').filter(function(x){ return x !== id; }); r.unshift(id); localStorage.setItem('tg-recent', JSON.stringify(r.slice(0, 12))); } catch(e){}
  var h = '<div class="trail"><a href="#">Home</a>' + TRAIL.slice(0, -1).map(function(t){ return '<span class="sep">›</span><a href="#a/' + t + '">' + A[t].title + '</a>'; }).join('') + '<span class="sep">›</span>' + a.title + '</div>';
  h += '<div class="meta">' + KIND[a.kind] + ' · ' + (SECOF[id] || a.where) + '</div><h1>' + a.title + '</h1><div class="lede">' + wiki(a.lede) + '</div>';
  if (a.steps) h += '<details class="sec" open><summary>Steps</summary><div class="secb"><ol class="steps">' + a.steps.map(function(s){ return '<li>' + (s[1] ? '<details><summary>' + wiki(s[0]) + '</summary><div class="why"><b>Why:</b> ' + wiki(s[1]) + '</div></details>' : wiki(s[0])) + '</li>'; }).join('') + '</ol></div></details>';
  (a.sections || []).forEach(function(s, i){ var body = s[1];
    if (s[0] === 'Concepts and method') body = '<p><b>Concepts:</b></p><div class="chips">' + (a.pre || []).map(chip).join('') + '</div><p style="margin-top:10px"><b>Method:</b></p><div class="chips">' + (a.method || []).map(chip).join('') + '</div>';
    var open = (a.kind === 'problem') ? (s[0] === 'Concepts and method') : (i === 0 && !a.steps); if (s[0] === 'Picture' || s[0] === 'Reading the definition') open = true;
    h += '<details class="sec"' + (open ? ' open' : '') + '><summary>' + s[0] + '</summary><div class="secb">' + wiki(body) + '</div></details>'; });
  if (a.kind === 'method' && (USEDIN[id] || []).length) h += '<div class="links"><h3>Used in these problems</h3><div class="chips">' + USEDIN[id].map(chip).join('') + '</div></div>';
  h += '<div class="links">';
  if ((a.pre || []).length && a.kind !== 'problem') h += '<h3>Depends on</h3><div class="chips">' + a.pre.map(chip).join('') + '</div>';
  if ((BACK[id] || []).length) h += '<h3>Builds toward</h3><div class="chips">' + BACK[id].map(chip).join('') + '</div>';
  var men = (MENTION[id] || []).filter(function(m){ return (BACK[id] || []).indexOf(m) < 0 && (a.pre || []).indexOf(m) < 0; });
  if (men.length) h += '<h3>Mentioned in</h3><div class="chips">' + men.map(chip).join('') + '</div>';
  h += '</div>';
  var seq = SETOF[id] || ORDER, k = seq.indexOf(id); var ORDER_ = ORDER; ORDER = seq;
  if (k >= 0) h += '<div class="pn">' + (k > 0 ? '<a href="#a/' + ORDER[k - 1] + '"><span>Previous</span>' + A[ORDER[k - 1]].title + '</a>' : '<span style="flex:1"></span>') + (k < ORDER.length - 1 ? '<a class="nx" href="#a/' + ORDER[k + 1] + '"><span>' + (SETOF[id] ? 'Next problem' : 'Next in the book') + '</span>' + A[ORDER[k + 1]].title + '</a>' : '') + '</div>';
  ORDER = ORDER_; return h;
}
function route(){
  var hsh = location.hash.replace(/^#/, ''), v = document.getElementById('view');
  closePv();
  if (hsh.indexOf('a/') === 0){ var id = hsh.slice(2); v.innerHTML = article(id); document.title = (A[id] ? A[id].title + ' · ' : '') + 'Topology Reference Guide'; }
  else { v.innerHTML = home(); document.title = 'Topology Reference Guide'; }
  math(v); window.scrollTo(0, 0); if (document.getElementById('qfig')) quotFig();
}
// previews: a tap on an underlined term inside an article shows its summary first
function closePv(){ document.getElementById('pv').classList.remove('on'); }
document.addEventListener('click', function(e){
  var l = e.target.closest('a.wl');
  if (l && !e.metaKey && !e.ctrlKey){ e.preventDefault(); var a = A[l.dataset.id]; if (!a) return; var pv = document.getElementById('pv');
    pv.querySelector('.pm').textContent = KIND[a.kind] + ' · ' + a.where; pv.querySelector('.pt').textContent = a.title; pv.querySelector('.pl').innerHTML = wiki(a.lede).replace(/<a [^>]*>|<\/a>/g, '');
    pv.querySelector('.pgo').setAttribute('href', '#a/' + l.dataset.id); math(pv); pv.classList.add('on'); return; }
  if (e.target.closest('#pv .px')) closePv();
  else if (!e.target.closest('#pv')) closePv();
});
// search: titles, summaries and text
var IDX = Object.keys(A).map(function(id){ var a = A[id]; return {id: id, t: a.title.toLowerCase(), l: plain(a.lede).toLowerCase(), b: plain(JSON.stringify(a.sections || []) + JSON.stringify(a.steps || [])).toLowerCase()}; });
function search(q){ q = q.trim().toLowerCase(); if (!q) return []; return IDX.map(function(e){ var s = e.t.indexOf(q) === 0 ? 0 : e.t.indexOf(q) >= 0 ? 1 : e.l.indexOf(q) >= 0 ? 2 : e.b.indexOf(q) >= 0 ? 3 : 9; return [s, e.id]; }).filter(function(x){ return x[0] < 9; }).sort(function(a, b){ return a[0] - b[0]; }).slice(0, 8).map(function(x){ return x[1]; }); }
var q = document.getElementById('q'), sg = document.getElementById('sugg');
q.addEventListener('input', function(){ var r = search(q.value); sg.innerHTML = r.map(function(id){ return '<a href="#a/' + id + '"><span class="sk">' + KIND[A[id].kind] + '</span>' + A[id].title + '</a>'; }).join('') || (q.value ? '<a href="#"><span class="sk">no match</span>Try another word</a>' : ''); sg.classList.toggle('on', !!q.value); });
q.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ var r = search(q.value); if (r.length){ location.hash = 'a/' + r[0]; q.value = ''; sg.classList.remove('on'); q.blur(); } } if (e.key === 'Escape'){ q.value = ''; sg.classList.remove('on'); } });
sg.addEventListener('click', function(){ setTimeout(function(){ q.value = ''; sg.classList.remove('on'); }, 0); });
document.addEventListener('click', function(e){ if (!e.target.closest('.search')) sg.classList.remove('on'); });
// theme
var tb = document.getElementById('themeBtn'); function setTb(){ tb.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? 'Dark' : 'Light'; } setTb();
tb.addEventListener('click', function(){ var l = document.documentElement.getAttribute('data-theme') === 'light'; if (l) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'light'); try { localStorage.setItem('tg-theme', l ? 'dark' : 'light'); } catch(e){} setTb(); if (document.getElementById('qfig')) quotFig(); });
// the crushing picture
function quotFig(){
  var cv = document.getElementById('qfig'); if (!cv) return; var g = cv.getContext('2d'), xs = document.getElementById('qx'), cl = document.getElementById('qclosed'), out = document.getElementById('qmsg');
  function col(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#888'; }
  function draw(){ var W = cv.width, H = cv.height, L = 30, Rr = W - 30, a = 0.35, b = 0.65, x = +xs.value/1000, closed = cl.checked, fg = col('--text'), mu = col('--muted'), bg = col('--card');
    function X(u){ return L + (Rr - L)*u; }
    g.fillStyle = bg; g.fillRect(0, 0, W, H); g.font = '14px Georgia, serif';
    var y0 = 50; g.strokeStyle = mu; g.lineWidth = 2; g.beginPath(); g.moveTo(L, y0); g.lineTo(Rr, y0); g.stroke();
    g.strokeStyle = '#e0947a'; g.lineWidth = 6; g.beginPath(); g.moveTo(X(a), y0); g.lineTo(X(b), y0); g.stroke();
    [a, b].forEach(function(e){ g.beginPath(); g.arc(X(e), y0, 6, 0, 7); g.fillStyle = closed ? '#e0947a' : bg; g.fill(); g.strokeStyle = '#e0947a'; g.lineWidth = 2; g.stroke(); });
    g.fillStyle = mu; g.fillText('ℝ', L, 24); g.fillText(closed ? 'A = [a, b], closed' : 'A = (a, b), not closed', X(a) - 10, 24);
    var inA = closed ? (x >= a && x <= b) : (x > a && x < b), gap = inA ? 0 : Math.min(Math.abs(x - a), Math.abs(x - b)), touches = !inA && !closed && gap < 0.004;
    var y1 = 132, shift = X(b) - X(a); g.strokeStyle = mu; g.lineWidth = 2; g.beginPath(); g.moveTo(L, y1); g.lineTo(Rr - shift, y1); g.stroke();
    var pA = X(a); g.fillStyle = '#e0947a'; g.beginPath(); g.arc(pA, y1, 7, 0, 7); g.fill(); g.fillStyle = mu; g.fillText('X/∼ : A is one point [A]', L, y1 - 24);
    function down(u){ return u <= a ? X(u) : u >= b ? X(u) - shift : pA; }
    if (inA){ out.innerHTML = 'x is in A, so in the quotient it is the point [A]. Move it outside A.'; }
    else if (touches){ var e = 0.06; g.fillStyle = 'rgba(201,73,90,.4)'; g.fillRect(X(x - e), y0 - 10, X(x + e) - X(x - e), 20); g.fillRect(Math.min(down(x - e), down(x + e)) - 2, y1 - 10, Math.abs(down(x + e) - down(x - e)) + 4, 20);
      out.innerHTML = 'x is a limit point of A that A leaves out, so every interval around x reaches into A and its image contains [A]. The points cannot be separated: <b>not Hausdorff</b>.'; }
    else { var U = gap/2; g.fillStyle = 'rgba(95,184,138,.45)'; g.fillRect(X(x - U), y0 - 10, X(x + U) - X(x - U), 20); g.fillRect(down(x - U), y1 - 10, down(x + U) - down(x - U), 20);
      g.fillStyle = 'rgba(91,155,213,.4)'; g.fillRect(L, y0 + 9, X(x - U) - L, 6); g.fillRect(X(x + U), y0 + 9, Rr - X(x + U), 6); g.fillRect(L, y1 + 9, down(x - U) - L, 6); g.fillRect(down(x + U), y1 + 9, Rr - shift - down(x + U), 6);
      out.innerHTML = 'r = d(x, A) > 0. Green: U = B(x, r/2), missing A. Blue: W = {z : d(z, x) > r/2}, containing all of A. Both are saturated, so their images are disjoint open sets around {x} and [A].'; }
    g.fillStyle = fg; g.beginPath(); g.arc(X(x), y0, 4, 0, 7); g.fill(); g.fillText('x', X(x) - 3, y0 + 26); if (!inA){ g.beginPath(); g.arc(down(x), y1, 4, 0, 7); g.fill(); g.fillText('{x}', down(x) - 8, y1 + 28); } }
  xs.oninput = draw; cl.onchange = function(){ if (!cl.checked) xs.value = 350; draw(); }; draw();
}
window.addEventListener('hashchange', route);
window.addEventListener('load', route);
</script>
