<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="mobile-web-app-capable" content="yes">

<title>Topology Reference Guide</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>(function(){try{if(localStorage.getItem('tg-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<style>
:root{--bg:#000;--surf:#0c0c0c;--card:#0f0f0f;--card2:#171717;--border:#262626;--border2:#3a3a3a;--text:#f2f2f2;--text2:#c2c2c2;--muted:#7d7d7d;--link:#f2f2f2;color-scheme:dark;}
:root[data-theme="light"]{--bg:#fff;--surf:#fff;--card:#fafafa;--card2:#f1f1f1;--border:#e2e2e2;--border2:#cfcfcf;--text:#111;--text2:#3f3f3f;--muted:#8a8a8a;--link:#111;color-scheme:light;}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--text);font:17px/1.65 'LineDigits',Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:var(--link);}
.top{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px calc(10px);padding-top:max(10px, env(safe-area-inset-top));}
.toprow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;}
.logo{font-size:26px;line-height:1;text-decoration:none;font-style:italic;font-family:'KaTeX_Caligraphic',Georgia,serif;width:34px;text-align:center;}
.brand{font:600 12px/1.2 -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.search{flex:1;position:relative;min-width:0;}
#q{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);font:16px -apple-system,system-ui,sans-serif;}
.tb{border:1px solid var(--border2);background:var(--card);color:var(--text2);border-radius:8px;padding:8px 10px;font:13px -apple-system,system-ui,sans-serif;cursor:pointer;}
#sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--border2);border-radius:8px;overflow:hidden;display:none;z-index:60;}
#sugg.on{display:block;}
#sugg a{display:block;padding:9px 12px;text-decoration:none;border-bottom:1px solid var(--border);}
#sugg a:last-child{border-bottom:none;}
#sugg .sk{font:11px -apple-system,system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:8px;}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 80px;}
.trail{font:13px -apple-system,system-ui,sans-serif;color:var(--muted);margin-bottom:14px;line-height:1.8;}
.trail a{color:var(--muted);text-decoration:none;}
.trail a:hover{color:var(--text);}
.trail .sep{margin:0 6px;opacity:.6;}
.meta{font:12px -apple-system,system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
h1{font-size:1.75rem;line-height:1.25;font-weight:normal;margin-bottom:10px;}
.lede{font-size:1.12rem;color:var(--text);border-left:3px solid var(--text);padding:2px 0 2px 14px;margin:6px 0 18px;}
details.sec{border-top:1px solid var(--border);}
details.sec:last-of-type{border-bottom:1px solid var(--border);}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 2px;font:600 14px -apple-system,system-ui,sans-serif;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;}
details.sec>summary::-webkit-details-marker{display:none;}
details.sec>summary::after{content:'+';color:var(--muted);font-size:18px;}
details.sec[open]>summary::after{content:'−';}
.secb{padding:0 2px 16px;color:var(--text2);}
.secb p{margin-bottom:.7em;} .secb ul,.secb ol{padding-left:22px;margin-bottom:.7em;} .secb li{margin:.25em 0;}
.steps{counter-reset:s;list-style:none;padding-left:0!important;}
.steps>li{counter-increment:s;position:relative;padding-left:30px;margin:10px 0;}
.steps>li::before{content:counter(s);position:absolute;left:0;top:1px;width:21px;height:21px;border:1px solid var(--border2);border-radius:50%;font:12px/21px -apple-system,system-ui,sans-serif;text-align:center;color:var(--text2);}
.steps details summary{cursor:pointer;color:var(--text);list-style:none;}
.steps details summary::-webkit-details-marker{display:none;}
.steps details summary::after{content:' why ›';font:12px -apple-system,system-ui,sans-serif;color:var(--muted);white-space:nowrap;}
.steps details[open] summary::after{content:' why ⌄';}
.steps .why{font-size:.93em;color:var(--text2);padding:6px 0 2px;}
a.wl{text-decoration:none;border-bottom:1px dotted var(--text2);color:var(--text);}
a.wl:hover{border-bottom-style:solid;}
.links{margin-top:22px;}
.links h3{font:600 12px -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-block;border:1px solid var(--border2);border-radius:999px;padding:4px 11px;font-size:.88rem;text-decoration:none;color:var(--text2);background:var(--card);}
.chip:hover{color:var(--text);border-color:var(--text2);}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:26px;font:13px -apple-system,system-ui,sans-serif;}
.pn a{text-decoration:none;color:var(--text2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;flex:1;}
.pn a span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
.pn a.nx{text-align:right;}
/* home */
.intro{color:var(--text2);margin-bottom:20px;}
.start{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 24px;}
.topic{margin:22px 0;}
.chap{font-size:1.2rem;font-weight:normal;margin:30px 0 8px;border-bottom:1px solid var(--border2);padding-bottom:6px;}
details.topic{margin:0;border-bottom:1px solid var(--border);}
details.topic>summary{list-style:none;cursor:pointer;padding:11px 0;font:600 14px -apple-system,system-ui,sans-serif;display:flex;justify-content:space-between;}
details.topic>summary::-webkit-details-marker{display:none;}
.glab{font:600 11px -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px;}
.cnt{font-weight:normal;color:var(--muted);font-size:12px;}
details.topic .tlist{padding-left:10px;}
.topic h2{font:600 13px -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px;}
.tlist a{display:block;text-decoration:none;padding:9px 0;border-bottom:1px solid var(--border);}
.tlist a b{font-weight:normal;color:var(--text);}
.tlist a i{display:block;font-style:normal;color:var(--muted);font-size:.9rem;line-height:1.45;}
.kind{font:10px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--border2);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px;}
.facts li{margin:.35em 0;}
.qsw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 14px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--card);font:13px -apple-system,system-ui,sans-serif;}
.qsn{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;}
.qst{display:flex;gap:6px;flex-wrap:wrap;}
.qst a,.qst span{min-width:38px;text-align:center;padding:7px 9px;border:1px solid var(--border2);border-radius:8px;text-decoration:none;color:var(--text);background:var(--card2);}
.qst a.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600;}
.qst .off{opacity:.35;}
.foot{color:var(--muted);font-size:.85rem;margin-top:30px;}
/* preview sheet */
#pv{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--card);border-top:1px solid var(--border2);box-shadow:0 -10px 30px rgba(0,0,0,.35);padding:16px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-width:760px;margin:0 auto;border-radius:14px 14px 0 0;}
#pv.on{transform:none;}
#pv .pm{font:11px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
#pv .pt{font-size:1.25rem;margin:2px 0 6px;}
#pv .pl{color:var(--text2);margin-bottom:12px;}
#pv .pb{display:flex;gap:8px;}
#pv .pb a,#pv .pb button{flex:1;text-align:center;border:1px solid var(--border2);border-radius:8px;padding:10px;font:14px -apple-system,system-ui,sans-serif;background:var(--card2);color:var(--text);text-decoration:none;cursor:pointer;}
.figc{width:100%;max-width:560px;height:auto;display:block;border:1px solid var(--border);border-radius:6px;touch-action:pan-y;}
.figctl{display:flex;gap:18px;align-items:center;margin:10px 0;font-size:.92em;color:var(--text2);flex-wrap:wrap;}
.figctl input[type=range]{width:200px;vertical-align:middle;}
.figmsg{font-size:.92em;color:var(--text2);min-height:3em;}
.katex{font-size:1.04em;}
.katex-display{overflow-x:auto;overflow-y:hidden;}
#fp{position:fixed;left:0;right:0;top:56px;bottom:0;z-index:45;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:14px max(16px, calc((100vw - 760px)/2)) calc(60px + env(safe-area-inset-bottom));}
#fp.on{display:block;} body.fpon{overflow:hidden;}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden;}
.seg button{background:var(--card);color:var(--text2);border:0;padding:8px 16px;font:14px -apple-system,system-ui,sans-serif;cursor:pointer;}
.seg button.on{background:var(--text);color:var(--bg);}
#fq{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);font:16px -apple-system,system-ui,sans-serif;}
.fk{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}
.fk button{border:1px solid var(--border2);border-radius:999px;padding:5px 12px;font:13px -apple-system,system-ui,sans-serif;background:var(--card);color:var(--muted);cursor:pointer;}
.fk button.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.fsel{display:flex;gap:10px;flex-wrap:wrap;}
.fsel label{flex:1;min-width:150px;display:flex;flex-direction:column;font:600 11px -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.fsel select{margin-top:5px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);font:15px -apple-system,system-ui,sans-serif;letter-spacing:0;text-transform:none;}
.fcount{font:12px -apple-system,system-ui,sans-serif;color:var(--muted);margin:16px 0 2px;}
.fnote{color:var(--muted);font-size:.92rem;margin-bottom:12px;}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;}
.sgrid button{border:1px solid var(--border2);background:var(--card);color:var(--text);border-radius:10px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;min-height:78px;}
.sgrid button.on{border-color:var(--text);background:var(--card2);}
.sm{font-size:1.15rem;} .sn{font:11px/1.3 -apple-system,system-ui,sans-serif;color:var(--muted);text-align:center;}
.scard{border:1px solid var(--border2);border-radius:12px;padding:14px 16px 16px;margin:0 0 14px;background:var(--card);}
.sbig{font-size:1.7rem;margin:2px 0 4px;}
.scard h2{font-weight:normal;font-size:1.3rem;margin-bottom:6px;} .scard p{color:var(--text2);}
.scard h3{font:600 12px -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;}
#sugg a.sall{color:var(--muted);font:13px -apple-system,system-ui,sans-serif;}
.secb table{border-collapse:collapse;width:100%;font-size:.85em;margin:.4em 0 1em;display:block;overflow-x:auto;}
.secb th,.secb td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:left;vertical-align:top;}
.secb th{font:600 11px -apple-system,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.role{font:13px/1.5 -apple-system,system-ui,sans-serif;color:var(--muted);margin:-6px 0 16px;}
.role b{color:var(--text2);font-weight:600;}
.dnav{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px;}
.dnav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--muted);font:13px -apple-system,system-ui,sans-serif;cursor:pointer;}
.dnav button.part{color:var(--text2);border-color:var(--text2);}
.dnav button.ok{background:var(--card2);color:var(--text);border-color:var(--text);}
.dnav button.cur{outline:2px solid var(--text);outline-offset:1px;}
.dq{border:1px solid var(--border2);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--card);}
.dq p{color:var(--text);margin:4px 0 0;}
.dst{margin:0 0 16px;}
.dsq{font:600 14px -apple-system,system-ui,sans-serif;color:var(--text);margin-bottom:8px;}
.dopt{display:block;width:100%;text-align:left;border:1px solid var(--border2);border-radius:10px;background:var(--card);color:var(--text);padding:10px 12px;margin:0 0 7px;font:16px/1.45 'LineDigits',Georgia,serif;cursor:pointer;}
.dopt.right{border-color:#5fae7a;background:rgba(95,174,122,.12);}
.dopt.wrong{border-color:#c9495a;background:rgba(201,73,90,.12);}
.dopt.dim{opacity:.45;}
.dopt:disabled{cursor:default;color:var(--text);}
.dwhy{color:var(--text2);font-size:.95em;padding:4px 2px 0;}
.dout{border-top:1px solid var(--border2);padding-top:12px;margin-top:6px;}
.dout p{color:var(--text);}
.dbtn{display:flex;gap:8px;margin-top:14px;}
.dbtn button{flex:1;border:1px solid var(--border2);border-radius:8px;background:var(--card2);color:var(--text);padding:11px;font:14px -apple-system,system-ui,sans-serif;cursor:pointer;}
details.pad>summary{color:var(--text);}
.padnote{font-size:.9em;color:var(--muted);}
.padbar{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0;}
.padbar button{border:1px solid var(--border2);background:var(--card);color:var(--text);border-radius:7px;padding:5px 8px;min-width:38px;font:14px 'LineDigits',Georgia,serif;cursor:pointer;}
#padin{caret-color:#4a90e2;width:100%;min-height:120px;resize:vertical;border:1px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);padding:10px 12px;font:16px/1.5 ui-monospace,Menlo,monospace;}
.padtools{display:flex;gap:8px;align-items:center;margin:8px 0 12px;flex-wrap:wrap;}
.padtools button:disabled{opacity:.4;cursor:default;}
.padtools button{border:1px solid var(--border2);background:var(--card2);color:var(--text);border-radius:8px;padding:8px 12px;font:14px -apple-system,system-ui,sans-serif;cursor:pointer;}
#padsaved{font:12px -apple-system,system-ui,sans-serif;color:var(--muted);}
.padprev{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--card);color:var(--text);}
.padprev p{color:var(--text);} .padprev .padtip{color:var(--muted);font:12px/1.4 -apple-system,system-ui,sans-serif;border-top:1px solid var(--border);padding-top:8px;margin-top:6px;} .padempty{color:var(--muted)!important;}
#padprint{display:none;}
@media print{ body.printbare{margin:0!important;} #padprint.bare{padding:0 16mm!important;} #padprint.bare .bt{width:100%;border-collapse:collapse;} #padprint.bare .bt td{padding:0;border:0!important;} #padprint.bare .bm{height:14mm;} #padprint.bare, #padprint.bare *:not(.katex *){border:0!important;box-shadow:none!important;outline:0!important;text-decoration:none!important;} #padprint.bare .bh{font-size:12pt;margin:0 0 10pt;} #padprint.bare a{color:#000!important;} #padprint.bare hr{display:none!important;} #padprint.bare h2{font-size:13pt;font-weight:bold;margin:12pt 0 4pt;} #padprint.bare .docq{break-inside:auto;margin:0;padding:0;} }
/* Georgia's old-style figures make 0 look like o: take the digits alone from Times, which has lining figures on every device */
@font-face{font-family:'LineDigits';src:local('Times New Roman'),local('TimesNewRomanPSMT'),local('Times'),local('Times-Roman');unicode-range:U+0030-0039;}
.padcaret{display:inline-block;width:2px;height:1.1em;margin:0 1px;vertical-align:-.15em;background:#4a90e2;} @keyframes padblink{50%{opacity:0;}}
.padview{display:flex;gap:4px;align-items:center;margin:6px 0 8px;font:12px -apple-system,system-ui,sans-serif;color:var(--muted);flex-wrap:wrap;} .padview button{border:1px solid var(--border2);background:var(--card);color:var(--text2);border-radius:999px;padding:5px 11px;font:13px -apple-system,system-ui,sans-serif;cursor:pointer;} .padview button.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.padwork{display:flex;flex-direction:column;gap:10px;}
@media (min-width:1000px) and (pointer:fine){ body:has(#padin) .wrap{max-width:1040px;} #padin{min-height:42vh;} }
body.padbig .wrap{max-width:none!important;padding-left:32px;padding-right:32px;} body.padbig #padin{min-height:68vh;} body.padbig .padwork.v-side .padprev{max-height:calc(100vh - 90px);}
.padview button.big{margin-left:12px;}
.padprev h2.padh,.padprev h3.padh,.padprev h4.padh,#padprint h3.padh,#padprint h4.padh{margin:.9em 0 .3em;font-weight:650;} .padprev h2.padh{font-size:1.25em;} .padprev h3.padh{font-size:1.1em;} .padprev h4.padh{font-size:1em;}
@media (pointer:coarse){ #padin{height:38vh!important;min-height:38vh;resize:none;overflow-y:auto;overscroll-behavior:contain;} .padwork.v-side .padprev{height:38vh;max-height:none;} .padwork.v-pin .padprev{height:28vh;} }
.padwork.v-side{display:grid;grid-template-columns:1fr 1fr;align-items:start;} .padwork.v-side .padprev{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;} body.padside .wrap{max-width:1180px;}
.padwork.v-pin{flex-direction:column-reverse;} .padwork.v-pin .padprev{position:sticky;top:64px;z-index:6;height:34vh;overflow:auto;box-shadow:0 6px 16px rgba(0,0,0,.25);}
@media (max-width:640px){ .padwork.v-side{grid-template-columns:1fr;} }
@media print{ body.printing>*:not(#padprint){display:none!important;} body.printing{background:#fff!important;color:#000!important;} #padprint{display:block;color:#000;font:12pt/1.55 'LineDigits',Georgia,serif;padding:0 6mm;} #padprint h1{font-size:16pt;font-weight:normal;margin:0 0 8pt;} #padprint h2{font-size:12pt;margin:14pt 0 6pt;} #padprint .pq{border-left:2pt solid #999;padding-left:8pt;color:#222;} #padprint p{margin:0 0 7pt;color:#000;} }
#ltx{display:none;position:fixed;z-index:70;background:var(--surf);border-top:1px solid var(--border2);flex-direction:column;}
#ltx.on{display:flex;}
#ltx .lxh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;font:600 14px -apple-system,system-ui,sans-serif;}
#ltx .lxx{border:1px solid var(--border2);background:var(--card2);color:var(--text);border-radius:8px;padding:6px 12px;font:13px -apple-system,system-ui,sans-serif;cursor:pointer;}
#lxq{margin:0 14px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);font:15px -apple-system,system-ui,sans-serif;}
#ltx .lxn{margin:6px 14px 4px;font:12px/1.4 -apple-system,system-ui,sans-serif;color:var(--muted);}
#ltx .lxb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 16px;flex:1;}
#ltx h4{font:600 11px -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;}
#ltx .lxe{display:grid;grid-template-columns:72px 1fr;grid-template-rows:auto auto;gap:0 10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:none;color:var(--text);padding:7px 2px;cursor:pointer;}

<script>
// ===== The articles. Each: title, kind, where (Munkres §), lede (one sentence), sections [[label, html], ...], pre (prerequisite ids).
// Links inside text: [[id]] or [[id|shown text]]. The first section opens by default; the rest stay folded.
var R = String.raw;
var TOPICS = [
  ['Foundations', ['relation-equivalence', 'equivalence-class', 'partition', 'image-preimage']],
  ['Relations', ['relations-map', 'relation', 'relation-equivalence', 'equivalence-class', 'partition', 'relation-order', 'relation-induced', 'homeomorphism-relation', 'equivalence-catalogue']],
  ['Open sets and bases', ['topology', 'open-set', 'standard-topologies', 'finer-coarser', 'basis', 'generated-topology', 'lemma-13-3', 'lemma-13-4', 'subbasis']],
  ['Building new spaces', ['order-topology', 'product-topology', 'subspace-topology', 'quotient-topology']],
  ['Closed sets and limits', ['closed-set', 'closure', 'interior', 'limit-point', 'closure-test', 'closure-limit-points', 'convergence']],
  ['Separation', ['hausdorff', 't1']],
  ['Continuous maps', ['continuous', 'restriction', 'continuity-equivalents', 'pasting-lemma', 'homeomorphism']],
  ['Metric spaces', ['metric', 'ball', 'metric-topology', 'metric-hausdorff', 'epsilon-delta']],
  ['Quotients', ['quotient-topology', 'saturated', 'quotient-map', 'relation-induced', 'maps-out-of-quotients', 'crushing-a-set', 'gluing-examples']],
  ['Methods', ['m-topology', 'm-open', 'm-closed', 'm-closure', 'm-continuous', 'm-hausdorff', 'm-quotient', 'm-compare', 'm-counterexample']],
  ['Example spaces', ['ex-real-line', 'ex-lower-limit', 'ex-k-topology', 'ex-finite-complement', 'ex-discrete', 'ex-indiscrete', 'ex-sierpinski', 'ex-crush-open', 'ex-circle', 'ex-two-origins']],
  ['Worked problems', ['hw7-q1']]
];
// reading order, roughly following Munkres
var ORDER = ['relation-equivalence', 'equivalence-class', 'partition', 'image-preimage', 'topology', 'open-set', 'standard-topologies', 'finer-coarser', 'basis', 'generated-topology', 'lemma-13-3', 'lemma-13-4', 'subbasis', 'order-topology', 'product-topology', 'subspace-topology', 'closed-set', 'closure', 'interior', 'closure-test', 'limit-point', 'closure-limit-points', 'hausdorff', 't1', 'convergence', 'continuous', 'restriction', 'continuity-equivalents', 'pasting-lemma', 'homeomorphism', 'metric', 'ball', 'metric-topology', 'metric-hausdorff', 'epsilon-delta', 'quotient-topology', 'saturated', 'quotient-map', 'relation-induced', 'maps-out-of-quotients', 'crushing-a-set', 'gluing-examples'];
var A = {
// ---------- foundations
'relation-equivalence': {title: 'Equivalence relation', kind: 'definition', where: 'Ch. 1, §3', pre: [],
  lede: R`A rule for when two points count as "the same": reflexive, symmetric and transitive.`,
  sections: [['Definition', R`<p>A relation $\sim$ on $X$ is an <b>equivalence relation</b> if for all $x,y,z\in X$:</p><ul><li><b>reflexive:</b> $x\sim x$;</li><li><b>symmetric:</b> $x\sim y\Rightarrow y\sim x$;</li><li><b>transitive:</b> $x\sim y$ and $y\sim z\Rightarrow x\sim z$.</li></ul>`],
    ['Example', R`<p>On a metric space with $A\subseteq X$: $x\sim_A y$ iff $x=y$ or both $x,y\in A$. This crushes $A$ to a point; see [[crushing-a-set]].</p>`],
    ['Non-example', R`<p>$x<y$ on $\mathbb R$: not reflexive ($x<x$ fails) and not symmetric.</p>`],
    ['Why it matters', R`<p>Its [[equivalence-class|classes]] form a [[partition]], and a partition is exactly what a [[quotient-topology|quotient space]] is built from. The equivalence relations the course uses are collected in [[equivalence-catalogue]]; how they fit with order relations is in [[relations-map]].</p>`]]},
'equivalence-class': {title: 'Equivalence class', kind: 'definition', where: 'Ch. 1, §3', pre: ['relation-equivalence'],
  lede: R`$[x]=\{y\in X: y\sim x\}$, everything that counts as the same as $x$.`,
  sections: [['Definition', R`<p>For an [[relation-equivalence|equivalence relation]] $\sim$ on $X$ and $x\in X$, the class of $x$ is $[x]=\{y\in X : y\sim x\}$. Two classes are either equal or disjoint.</p>
<p><b>A set that is also one point.</b> Recall: a set is a collection, and its members can be anything, including other sets. A team is a set of players: $\{\text{Ann},\text{Bo},\text{Cy}\}$. A league is a set of teams. In the league, each team is one member, even though each team has several players inside it.</p>
<p>An equivalence class is a team in this sense. Inside $X$ it is a collection of points. In the quotient $X/{\sim}$ it is one member. For example, on $X=\{1,2,3,4\}$ with "same parity", $[1]=[3]=\{1,3\}$ and $[2]=[4]=\{2,4\}$, so $X/{\sim}=\{\{1,3\},\{2,4\}\}$ has two members, each of them a set of two numbers. To ask whether a set of classes is open, unpack it: pool the points of its classes into one subset of $X$, which is its preimage under $\pi$.</p>`],
    ['Example', R`<p>For $\sim_A$: if $a\in A$ then $[a]=A$ (every point of $A$ is related to $a$ by the "both in $A$" clause); if $x\notin A$ then $[x]=\{x\}$.</p>`],
    ['Watch out', R`<p>$[x]$ is a <em>set</em> of points of $X$, but a single <em>point</em> of the quotient $X/{\sim}$.</p>`],
    ['Set or collection?', R`<p><b>A class is a set.</b> $[x]=\{y\in X: y\sim x\}$ is a subset of $X$; its elements are points.</p><p><b>All the classes together form a collection.</b> In Munkres, "collection" and "family" are not a new kind of object: they are the words used for a set whose elements are themselves sets, because "a collection of sets" reads more easily than "a set of sets". Every collection is a set. The set of all classes,</p>
$$X/{\sim}=\{[x]: x\in X\},$$
<p>is a collection: the [[partition|partition]] of $X$, which is also the quotient set.</p><p><b>Two roles at once.</b> $[x]$ is a <em>set</em> in $X$, with points inside it, and an <em>element</em> of the collection $X/{\sim}$.</p><p><b>Quick check</b>, with "same parity" on $X=\{1,2,3,4\}$, where</p>
$$[1]=\{1,3\},\qquad X/{\sim}=\{\{1,3\},\{2,4\}\}:$$
<ul class="facts"><li>$1\in[1]$: true. Points are elements of their class.</li><li>$[1]\in X/{\sim}$: true. Classes are elements of the quotient.</li><li>$1\in X/{\sim}$: false. A point is not an element of the collection; its class is.</li></ul>`]]},
'partition': {title: 'Partition', kind: 'definition', where: 'Ch. 1, §3', pre: ['equivalence-class'],
  lede: R`Cutting a set into nonempty pieces with no overlaps and nothing left out.`,
  sections: [['Definition', R`<p>A collection of nonempty, pairwise disjoint subsets of $X$ whose union is $X$.</p>`],
    ['Relation to equivalence', R`<p>The [[equivalence-class|classes]] of any equivalence relation form a partition; conversely, "being in the same piece" is an equivalence relation. They are two descriptions of one thing.</p>`],
    ['Non-example', R`<p>$\{[0,1],[1,2]\}$ on $[0,2]$: the pieces overlap at $1$.</p>`]]},
'image-preimage': {title: 'Image and preimage', kind: 'definition', where: 'Ch. 1, §2', pre: [],
  lede: R`$f(A)$ is where $A$ goes; $f^{-1}(B)$ is everything that lands in $B$.`,
  sections: [['Definition', R`<p>For $f:X\to Y$: $f(A)=\{f(a):a\in A\}$ and $f^{-1}(B)=\{x\in X: f(x)\in B\}$. The preimage makes sense even when $f$ has no inverse.</p>`],
    ['Why preimages', R`<p>Preimages preserve unions, intersections and complements: $f^{-1}(\bigcup B_\alpha)=\bigcup f^{-1}(B_\alpha)$, $f^{-1}(Y\setminus B)=X\setminus f^{-1}(B)$. Images do not preserve intersections. That is why [[continuous|continuity]] is defined with preimages.</p>`]]},
// ---------- open sets and bases
'topology': {title: 'Topology', kind: 'definition', where: '§12', pre: [],
  lede: R`A choice of which subsets of $X$ are called open, closed under unions and finite intersections.`,
  sections: [['Definition', R`<p>A <b>topology</b> on $X$ is a collection $\mathcal T$ of subsets with</p><ol><li>$\varnothing, X\in\mathcal T$;</li><li>any union of members of $\mathcal T$ is in $\mathcal T$;</li><li>any <em>finite</em> intersection of members is in $\mathcal T$.</li></ol><p>The members are the [[open-set|open sets]]; $(X,\mathcal T)$ is a topological space.</p>`],
    ['Intuition', R`<p>These are exactly the properties of open sets in $\mathbb R$ that analysis uses. Taking them as the definition lets the same arguments run where there is no distance at all.</p>`],
    ['Why only finite intersections', R`<p>$\bigcap_n(-\tfrac1n,\tfrac1n)=\{0\}$ is not open in $\mathbb R$, so infinite intersections cannot be allowed.</p>`],
    ['Examples', R`<p>See [[standard-topologies]]. To check a candidate, follow [[m-topology]].</p>`]]},
'open-set': {title: 'Open set', kind: 'definition', where: '§12', pre: ['topology'],
  lede: R`A member of the topology. What "open" means depends entirely on which topology you chose.`,
  sections: [['Definition', R`<p>$U\subseteq X$ is open if $U\in\mathcal T$.</p>`],
    ['In practice', R`<p>Topologies are usually given by a [[basis]], and then $U$ is open iff around each point of $U$ a basis element fits inside $U$ ([[generated-topology]]). In a metric space: a whole [[ball]] fits.</p>`],
    ['Watch out', R`<p>Open is not the opposite of [[closed-set|closed]]. $[0,1)$ is neither in $\mathbb R$; $\varnothing$ and $X$ are both.</p>`]]},
'standard-topologies': {title: 'Discrete, indiscrete and finite-complement topologies', kind: 'example', where: '§12', pre: ['topology'],
  lede: R`The extreme topologies, and one in between that is useful for counterexamples.`,
  sections: [['Discrete', R`<p>Every subset is open. The finest possible topology. See [[ex-discrete]].</p>`],
    ['Indiscrete', R`<p>Only $\varnothing$ and $X$. The coarsest possible. See [[ex-indiscrete]].</p>`],
    ['Finite complement', R`<p>$U$ is open iff $X\setminus U$ is finite, or $U=\varnothing$. On an infinite set any two nonempty open sets meet, so it is [[t1|T₁]] but not [[hausdorff|Hausdorff]]. See [[ex-finite-complement]].</p>`]]},
'finer-coarser': {title: 'Finer and coarser', kind: 'definition', where: '§12', pre: ['topology'],
  lede: R`$\mathcal T'$ is finer than $\mathcal T$ if it has every $\mathcal T$-open set, and possibly more.`,
  sections: [['Definition', R`<p>$\mathcal T'$ is <b>finer</b> than $\mathcal T$ (and $\mathcal T$ <b>coarser</b>) if $\mathcal T\subseteq\mathcal T'$.</p>`],
    ['Intuition', R`<p>More open sets means the topology can tell more points apart, and fewer sequences converge.</p>`],
    ['How to check', R`<p>With bases, use [[lemma-13-3]]; the recipe is [[m-compare]]. Example: [[ex-lower-limit]] is strictly finer than [[ex-real-line|ℝ]].</p>`]]},
'basis': {title: 'Basis', kind: 'definition', where: '§13', pre: ['topology'],
  lede: R`A collection of building blocks: every open set is a union of them.`,
  sections: [['Definition', R`<p>A collection $\mathcal B$ of subsets of $X$ is a <b>basis</b> if</p><ol><li>every $x\in X$ lies in some $B\in\mathcal B$;</li><li>if $x\in B_1\cap B_2$, there is $B_3\in\mathcal B$ with $x\in B_3\subseteq B_1\cap B_2$.</li></ol><p>It generates a topology: see [[generated-topology]].</p>`],
    ['Examples', R`<p>Open intervals in $\mathbb R$; [[ball|open balls]] in a metric space; $[a,b)$ for [[ex-lower-limit]]; open boxes for the [[product-topology]].</p>`],
    ['Non-example', R`<p>Closed intervals $[a,b]$ in $\mathbb R$: $[0,1]\cap[1,2]=\{1\}$ contains no closed interval of positive length around $1$.</p>`],
    ['Watch out', R`<p>A basis is not a topology. It is not closed under unions; its unions are the topology.</p>`]]},
'generated-topology': {title: 'Topology generated by a basis (Lemmas 13.1, 13.2)', kind: 'theorem', where: '§13', pre: ['basis'],
  lede: R`$U$ is open iff around each of its points a basis element fits inside it; equivalently, iff $U$ is a union of basis elements.`,
  sections: [['Statement', R`<p>$U$ is open in the topology generated by $\mathcal B$ iff for every $x\in U$ there is $B\in\mathcal B$ with $x\in B\subseteq U$. <b>Lemma 13.1:</b> these are exactly the unions of elements of $\mathcal B$.</p><p><b>Lemma 13.2:</b> conversely, a collection $\mathcal C$ of open sets is a basis for a given topology if every open $U$ and every $x\in U$ have some $C\in\mathcal C$ with $x\in C\subseteq U$.</p>`],
    ['Why', R`<p>If each $x\in U$ has $B_x$ with $x\in B_x\subseteq U$, then $U=\bigcup_x B_x$. Conversely a union of basis elements has, at each of its points, the basis element that point came from.</p>`],
    ['Use', R`<p>This is the definition used in [[m-open]].</p>`]]},
'lemma-13-3': {title: 'Comparing topologies through bases (Lemma 13.3)', kind: 'theorem', where: '§13', pre: ['basis', 'finer-coarser'],
  lede: R`$\mathcal T'$ is finer than $\mathcal T$ iff every basis element of $\mathcal T$ around $x$ contains a basis element of $\mathcal T'$ around $x$.`,
  sections: [['Statement', R`<p>Let $\mathcal B,\mathcal B'$ generate $\mathcal T,\mathcal T'$. Then $\mathcal T'$ is finer than $\mathcal T$ iff for each $x$ and each $B\in\mathcal B$ with $x\in B$, there is $B'\in\mathcal B'$ with $x\in B'\subseteq B$.</p>`],
    ['Why', R`<p>If $U$ is $\mathcal T$-open and $x\in U$: pick $B$ with $x\in B\subseteq U$, then $B'$ with $x\in B'\subseteq B\subseteq U$. So $U$ is $\mathcal T'$-open by [[generated-topology]].</p>`],
    ['Lemma 13.4', R`<p>[[ex-lower-limit|ℝ_ℓ]] and [[ex-k-topology|ℝ_K]] are each strictly finer than ℝ and not comparable with each other; this lemma is proved with 13.3. See [[lemma-13-4]].</p>`]]},
'lemma-13-4': {title: 'The lower limit and K-topologies compared (Lemma 13.4)', kind: 'theorem', where: '§13', pre: ['lemma-13-3', 'ex-lower-limit', 'ex-k-topology', 'finer-coarser'],
  lede: R`$\mathbb R_\ell$ and $\mathbb R_K$ are each strictly finer than the standard topology on $\mathbb R$, but neither is finer than the other.`,
  sections: [['Statement', R`<p>The topologies of [[ex-lower-limit|$\mathbb R_\ell$]] (basis: all $[a,b)$) and [[ex-k-topology|$\mathbb R_K$]] (basis: all $(a,b)$ and all $(a,b)-K$, where $K=\{\tfrac1n:n\ge1\}$) are each strictly finer than the standard topology on $\mathbb R$ (basis: all $(a,b)$), but are not comparable with one another (Munkres §13).</p>`],
    ['The tool', R`<p>Every comparison runs through [[lemma-13-3]]: $\mathcal T'$ is finer than $\mathcal T$ iff around each point, every basis element of $\mathcal T$ contains a basis element of $\mathcal T'$ around the same point. To show a topology is <em>not</em> finer, find one point $x$ and one basis element around it that contains no basis element of the other topology around $x$.</p>`],
    ['ℝ_ℓ is strictly finer than ℝ', R`<p><b>Finer.</b> Given $x\in(a,b)$, the set $[x,b)$ is a basis element of $\mathbb R_\ell$ with $x\in[x,b)\subseteq(a,b)$. By 13.3, $\mathbb R_\ell$ is finer.</p><p><b>Strictly.</b> Take $x$ and the $\ell$-basis element $[x,d)$. Every open interval $(a,b)$ containing $x$ contains points less than $x$, so none lies inside $[x,d)$. So the standard topology is not finer than $\mathbb R_\ell$.</p>`],
    ['ℝ_K is strictly finer than ℝ', R`<p><b>Finer.</b> Every interval $(a,b)$ is itself a basis element of $\mathbb R_K$, so the condition of 13.3 holds trivially.</p><p><b>Strictly.</b> Take $x=0$ and the $K$-basis element $B=(-1,1)-K$, which contains $0$. Any interval $(a,b)$ containing $0$ contains $\tfrac1n$ for large $n$, a point not in $B$. So no standard basis element around $0$ lies inside $B$.</p>`],
    ['Neither is finer than the other', R`<p><b>$\mathbb R_K$ is not finer than $\mathbb R_\ell$.</b> Take $x=10$ and $[10,11)$. Every $K$-basis element containing $10$ is $(a,b)$ or $(a,b)-K$ with $a\lt10$, so it contains points just below $10$, which are not in $[10,11)$.</p><p><b>$\mathbb R_\ell$ is not finer than $\mathbb R_K$.</b> Take $x=0$ and $(-1,1)-K$. Every $[a,b)$ containing $0$ has $a\le0\lt b$, so it contains $\tfrac1n$ for large $n$, which is not in $(-1,1)-K$.</p>`],
    ['Why it matters', R`<p>It shows that "finer" is not a ladder: two topologies can both refine a third and still not be comparable. $\mathbb R_\ell$ refines $\mathbb R$ by cutting at a point (half-open intervals); $\mathbb R_K$ refines it only near the sequence $\tfrac1n$. Both are also the course's sources of counterexamples later (for instance, $\mathbb R_K$ is Hausdorff but not regular, §31).</p>`]]},
'subbasis': {title: 'Subbasis', kind: 'definition', where: '§13', pre: ['basis'],
  lede: R`Smaller ingredients still: intersect finitely many, then take unions.`,
  sections: [['Definition', R`<p>A collection $\mathcal S$ of subsets whose union is $X$. The topology it generates consists of all unions of finite intersections of elements of $\mathcal S$.</p>`],
    ['Examples', R`<p>Rays $(-\infty,a)$ and $(b,\infty)$ for $\mathbb R$; preimages $\pi_1^{-1}(U),\pi_2^{-1}(V)$ for the [[product-topology]] (Theorem 15.2).</p>`],
    ['Use', R`<p>To check [[continuous|continuity]] it suffices to check preimages of subbasis elements.</p>`]]},
// ---------- building spaces
'order-topology': {title: 'Order topology', kind: 'definition', where: '§14', pre: ['basis'],
  lede: R`On an ordered set, the topology of open intervals (half-open at an end point).`,
  sections: [['Definition', R`<p>Basis: open intervals $(a,b)$; plus $[a_0,b)$ if there is a least element $a_0$, and $(a,b_0]$ if there is a greatest $b_0$.</p>`],
    ['Examples', R`<p>$\mathbb R$ with its order gives the standard topology. Order topologies are [[hausdorff|Hausdorff]] (Theorem 17.11).</p>`]]},
'product-topology': {title: 'Product topology on X × Y', kind: 'definition', where: '§15', pre: ['basis'],
  lede: R`Open sets are unions of open boxes $U\times V$.`,
  sections: [['Definition', R`<p>The topology on $X\times Y$ with [[basis]] all $U\times V$, $U$ open in $X$, $V$ open in $Y$. Theorem 15.1: products of basis elements also form a basis.</p>`],
    ['Which topology a product carries', R`<p>$X\times Y$ by itself is only a <b>set</b>, the pairs $(x,y)$; a set has no topology until one is chosen, and many are possible (discrete, indiscrete, others). The <b>convention</b>: whenever $X$ and $Y$ are spaces and $X\times Y$ is used as a space without further comment, it carries the product topology. Munkres follows this throughout, and so do the homework problems (HW7 Q3: "let $X$ and $Y$ be topological spaces" and the projection $\pi_1:X\times Y\to X$). A different topology would be named explicitly.</p>
<p><b>Why this is the default:</b> it is built from the factors' own open sets, and it is the coarsest topology making both projections continuous ([[defining-by-maps]]). In $\mathbb R\times\mathbb R$ it gives the usual open sets of the plane.</p>
<p><b>What it lets you use:</b> because the boxes form a basis, the open sets of $X\times Y$ are <em>exactly</em> the unions of boxes $U\times V$ (Lemma 13.1); equivalently, around each point of an open $W$ there is a box inside $W$. Either form can start a proof, as in [[hw7-q3]].</p>`],
    ['Watch out', R`<p>Not every open set is a box: an open disc in $\mathbb R^2$ is a union of boxes.</p>`],
    ['Facts', R`<p>The projections are [[continuous]]; a map into a product is continuous iff its components are (Theorem 18.4); products of Hausdorff spaces are [[hausdorff|Hausdorff]].</p>`]]},
'subspace-topology': {title: 'Subspace topology', kind: 'definition', where: '§16', pre: ['topology'],
  lede: R`Open in $Y$ means: what an open set of $X$ cuts out of $Y$.`,
  sections: [['Definition', R`<p>For $Y\subseteq X$: $\mathcal T_Y=\{Y\cap U : U\in\mathcal T\}$. Lemma 16.1: $\{B\cap Y\}$ is a basis when $\mathcal B$ is.</p>`],
    ['Watch out', R`<p>Open in $Y$ is not open in $X$: $[0,\tfrac12)$ is open in $[0,1]$ but not in $\mathbb R$. Lemma 16.2: it is, if $Y$ itself is open in $X$.</p>`],
    ['Related', R`<p>Closed sets of $Y$ are $C\cap Y$ with $C$ closed in $X$, and closures in $Y$ are $\overline A\cap Y$ (Theorems 17.2, 17.4); see [[closed-set]].</p>`]]},
// ---------- closed sets
'closed-set': {title: 'Closed set', kind: 'definition', where: '§17', pre: ['open-set'],
  lede: R`A set whose complement is open.`,
  sections: [['Definition', R`<p>$A$ is <b>closed</b> if $X\setminus A$ is open.</p>`],
    ['Properties (Theorem 17.1)', R`<p>$\varnothing$ and $X$ are closed; arbitrary intersections and finite unions of closed sets are closed. (De Morgan turns the axioms for open sets into these.)</p>`],
    ['Characterization', R`<p>$A$ is closed iff it contains all its [[limit-point|limit points]] ([[closure-limit-points|Corollary 17.7]]).</p>`],
    ['In subspaces', R`<p>Closed in $Y$ iff of the form $C\cap Y$, $C$ closed in $X$ (17.2); if $Y$ is closed in $X$, closed in $Y$ implies closed in $X$ (17.3).</p>`],
    ['Where it matters', R`<p>Closedness of $A$ is what makes [[crushing-a-set]] give a Hausdorff space. Recipe: [[m-closed]].</p>`]]},
'closure': {title: 'Closure', kind: 'definition', where: '§17', pre: ['closed-set'],
  lede: R`$\overline A$: the smallest closed set containing $A$.`,
  sections: [['Definition', R`<p>$\overline A$ is the intersection of all closed sets containing $A$. It is closed, and $A\subseteq\overline A$.</p>`],
    ['Working test', R`<p>$x\in\overline A$ iff every open set (or basis element) containing $x$ meets $A$: the [[closure-test]].</p>`],
    ['Examples', R`<p>$\overline{(0,1)}=[0,1]$ in $\mathbb R$, but $[0,1)$ in [[ex-lower-limit|ℝ_ℓ]]. $\overline{\mathbb Q}=\mathbb R$.</p>`],
    ['Related', R`<p>[[closure-limit-points|$\overline A = A\cup A'$]]; recipe [[m-closure]]; the dual notion is [[interior]].</p>`]]},
'interior': {title: 'Interior', kind: 'definition', where: '§17', pre: ['open-set'],
  lede: R`$\operatorname{Int}A$: the largest open set inside $A$.`,
  sections: [['Definition', R`<p>The union of all open sets contained in $A$.</p>`], ['Example', R`<p>$\operatorname{Int}[0,1]=(0,1)$ in $\mathbb R$; $\operatorname{Int}\mathbb Q=\varnothing$.</p>`], ['Relation to closure', R`<p>$X\setminus\operatorname{Int}A=\overline{X\setminus A}$.</p>`]]},
'closure-test': {title: 'The closure test (Theorem 17.5)', kind: 'theorem', where: '§17', pre: ['closure'],
  lede: R`$x\in\overline A$ iff every open set containing $x$ meets $A$.`,
  sections: [['Statement', R`<p>$x\in\overline A$ iff every open $U\ni x$ intersects $A$. If the topology is given by a [[basis]], "every basis element containing $x$" suffices.</p>`],
    ['Why', R`<p>If some open $U\ni x$ misses $A$, then $X\setminus U$ is a closed set containing $A$ and not $x$, so $x\notin\overline A$. If $x\notin\overline A$, some closed $C\supseteq A$ misses $x$, and $X\setminus C$ is an open set around $x$ missing $A$.</p>`],
    ['Use', R`<p>The main tool in [[m-closure]].</p>`]]},
'limit-point': {title: 'Limit point', kind: 'definition', where: '§17', pre: ['open-set'],
  lede: R`Points of $A$ crowd in on $x$: every neighbourhood of $x$ meets $A$ somewhere other than $x$.`,
  sections: [['Definition', R`<p>$x$ is a <b>limit point</b> of $A$ if every neighbourhood of $x$ contains a point of $A$ other than $x$. $A'$ denotes the set of limit points.</p>`],
    ['Examples', R`<p>$0$ is a limit point of $(0,1)$ and of $\{1/n\}$. In $\{0\}\cup[1,2]$, the point $0$ is not a limit point (it is isolated).</p>`],
    ['In a metric space', R`<p>For $x\notin A$: $x$ is a limit point iff $d(x,A)=\inf_{a\in A}d(x,a)=0$. This is the gap that closedness guarantees in [[crushing-a-set]].</p>`],
    ['Related', R`<p>[[closure-limit-points]]; in [[t1|T₁]] spaces every neighbourhood then meets $A$ in infinitely many points (Theorem 17.9).</p>`]]},
'closure-limit-points': {title: 'Closure = set plus limit points (Theorem 17.6)', kind: 'theorem', where: '§17', pre: ['closure', 'limit-point'],
  lede: R`$\overline A=A\cup A'$, so $A$ is closed exactly when it contains its limit points.`,
  sections: [['Statement', R`<p>$\overline A=A\cup A'$. <b>Corollary 17.7:</b> $A$ is closed iff $A'\subseteq A$.</p>`],
    ['Why', R`<p>Both sides consist of the points every neighbourhood of which meets $A$ ([[closure-test]]): either the point is in $A$, or the neighbourhoods meet $A$ elsewhere.</p>`],
    ['Example', R`<p>$A=(0,1)$: $A'=[0,1]$, so $A$ is not closed; its missing limit points $0,1$ are what break [[ex-crush-open]].</p>`]]},
'convergence': {title: 'Convergence of sequences', kind: 'definition', where: '§17', pre: ['open-set'],
  lede: R`$x_n\to x$ if every neighbourhood of $x$ contains all but finitely many $x_n$.`,
  sections: [['Definition', R`<p>$x_n\to x$ if for every open $U\ni x$ there is $N$ with $x_n\in U$ for all $n\ge N$.</p>`],
    ['Uniqueness (Theorem 17.10)', R`<p>In a [[hausdorff|Hausdorff]] space a sequence has at most one limit: disjoint neighbourhoods of two limits cannot both contain the tail.</p>`],
    ['Non-example', R`<p>In the [[ex-indiscrete|indiscrete]] topology every sequence converges to every point.</p>`]]},
// ---------- separation
'hausdorff': {title: 'Hausdorff space', kind: 'definition', where: '§17', pre: ['open-set'],
  lede: R`Any two distinct points have disjoint open neighbourhoods.`,
  sections: [['Definition', R`<p>$X$ is <b>Hausdorff</b> if for all $x\neq y$ there are open $U\ni x$, $V\ni y$ with $U\cap V=\varnothing$.</p>`],
    ['Intuition', R`<p>Points can be put in separate bubbles. This is what makes limits unique ([[convergence|Theorem 17.10]]) and single points closed (Theorem 17.8).</p>`],
    ['Examples', R`<p>[[metric-hausdorff|Every metric space]]; [[order-topology|order topologies]], subspaces and [[product-topology|products]] of Hausdorff spaces (17.11); a [[crushing-a-set|closed set crushed to a point]].</p>`],
    ['Non-examples', R`<p>[[ex-finite-complement]], [[ex-indiscrete]], [[ex-crush-open]], [[ex-two-origins]].</p>`],
    ['How to prove it', R`<p>[[m-hausdorff]].</p>`]]},
't1': {title: 'T₁ space', kind: 'definition', where: '§17', pre: ['closed-set'],
  lede: R`Every single point is a closed set. Weaker than Hausdorff.`,
  sections: [['Definition', R`<p>$X$ is T₁ if every finite set (equivalently every point) is closed.</p>`],
    ['Relation', R`<p>[[hausdorff|Hausdorff]] implies T₁ (Theorem 17.8). Not conversely: [[ex-finite-complement]] is T₁ but not Hausdorff.</p>`]]},
// ---------- continuity
'continuous': {title: 'Continuous function', kind: 'definition', where: '§18', pre: ['open-set', 'image-preimage'],
  lede: R`Preimages of open sets are open.`,
  sections: [['Definition', R`<p>$f:X\to Y$ is <b>continuous</b> if $f^{-1}(V)$ is open in $X$ for every open $V\subseteq Y$. It is enough to check [[basis]] (or [[subbasis]]) elements of $Y$.</p>`],
    ['Intuition', R`<p>Points near $x$ go near $f(x)$, said with open sets instead of distances. In metric spaces it is exactly [[epsilon-delta]].</p>`],
    ['Examples', R`<p>Constants, the identity, inclusions of subspaces, projections from products, compositions of continuous maps (Theorem 18.2).</p>`],
    ['Non-example', R`<p>The identity $\mathbb R\to\mathbb R_\ell$: $[0,1)$ is open in [[ex-lower-limit|ℝ_ℓ]] but its preimage is not open in $\mathbb R$.</p>`],
    ['Related', R`<p>[[continuity-equivalents]], [[pasting-lemma]], [[homeomorphism]], recipe [[m-continuous]].</p>`]]},
'restriction': {title: 'Restriction of a function', kind: 'definition', where: '§18', pre: ['continuous', 'subspace-topology'],
  lede: R`The same rule, used only on a subset of the domain. Restricting a continuous map keeps it continuous (Theorem 18.2(d)).`,
  sections: [['Definition', R`<p>Let $f:X\to Y$ be a function and $C\subseteq X$. The <b>restriction of $f$ to $C$</b>, written $f|_C$ and read "$f$ restricted to $C$", is the function $$f|_C:C\to Y,\qquad f|_C(c)=f(c)\ \text{for every } c\in C.$$ Only the domain changes, from $X$ to the smaller set $C$. Every point of $C$ goes where it went before; the points outside $C$ are no longer inputs.</p>`],
    ['Example', R`<p>$f:\mathbb R\to\mathbb R$, $f(t)=t^2$, and $C=[0,1]$. Then $f|_{[0,1]}:[0,1]\to\mathbb R$ is still $t\mapsto t^2$, but accepts only inputs from $[0,1]$: $f|_{[0,1]}(\tfrac12)=\tfrac14=f(\tfrac12)$, while $f|_{[0,1]}(5)$ is not defined, since $5\notin[0,1]$.</p>
<p>A restriction can have properties the original map lacks. $f(t)=t^2$ is not injective on $\mathbb R$ ($f(-1)=f(1)$), but $f|_{[0,1]}$ is. In the same way, a map to $\{0,1\}$ need not be constant on $X$, but its restriction to a connected subset is ([[hw9-q2]]).</p>`],
    ['Why it is defined this way', R`<p>Many theorems apply only to maps whose domain has some property: connected, compact, closed. When the whole domain $X$ lacks the property but a subset $C$ has it, restricting gives a map with domain $C$, to which the theorem applies. Whatever it proves about $f|_C$ is then a statement about $f$ at the points of $C$, because the two agree there.</p>`],
    ['Restrictions of continuous maps are continuous', R`<p><b>Theorem 18.2(d).</b> If $f:X\to Y$ is [[continuous]] and $C\subseteq X$ has the [[subspace-topology|subspace topology]], then $f|_C:C\to Y$ is continuous.</p>
<p><b>Recall:</b> $g:A\to B$ is continuous when $g^{-1}(V)$ is open in $A$ for every open $V\subseteq B$. <b>Recall:</b> the open sets of the subspace $C$ are exactly the sets $C\cap U$ with $U$ open in $X$.</p>
<p><b>The preimage.</b> A point $c$ lies in $(f|_C)^{-1}(V)$ exactly when $c\in C$ and $f|_C(c)\in V$. Since $f|_C(c)=f(c)$, this says $c\in C$ and $f(c)\in V$, so $$(f|_C)^{-1}(V)=C\cap f^{-1}(V).$$ The restricted preimage is the old preimage cut down to $C$.</p>
<p><b>It is open in $C$.</b> $f$ is continuous and $V$ is open, so $f^{-1}(V)$ is open in $X$. Then $C\cap f^{-1}(V)$ is $C$ intersected with an open set of $X$, which is open in $C$ by the definition of the subspace topology.</p>`],
    ['Related', R`<p>The <b>inclusion</b> $i:C\to X$, $i(c)=c$, gives another way to write it: $f|_C=f\circ i$, a composite of continuous maps (Theorem 18.2(b), (c)). Used in [[hw9-q2]] and [[hw7-q5]]. The reverse move, building one map on $X$ from maps on pieces, is the [[pasting-lemma]].</p>`]]},
'continuity-equivalents': {title: 'Equivalent forms of continuity (Theorem 18.1)', kind: 'theorem', where: '§18', pre: ['continuous', 'closure'],
  lede: R`Continuity can be checked with closures, closed sets, or neighbourhoods.`,
  sections: [['Statement', R`<p>For $f:X\to Y$ these are equivalent: (1) $f$ is continuous; (2) $f(\overline A)\subseteq\overline{f(A)}$ for every $A\subseteq X$; (3) preimages of [[closed-set|closed sets]] are closed; (4) for each $x$ and each open $V\ni f(x)$ there is an open $U\ni x$ with $f(U)\subseteq V$.</p>`],
    ['Why (1)⇔(3)', R`<p>$f^{-1}(Y\setminus C)=X\setminus f^{-1}(C)$; see [[image-preimage]].</p>`]]},
'pasting-lemma': {title: 'Pasting lemma (Theorem 18.3)', kind: 'theorem', where: '§18', pre: ['continuous', 'closed-set'],
  lede: R`Two continuous pieces on closed sets that agree on the overlap glue into a continuous map.`,
  sections: [['Statement', R`<p>If $X=A\cup B$ with $A,B$ closed, and $f:A\to Y$, $g:B\to Y$ are continuous and agree on $A\cap B$, then $h=f\cup g:X\to Y$ is continuous.</p>`],
    ['Why', R`<p>For closed $C$: $h^{-1}(C)=f^{-1}(C)\cup g^{-1}(C)$. Each piece is closed in $A$ or $B$, hence in $X$ (Theorem 17.3), and a finite union of closed sets is closed.</p>`],
    ['Watch out', R`<p>It fails for non-closed pieces: $f=0$ on $(-\infty,0)$ and $g=1$ on $[0,\infty)$.</p>`]]},
'homeomorphism': {title: 'Homeomorphism', kind: 'definition', where: '§18', pre: ['continuous'],
  lede: R`A bijection that is continuous both ways: the same space with the points renamed.`,
  sections: [['Definition', R`<p>A bijection $f:X\to Y$ with $f$ and $f^{-1}$ both [[continuous]].</p>`],
    ['Examples', R`<p>$(-1,1)\cong\mathbb R$ via $x\mapsto x/(1-x^2)$. [[ex-circle|An interval with ends glued]] is a circle.</p>`],
    ['Watch out', R`<p>$[0,1)\to S^1$, $t\mapsto(\cos2\pi t,\sin2\pi t)$, is a continuous bijection whose inverse is not continuous: it tears the circle open at $(1,0)$.</p>`]]},
// ---------- metric
'metric': {title: 'Metric', kind: 'definition', where: '§20', pre: [],
  lede: R`A distance function: positive, symmetric, with the triangle inequality.`,
  sections: [['Definition', R`<p>$d:X\times X\to\mathbb R$ with $d(x,y)\ge0$, equality iff $x=y$; $d(x,y)=d(y,x)$; and the <b>triangle inequality</b> $d(x,z)\le d(x,y)+d(y,z)$.</p>`],
    ['What it gives', R`<p>[[ball|Balls]], and from them the [[metric-topology]].</p>`],
    ['Examples', R`<p>Euclidean distance on $\mathbb R^n$; the discrete metric ($d=1$ for distinct points), which gives the [[ex-discrete|discrete topology]].</p>`]]},
'ball': {title: 'Open ball', kind: 'definition', where: '§20', pre: ['metric'],
  lede: R`$B(x,\varepsilon)=\{y: d(x,y)<\varepsilon\}$.`,
  sections: [['Definition', R`<p>The set of points at distance less than $\varepsilon$ from $x$.</p>`],
    ['Balls are open', R`<p>If $y\in B(x,\varepsilon)$, set $\delta=\varepsilon-d(x,y)>0$. For $z\in B(y,\delta)$: $d(x,z)\le d(x,y)+d(y,z)<d(x,y)+\delta=\varepsilon$. So $B(y,\delta)\subseteq B(x,\varepsilon)$.</p>`],
    ['Use', R`<p>The basis of the [[metric-topology]]; the standard tool in [[m-open]] and [[m-hausdorff]].</p>`]]},
'metric-topology': {title: 'Metric topology', kind: 'definition', where: '§20', pre: ['ball', 'basis'],
  lede: R`Open means: around each point, a whole ball fits inside.`,
  sections: [['Definition', R`<p>The topology with [[basis]] the open balls. $U$ is open iff for each $x\in U$ some $B(x,\varepsilon)\subseteq U$.</p>`],
    ['Metrizable', R`<p>A space is metrizable if its topology comes from some metric. Metrizable spaces are [[hausdorff|Hausdorff]], so [[ex-finite-complement]] is not metrizable.</p>`]]},
'metric-hausdorff': {title: 'Every metric space is Hausdorff', kind: 'theorem', where: '§20', pre: ['metric-topology', 'hausdorff'],
  lede: R`Balls of radius $d(x,y)/2$ around $x$ and $y$ are disjoint.`,
  sections: [['Proof', R`<p>Let $x\neq y$ and $r=d(x,y)/2>0$. If $z\in B(x,r)\cap B(y,r)$, then $d(x,y)\le d(x,z)+d(z,y)<2r=d(x,y)$, a contradiction.</p>`],
    ['Where it is used', R`<p>Case 1 of [[hw7-q1]] is this argument with the radius also shrunk to avoid $A$.</p>`]]},
'epsilon-delta': {title: 'ε–δ continuity (Theorem 21.1)', kind: 'theorem', where: '§21', pre: ['continuous', 'metric-topology'],
  lede: R`Between metric spaces, continuity is the familiar ε–δ condition.`,
  sections: [['Statement', R`<p>$f:X\to Y$ between metric spaces is [[continuous]] iff for every $x$ and $\varepsilon>0$ there is $\delta>0$ with $d(x,y)<\delta\Rightarrow d(f(x),f(y))<\varepsilon$.</p>`],
    ['Why', R`<p>The condition says $f(B(x,\delta))\subseteq B(f(x),\varepsilon)$: form (4) of [[continuity-equivalents]] with [[ball|balls]] as neighbourhoods.</p>`]]},
// ---------- quotients
'quotient-topology': {title: 'Quotient topology', kind: 'definition', where: '§22', pre: ['partition', 'open-set'],
  lede: R`Glue points together; a set of glued points is open iff everything lying over it is open.`,
  sections: [['Definition', R`<p>Let $X^*$ be a [[partition]] of $X$ and $p:X\to X^*$ send each point to its piece. Then $U\subseteq X^*$ is open iff $p^{-1}(U)$ is open in $X$. $X^*$ is the <b>quotient space</b>.</p>`],
    ['Intuition', R`<p>It is the largest topology for which $p$ is [[continuous]]. Openness upstairs is decided entirely downstairs.</p>`],
    ['Getting open sets in', R`<p>Push down open sets that are [[saturated]]. Recipe: [[m-quotient]].</p>`],
    ['Watch out', R`<p>Quotients of nice spaces can be badly behaved: [[ex-crush-open]] is not Hausdorff.</p>`],
    ['Examples', R`<p>[[crushing-a-set]], [[gluing-examples]].</p>`]]},
'saturated': {title: 'Saturated set', kind: 'definition', where: '§22', pre: ['quotient-topology'],
  lede: R`A union of whole pieces; it never contains part of a glued piece without the rest.`,
  sections: [['Definition', R`<p>$C\subseteq X$ is saturated if $C=p^{-1}(p(C))$.</p>`],
    ['Key fact', R`<p>If $C$ is open and saturated, then $p^{-1}(p(C))=C$ is open, so $p(C)$ is open in $X^*$. This is how open sets of a quotient are built.</p>`],
    ['Why pulling back can grow a set', R`<p>$p^{-1}(p(C))$ is everything equivalent to something in $C$. If $C$ contains part of a piece, the pullback drags in the rest.</p>`],
    ['Example', R`<p>For a crushed set $A$: any set containing all of $A$ or none of it. Used in both cases of [[hw7-q1]].</p>`]]},
'quotient-map': {title: 'Quotient map', kind: 'definition', where: '§22', pre: ['quotient-topology', 'continuous'],
  lede: R`A surjection for which $U$ is open exactly when $p^{-1}(U)$ is open.`,
  sections: [['Definition', R`<p>A surjective $p:X\to Y$ such that $U\subseteq Y$ is open iff $p^{-1}(U)$ is open in $X$. Stronger than [[continuous]], which is only the "if $U$ open then $p^{-1}(U)$ open" half.</p>`],
    ['Sufficient conditions', R`<p>A continuous surjection that is an open map, or a closed map, is a quotient map.</p>`]]},
'maps-out-of-quotients': {title: 'Maps out of a quotient (Theorem 22.2)', kind: 'theorem', where: '§22', pre: ['quotient-map'],
  lede: R`A map on $X$ that is constant on each piece descends to a continuous map on the quotient.`,
  sections: [['Statement', R`<p>Let $p:X\to Y$ be a quotient map and $h:X\to Z$ continuous and constant on each $p^{-1}(\{y\})$. Then $h$ induces $g:Y\to Z$ with $g\circ p=h$, and $g$ is continuous.</p>`],
    ['Use', R`<p>Define maps on a glued space by defining them upstairs. Example in [[gluing-examples]].</p>`]]},
'crushing-a-set': {title: 'Crushing a set to a point', kind: 'idea', where: '§22 · HW7', pre: ['quotient-topology', 'saturated', 'closed-set'],
  lede: R`Collapse $A\subseteq X$ to one point. The result is Hausdorff when $A$ is closed in a metric space, and can fail otherwise.`,
  sections: [['Setup', R`<p>$x\sim_A y$ iff $x=y$ or both in $A$. The points of $X/{\sim_A}$ are $[A]$ and $\{x\}$ for $x\notin A$ ([[equivalence-class]]).</p>`],
    ['Picture', '<canvas id="qfig" class="figc" width="560" height="170" aria-label="Crushing A to a point"></canvas><div class="figctl"><label>x <input id="qx" type="range" min="0" max="1000" value="180"></label><label><input id="qclosed" type="checkbox" checked> A closed</label></div><p id="qmsg" class="figmsg"></p>'],
    ['Saturated sets', '<canvas id="satfig" class="figc" width="560" height="236" aria-label="A draggable open interval S, its image, and the preimage of its image"></canvas><div class="figctl"><span>Drag an endpoint of S, or drag the middle to move it.</span></div><p id="satmsg" class="figmsg"></p>' + R`<p>A set is saturated iff it is a union of whole equivalence classes. Here the only non-singleton class is $A$, so $S$ is saturated iff it contains all of $A$ or none of $A$. For a saturated open set, $\pi^{-1}(\pi(S))=S$ is open, so $\pi(S)$ is open in the quotient. This is why the separation argument only pushes forward saturated sets like $U$ and $W$.</p>`],
    ['Why closed matters', R`<p>For $x\notin A$ with $A$ closed there is $r>0$ with $B(x,r)\cap A=\varnothing$, a gap. For $A=(0,1)$ and $x=0$ there is no gap: $d(0,A)=0$, every open set around $\{0\}$ contains $[A]$, and the quotient is not Hausdorff ([[ex-crush-open]]).</p>`],
    ['The proof', R`<p>Written out in [[hw7-q1]].</p>`]]},
'gluing-examples': {title: 'Gluing examples', kind: 'example', where: '§22', pre: ['quotient-topology', 'homeomorphism'],

  sections: [['Circle', R`<p>$[0,1]/\{0\sim1\}\cong S^1$: $h(t)=(\cos2\pi t,\sin2\pi t)$ is constant on $\{0,1\}$, so it induces a continuous bijection $[0,1]/{\sim}\to S^1$ ([[maps-out-of-quotients]]); compactness (Ch. 3) makes it a [[homeomorphism]]. See [[ex-circle]].</p>`],

'ex-finite-complement': {title: 'Finite complement topology', kind: 'example', where: '§12', pre: ['topology', 'open-set', 'closed-set'],
  lede: 'Open sets are the sets missing only finitely many points (plus the empty set). Closed sets are the finite sets (plus the whole space).',
  sections: [
  ['What it is', R`<p>A topology where the open sets are <b>huge</b>: a nonempty open set contains all of $X$ except at most finitely many points. To make an open set you start with everything and throw away a finite list of points. Equivalently, the <b>closed</b> sets are just the <b>finite</b> sets (and $X$ itself).</p>
<p>On $\mathbb R$: $\mathbb R\setminus\{0\}$ is open; $\mathbb R\setminus\{1,2,3\}$ is open; but the interval $(0,1)$ is <em>not</em> open, because it leaves out infinitely many points. So this is a very different topology from the usual one, even on the same set.</p>`],
  ['Definition', R`<p>Let $X$ be a set. The <b>finite complement topology</b> (or cofinite topology) is</p>$$\mathcal T_f=\{U\subseteq X:\ X\setminus U \text{ is finite, or } U=\varnothing\}$$<p>(Munkres §12, Example 3). A set is closed exactly when its complement is open, so the closed sets are the finite subsets of $X$ together with $X$.</p>`],
  ['Examples', R`<ul class="facts"><li>On $\mathbb R$: open sets include $\mathbb R$, $\mathbb R\setminus\{0\}$, $\mathbb R\setminus\{1,\tfrac12,\tfrac13\}$; not open: $(0,1)$, $(0,\infty)$, $\mathbb Z$, $\mathbb Q$.</li><li>Closed sets on $\mathbb R$: $\varnothing$, $\{5\}$, $\{1,2,3\}$, $\mathbb R$. Not closed: $[0,1]$, $\mathbb Z$ (both infinite but not everything).</li><li>On a <b>finite</b> set $X$, every subset has finite complement, so every subset is open: the topology is [[ex-discrete|discrete]]. The interesting case is an infinite $X$.</li></ul>`],
  ['Why it is a topology', R`<p>Check the three axioms by looking at complements, where "finite" is easy to track.</p><ul><li><b>$\varnothing$ and $X$:</b> $\varnothing$ is allowed by name; $X\setminus X=\varnothing$ is finite.</li><li><b>Any union:</b> if each $U_\alpha$ is nonempty and open, the complement of $\bigcup U_\alpha$ is $\bigcap(X\setminus U_\alpha)$ (De Morgan), which sits inside any one $X\setminus U_\alpha$, a finite set. A subset of a finite set is finite. (Empty $U_\alpha$ add nothing to the union.)</li><li><b>Finite intersections:</b> the complement of $U_1\cap\dots\cap U_n$ is $(X\setminus U_1)\cup\dots\cup(X\setminus U_n)$, a finite union of finite sets, so finite. (If some $U_i$ is empty, the intersection is $\varnothing$, which is open.)</li></ul>`],
  ['Why it is defined this way', R`<p>It is the <b>smallest topology in which every single point is closed</b>. If points are closed, finite unions of points (finite sets) are closed, so their complements must be open; the finite complement topology contains exactly those and nothing more. So it is the coarsest [[t1|T₁]] topology on $X$: it is the test case for "what follows just from points being closed?"</p>`],
  ['Facts to keep in mind', R`<ul class="facts"><li><b>Points are closed</b> ($T_1$): $\{x\}$ is finite.</li><li><b>Not Hausdorff</b> on an infinite set: two nonempty open sets $U,V$ always meet. Their complements are finite, so $(X\setminus U)\cup(X\setminus V)$ is finite and cannot be all of the infinite $X$; a point outside it lies in $U\cap V$.</li><li><b>Connected</b> on an infinite set, for the same reason: there are no two disjoint nonempty open sets at all.</li><li><b>Closure:</b> a finite set is its own closure; an infinite set is dense, $\overline A=X$ ([[hw2-q3]]), since the only closed set containing infinitely many points is $X$.</li><li><b>Sequences:</b> a sequence of distinct points converges to <em>every</em> point, because each open set misses only finitely many terms. Limits are not unique, as expected without Hausdorff.</li><li><b>Coarser than the usual topology on $\mathbb R$:</b> every cofinite-open set is open in $\mathbb R$ (finite sets are closed in $\mathbb R$), but not conversely.</li><li><b>Maps into it:</b> every injective $f:\mathbb R\to\mathbb R_f$ is continuous ([[mt-q4]]): the preimage of a finite set under an injective map is finite, hence closed.</li></ul>`],
  ['Why not Hausdorff, in a picture', R`<p>Think of an open set as "almost everything". Two sets that are each almost everything cannot avoid each other: each one is missing only a few points, and together they are missing only a few points, so most points lie in both. Separating two points would need two open sets that are far apart, and in this topology there is no room for that.</p>`],
  ['Where it sits', R`<p>A standard example from §12, used throughout §17 (closure, limit points, $T_1$ versus Hausdorff) and in true/false questions ([[gallery]]). <em>Beyond the course:</em> on the complex numbers, the finite complement topology is the Zariski topology of algebraic geometry, whose closed sets are the zero sets of polynomials; a nonzero polynomial in one variable has finitely many roots.</p>`]]},
'ex-discrete': {title: 'Discrete space', kind: 'example', where: '§12', pre: ['standard-topologies'], lede: 'Every subset is open (so every subset is also closed); every map out of it is continuous.', sections: []},
'ex-indiscrete': {title: 'Indiscrete space', kind: 'example', where: '§12', pre: ['standard-topologies'], lede: R`Only $\varnothing$ and $X$; every map into it is continuous.`, sections: []},
'ex-sierpinski': {title: 'Sierpiński space', kind: 'example', where: '§12', pre: ['topology'], lede: R`$\{0,1\}$ with open sets $\varnothing,\{1\},\{0,1\}$.`, sections: [['Facts', R`<p>Not [[t1|T₁]]: $\{1\}$ is open, so $\{0\}$ is closed, but $\{1\}$ is not closed. The smallest space that is neither discrete nor indiscrete.</p>`]]},
'ex-crush-open': {title: 'ℝ/(0,1): crushing a set that is not closed', kind: 'example', where: '§22', pre: ['quotient-topology', 'limit-point'], lede: R`Collapsing $(0,1)$ to a point gives a non-Hausdorff space.`, sections: [['Why', R`<p>Any open $V\ni\{0\}$ has $p^{-1}(V)$ open in $\mathbb R$ containing $0$, so containing $(-\varepsilon,\varepsilon)$, which meets $(0,1)$. So $[(0,1)]\in V$. Every neighbourhood of $\{0\}$ contains the crushed point.</p>`], ['Also', R`<p>$\{[(0,1)]\}$ is not closed, since its preimage $(0,1)$ is not closed: the space is not even [[t1|T₁]].</p>`]]},
'ex-circle': {title: 'Circle from an interval', kind: 'example', where: '§22', pre: ['gluing-examples'], lede: R`$[0,1]$ with $0\sim1$ is homeomorphic to $S^1$.`, sections: [['Why', R`<p>See [[gluing-examples]].</p>`]]},
'ex-two-origins': {title: 'Line with two origins', kind: 'example', where: '§22', pre: ['quotient-topology'], lede: 'Two copies of ℝ glued everywhere except 0. Looks like ℝ near each point but is not Hausdorff.', sections: [['Why not Hausdorff', R`<p>Any neighbourhoods of the two origins contain intervals $(-\varepsilon,0)\cup(0,\varepsilon)$ that are glued together, so they meet.</p>`]]},
// ---------- worked
'hw7-q1': {title: 'HW7 Q1: crushing a closed set', kind: 'worked', where: 'Homework 7', pre: ['crushing-a-set', 'm-quotient', 'm-hausdorff'],
  lede: R`For a closed $A$ in a metric space, $X/{\sim_A}$ is Hausdorff. Set up as in our session; check the wording on the sheet.`,
  sections: [['(a) The classes', R`<p>If $a\in A$: every $y\in A$ is related to $a$ by the "both in $A$" clause, and no $y\notin A$ is. So $[a]=A$. If $x\notin A$, only $y=x$ is related, so $[x]=\{x\}$. Hence $X/{\sim_A}=\{A\}\cup\{\{x\}:x\in X\setminus A\}$.</p>`],
    ['(b) Setup', R`<p>$\pi:X\to X/{\sim_A}$, $\pi(z)=[z]$. $U$ is open in $X/{\sim_A}$ iff $\pi^{-1}(U)$ is open in $X$. If $W\subseteq X$ is open and contains all of $A$ or none of it, it is [[saturated]], so $\pi(W)$ is open.</p>`],
    ['(b) Case 1: two singletons', R`<p>$\{x\},\{y\}$ with $x\ne y$, $x,y\notin A$. Since $A$ is closed there are $r_x,r_y>0$ with $B(x,r_x)\cap A=\varnothing=B(y,r_y)\cap A$. Let $r=\min(\tfrac{d(x,y)}2,r_x,r_y)$. The balls $B(x,r),B(y,r)$ miss $A$, so their images are open; if $z$ were in both, $d(x,y)<2r\le d(x,y)$. So the images are disjoint open sets around $\{x\},\{y\}$.</p>`],
    ['(b) Case 2: [A] and a singleton', R`<p>Choose $r>0$ with $B(x,r)\cap A=\varnothing$. Let $U=B(x,\tfrac r2)$ and $W=\{z: d(z,x)>\tfrac r2\}$. Both are open; $U$ misses $A$ and $A\subseteq W$, so both are saturated; they are disjoint. So $\pi(U)\ni\{x\}$ and $\pi(W)\ni[A]$ separate the points.</p>`],
    ['Conclusion', R`<p>Every pair of distinct points is separated, so $X/{\sim_A}$ is [[hausdorff|Hausdorff]]. $\blacksquare$</p>`],
    ['Why the hypothesis', R`<p>Without closedness it fails: [[ex-crush-open]].</p>`]]}
};

  lede: R`$\pi_1(x,y)=x$: continuous, and an open map, but not always a closed map.`,
  sections: [['Continuous', R`<p>$\pi_1^{-1}(U)=U\times Y$ is open, so $\pi_1$ is [[continuous]].</p>`],
    ['Open (HW2 Q2, HW7 Q3a)', R`<p>If $W$ is open and $(x,y)\in W$, a box $U\times V\ni(x,y)$ fits in $W$; then $x\in U\subseteq\pi_1(W)$. So $\pi_1(W)$ is open: an [[open-map]].</p>`],
    ['Not closed (HW7 Q3b)', R`<p>The hyperbola $\{xy=1\}\subset\mathbb R^2$ is closed, but its projection $\mathbb R\setminus\{0\}$ is not closed.</p>`]]},
'dense': {title: 'Dense set', kind: 'definition', where: '§17', pre: ['closure'],
  lede: R`$A$ is dense in $X$ if $\overline A=X$: every nonempty open set meets $A$.`,
  sections: [['Example', R`<p>$\mathbb Q$ is dense in $\mathbb R$.</p>`],
    ['Use (HW3 Q3)', R`<p>Two continuous maps into a [[hausdorff|Hausdorff]] space that agree on a dense set agree everywhere: the set where they agree is closed and contains $A$, so it contains $\overline A=X$.</p>`]]},
'embedding': {title: 'Embedding', kind: 'definition', where: '§18', pre: ['homeomorphism', 'subspace-topology'],
  lede: R`An injective continuous map that is a homeomorphism onto its image.`,
  sections: [['Definition', R`<p>$f:X\to Y$ is an embedding if $f:X\to f(X)$ is a [[homeomorphism]], with $f(X)$ given the [[subspace-topology]].</p>`],
    ['Where it appears', R`<p>HW3 Q4(b): with $g\circ f=\mathrm{id}_X$, $g|_{f(X)}$ is the continuous inverse.</p>`]]},
'open-map': {title: 'Open and closed maps', kind: 'definition', where: '§18, §22', pre: ['continuous', 'image-preimage'],
  lede: R`$f$ is open if images of open sets are open; closed if images of closed sets are closed. Neither implies continuity.`,
  sections: [['Definition', R`<p>$f:X\to Y$ is an <b>open map</b> if $f(U)$ is open for every open $U\subseteq X$, and a <b>closed map</b> if $f(C)$ is closed for every closed $C$.</p>`],
    ['Independent of continuity', R`<p>A constant map is continuous but usually not open. A bijection onto a finer topology can be open without being continuous (HW7 Q6b).</p>`],
    ['For bijections (HW7 Q6a)', R`<p>If $f$ is a bijection, $f(X\setminus U)=Y\setminus f(U)$, so $f$ is open iff it is closed.</p>`],
    ['Relation to quotient maps', R`<p>A continuous surjective open (or closed) map is a [[quotient-map]]; the converse fails (HW7 Q2, Q4c).</p>`],
    ['Method', R`<p>[[m-open-map]].</p>`]]},
'product-vs-box': {title: 'Product versus box topology', kind: 'definition', where: '§19', pre: ['product-topology', 'subbasis'],
  lede: R`For infinite products, the product topology allows only finitely many restricted coordinates in a basis element; the box topology allows all.`,
  sections: [['Definition', R`<p>On $\prod X_j$: the <b>box</b> topology has basis $\prod U_j$ with each $U_j$ open; the <b>product</b> topology has basis $\prod U_j$ with $U_j=X_j$ for all but finitely many $j$.</p>`],
    ['Why the product one', R`<p>A map into $\prod X_j$ is continuous iff each coordinate is (Theorem 19.6), and a sequence converges iff each coordinate converges. Both fail for the box topology.</p>`],
    ['Where it appears', R`<p>HW3 Q5 (convergence in $\prod\{0,1\}$), HW3 Q6 (the max function), MT Q5 (products of closed sets).</p>`]]},
// ---------- methods the homework needs
'm-set-equality': {title: 'Prove two sets (or topologies) are equal', kind: 'method', where: 'Ch. 1', pre: ['set-equality'],
  lede: 'Two inclusions, each from an arbitrary element.',
  steps: [[R`Write "Let $x\in S$." and unwind what membership in $S$ means.`, 'Arbitrary element: the argument must work for every $x$.'], [R`Use the definitions until you can conclude $x\in T$.`, 'This proves $S\subseteq T$.'], [R`Repeat starting from $x\in T$.`, R`This proves $T\subseteq S$; together, $S=T$.`]],
  sections: [['For topologies', R`<p>Elements are open sets: "Let $U$ be open in $\mathcal T$; show $U$ is open in $\mathcal T'$", and conversely.</p>`]]},
'm-finite': {title: 'Compute in a finite space', kind: 'method', where: '§12–17', pre: ['topology', 'closure'],
  lede: 'List the open sets, then read off closures, interiors and subspace topologies directly.',
  steps: [['List every open set.', 'On a finite set everything can be checked by hand.'], [R`Subspace topology on $A$: intersect each open set with $A$ and list the distinct results.`, R`[[subspace-topology]].`], [R`Closure of $B$: the complement of the largest open set missing $B$; or the points every open neighbourhood of which meets $B$.`, R`[[closure-test]].`], [R`Interior of $B$: the union of the open sets inside $B$.`, R`[[interior]].`]],
  sections: [['Where it appears', R`<p>HW1 Q1, Q2, Q6; HW2 Q4; MT Q2; HW6 Q1.</p>`]]},
'm-open-map': {title: 'Decide whether a map is open or closed', kind: 'method', where: '§18, §22', pre: ['open-map'],
  lede: 'To prove open: image of an open set, point by point. To disprove: one open (closed) set with a non-open (non-closed) image.',
  steps: [[R`To prove $f$ is open, take open $U$ and $y=f(x)\in f(U)$; find an open set around $y$ inside $f(U)$.`, R`Often a basis element, as for [[projections]].`], [R`To prove $f$ is closed, take closed $C$ and show $Y\setminus f(C)$ is open, or that $f(C)$ contains its limit points.`, R`[[closed-set]].`], ['To disprove, find one set whose image fails.', R`Candidates: the hyperbola for $\pi_1$; a single point or an interval mapping onto a non-open set; finite spaces where you can list everything.`]],
  sections: [['For bijections', R`<p>Open iff closed: $f(X\setminus U)=Y\setminus f(U)$ (HW7 Q6a).</p>`]]},
'm-quotient-map': {title: 'Prove a map is a quotient map', kind: 'method', where: '§22', pre: ['quotient-map'],
  lede: R`Three claims: surjective, continuous, and the reverse direction ($p^{-1}(U)$ open $\Rightarrow U$ open).`,
  steps: [[R`<b>Surjective:</b> for each $y$, name a preimage.`, ''], [R`<b>Continuous:</b> $U$ open $\Rightarrow p^{-1}(U)$ open.`, R`Usually from known continuous maps (projections, sums, restrictions).`], [R`<b>Reverse direction:</b> assume $p^{-1}(U)$ is open and prove $U$ is open.`, R`Do not use continuity of $p$ here: that would be circular.`], [R`<b>The section trick:</b> find a continuous $j:Y\to X$ with $p\circ j=\mathrm{id}_Y$. Then $U=j^{-1}(p^{-1}(U))$ is open.`, R`$(p\circ j)^{-1}(U)=U$. Openness only travels backward, so you need a map out of $Y$.`]],
  sections: [['Alternatives', R`<p>If $p$ is a continuous surjective [[open-map|open or closed map]], it is a quotient map.</p>`], ['Where it appears', R`<p>HW6 Q2 ($p(x,y)=x+y$; $\pi_1$), HW7 Q4(b), HW7 Q5(a).</p>`], ['Common mistakes', R`<p>Writing "$p$ is continuous so $p^{-1}(U)$ is open" in the reverse direction; writing $p^{-1}(a)$ instead of $p^{-1}(\{a\})$; making the helper map go the wrong way.</p>`]]},
'm-not-quotient': {title: 'Prove a map is not a quotient map', kind: 'method', where: '§22', pre: ['quotient-map', 'saturated'],
  lede: 'Find an open saturated set upstairs whose image is not open downstairs.',
  steps: [['Understand the fibres $p^{-1}(\{y\})$.', 'You need to know which sets are saturated.'], ['Decide which claim fails; usually the reverse direction.', ''], ['Find where the domain has more room than the target: a point alone upstairs but crowded downstairs.', R`E.g. a point cut off from a square upstairs, attached downstairs.`], [R`Build open saturated $W$ upstairs, set $U=p(W)$, check $p^{-1}(U)=W$, $W$ open, $U$ not open.`, R`Then $p^{-1}(U)$ is open but $U$ is not.`]],
  sections: [['Where it appears', R`<p>HW6 Q3, HW7 Q5(c).</p>`]]},
'm-true-false': {title: 'Answer true / false quickly', kind: 'method', where: 'tests', pre: [],
  lede: 'Test the claim on a short list of standard examples before trying to prove it.',
  steps: [[R`Try $\mathbb Z$, $\{1/n\}$, $\mathbb Q$, intervals, and finite sets in $\mathbb R$.`, 'Most claims about subspaces of $\mathbb R$ break on one of these.'], [R`Try the [[ex-finite-complement|cofinite]], [[ex-indiscrete|indiscrete]], [[ex-discrete|discrete]] topologies.`, 'They break separation and continuity claims.'], ['If nothing breaks it, look for the one-line reason it is true.', '']],
  sections: [['Where it appears', R`<p>MT Q3.</p>`]]}
