'hw1-q5': PB('HW1 Q5 · Open in ℝ versus open in [−1, 1]', 'Homework 1 · §16', R`Decide which sets defined by $\tfrac12<|x|<1$ and variants are open in $\mathbb R$ and in $Y=[-1,1]$.`, ['subspace-topology', 'open-set'], ['m-open'], R`<p>An endpoint $\pm1$ is harmless in $Y$ (nothing beyond it), but not in $\mathbb R$. Write each set as $Y\cap U$ when it is open in $Y$.</p>`),
'hw1-q6': PB('HW1 Q6 · A subspace topology on a finite set', 'Homework 1 · §16', R`Compute $\mathcal T_A$ for $A=\{0,1,3\}$ in a 4-point space.`, ['subspace-topology'], ['m-finite'], R`<p>Intersect each of the five open sets with $A$ and list the distinct results.</p>`),
'hw2-q1': PB('HW2 Q1 · Products of discrete and indiscrete spaces', 'Homework 2 · §15', R`Products of discrete spaces are discrete; of indiscrete spaces, indiscrete.`, ['product-topology', 'standard-topologies'], ['m-open'], R`<p>Discrete: each point $\{(x,y)\}=\{x\}\times\{y\}$ is a basis element. Indiscrete: the only boxes are $\varnothing$ and $X\times Y$.</p>`),
'hw2-q2': PB('HW2 Q2 · Projections are open', 'Homework 2 · §15', R`If $W\subseteq X\times Y$ is open, then $\pi_1(W)$ is open.`, ['projections'], ['m-open-map'], R`<p>Around each $(x,y)\in W$ fits a box $U\times V$; then $x\in U\subseteq\pi_1(W)$.</p>`),
'hw2-q3': PB('HW2 Q3 · Closure in the cofinite topology', 'Homework 2 · §17', R`On an infinite set with the finite complement topology, describe $\overline A$.`, ['closure', 'ex-finite-complement'], ['m-closure'], R`<p>Closed sets are the finite sets and $X$. So $\overline A=A$ if $A$ is finite, and $\overline A=X$ if $A$ is infinite.</p>`),
'hw2-q4': PB('HW2 Q4 · Closure and interior in a finite space', 'Homework 2 · §17', R`Closure and interior of $B=\{1,3\}$ in $X$, and in the subspace $A$.`, ['closure', 'interior', 'subspace-topology'], ['m-finite', 'm-closure'], R`<p>Compute in $X$ first; in $A$ use $\mathcal T_A$, or $\overline B^{\,A}=\overline B\cap A$ (Theorem 17.4).</p>`),
'hw2-q5': PB('HW2 Q5 · Closure of a union', 'Homework 2 · §17', R`$\bigcup\overline{A_j}\subseteq\overline{\bigcup A_j}$, with equality for finite unions but not in general.`, ['closure', 'set-equality'], ['m-set-equality', 'm-closure'], R`<p>Finite unions of closed sets are closed, which gives the reverse inclusion when $J$ is finite. Counterexample: $A_n=\{1/n\}$, whose closures miss $0$.</p>`),
'hw2-q6': PB('HW2 Q6 · Products and subspaces of Hausdorff spaces', 'Homework 2 · §17', R`Products and subspaces of Hausdorff spaces are Hausdorff (prove Theorem 17.11, do not cite it).`, ['hausdorff', 'product-topology', 'subspace-topology'], ['m-hausdorff'], R`<p>Product: points differ in some coordinate; separate there and take boxes. Subspace: intersect the separating sets with $Y$.</p>`),
'hw3-q1': PB('HW3 Q1 · f × g is continuous', 'Homework 3 · §18', R`If $f,g$ are continuous, so is $h(a,c)=(f(a),g(c))$.`, ['continuous', 'product-topology'], ['m-continuous'], R`<p>Check basis elements: $h^{-1}(U\times V)=f^{-1}(U)\times g^{-1}(V)$, open.</p>`),
'hw3-q2': PB('HW3 Q2 · The identity and finer topologies', 'Homework 3 · §18', R`$\mathrm{id}:(X,\mathcal T)\to(X,\mathcal T')$ is continuous iff $\mathcal T$ is finer; a homeomorphism iff $\mathcal T=\mathcal T'$.`, ['continuous', 'finer-coarser', 'homeomorphism'], ['m-continuous', 'm-compare'], R`<p>$\mathrm{id}^{-1}(U)=U$, so continuity says exactly $\mathcal T'\subseteq\mathcal T$.</p>`),
'hw3-q3': PB('HW3 Q3 · Maps agreeing on a dense set', 'Homework 3 · §17–18', R`Continuous maps into a Hausdorff space agreeing on a dense set are equal; give a counterexample without Hausdorff.`, ['dense', 'hausdorff', 'continuous'], ['m-hausdorff', 'm-counterexample'], R`<p>$\{x: f(x)=g(x)\}$ is closed when $Y$ is Hausdorff and contains $A$. Without Hausdorff: maps into an [[ex-indiscrete|indiscrete]] space.</p>`),
'hw3-q4': PB('HW3 Q4 · Retractions and embeddings', 'Homework 3 · §18', R`With $g\circ f=\mathrm{id}$: $\{y: f(g(y))=y\}=f(X)$, which is closed if $Y$ is Hausdorff, and $f$ is an embedding.`, ['embedding', 'set-equality', 'hausdorff'], ['m-set-equality', 'm-closed'], R`<p>Two inclusions for the set equality; closedness is the HW3 Q3 argument with $f\circ g$ and $\mathrm{id}$.</p>`),
'hw3-q5': PB('HW3 Q5 · Convergence in ∏{0,1}', 'Homework 3 · §19', R`If $A_1\subseteq A_2\subseteq\cdots$ then $x(A_n)\to x(\bigcup A_n)$ in the product topology.`, ['product-vs-box', 'convergence'], ['m-continuous'], R`<p>In the product topology, convergence is coordinatewise; each coordinate is eventually constant.</p>`),
'hw3-q6': PB('HW3 Q6 · The max function on an infinite product', 'Homework 3 · §19', R`$m(x)=\max_j x_j$ on $\prod\{0,\dots,n\}$ is not continuous unless $J$ is finite.`, ['product-vs-box', 'continuous'], ['m-continuous'], R`<p>$m^{-1}(\{0\})=\{(0,0,\dots)\}$ would have to be open, but a product-topology basis element restricts only finitely many coordinates.</p>`),
'mt-q1': PB('MT Q1 · {0} is not open in ℚ', 'Midterm 1 practice · §16', R`State the subspace topology; prove $\{0\}$ is not open in $\mathbb Q$.`, ['subspace-topology'], ['m-open'], R`<p>If $\{0\}=\mathbb Q\cap U$ with $U$ open, $U\supseteq(a,b)\ni0$, which contains other rationals.</p>`),
'mt-q2': PB('MT Q2 · Closure in a finite space', 'Midterm 1 practice · §17', R`Find $\overline{\{1\}}$ in $X=\{0,1,2\}$, $\mathcal T=\{\varnothing,\{0\},\{0,1\},X\}$.`, ['closure'], ['m-finite', 'm-closure'], R`<p>Closed sets: $X,\{1,2\},\{2\},\varnothing$. The smallest containing $1$ is $\{1,2\}$.</p>`),
'mt-q3': PB('MT Q3 · True or false on subspaces of ℝ', 'Midterm 1 practice · §16–18', 'Quick judgments with no justification.', ['subspace-topology', 'hausdorff'], ['m-true-false'], R`<p>Run through the standard examples first.</p>`),
'mt-q4': PB('MT Q4 · Injective maps into the cofinite line', 'Midterm 1 practice · §18', R`Every injective $f:\mathbb R\to\mathbb R_f$ is continuous.`, ['ex-finite-complement', 'continuous'], ['m-continuous'], R`<p>Closed sets of $\mathbb R_f$ are finite (or everything); preimages of finite sets under an injective map are finite, hence closed in $\mathbb R$.</p>`),
'mt-q5': PB('MT Q5 · Products of closed sets are closed', 'Midterm 1 practice · §19', R`If each $A_j$ is closed in $X_j$, then $\prod A_j$ is closed in $\prod X_j$.`, ['product-vs-box', 'closed-set'], ['m-closed'], R`<p>The complement is $\bigcup_j\pi_j^{-1}(X_j\setminus A_j)$, a union of open sets.</p>`),
'mt-q6': PB('MT Q6 · A closed ball is closed', 'Midterm 1 practice · §20', R`State the metric axioms; prove $\{y: d(x,y)\le1\}$ is closed.`, ['metric', 'ball'], ['m-closed', 'm-open'], R`<p>If $d(x,z)>1$, the ball $B(z,d(x,z)-1)$ misses the set by the triangle inequality.</p>`),
'hw6-q1': PB('HW6 Q1 · The quotient topology on {−1, 0, 1}', 'Homework 6 · §22', R`Find the quotient topology on $\{-1,0,1\}$ induced by $p:\mathbb R\to\{-1,0,1\}$ (the sign of $x$).`, ['quotient-topology'], ['m-finite'], R`<p>$U$ is open iff $p^{-1}(U)$ is open in $\mathbb R$. Since $p^{-1}(\{0\})=\{0\}$ is not open, the topology is $\{\varnothing,\{-1\},\{1\},\{-1,1\},\{-1,0,1\}\}$.</p>`),
'hw6-q2': PB('HW6 Q2 · Quotient maps through a section', 'Homework 6 · §22', R`A map with a continuous one-sided inverse is a quotient map; $\pi_1:X\times Y\to X$ is one.`, ['quotient-map', 'projections'], ['m-quotient-map'], R`<p>If $r\circ i=\mathrm{id}$ with $i$ continuous: $U=i^{-1}(r^{-1}(U))$. For $\pi_1$, fix $y_0\in Y$ (uses $Y\ne\varnothing$) and use $i(x)=(x,y_0)$.</p>`),
'hw6-q3': PB('HW6 Q3 · A map that is not a quotient map', 'Homework 6 · §22', 'Subspace versus quotient topology on pieces of a square.', ['quotient-map', 'saturated', 'subspace-topology'], ['m-not-quotient'], R`<p>A point cut off from the square upstairs is crowded downstairs. Build an open saturated set using a triangle that avoids the diagonal near the corner; its image is not open.</p>`),
'hw6-q4': PB('HW6 Q4 · Finer topologies and quotients', 'Homework 6 · §22', R`The quotient topology is finer than the subspace topology; a topology finer than a Hausdorff one is Hausdorff.`, ['quotient-topology', 'finer-coarser', 'hausdorff'], ['m-compare', 'm-hausdorff'], R`<p>$f^{-1}(A\cap V)=f^{-1}(V)$ is open by continuity. A finer topology keeps the same disjoint open sets.</p>`),
'hw6-q5': PB('HW6 Q5 · A quotient that is Hausdorff', 'Homework 6 · §22', R`For $x\sim y$ iff $q(x)=q(y)$ with $q$ into a Hausdorff space, $X/{\sim}$ is Hausdorff.`, ['quotient-topology', 'maps-out-of-quotients', 'hausdorff'], ['m-quotient', 'm-hausdorff'], R`<p>Map out of the quotient: $g([z])=q(z)$ is well defined and continuous; pull back disjoint open sets of the Hausdorff target.</p>`),
'hw7-q2': PB('HW7 Q2 · Is the sign map open? closed?', 'Homework 7 · §22', R`Decide whether $p:\mathbb R\to\{-1,0,1\}$ from HW6 is an open map and whether it is a closed map.`, ['open-map', 'quotient-map'], ['m-open-map'], R`<p>Use the topology from [[hw6-q1]]. Test small sets: what is the image of an open interval containing $0$? Of a closed set like $\{0\}$ or $[1,2]$? Decide which images are open or closed in the finite topology.</p>`),
'hw7-q3': PB('HW7 Q3 · Projections are open, not always closed', 'Homework 7 · §15', R`(a) $\pi_1:X\times Y\to X$ is open. (b) It need not be closed.`, ['projections', 'open-map'], ['m-open-map'], R`<p>(a) is the [[hw2-q2]] argument. (b) Look for a closed set in $\mathbb R^2$ whose shadow on the $x$-axis approaches a point it never reaches.</p>`),
'hw7-q4': PB('HW7 Q4 · Folding a plane region onto ℝ', 'Homework 7 · §22', R`$A=[0,\infty)\times\mathbb R\cup\mathbb R\times\{0\}$, $q(x,y)=x$: sketch $A$; $q$ is a quotient map but neither open nor closed.`, ['quotient-map', 'open-map', 'subspace-topology'], ['m-quotient-map', 'm-open-map'], R`<p>(b) The section trick: $j(x)=(x,0)$ lands in $A$ and $q\circ j=\mathrm{id}$ (compare [[hw6-q2]]). (c) Find a set open in $A$ on the left half-line part whose image is a single point or a non-open set; and a closed set whose image is not closed.</p>`),
'hw7-q5': PB('HW7 Q5 · Quotient then subspace, or subspace then quotient', 'Homework 7 · §22', R`$p:D\to C$ flattens the lower edge onto the square; it is a quotient map, and restricting to $B$ gives a quotient topology on $q(B)$ different from the subspace topology.`, ['quotient-map', 'subspace-topology', 'saturated'], ['m-quotient-map', 'm-not-quotient'], R`<p>(a) A section again. (c) Reuse the HW6 Q3 construction: an open saturated set in $B$ whose image is not open in the subspace topology of $q(B)$.</p>`),
'hw7-q6': PB('HW7 Q6 · Open bijections', 'Homework 7 · §18', R`(a) A bijection is open iff closed. (b) An open bijection need not be continuous.`, ['open-map', 'image-preimage'], ['m-open-map', 'm-counterexample'], R`<p>(a) For a bijection, $f(X\setminus U)=Y\setminus f(U)$. (b) Use the identity map between two topologies on the same set, one finer than the other ([[hw3-q2]]).</p>`)
});
A['hw7-q1'].kind = 'problem'; A['hw7-q1'].method = ['m-quotient', 'm-hausdorff']; A['hw7-q1'].where = 'Homework 7 · §22';
A['hw7-q1'].lede = R`(a) The classes of $\sim_A$. (b) If $X$ is a metric space and $A$ is closed, $X/{\sim_A}$ is Hausdorff.`;

// ===== Book order: every section holds its concepts, then its methods, then its problems. Plus the articles that fill the gaps.
Object.assign(A, {
// ---------- Chapter 1
'de-morgan': {title: 'Unions, intersections, complements (De Morgan)', kind: 'idea', where: 'Ch. 1, §1', pre: [],
  lede: R`$X\setminus\bigcup A_\alpha=\bigcap(X\setminus A_\alpha)$ and $X\setminus\bigcap A_\alpha=\bigcup(X\setminus A_\alpha)$.`,
  sections: [['Statement', R`<p>Complement turns unions into intersections and back. It holds for any indexed family.</p>`],
    ['Why it matters', R`<p>It converts every fact about [[open-set|open sets]] into one about [[closed-set|closed sets]]: arbitrary unions of open sets become arbitrary intersections of closed sets (Theorem 17.1). MT Q5 is a direct use.</p>`]]},
'functions': {title: 'Injective, surjective, bijective', kind: 'definition', where: 'Ch. 1, §2', pre: ['image-preimage'],
  lede: 'One-to-one, onto, and both; a bijection has an inverse function.',
  sections: [['Definition', R`<p>$f:X\to Y$ is <b>injective</b> if $f(x)=f(x')\Rightarrow x=x'$, <b>surjective</b> if $f(X)=Y$, <b>bijective</b> if both; then $f^{-1}:Y\to X$ exists.</p>`],
    ['Useful identities', R`<p>$f(f^{-1}(B))\subseteq B$ with equality when $f$ is surjective; $A\subseteq f^{-1}(f(A))$ with equality when $f$ is injective. The second is the [[saturated]] condition in disguise.</p>`],
    ['Where it appears', R`<p>MT Q4 (injective maps), [[homeomorphism|homeomorphisms]], HW7 Q6 (bijections).</p>`]]},
'indexed-products': {title: 'Cartesian products of indexed families', kind: 'definition', where: 'Ch. 1, §5', pre: ['functions'],
  lede: R`$\prod_{\alpha\in J}X_\alpha$ is the set of $J$-tuples $(x_\alpha)$ with $x_\alpha\in X_\alpha$, i.e. functions $J\to\bigcup X_\alpha$.`,
  sections: [['Definition', R`<p>A point of $\prod X_\alpha$ is a choice of one $x_\alpha\in X_\alpha$ for each index $\alpha$. The projection $\pi_\beta$ reads off the $\beta$ coordinate.</p>`],
    ['Example', R`<p>$\prod_{j\in J}\{0,1\}$ is the set of functions $J\to\{0,1\}$, equivalently of subsets of $J$ ($x(A)_j=1$ iff $j\in A$; HW3 Q5, HW4 Q1).</p>`],
    ['Topologies on it', R`<p>[[product-vs-box]].</p>`]]},
'countable': {title: 'Countable sets', kind: 'definition', where: 'Ch. 1, §7', pre: ['functions'],
  lede: R`$J$ is countable if there is an injection $J\to\mathbb N$; a countable union of finite sets is countable.`,
  sections: [['Definition', R`<p>$J$ is <b>countable</b> if it is finite or in bijection with $\mathbb Z_+$; equivalently, there is an injective map $J\to\mathbb N$.</p>`],
    ['Facts', R`<p>Subsets and countable unions of countable sets are countable; $\mathbb Q$ is countable; $\mathbb R$ and $\mathcal P(\mathbb N)$ are not.</p>`],
    ['Where it appears', R`<p>HW4 Q4: if the point $z$ of $\prod_J\{0,1\}$ has a countable neighbourhood base, $J$ is countable. Hence $\prod_{\mathbb R}\{0,1\}$ is not [[metrizable]].</p>`]]},
// ---------- the connecting idea
'defining-by-maps': {title: 'Subspace, product, quotient: topologies defined by maps', kind: 'idea', where: '§15–22', pre: ['continuous'],
  lede: 'Each new topology is the one that makes a natural map continuous, and no more (or no less) than needed.',
  sections: [['The pattern', R`<p><b>[[subspace-topology|Subspace]]:</b> the coarsest topology on $Y$ making the inclusion $Y\hookrightarrow X$ continuous.<br><b>[[product-vs-box|Product]]:</b> the coarsest topology on $\prod X_\alpha$ making every projection continuous.<br><b>[[quotient-topology|Quotient]]:</b> the finest topology on $X^*$ making $p:X\to X^*$ continuous.</p>`],
    ['What it buys you', R`<p>Each comes with a rule for maps. Into a subspace: $f:Z\to Y$ is continuous iff it is continuous into $X$. Into a product: iff every coordinate is ([[maps-into-products|Theorem 19.6]]). Out of a quotient: iff the composite with $p$ is ([[maps-out-of-quotients|Theorem 22.2]]).</p>`],
    ['Why coarsest or finest', R`<p>Maps <em>out of</em> $Y$ or the product pull open sets back, so the fewest open sets that still make them continuous. The map <em>into</em> the quotient must pull open sets back to open sets, so the most open sets possible.</p>`],
    ['Order matters', R`<p>Taking a subspace and a quotient in different orders can give different topologies (HW6 Q3, HW7 Q5). Taking subspaces and products in either order gives the same one ([[products-and-subspaces]]).</p>`]]},
// ---------- §19 fill-in
'maps-into-products': {title: 'Maps into products (Theorem 19.6)', kind: 'theorem', where: '§19', pre: ['product-vs-box', 'continuous'],
  lede: R`$f:A\to\prod X_\alpha$ is continuous iff every [[coordinate-function|coordinate function]] $f_\alpha=\pi_\alpha\circ f$ is.`,
  sections: [['Statement', R`<p>In the product topology, $f=(f_\alpha)$ is continuous iff each $f_\alpha$ is. (For two factors this is Theorem 18.4.) It fails for the box topology.</p>`],
    ['Why', R`<p>Projections are continuous, so $f$ continuous gives each $f_\alpha$ continuous. Conversely the product topology has [[subbasis]] $\pi_\alpha^{-1}(U)$, and $f^{-1}(\pi_\alpha^{-1}(U))=f_\alpha^{-1}(U)$ is open.</p>`],
    ['Use', R`<p>HW4 Q2: rearranging $(X_1\times X_2)\times X_3\to\prod X_\alpha$ is continuous because each coordinate is a composite of projections; the inverse likewise, so it is a [[homeomorphism]], without mentioning open sets. Method: [[m-product-maps]].</p>`]]},
'products-and-subspaces': {title: 'Products of subspaces (Theorem 19.3)', kind: 'theorem', where: '§19', pre: ['product-vs-box', 'subspace-topology'],
  lede: R`If $A_\alpha\subseteq X_\alpha$, then $\prod A_\alpha$ gets the same topology as a subspace of $\prod X_\alpha$ or as a product of subspaces.`,
  sections: [['Statement', R`<p>For both the product and the box topology. For two factors this is Theorem 16.3; HW4 Q3 asks for the proof in general.</p>`],
    ['Why', R`<p>Compare bases. A basis element of the subspace topology is $(\prod U_\alpha)\cap\prod A_\alpha=\prod(U_\alpha\cap A_\alpha)$, with $U_\alpha$ open and $U_\alpha=X_\alpha$ for all but finitely many $\alpha$; for those, $U_\alpha\cap A_\alpha=A_\alpha$. That is exactly a basis element of the product of the subspaces, and every such element arises this way. The bases are the same collection, so the topologies are equal ([[generated-topology]]).</p>`]]},
'products-hausdorff-closure': {title: 'Hausdorff and closures in products (Theorems 19.4, 19.5)', kind: 'theorem', where: '§19', pre: ['product-vs-box', 'hausdorff', 'closure'],
  lede: R`Products of Hausdorff spaces are Hausdorff, and $\overline{\prod A_\alpha}=\prod\overline{A_\alpha}$.`,
  sections: [['Statements', R`<p>Both hold in the product and the box topology. In particular a product of closed sets is closed (MT Q5).</p>`],
    ['Why Hausdorff', R`<p>Distinct points differ in some coordinate $\beta$; separate there by $U,V$ and use $\pi_\beta^{-1}(U),\pi_\beta^{-1}(V)$.</p>`]]},
'product-convergence': {title: 'Convergence in a product', kind: 'theorem', where: '§19', pre: ['product-vs-box', 'convergence'],
  lede: 'In the product topology a sequence converges exactly when every coordinate converges.',
  sections: [['Statement', R`<p>$x_n\to x$ in $\prod X_\alpha$ (product topology) iff $\pi_\alpha(x_n)\to\pi_\alpha(x)$ for every $\alpha$ (Munkres §19, exercise).</p>`],
    ['Why', R`<p>A basis element around $x$ restricts finitely many coordinates; each of those is eventually satisfied, and finitely many "eventually"s have a common tail.</p>`],
    ['Use', R`<p>HW3 Q5 and HW4 Q1: each coordinate of $x(A_n)$ is eventually constant, so the sequence converges to the set of indices eventually in the $A_n$.</p>`]]},
// ---------- §21 fill-in
'first-countable': {title: 'Countable neighbourhood bases', kind: 'definition', where: '§21, §30', pre: ['basis', 'countable'],
  lede: R`$x$ has a countable basis at $x$ if countably many neighbourhoods $U_1\supseteq U_2\supseteq\cdots$ fit inside every neighbourhood of $x$.`,
  sections: [['Definition', R`<p>A countable collection of neighbourhoods of $x$ such that every neighbourhood of $x$ contains one of them. Every metric space has one: the [[ball|balls]] $B(x,1/n)$.</p>`],
    ['Why it matters', R`<p>It makes sequences enough: the [[sequence-lemma]] needs it. Failing it is a quick proof that a space is not [[metrizable]] (HW4 Q4 with uncountable $J$).</p>`]]},
'sequence-lemma': {title: 'The sequence lemma (Lemma 21.2)', kind: 'theorem', where: '§21', pre: ['closure', 'convergence'],
  lede: R`If a sequence in $A$ converges to $x$, then $x\in\overline A$; the converse holds in metric spaces.`,
  sections: [['Statement', R`<p>If $x_n\in A$ and $x_n\to x$ then $x\in\overline A$. If $X$ is metrizable (more generally has [[first-countable|countable bases at points]]) the converse holds: pick $x_n\in B(x,1/n)\cap A$.</p>`],
    ['Theorem 21.3', R`<p>In the same setting, $f$ is continuous iff $x_n\to x$ implies $f(x_n)\to f(x)$.</p>`]]},
'metrizable': {title: 'Metrizable spaces', kind: 'definition', where: '§20–21', pre: ['metric-topology'],
  lede: 'A space whose topology comes from some metric.',
  sections: [['Necessary conditions', R`<p>Metrizable spaces are [[hausdorff|Hausdorff]] and have [[first-countable|countable bases at points]]. So the [[ex-finite-complement|cofinite]] line, $\mathbb R^\omega$ in the box topology, and $\prod_{\mathbb R}\{0,1\}$ are not metrizable.</p>`],
    ['Positive examples', R`<p>$\mathbb R^n$; countable products of metric spaces (Theorem 20.5 for $\mathbb R^\omega$).</p>`]]},
'uniform-limit': {title: 'Uniform limits (Theorem 21.6)', kind: 'theorem', where: '§21', pre: ['epsilon-delta'],
  lede: 'A uniform limit of continuous functions into a metric space is continuous.',
  sections: [['Statement', R`<p>If $f_n:X\to Y$ are continuous, $Y$ is metric, and $f_n\to f$ uniformly, then $f$ is continuous.</p>`], ['Why', R`<p>The $\varepsilon/3$ argument: $d(f(x),f(y))\le d(f(x),f_N(x))+d(f_N(x),f_N(y))+d(f_N(y),f(y))$.</p>`]]},
// ---------- Chapter 3
'connected': {title: 'Connected space', kind: 'definition', where: '§23', pre: ['open-set'],
  lede: 'A space that cannot be split into two disjoint nonempty open sets.',
  sections: [['Definition', R`<p>A <b>separation</b> of $X$ is a pair of disjoint nonempty open sets $U,V$ with $U\cup V=X$. $X$ is <b>connected</b> if it has none; equivalently, the only sets both open and closed are $\varnothing$ and $X$.</p>`],
    ['Theorems', R`<p>Continuous images of connected spaces are connected (23.5); a union of connected sets with a common point is connected (23.3); finite products of connected spaces are connected (23.6); if $A$ is connected and $A\subseteq B\subseteq\overline A$, then $B$ is connected (23.4).</p>`],
    ['Examples', R`<p>Intervals in $\mathbb R$ ([[connected-reals]]). Not connected: $\mathbb Q$; [[ex-lower-limit|ℝ_ℓ]] ($[a,b)$ is open and closed).</p>`],
    ['Method', R`<p>[[m-connected]].</p>`]]},
'connected-reals': {title: 'Connected subsets of ℝ; intermediate values (§24)', kind: 'theorem', where: '§24', pre: ['connected'],
  lede: R`Intervals are connected, and so a continuous real function on a connected space takes every intermediate value.`,
  sections: [['Statements', R`<p>The connected subspaces of $\mathbb R$ are exactly the intervals and rays (Theorem 24.1 and its converse). <b>Intermediate value theorem (24.3):</b> if $f:X\to\mathbb R$ is continuous and $X$ connected, $f$ takes every value between any two of its values.</p>`],
    ['Path connected', R`<p>Full article: [[path-connected]]. $X$ is path connected if any two points are joined by a continuous path $[0,1]\to X$. Path connected implies connected; the topologist's sine curve is connected but not path connected.</p>`]]},
'components': {title: 'Components and local connectedness (§25)', kind: 'definition', where: '§25', pre: ['connected'],

// Labels used: Reading the definition · Why it is defined this way · Worked example · Non-example, and why it fails · Common confusions
var DEEP = {
'topology': [
  ['Reading the definition', R`<p><b>"A collection of subsets."</b> A topology is not a shape or a distance. It is a list: some subsets of $X$ are placed on the list and called open, the rest are not. Two different lists on the same set $X$ are two different spaces.</p>
<p><b>Axiom (1), $\varnothing$ and $X$ are open.</b> The empty set and the whole space are always on the list. Without this, statements like "the preimage of $Y$ is $X$, which is open" would fail for no good reason.</p>
<p><b>Axiom (2), any union is open.</b> If you have open sets, however many (finitely many, countably many, uncountably many), the set of points lying in at least one of them is open. Gluing open regions together keeps them open.</p>
<p><b>Axiom (3), finite intersections are open.</b> The points lying in all of finitely many open sets form an open set. Only finitely many: the condition is about shrinking a little, not infinitely.</p>`],
  ['Why it is defined this way', R`<p>In $\mathbb R$, a set is open when every point has some room around it inside the set. Unions keep that room (each point keeps the room it had). Intersections of two open sets keep it too (take the smaller of the two rooms). But infinitely many intersections can squeeze the room to nothing: $\bigcap_n(-\tfrac1n,\tfrac1n)=\{0\}$. The three axioms are exactly what survives when you forget distance and keep only "which sets have room".</p>
<p>So a topology records <em>nearness without measurement</em>: which points are close to which sets, and nothing more. Continuity, convergence, closure and connectedness can all be defined from that record alone.</p>`],
  ['Worked example', R`<p>$X=\{a,b,c\}$, $\mathcal T=\{\varnothing,\{a\},\{a,b\},X\}$.</p>
<ol><li>(1): $\varnothing$ and $X$ are listed. ✓</li><li>(2): every union of listed sets: $\{a\}\cup\{a,b\}=\{a,b\}$, and anything with $X$ gives $X$. All listed. ✓</li><li>(3): $\{a\}\cap\{a,b\}=\{a\}$; intersections with $X$ change nothing. All listed. ✓</li></ol>
<p>So $\mathcal T$ is a topology. In it, $a$ is "close to everything" in a sense: every open set containing $b$ or $c$ also contains $a$.</p>`],
  ['Non-example, and why it fails', R`<p>$\{\varnothing,\{a\},\{b\},X\}$ on $\{a,b,c\}$: the union $\{a\}\cup\{b\}=\{a,b\}$ is not listed, so axiom (2) fails.</p>`],
  ['Common confusions', R`<p>Open is not the opposite of closed. A topology does not need to contain complements of its sets. The sets in $\mathcal T$ are open <em>by definition</em>; there is nothing more to check about them.</p>`]],
'open-set': [
  ['Reading the definition', R`<p>"$U$ is open" is shorthand for "$U\in\mathcal T$". It has no meaning until a topology is fixed. The same set $[0,1)$ is open in [[ex-lower-limit|ℝ_ℓ]] and not open in standard ℝ.</p>`],
  ['Why it is defined this way', R`<p>The open sets are the ones that contain a little room around each of their points. When a topology comes from a [[basis]] or a [[metric]], that is literally the test: around each point of $U$ fits a basis element (a ball) inside $U$.</p>`],
  ['Worked example', R`<p>Show $(0,\infty)$ is open in $\mathbb R$. Take $x>0$. The interval $(x/2,\,2x)$ contains $x$ and lies inside $(0,\infty)$ because $x/2>0$. Every point has room, so the set is open.</p>`],
  ['Non-example, and why it fails', R`<p>$[0,1)$ in $\mathbb R$: at the point $0$ every interval $(-\varepsilon,\varepsilon)$ sticks out to the left of $0$, outside the set. One point without room is enough to fail.</p>`]],
'basis': [
  ['Reading the definition', R`<p><b>Condition (1), every point is in some basis element.</b> The building blocks reach every point, so every point will have at least one open set around it.</p>
<p><b>Condition (2), intersections contain a block.</b> If $x$ sits in two blocks $B_1,B_2$, there is a third block $B_3$ around $x$ inside both. This is what makes the generated collection closed under intersections (axiom (3) of a [[topology]]).</p>`],
  ['Why it is defined this way', R`<p>Listing every open set of $\mathbb R$ is impossible; listing the open intervals is easy. A basis is a small, describable collection from which the whole topology is built by taking unions. The two conditions are exactly what is needed for those unions to form a topology.</p>`],
  ['Worked example', R`<p>Open intervals in $\mathbb R$. (1): $x\in(x-1,x+1)$. (2): if $x\in(a,b)\cap(c,d)$, then $(\max(a,c),\min(b,d))$ is an open interval around $x$ inside both.</p>`],
  ['Non-example, and why it fails', R`<p>Closed intervals $[a,b]$ with $a<b$. Condition (2) fails at $1\in[0,1]\cap[1,2]=\{1\}$: there is no closed interval of positive length around $1$ inside $\{1\}$.</p>`],
  ['Common confusions', R`<p>A basis is not itself a topology: $(0,1)\cup(2,3)$ is open but not an interval. A topology can have many bases (intervals with rational endpoints also work, HW1 Q3).</p>`]],
'subspace-topology': [
  ['Reading the definition', R`<p><b>$\mathcal T_Y=\{Y\cap U: U\in\mathcal T\}$.</b> To get an open set of $Y$, take any open set $U$ of the big space and keep only the part inside $Y$. Every open set of $Y$ arises this way, and only these.</p>`],
  ['Why it is defined this way', R`<p>$Y$ should be close to what $X$ says it is close to, seen from inside $Y$. Points of $X$ outside $Y$ simply are not there any more. Equivalently, it is the coarsest topology making the inclusion $Y\hookrightarrow X$ [[continuous]] ([[defining-by-maps]]).</p>`],
  ['Worked example', R`<p>$Y=[0,1]\subset\mathbb R$. Is $[0,\tfrac12)$ open in $Y$? Yes: $[0,\tfrac12)=Y\cap(-1,\tfrac12)$, and $(-1,\tfrac12)$ is open in $\mathbb R$. The point $0$ has no room to its left in $\mathbb R$, but inside $Y$ there is nothing to its left to need room for.</p>`],
  ['Non-example, and why it fails', R`<p>$\{0\}$ in $Y=\mathbb Q$: any open $U\ni0$ contains an interval around $0$, which contains other rationals, so $\mathbb Q\cap U\ne\{0\}$ (MT Q1).</p>`],
  ['Common confusions', R`<p>Always say "open in $Y$" or "open in $X$". A set open in $Y$ need not be open in $X$ unless $Y$ itself is open in $X$.</p>`]],
'product-topology': [
  ['Reading the definition', R`<p>An open set of $X\times Y$ is a union of <b>open boxes</b> $U\times V$: pick an open set in each factor and take all pairs.</p>`],
  ['Why it is defined this way', R`<p>It is the coarsest topology making both projections continuous: $\pi_1^{-1}(U)=U\times Y$ and $\pi_2^{-1}(V)=X\times V$ must be open, and their intersections $U\times V$ then are too ([[defining-by-maps]]). Nothing more is added.</p>`],
  ['Worked example', R`<p>In $\mathbb R^2$ the open disc $D$ is open: around each point of $D$ fits a small open square $(a,b)\times(c,d)$ inside $D$, so $D$ is a union of boxes.</p>`],
  ['Common confusions', R`<p>$D$ itself is not a box; open sets are unions of boxes. For infinitely many factors, see [[product-vs-box]].</p>`]],
'closed-set': [
  ['Reading the definition', R`<p>$A$ is closed when everything <em>outside</em> it is open: each point not in $A$ has room around it that avoids $A$ entirely.</p>`],
  ['Why it is defined this way', R`<p>A closed set is one you cannot leave by approaching its edge: if points of $A$ crowd in on some $x$, then $x$ is in $A$ already ([[closure-limit-points]]). Defining it through the complement makes this automatic from the open sets.</p>`],
  ['Worked example', R`<p>$[0,1]$ in $\mathbb R$: its complement $(-\infty,0)\cup(1,\infty)$ is a union of open intervals, so it is open, and $[0,1]$ is closed.</p>`],

'closure': [
  ['Reading the definition', R`<p>"The intersection of all closed sets containing $A$" is the smallest closed set that still contains all of $A$. Anything smaller would either miss part of $A$ or fail to be closed.</p>`],
  ['Why it is defined this way', R`<p>It adds to $A$ exactly the points $A$ cannot be separated from: the points every open neighbourhood of which reaches into $A$ ([[closure-test]]). So it answers "which points are stuck to $A$?"</p>`],
  ['Worked example', R`<p>$A=(0,1)$ in $\mathbb R$. Guess $[0,1]$. It is closed and contains $A$. Nothing smaller works: $0$ is in the closure because every interval $(-\varepsilon,\varepsilon)$ meets $(0,1)$; likewise $1$. Points outside $[0,1]$, say $2$, have $(1.5,2.5)$ missing $A$.</p>`],

'limit-point': [
  ['Reading the definition', R`<p><b>"Every neighbourhood of $x$"</b>: however small an open set around $x$ you take. <b>"Contains a point of $A$ other than $x$"</b>: points of $A$ can be found arbitrarily close to $x$, not counting $x$ itself.</p>`],
  ['Why it is defined this way', R`<p>It captures "$A$ accumulates at $x$". Excluding $x$ itself is what distinguishes a genuine accumulation from simply containing $x$.</p>`],
  ['Worked example', R`<p>$A=\{1/n\}$. Is $0$ a limit point? Any open $U\ni0$ contains some $(-\varepsilon,\varepsilon)$, and $1/n<\varepsilon$ for large $n$. Yes. Is $\tfrac12$ a limit point? The interval $(0.45,0.55)$ contains no other $1/n$. No.</p>`],
  ['Common confusions', R`<p>A limit point need not be in $A$, and a point of $A$ need not be a limit point (isolated points). The closure is $A$ together with its limit points.</p>`]],
'hausdorff': [
  ['Reading the definition', R`<p><b>"For all $x\ne y$"</b>: every pair of distinct points, not just some. <b>"Open $U\ni x$, $V\ni y$"</b>: a neighbourhood of each. <b>"$U\cap V=\varnothing$"</b>: they share no point at all.</p>`],
  ['Why it is defined this way', R`<p>Without it, two different points can be indistinguishable by open sets: every neighbourhood of one meets every neighbourhood of the other. Then a sequence can converge to both. Hausdorff is the condition that rules this out, and it holds in every space with a [[metric]].</p>`],
  ['Worked example', R`<p>$\mathbb R$: for $x<y$ let $r=(y-x)/2$. Then $(x-r,x+r)$ and $(y-r,y+r)$ meet only if some point is within $r$ of both, which would put $x,y$ within $2r=y-x$ of each other strictly, impossible.</p>`],
  ['Non-example, and why it fails', R`<p>[[ex-finite-complement|The cofinite line]]: two nonempty open sets each miss only finitely many points, so they share infinitely many. No pair can be separated.</p>`]],
'continuous': [
  ['Reading the definition', R`<p><b>"For every open $V\subseteq Y$"</b>: start in the target. <b>"$f^{-1}(V)$ is open in $X$"</b>: the set of all points that land in $V$ is open. Continuity is a statement about pulling open sets back, never pushing them forward.</p>`],
  ['Why it is defined this way', R`<p>In ε–δ form: for any target window around $f(x)$ (that is $V$) there is a source window around $x$ that lands inside it. "All points landing in $V$ form an open set" says exactly that every such $x$ has its window. The output window is chosen first, the input window found: the backward direction.</p>`],
  ['Worked example', R`<p>$\pi_1:\mathbb R^2\to\mathbb R$. For open $U\subseteq\mathbb R$, $\pi_1^{-1}(U)=U\times\mathbb R$, an open box. So $\pi_1$ is continuous.</p>`],
  ['Non-example, and why it fails', R`<p>$f(x)=0$ for $x<0$, $1$ for $x\ge0$. Take $V=(\tfrac12,\tfrac32)$. Then $f^{-1}(V)=[0,\infty)$, not open: the point $0$ has no room. That is the jump, seen through preimages.</p>`],
  ['Common confusions', R`<p>Images of open sets need not be open: that is a separate property, [[open-map|being an open map]]. A constant map is continuous but sends open sets to single points.</p>`]],
'homeomorphism': [
  ['Reading the definition', R`<p>Three requirements: a <b>bijection</b> (points correspond one to one), <b>continuous</b> (open sets of $Y$ pull back to open sets), and <b>continuous inverse</b> (open sets of $X$ pull back under $f^{-1}$, i.e. $f$ sends open sets to open sets).</p>`],
  ['Why it is defined this way', R`<p>Together these say $f$ matches up the points <em>and</em> the open sets exactly. Every topological statement true of $X$ is then true of $Y$. It is the notion of "the same space".</p>`],
  ['Worked example', R`<p>$(-1,1)\to\mathbb R$, $x\mapsto x/(1-x^2)$: continuous, strictly increasing, onto, with continuous inverse. An open interval and the whole line are the same space.</p>`],
  ['Non-example, and why it fails', R`<p>$[0,1)\to S^1$, $t\mapsto(\cos2\pi t,\sin2\pi t)$ is a continuous bijection, but $[0,\tfrac12)$ is open in $[0,1)$ while its image, an arc including $(1,0)$ but approaching it only from one side, is not open in $S^1$. The inverse is not continuous.</p>`]],
'open-map': [
  ['Reading the definition', R`<p>Open map: push an open set <em>forward</em> and it stays open. Closed map: push a closed set forward and it stays closed. Continuity is about pulling back; these are about pushing forward.</p>`],
  ['Why it is defined this way', R`<p>Continuity alone does not say how $f$ treats open sets of the source. Open and closed maps are the extra conditions that make a continuous surjection into a [[quotient-map]], and an open continuous bijection into a [[homeomorphism]].</p>`],
  ['Worked example', R`<p>$\pi_1:X\times Y\to X$ is open. For open $W$ and $x\in\pi_1(W)$, pick $(x,y)\in W$ and a box $U\times V\subseteq W$ around it. Then $U\subseteq\pi_1(W)$ and $x\in U$: room around $x$ inside $\pi_1(W)$.</p>`],
  ['Non-example, and why it fails', R`<p>$\pi_1$ is not closed: the hyperbola $\{xy=1\}$ is closed in $\mathbb R^2$, but $\pi_1$ of it is $\mathbb R\setminus\{0\}$, not closed. The branches approach the $y$-axis without reaching it.</p>`],
  ['Common confusions', R`<p>Open, closed and continuous are independent of each other in general. For bijections, open and closed coincide (HW7 Q6a).</p>`]],
'quotient-topology': [
  ['Reading the definition', R`<p><b>"A partition $X^*$ of $X$"</b>: we have decided which points to glue: each piece of the partition becomes a single point. <b>"$p:X\to X^*$"</b>: sends each point to the piece it belongs to. <b>"$U\subseteq X^*$ is open iff $p^{-1}(U)$ is open"</b>: a set of glued points is open exactly when all the original points lying over it form an open set of $X$.</p>`],
  ['Why it is defined this way', R`<p>We want $p$ [[continuous]], so every open $U$ must have $p^{-1}(U)$ open: that is one direction. Among all topologies with that property we take the largest one: every set whose preimage is open is declared open. This keeps as much of $X$'s topology as the gluing allows ([[defining-by-maps]]).</p>
<p>Picture it as looking down from above: $X$ is upstairs, $X^*$ downstairs. Downstairs has no topology of its own; each candidate set is tested by looking at what lies over it.</p>`],
  ['Worked example', R`<p>$p:\mathbb R\to\{-1,0,1\}$, the sign of $x$ (HW6 Q1). Test each subset by its preimage:</p>
<ul><li>$\{-1\}$: preimage $(-\infty,0)$, open. Open.</li><li>$\{1\}$: preimage $(0,\infty)$, open. Open.</li><li>$\{0\}$: preimage $\{0\}$, not open. Not open.</li><li>$\{-1,0\}$: preimage $(-\infty,0]$, not open. Not open.</li><li>$\{-1,1\}$: preimage $\mathbb R\setminus\{0\}$, open. Open.</li></ul>
<p>So the topology is $\{\varnothing,\{-1\},\{1\},\{-1,1\},\{-1,0,1\}\}$. The point $0$ cannot be separated from $\pm1$: every open set containing $0$ is the whole space.</p>`],
  ['Non-example, and why it fails', R`<p>The quotient topology does not inherit good properties: crushing $(0,1)$ in $\mathbb R$ gives a space that is not Hausdorff ([[ex-crush-open]]).</p>`],
  ['Common confusions', R`<p>The quotient set is a set of <em>pieces</em>, which are subsets of $X$. A "point" of $X^*$ like $[A]$ is a whole set upstairs.</p>`]],
'saturated': [
  ['Reading the definition', R`<p>$p^{-1}(p(C))$ is "everything glued to something in $C$": push $C$ down, then take everything lying over the result. $C$ is <b>saturated</b> when this adds nothing, i.e. whenever $C$ contains one point of a piece it contains the whole piece.</p>`],
  ['Why it is defined this way', R`<p>It is the exact condition under which pushing a set down and pulling it back returns the same set. For open saturated $C$ that means $p^{-1}(p(C))=C$ is open, so $p(C)$ is open downstairs. Saturated open sets are precisely the open sets of $X$ that correspond to open sets of $X^*$.</p>`],
  ['Worked example', R`<p>Crush $A=[0,1]$ in $\mathbb R$. $C=(2,3)$ misses $A$: saturated. $C=(-1,2)$ contains all of $A$: saturated. $C=(-1,\tfrac12)$ contains part of $A$: not saturated; pulling back after pushing down gives $(-1,\tfrac12)\cup[0,1]=(-1,1]$, which is not even open.</p>`],
  ['Common confusions', R`<p>Saturated is about $C$ relative to the gluing, not about openness: a set can be saturated and not open, or open and not saturated.</p>`]],
'quotient-map': [
  ['Reading the definition', R`<p>Three parts. <b>Surjective</b>: every point of $Y$ comes from somewhere, so every point downstairs has something over it. <b>If $U$ open then $p^{-1}(U)$ open</b>: continuity. <b>If $p^{-1}(U)$ open then $U$ open</b>: the reverse direction, which says $Y$ has no fewer open sets than the gluing allows.</p>`],
  ['Why it is defined this way', R`<p>It says $Y$ carries exactly the [[quotient-topology]] for the partition into fibres $p^{-1}(\{y\})$. So a quotient map is "gluing, with the right topology downstairs". It is how gluings that arise as maps (wrapping $[0,1]$ around a circle, projecting a product) are recognized as quotients.</p>`],
  ['Worked example', R`<p>$\pi_1:X\times Y\to X$ (HW6 Q2), with $Y\ne\varnothing$.</p>
<ol><li>Surjective: fix $y_0\in Y$; then $\pi_1(x,y_0)=x$.</li><li>Continuous: $\pi_1^{-1}(U)=U\times Y$ is open.</li><li>Reverse: suppose $\pi_1^{-1}(U)$ is open. The map $i(x)=(x,y_0)$ is continuous and $\pi_1\circ i=\mathrm{id}$, so $U=i^{-1}(\pi_1^{-1}(U))$ is open, a preimage of an open set under a continuous map.</li></ol>`],
  ['Non-example, and why it fails', R`<p>$g:[0,1)\cup\{2\}\to[0,1]$, $g(2)=1$ and $g(t)=t$ otherwise. It is a continuous bijection, but $g^{-1}(\{1\})=\{2\}$ is open (isolated) while $\{1\}$ is not open in $[0,1]$. The reverse direction fails: a point alone upstairs is crowded downstairs.</p>`],
  ['Common confusions', R`<p>The reverse direction is not the same as being an [[open-map]]: it only concerns full preimages $p^{-1}(U)$. Open (or closed) plus continuous surjective implies quotient, not conversely (HW7 Q4).</p>`]],
'maps-out-of-quotients': [
  ['Reading the definition', R`<p><b>"$h$ constant on each $p^{-1}(\{y\})$"</b>: $h$ does not distinguish points that get glued together, so it makes sense on the glued space. <b>"$g\circ p=h$"</b>: $g$ sends each glued point to the common value of $h$ on it. <b>"$g$ continuous"</b>: continuity comes for free.</p>`],
  ['Why it is true', R`<p>For open $V\subseteq Z$: $p^{-1}(g^{-1}(V))=h^{-1}(V)$ is open, because $h$ is continuous. By the definition of the quotient topology, $g^{-1}(V)$ is open. Openness downstairs is tested upstairs, and upstairs $h$ does the work.</p>`],
  ['Worked example', R`<p>HW6 Q5: to show $X/{\sim}$ is Hausdorff when $x\sim y$ iff $q(x)=q(y)$ for a map $q$ into a Hausdorff space, define $g([z])=q(z)$. It is well defined by the definition of $\sim$ and continuous by this theorem; distinct classes have distinct images, which have disjoint neighbourhoods, which pull back to disjoint neighbourhoods of the classes.</p>`]]
};
Object.keys(DEEP).forEach(function(id){ var a = A[id]; if (!a) return; var s = a.sections || []; var k = s.length && /^(Definition|Statement)$/.test(s[0][0]) ? 1 : 0; a.sections = s.slice(0, k).concat(DEEP[id], s.slice(k)); a.deep = 1; });

// ===== Deeper teaching, second batch: the rest of Chapters 1–2 and the start of Chapter 3.
var DEEP2 = {
'image-preimage': [
  ['Reading the definition', R`<p><b>$f(A)$</b>: start with points of $A$, apply $f$, collect where they land. <b>$f^{-1}(B)$</b>: start with the target set $B$, collect every point of $X$ that lands inside $B$. The symbol $f^{-1}$ here does not mean $f$ has an inverse; it is just the set of points that map into $B$.</p>`],
  ['Worked example', R`<p>$f(x)=x^2$ on $\mathbb R$. $f([-1,2])=[0,4]$. $f^{-1}([1,4])=[-2,-1]\cup[1,2]$. $f^{-1}(\{-1\})=\varnothing$.</p>`],
  ['Common confusions', R`<p>$f^{-1}$ takes sets, not points: write $f^{-1}(\{0\})$, not $f^{-1}(0)$. And $f(A\cap B)\subseteq f(A)\cap f(B)$ can be strict ($f(x)=x^2$, $A=\{-1\}$, $B=\{1\}$), while $f^{-1}$ preserves intersections exactly.</p>`]],
'relation-equivalence': [
  ['Reading the definition', R`<p><b>Reflexive</b>: everything is the same as itself. <b>Symmetric</b>: "same as" works both ways. <b>Transitive</b>: same as something that is same as a third thing means same as the third thing. Together they say the relation behaves like equality, but coarser.</p>`],
  ['Why it is defined this way', R`<p>These three properties are exactly what is needed for "the set of things the same as $x$" to be well behaved: two such sets are either identical or disjoint, so they cut $X$ into pieces ([[partition]]). That is what lets us glue.</p>`],
  ['Worked example', R`<p>Check $\sim_A$: reflexive since $x=x$; symmetric since "$x=y$ or both in $A$" is symmetric in $x,y$; transitive: if $x\sim y$ and $y\sim z$, either one of them is an equality (then substitute), or $x,y\in A$ and $y,z\in A$, so $x,z\in A$.</p>`]],
'equivalence-class': [
  ['Reading the definition', R`<p>$[x]$ collects every $y$ that $\sim$ declares the same as $x$. If $y\in[x]$ then $[y]=[x]$: any member can name the class.</p>`],
  ['Why two classes are equal or disjoint', R`<p>If $z\in[x]\cap[y]$ then $z\sim x$ and $z\sim y$, so by symmetry and transitivity $x\sim y$, and every element of one class is related to every element of the other.</p>`]],
'functions': [
  ['Reading the definition', R`<p><b>Injective</b>: different inputs give different outputs; nothing is merged. <b>Surjective</b>: every target point is hit; nothing is missed. <b>Bijective</b>: a perfect matching, so it can be run backwards.</p>`],
  ['Why it matters here', R`<p>Quotient maps are surjections that merge points (not injective): gluing. Homeomorphisms are bijections that match open sets: renaming. Injectivity is what makes $A=f^{-1}(f(A))$ automatic, which is why every set is [[saturated]] for an injective map.</p>`]],
'countable': [
  ['Reading the definition', R`<p>"Injective map $J\to\mathbb N$" means you can label the elements of $J$ with different natural numbers. Then you could list them one after another, possibly with gaps.</p>`],
  ['Worked example', R`<p>A countable union of finite sets $J_1,J_2,\dots$ is countable: list all of $J_1$, then the new elements of $J_2$, and so on. Each element gets a position in the list. This is the last step of HW4 Q4(b).</p>`]],
'finer-coarser': [
  ['Reading the definition', R`<p>$\mathcal T\subseteq\mathcal T'$: every set open for $\mathcal T$ is also open for $\mathcal T'$. The finer topology has at least as many open sets.</p>`],
  ['Why it matters', R`<p>More open sets make more maps <em>out of</em> the space continuous and fewer maps <em>into</em> it. The identity $(X,\mathcal T')\to(X,\mathcal T)$ is continuous exactly when $\mathcal T'$ is finer (HW3 Q2). A finer topology than a Hausdorff one is Hausdorff (same disjoint open sets still available, HW6 Q4).</p>`],
  ['Worked example', R`<p>$\mathbb R_\ell$ is finer than $\mathbb R$: any $(a,b)\ni x$ contains $[x,b)\ni x$. Strictly finer: $[0,1)$ is open in $\mathbb R_\ell$ but not in $\mathbb R$.</p>`]],
'generated-topology': [
  ['Reading the statement', R`<p>"$U$ is open iff around each $x\in U$ some basis element fits inside $U$." This turns openness into a pointwise check you can actually carry out.</p>`],
  ['Worked example', R`<p>In the metric topology, $\{(x,y): x>0\}$ is open: at $(x,y)$ with $x>0$ the ball of radius $x$ fits inside.</p>`]],
'lemma-13-3': [
  ['Reading the statement', R`<p>To show the new topology $\mathcal T'$ has every old open set, it is enough to look at old <em>basis</em> elements, one point at a time: inside each old block around $x$ find a new block around $x$.</p>`],
  ['Worked example', R`<p>HW1 Q3: rational intervals versus all intervals. Inside $(a,b)\ni x$ pick rationals $p,q$ with $a<p<x<q<b$; then $x\in(p,q)\subseteq(a,b)$. And rational intervals are intervals. So each topology is finer than the other: they are equal.</p>`]],
'subbasis': [
  ['Reading the definition', R`<p>Start with a family $\mathcal S$ that covers $X$. Allow finite intersections of its members (these form a basis), then all unions of those. The result is the smallest topology containing $\mathcal S$.</p>`],
  ['Why it is useful', R`<p>It is the easiest way to say "make these particular sets open and nothing more". The product topology is "make every $\pi_\alpha^{-1}(U)$ open and nothing more".</p>`]],
'projections': [
  ['Reading the definition', R`<p>$\pi_1$ forgets the second coordinate. Picture $\mathbb R^2\to\mathbb R$: each point drops straight down to the $x$-axis, its shadow.</p>`],
  ['Why open but not closed', R`<p>An open set has room around each point, and a box of room projects to an interval of room: open. But a closed set can creep toward a vertical line without touching it (the hyperbola), so its shadow approaches a point it never reaches: not closed.</p>`]],
'interior': [
  ['Reading the definition', R`<p>The interior of $A$ is the set of points of $A$ that have room inside $A$: those with some open set around them contained in $A$.</p>`],
  ['Worked example', R`<p>$A=[0,1)$ in $\mathbb R$: $\operatorname{Int}A=(0,1)$. The point $0$ is in $A$, but every interval around it pokes out to the left.</p>`]],
'closure-test': [
  ['Reading the statement', R`<p>To decide whether $x$ is stuck to $A$, probe it with every open set around it. If even one probe misses $A$, $x$ is not in the closure. If every probe hits $A$, it is.</p>`],
  ['Worked example', R`<p>MT Q2: $X=\{0,1,2\}$, $\mathcal T=\{\varnothing,\{0\},\{0,1\},X\}$, $A=\{1\}$. For $x=0$: the open set $\{0\}$ misses $A$, so $0\notin\overline A$. For $x=2$: the only open set containing $2$ is $X$, which meets $A$, so $2\in\overline A$. And $1\in A$. So $\overline A=\{1,2\}$.</p>`]],
'closure-limit-points': [
  ['Reading the statement', R`<p>Every point stuck to $A$ is either in $A$ already or is a point that $A$ accumulates at. Nothing else gets added.</p>`],
  ['Worked example', R`<p>$A=\{1/n\}\cup\{2\}$. Limit points: only $0$ (the point $2$ is isolated). So $\overline A=A\cup\{0\}$.</p>`]],
'dense': [
  ['Reading the definition', R`<p>$\overline A=X$ means every point of $X$ is stuck to $A$: no open set, however small, avoids $A$.</p>`],
  ['Why it matters', R`<p>Continuous maps into Hausdorff spaces are determined by their values on a dense set (HW3 Q3). That is why knowing a continuous function on $\mathbb Q$ determines it on $\mathbb R$.</p>`]],
't1': [
  ['Reading the definition', R`<p>Every single point $\{x\}$ is closed: for any $y\ne x$ there is an open set around $y$ missing $x$. Points can be avoided one at a time, but not necessarily separated in pairs.</p>`],
  ['Worked example', R`<p>[[ex-finite-complement|Cofinite]]: $X\setminus\{x\}$ is open (its complement is finite), so points are closed: T₁. Not Hausdorff.</p>`]],
'convergence': [
  ['Reading the definition', R`<p>"For every open $U\ni x$ there is $N$ with $x_n\in U$ for $n\ge N$": whatever neighbourhood of $x$ you choose, the sequence eventually enters it and stays.</p>`],
  ['Worked example', R`<p>In $\mathbb R$, $1/n\to0$: for $U\supseteq(-\varepsilon,\varepsilon)$ take $N>1/\varepsilon$. In the [[ex-indiscrete|indiscrete]] topology the only neighbourhood is $X$, so every sequence converges to every point: limits need not be unique without [[hausdorff|Hausdorff]].</p>`]],
'continuity-equivalents': [
  ['Reading the statement', R`<p>Four ways of saying the same thing. (2) says continuous maps do not tear points away from sets they were stuck to. (3) is (1) with complements. (4) is the local, ε–δ-like version: around each point separately.</p>`],
  ['When to use which', R`<p>(1) with a basis for general proofs; (3) when closed sets are easier (MT Q4); (4) when working at one point at a time; (2) for closure arguments (HW3 Q3).</p>`]],
'pasting-lemma': [
  ['Reading the statement', R`<p>If $X$ is cut into two closed pieces and $f$ is continuous on each piece, with the pieces agreeing where they meet, then the combined function is continuous.</p>`],
  ['Worked example', R`<p>$h(x)=x$ for $x\le0$ and $h(x)=x/2$ for $x\ge0$: both pieces are continuous on the closed sets $(-\infty,0]$, $[0,\infty)$ and agree at $0$. So $h$ is continuous.</p>`]],
'embedding': [
  ['Reading the definition', R`<p>$f$ puts a copy of $X$ inside $Y$: injective, continuous, and with the subspace topology on $f(X)$ matching the topology of $X$ exactly.</p>`],
  ['Non-example', R`<p>$[0,1)\to S^1$ wrapping around: injective and continuous, but not an embedding, because the image has the wrong topology near $(1,0)$.</p>`]],
'product-vs-box': [
  ['Reading the definition', R`<p>A box-topology basis element may restrict every coordinate. A product-topology basis element restricts only finitely many and leaves all the others completely free ($U_\alpha=X_\alpha$).</p>`],
  ['Why the product topology wins', R`<p>Restricting infinitely many coordinates is too strong: in the box topology on $\mathbb R^\omega$, the diagonal map $t\mapsto(t,t,t,\dots)$ is not continuous, since $\prod(-\tfrac1n,\tfrac1n)$ pulls back to $\{0\}$. The product topology is the coarsest making projections continuous, and that is exactly enough for coordinatewise statements to work.</p>`],
  ['Worked example', R`<p>HW3 Q6: if $J$ is infinite, $m^{-1}(\{0\})=\{(0,0,\dots)\}$. Any product-topology basis element around this point leaves some coordinate free, so it contains points with a nonzero coordinate. So the preimage is not open, and $m$ is not continuous.</p>`]],
'maps-into-products': [
  ['Reading the statement', R`<p>A map into a product is just a list of maps, one per factor. It is continuous exactly when each map in the list is.</p>`],
  ['Why it fails for the box topology', R`<p>The diagonal $\mathbb R\to\mathbb R^\omega$ has continuous coordinates (all the identity) but is not continuous into the box topology; see [[product-vs-box]].</p>`]],
'products-and-subspaces': [
  ['Reading the statement', R`<p>Two ways to topologize $\prod A_\alpha$: as a subspace of the big product, or as a product of the smaller subspaces. They give the same open sets.</p>`],
  ['Contrast', R`<p>Subspaces and quotients do <em>not</em> commute in this way (HW6 Q3, HW7 Q5); see [[defining-by-maps]].</p>`]],
'metric': [
  ['Reading the definition', R`<p><b>Positive</b>: distances are never negative, and zero only between a point and itself. <b>Symmetric</b>: from $x$ to $y$ is as far as from $y$ to $x$. <b>Triangle inequality</b>: a detour through $y$ is never shorter than going straight.</p>`],
  ['Why the triangle inequality matters', R`<p>Nearly every proof with balls uses it: balls are open, metric spaces are Hausdorff, closed balls are closed (MT Q6). It is what turns "close to $y$, and $y$ close to $x$" into "close to $x$".</p>`]],
'ball': [
  ['Reading the definition', R`<p>$B(x,\varepsilon)$: all points strictly closer than $\varepsilon$ to $x$. The strict inequality is what makes it open; with $\le$ you get a closed ball.</p>`],
  ['Worked example', R`<p>In $\mathbb R^2$ with Euclidean distance, $B(0,1)$ is the open unit disc. With the max metric $d=\max(|x_1-y_1|,|x_2-y_2|)$ it is an open square. Same topology: each contains a smaller copy of the other around each point.</p>`]],
'metric-topology': [
  ['Reading the definition', R`<p>A set is open when every point of it is the centre of some ball lying inside it. The radius may shrink as you approach the edge.</p>`],
  ['Worked example', R`<p>MT Q6: $A=\{y: d(x,y)\le1\}$ is closed. For $z\notin A$, $d(x,z)>1$; let $r=d(x,z)-1$. If $w\in B(z,r)$, then $d(x,w)\ge d(x,z)-d(z,w)>1$. So $B(z,r)$ misses $A$: the complement is open.</p>`]],
'first-countable': [
  ['Reading the definition', R`<p>You can list countably many neighbourhoods of $x$ such that every neighbourhood of $x$, however small, contains one from your list. In a metric space: $B(x,1),B(x,\tfrac12),B(x,\tfrac13),\dots$</p>`],
  ['Why it matters', R`<p>It lets you build a sequence $x_n\in U_n\cap A$ approaching $x$, so closures and continuity can be tested with sequences.</p>`]],
'metrizable': [
  ['Reading the definition', R`<p>"Some metric produces exactly these open sets." The metric is not part of the space; the question is whether one exists.</p>`],
  ['How to show a space is not metrizable', R`<p>Find a property every metric space has and show it fails: not Hausdorff, or some point with no countable neighbourhood base (HW4 Q4).</p>`]],
'connected': [
  ['Reading the definition', R`<p>A separation splits $X$ into two nonempty open pieces with nothing in common. Connected means this is impossible: you cannot break the space into two open parts.</p>`],
  ['Why it is defined this way', R`<p>It captures "in one piece" without paths or distances. And it is what makes the intermediate value theorem work: a continuous function cannot jump over a value without splitting its domain.</p>`],
  ['Worked example', R`<p>$\mathbb Q$ is not connected: $U=\mathbb Q\cap(-\infty,\sqrt2)$ and $V=\mathbb Q\cap(\sqrt2,\infty)$ are open in $\mathbb Q$, disjoint, nonempty, and cover $\mathbb Q$ because $\sqrt2\notin\mathbb Q$.</p>`]],
'compact': [
  ['Reading the definition', R`<p><b>Open cover</b>: a collection of open sets that together contain every point. <b>Finite subcover</b>: finitely many of them already do. Compact means: whatever cover you are given, finitely many of its sets suffice.</p>`],
  ['Why it is defined this way', R`<p>It is the topological version of "finite enough": properties that hold locally (bounded near each point, separated near each point) can be patched together using finitely many pieces. That is how compactness gives maxima, uniform continuity, and closedness in Hausdorff spaces.</p>`],
  ['Worked example', R`<p>$(0,1)$ is not compact: the cover by $(\tfrac1n,1)$, $n\ge2$, has no finite subcover, since finitely many miss the points below the smallest $\tfrac1n$. $[0,1]$ is compact (Heine–Borel).</p>`]]
};
Object.keys(DEEP2).forEach(function(id){ var a = A[id]; if (!a) return; var s = a.sections || []; var k = s.length && /^(Definition|Statement|Statements)$/.test(s[0][0]) ? 1 : 0; a.sections = s.slice(0, k).concat(DEEP2[id], s.slice(k)); a.deep = 1; });

// ===== What each thing IS: the idea before the definition. Plus three opening essays.
Object.assign(A, {
'what-is-topology': {title: 'What topology is about', kind: 'idea', where: 'Start here', pre: [],
  lede: 'Topology studies the properties of a space that survive stretching and bending: which points are near which, what is in one piece, where there are holes.',
  sections: [['The question', R`<p>Geometry measures: lengths, angles, areas. Topology asks what is left when you are allowed to stretch, squeeze and bend a space as much as you like, as long as you do not tear it or glue separate parts together. A coffee cup and a doughnut are the same in this sense (one hole each); a sphere and a doughnut are not.</p>
<p>What survives such deformations is a notion of <b>nearness</b>: which points are close to which sets, which points can be approached by others, which parts hang together. Distances change under stretching; nearness does not.</p>`],
    ['How it is captured', R`<p>Nearness is recorded without numbers by saying which sets are <b>open</b>: an open set around a point is a "neighbourhood", a region of points near it. The whole subject is then built from one decision, which subsets are open, made subject to three rules ([[topology]]).</p>
<p>From that alone the course defines limits ([[convergence]]), what a set touches ([[closure]]), separation of points ([[hausdorff]]), being in one piece ([[connected]]), finiteness of a kind ([[compact]]), and maps that preserve nearness ([[continuous]]).</p>`],
    ['The shape of the course', R`<p>Chapter 2 sets up the language and the ways to build spaces (subspaces, products, quotients). Chapter 3 studies the two great properties, connectedness and compactness. Later chapters count holes (the fundamental group) and classify surfaces. Each step asks: what can be said about a space using only its open sets?</p>`],
    ['Read next', R`<p>[[describing-by-structure]], then [[topology]].</p>`]]},
'describing-by-structure': {title: 'How mathematics says what something is', kind: 'idea', where: 'Start here', pre: ['what-is-topology'],
  lede: 'A mathematical object is a set together with a structure on it; two objects are "the same" when a bijection carries one structure exactly onto the other.',
  sections: [['A set and a structure', R`<p>A topological space is not a set of points alone. The points of $\mathbb R$ and of $\mathbb R_\ell$ are the same real numbers; the spaces differ because different subsets are called open. The object <em>is</em> the pair $(X,\mathcal T)$: the points, and the record of which sets count as neighbourhoods.</p>
<p>The same pattern runs through mathematics. A group is a set with a multiplication; a metric space is a set with a distance; a topological space is a set with a topology. The set supplies the material; the structure says what it is like.</p>`],
    ['Definitions say what it does, not what it is made of', R`<p>Modern definitions describe an object by the properties of its structure (three axioms for open sets) rather than by what it is made of. Any collection satisfying the axioms counts. This is why the same definitions apply to the real line, to a finite set of three points, and to an infinite product of copies of $\{0,1\}$.</p>`],
    ['Sameness', R`<p>Two spaces are the same when a [[homeomorphism]] matches their points one to one and their open sets exactly. Then every statement made in terms of open sets is true of one iff it is true of the other. A <b>topological property</b> is exactly such a statement: Hausdorff, connected, compact. Being bounded is not one: $(-1,1)$ is bounded and homeomorphic to $\mathbb R$, which is not.</p>`],
    ['Building new objects from old', R`<p>New spaces are made by saying which maps should be continuous: a subspace is defined by its inclusion, a product by its projections, a quotient by its gluing map ([[defining-by-maps]]). The object is described by how it relates to others, not by listing its open sets.</p>`],
    ['An interpretation (beyond Munkres)', R`<p>This way of describing objects by structure and relations, with identity up to isomorphism, is what philosophers of mathematics call structuralism: mathematical objects are positions in a structure, and nothing about them matters beyond the structure. Topology is a clear case, since everything said about a space is said through its open sets.</p>`]]},
'abstraction-quotients': {title: 'Quotients as abstraction', kind: 'idea', where: '§22', pre: ['quotient-topology', 'relation-equivalence'],
  lede: 'Gluing points along an equivalence relation is the same move as forming an abstract concept: things that agree in some respect become one thing.',
  sections: [['The move', R`<p>Start with many things and a respect in which some of them agree: points with the same sign, points of $[0,1]$ that are both endpoints, points of $A$ that are "all in $A$". Declare them equal. The new objects are the classes; the [[quotient-topology]] says which collections of them are open.</p>`],
    ['In mathematics generally', R`<p>Fractions are built this way ($\tfrac12=\tfrac24$: pairs of integers identified when $ad=bc$); so are the integers mod $n$, and the circle as an interval with its ends identified ([[gluing-examples]]).</p>`],
    ['An interpretation (beyond Munkres)', R`<p>Frege defined "the direction of a line" through the relation of being parallel: lines have the same direction exactly when they are parallel. That principle, and Hume's principle for numbers (two collections have the same number exactly when they can be matched one to one), have the form of a quotient: an equivalence relation, and new objects that are its classes. The topological question adds a further layer: once things are identified, which collections of the new objects count as open, i.e. what nearness the abstraction inherits.</p>`]]}
});
var WHAT = {
'topology': R`<p>A topology is a <b>record of nearness</b> on a set. It does not say how far apart points are; it says which sets are neighbourhoods, regions containing all points "near enough" to a given point for some purpose. Choosing a topology is choosing what "near" means.</p><p>Think of it as resolution. The [[ex-discrete|discrete]] topology says every point stands alone: maximal resolution. The [[ex-indiscrete|indiscrete]] topology cannot tell any two points apart: no resolution. Every other topology lies between, and the axioms say only that resolution behaves consistently when regions are combined.</p>`,
'open-set': R`<p>An open set is a <b>region with room around each of its points</b>: a set every point of which is surrounded, inside the set, by points near it. It has no edge of its own: wherever you stand in it, you can move a little in any direction and stay in it.</p>`,
'basis': R`<p>A basis is a <b>set of standard neighbourhoods</b>: small regions of a fixed shape (intervals, balls, boxes) that are enough to describe nearness everywhere. Instead of listing all open sets, you list the building blocks and say open sets are whatever can be built from them.</p>`,
'subspace-topology': R`<p>A subspace is <b>a part of a space, seen from inside</b>. Its points keep exactly the nearness they had in the larger space; the points outside are simply not there any more.</p>`,
'product-topology': R`<p>A product is <b>a space of combinations</b>: a point of $X\times Y$ is a choice of a point in each. Two combinations are near when each of their components is near. The plane is the product of two lines.</p>`,
'closed-set': R`<p>A closed set is <b>a set that contains its own edge</b>: if points of the set crowd toward some point, that point already belongs to it. You cannot leave a closed set by sliding up to its boundary.</p>`,
'closure': R`<p>The closure of $A$ is <b>everything $A$ touches</b>: $A$ together with all the points it cannot be separated from. It is what you get by adding $A$'s missing edge.</p>`,
'limit-point': R`<p>A limit point of $A$ is <b>a place where $A$ piles up</b>: points of $A$ come arbitrarily near it, from somewhere other than the point itself.</p>`,
'hausdorff': R`<p>A Hausdorff space is one where <b>different points are genuinely apart</b>: any two can be given private neighbourhoods that do not overlap. It is the minimum needed for limits to be unique and for points to behave like points.</p>`,
'continuous': R`<p>A continuous map is <b>a map that does not tear</b>: points near each other stay near each other after mapping, so nothing that was connected gets ripped apart. In the language of open sets: if you specify how near you want to land, there is a region near your starting point that gets you there.</p>`,
'homeomorphism': R`<p>A homeomorphism is <b>a perfect relabelling</b>: the same space with its points renamed. Points match one to one and nearness matches exactly, so as far as topology can tell, the two spaces are one space.</p>`,
'open-map': R`<p>An open map <b>keeps room</b> going forward: a region with room around each point lands on a region with room around each point. A closed map keeps edges: a set containing its edge lands on one that contains its edge.</p>`,
'quotient-topology': R`<p>A quotient is <b>a space built by gluing</b>: points that should count as one are identified, and the glued space inherits nearness from the original. Wrap a strip of paper into a ring by gluing its ends; collapse a set to a single point; identify opposite sides of a square to make a torus.</p><p>The quotient topology is the honest answer to "what is near what after gluing?": a set of glued points is a neighbourhood exactly when the original points lying over it form a neighbourhood upstairs. See also [[abstraction-quotients]].</p>`,
'saturated': R`<p>A saturated set is <b>a set that respects the gluing</b>: it never splits a glued piece, taking some of its points and leaving others. Only such sets can be pictured downstairs, as sets of whole glued points.</p>`,
'quotient-map': R`<p>A quotient map is <b>a gluing presented as a map</b>: it sends points to where they are glued, and the target has exactly the nearness the gluing produces. Wrapping $[0,1]$ around a circle is a quotient map; it glues $0$ to $1$ and nothing else.</p>`,
'metric': R`<p>A metric is <b>a way of measuring distance</b>: a number for each pair of points, obeying the rules distance should obey. It gives a topology (nearness = small distance), but carries more information than topology keeps.</p>`,
'connected': R`<p>A connected space is <b>in one piece</b>: it cannot be split into two parts each of which is separate from the other. There is no way to sort its points into two groups without some point of one group being stuck to the other.</p>`,
'compact': R`<p>A compact space is <b>finite in the eyes of topology</b>: however you cover it with open regions, finitely many regions already suffice. It behaves like a finite set wherever finiteness matters (taking maxima, choosing a smallest radius, patching local facts together), while possibly having infinitely many points.</p>`,
'relation-equivalence': R`<p>An equivalence relation is <b>a respect in which things are the same</b>: having the same sign, the same colour, both lying in $A$. It is sameness relative to a point of view, coarser than identity.</p>`,
'partition': R`<p>A partition is <b>a sorting</b>: every element goes into exactly one bin. Sorting by a respect of sameness gives the classes of an equivalence relation.</p>`
};
Object.keys(WHAT).forEach(function(id){ var a = A[id]; if (!a) return; a.sections = [['What it is', WHAT[id]]].concat(a.sections || []); });
