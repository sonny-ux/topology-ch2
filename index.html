// ---------- Q1
hub8('hw8-q1', [
 ['What "constant" means (the goal)', R`<p>A function $f:X\to Y$ is <b>constant</b> if it takes the same value at every point: there is one $c\in Y$ with $f(x)=c$ for all $x\in X$. Equivalently, $f(x)=f(x')$ for every pair $x,x'\in X$. Its image $f(X)$ is then a single point $\{c\}$ (or empty, if $X=\varnothing$).</p>
<p>For a map $f:X\to\{0,1\}$ there are only two possible constant maps: <b>$f(x)=0$ for all $x$</b>, or <b>$f(x)=1$ for all $x$</b>. In terms of preimages, $f$ is constant exactly when <b>one of $f^{-1}(\{0\})$, $f^{-1}(\{1\})$ is empty</b>: if no point goes to $1$, every point goes to $0$, and the other way round.</p>
<p><b>Not constant</b> means the opposite: there are two points $u,v\in X$ with $f(u)\ne f(v)$, i.e. $f(u)=0$ and $f(v)=1$ for some $u,v$. So</p><ul><li>to prove (a), "$f$ is constant", show one of the two preimages is empty, and say which value $f$ then takes everywhere;</li><li>to prove (b), "$f$ is not constant", name two points with different values.</li></ul>`],
 ['How the terms are used', R`<p><b>The discrete topology on $\{0,1\}$</b> ([[ex-discrete]]) makes <em>every</em> subset open: $\varnothing,\{0\},\{1\},\{0,1\}$. So for a map $f:X\to\{0,1\}$, <b>continuity</b> ([[continuous]]) asks that the preimage of each of these four sets be open in $X$. Two of them are automatic ($f^{-1}(\varnothing)=\varnothing$, $f^{-1}(\{0,1\})=X$), so continuity comes down to: <b>$f^{-1}(\{0\})$ and $f^{-1}(\{1\})$ are both open.</b></p>
<p>Those two sets are disjoint (no point goes to both values) and together they are all of $X$ (every point goes somewhere). A <b>separation</b> of $X$ ([[connected]]) is exactly a pair of disjoint nonempty open sets covering $X$. So a continuous map to $\{0,1\}$ is the same thing as a way of splitting $X$ into two open, disjoint parts, one labelled $0$ and one labelled $1$; it is <b>constant</b> exactly when one of the two parts is empty.</p>
<p>That one observation does both parts. (a) is "if no separation exists, one part is empty"; (b) is "if a separation $U,V$ exists, label $U$ with $0$ and $V$ with $1$".</p>`],
 ['Breakdown', steps([
  [R`<b>(a) Take an arbitrary continuous $f:X\to\{0,1\}$</b> and set $U=f^{-1}(\{0\})$, $V=f^{-1}(\{1\})$.`, R`The claim is about all continuous $f$, so start from an arbitrary one. These two preimages are the natural sets to look at: they record where $f$ takes each value.`],
  [R`<b>(a) $U$ and $V$ are open.</b> $\{0\}$ and $\{1\}$ are open in the discrete topology, and $f$ is continuous.`, R`Definition of continuity: preimages of open sets are open. Two facts are used, and neither is about $X$: the topology of the <em>target</em> (discrete, so $\{0\}$ and $\{1\}$ are open) and the continuity of $f$. The chain is: $\{0\}$ open in $\{0,1\}$, $f$ continuous, so $f^{-1}(\{0\})$ open in $X$. This holds for every space $X$, connected or not. Connectedness of $X$ is used only later, to force one of $U,V$ to be empty.`],
  [R`<b>(a) $U\cap V=\varnothing$ and $U\cup V=X$.</b>`, R`<b>Recall:</b> a function $f:X\to Y$ assigns to <em>every</em> $x\in X$ <em>exactly one</em> value $f(x)\in Y$ (Munkres §2: a rule of assignment whose domain is all of $X$). "Every" gives the cover; "exactly one" gives disjointness. <b>Disjoint:</b> a function gives each point exactly one value, so no $x$ has $f(x)=0$ and $f(x)=1$. <b>Cover:</b> prove $U\cup V=X$ by two inclusions ([[m-set-equality]]). $U\cup V\subseteq X$ because preimages are subsets of the domain. $X\subseteq U\cup V$: take any $x\in X$; $f$ maps into $\{0,1\}$, so $f(x)=0$ (then $x\in U$) or $f(x)=1$ (then $x\in V$). Shorter route: preimages respect unions, so $U\cup V=f^{-1}(\{0\})\cup f^{-1}(\{1\})=f^{-1}(\{0,1\})=X$, since every point of $X$ is sent somewhere in the target ([[image-preimage]]).`],
  [R`<b>(a) One of $U,V$ is empty.</b> Otherwise $U,V$ would be a separation of $X$, which cannot exist since $X$ is connected.`, R`Recall: connected means no pair of disjoint nonempty open sets covers $X$. Here every requirement holds except possibly "nonempty", so that is the one that must fail.`],
  [R`<b>(a) Conclude:</b> if $V=\varnothing$ then $f(x)=0$ for all $x$; if $U=\varnothing$ then $f(x)=1$ for all $x$. Either way $f$ is constant.`, ''],
  [R`<b>(b) Use the separation.</b> $X$ not connected gives disjoint nonempty open $U,V$ with $U\cup V=X$.`, R`This is what "not connected" means; it hands you the two sets to build $f$ from.`],
  [R`<b>(b) Define</b> $f(x)=0$ for $x\in U$ and $f(x)=1$ for $x\in V$.`, R`Well defined because each $x$ lies in exactly one of $U,V$ (they cover $X$ and are disjoint).`],
  [R`<b>(b) Check continuity on all four open sets:</b> $f^{-1}(\varnothing)=\varnothing$, $f^{-1}(\{0\})=U$, $f^{-1}(\{1\})=V$, $f^{-1}(\{0,1\})=X$; all open.`, R`In the discrete topology there are exactly four open sets, so checking all of them is checking continuity completely ([[m-finite]]).`],
  [R`<b>(b) Not constant:</b> pick $u\in U$, $v\in V$ (both nonempty); $f(u)=0\ne1=f(v)$.`, R`This is where "nonempty" in the separation is used.`]])],
 ['Clean solution', R`<p>Throughout, $\{0,1\}$ has the discrete topology, whose open sets are $\varnothing,\{0\},\{1\},\{0,1\}$.</p>
<p><b>(a)</b> Let $X$ be connected and let $f:X\to\{0,1\}$ be continuous. Set $U=f^{-1}(\{0\})$ and $V=f^{-1}(\{1\})$. Since $\{0\}$ and $\{1\}$ are open and $f$ is continuous, $U$ and $V$ are open in $X$. They are disjoint, since no point has $f(x)=0$ and $f(x)=1$, and $U\cup V=X$, since each $f(x)$ is $0$ or $1$. If both were nonempty, $U,V$ would be a separation of $X$, contradicting connectedness. Hence $U=\varnothing$ or $V=\varnothing$. If $V=\varnothing$, then $f(x)=0$ for every $x\in X$; if $U=\varnothing$, then $f(x)=1$ for every $x$. In either case $f$ is constant. $\blacksquare$</p>
<p><b>(b)</b> Let $X$ be not connected. Then there are disjoint nonempty open sets $U,V\subseteq X$ with $U\cup V=X$. Define $f:X\to\{0,1\}$ by $f(x)=0$ if $x\in U$ and $f(x)=1$ if $x\in V$; this is well defined because every $x$ lies in exactly one of $U,V$. The preimages of the four open sets are $f^{-1}(\varnothing)=\varnothing$, $f^{-1}(\{0\})=U$, $f^{-1}(\{1\})=V$ and $f^{-1}(\{0,1\})=X$, all open in $X$, so $f$ is continuous. Choosing $u\in U$ and $v\in V$ gives $f(u)=0\ne1=f(v)$, so $f$ is not constant. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>A continuous map to a discrete space cannot "jump" inside a connected piece: near each point it must stay on the same value, because each value's preimage is open. A map to $\{0,1\}$ is therefore a colouring of $X$ in two colours with each colour region open. A connected space admits only one-colour colourings; a disconnected one admits a two-colour colouring, one colour per side of the split.</p>
<p>Together (a) and (b) give a third definition of connectedness: <b>$X$ is connected iff every continuous map $X\to\{0,1\}$ is constant</b> (added to [[connected]], "Equivalent forms"). It is also the shape of the intermediate value theorem: a continuous map cannot reach two values without passing through a split.</p>`]]);

// ---------- Q2
hub8('hw8-q2', [
 ['What it builds on: HW8 Q1', R`<p>Q1 showed that continuous maps $X\to\{0,1\}$ (discrete) are exactly the ways of splitting $X$ into two disjoint open parts. Q2 turns this around: declare two points the same when <em>no</em> such split separates them. The classes are the pieces that can never be cut apart by a map to $\{0,1\}$.</p>`],
 ['How the terms are used', R`<p>An <b>equivalence relation</b> ([[relation-equivalence]]) must be reflexive ($x\sim x$), symmetric ($x\sim x'$ gives $x'\sim x$) and transitive ($x\sim x'$ and $x'\sim x''$ give $x\sim x''$). Here $x\sim x'$ means: <em>for every</em> continuous $f:X\to\{0,1\}$, $f(x)=f(x')$. Each of the three rules is a statement about all such $f$, and each follows from the matching rule for <b>equality</b> of the values $f(x)$, which is itself reflexive, symmetric and transitive.</p>
<p>An <b>equivalence class</b> ([[equivalence-class]]) is $[x]=\{x'\in X: x'\sim x\}$. To show it is <b>closed</b> ([[closed-set]]) the method is to write it using operations that keep sets closed. The key facts:</p><ul><li>In the discrete topology every subset is open, so every subset is also closed (its complement is open). In particular $\{0\}$ and $\{1\}$ are closed.</li><li>For continuous $f$, the preimage of a closed set is closed (Theorem 18.1; preimages respect complements).</li><li>Any intersection of closed sets, even infinitely many, is closed (Theorem 17.1).</li></ul><p>So the plan is: write $[x]$ as an intersection of preimages $f^{-1}(\{f(x)\})$, one for each continuous $f$.</p>`],
 ['Breakdown', steps([
  [R`<b>(a) Reflexive:</b> for every $f$, $f(x)=f(x)$, so $x\sim x$.`, R`Equality is reflexive.`],
  [R`<b>(a) Symmetric:</b> if $x\sim x'$, then for every $f$, $f(x)=f(x')$, so $f(x')=f(x)$; hence $x'\sim x$.`, R`Equality is symmetric; the "for every $f$" is carried through unchanged.`],
  [R`<b>(a) Transitive:</b> if $x\sim x'$ and $x'\sim x''$, take any $f$: $f(x)=f(x')$ and $f(x')=f(x'')$, so $f(x)=f(x'')$; hence $x\sim x''$.`, R`Fix one arbitrary $f$, use both hypotheses for that same $f$, and conclude for it; since $f$ was arbitrary, it holds for all.`],
  [R`<b>(b) Name the class:</b> $A$ is a class, so $A=[x]$ for some $x\in A$.`, R`Every class is the class of any of its members.`],
  [R`<b>(b) Rewrite it:</b> $[x]=\bigcap_{f}f^{-1}(\{f(x)\})$, the intersection over all continuous $f:X\to\{0,1\}$.`, R`$x'$ lies in $f^{-1}(\{f(x)\})$ exactly when $f(x')=f(x)$; lying in all of them is exactly "$f(x')=f(x)$ for every $f$", i.e. $x'\sim x$. Prove the equality by two inclusions ([[m-set-equality]]).`],
  [R`<b>(b) Each piece is closed:</b> $\{f(x)\}$ is $\{0\}$ or $\{1\}$, closed in the discrete topology; $f$ is continuous, so $f^{-1}(\{f(x)\})$ is closed in $X$.`, R`Recall: every subset of a discrete space is closed; preimages of closed sets under continuous maps are closed.`],
  [R`<b>(b) Conclude:</b> an intersection of closed sets is closed, so $A=[x]$ is closed.`, R`Theorem 17.1: arbitrary intersections of closed sets are closed. The family is usually infinite, which is why "arbitrary" matters.`]])],
 ['Clean solution', R`<p>Let $\mathcal F$ be the set of continuous functions $X\to\{0,1\}$, where $\{0,1\}$ has the discrete topology. By definition, $x\sim x'$ iff $f(x)=f(x')$ for all $f\in\mathcal F$.</p>
<p><b>(a)</b> <em>Reflexive:</em> for every $f\in\mathcal F$, $f(x)=f(x)$, so $x\sim x$. <em>Symmetric:</em> if $x\sim x'$, then $f(x)=f(x')$ for all $f\in\mathcal F$, so $f(x')=f(x)$ for all $f\in\mathcal F$, and $x'\sim x$. <em>Transitive:</em> suppose $x\sim x'$ and $x'\sim x''$, and let $f\in\mathcal F$. Then $f(x)=f(x')$ and $f(x')=f(x'')$, so $f(x)=f(x'')$. Since $f$ was arbitrary, $x\sim x''$. Hence $\sim$ is an equivalence relation. $\blacksquare$</p>
<p><b>(b)</b> Let $A$ be an equivalence class and choose $x\in A$, so $A=\{x'\in X: x'\sim x\}$. We claim $A=\bigcap_{f\in\mathcal F}f^{-1}(\{f(x)\})$. If $x'\in A$, then $f(x')=f(x)$ for every $f\in\mathcal F$, so $x'\in f^{-1}(\{f(x)\})$ for every $f$, and $x'$ lies in the intersection. Conversely, if $x'$ lies in the intersection, then $f(x')=f(x)$ for every $f\in\mathcal F$, so $x'\sim x$ and $x'\in A$.</p>
<p>In the discrete topology every subset is open, so every subset is closed; in particular $\{f(x)\}$, which is $\{0\}$ or $\{1\}$, is closed in $\{0,1\}$. Since each $f\in\mathcal F$ is continuous, $f^{-1}(\{f(x)\})$ is closed in $X$. An arbitrary intersection of closed sets is closed, so $A$ is closed. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>Each continuous $f:X\to\{0,1\}$ cuts $X$ into two open-and-closed halves (Q1). A class of $\sim$ is what you get by making every possible such cut and keeping only the points that land on $x$'s side every time. Each cut keeps a closed half; keeping closed halves over and over, even infinitely often, leaves a closed set.</p>
<p>The classes are not always open: an intersection of infinitely many open sets need not be open. For $X=\{0\}\cup\{\tfrac1n:n\ge1\}\subset\mathbb R$, the class of $0$ is $\{0\}$ (each $\tfrac1n$ is open and closed in $X$, so some map separates it from $0$), and $\{0\}$ is closed but not open in $X$.</p>
<p><em>Intuition, beyond the HW:</em> any connected set lies inside one class ([[hw8-q1]](a) applied to it), so each [[components|component]] sits inside a class. The classes are called quasi-components in the wider literature.</p>`]]);

// ---------- Q3
hub8('hw8-q3', [
 ['How the terms are used', R`<p><b>Path connected</b> ([[path-connected]]): for any two points there is a continuous $\gamma:[0,1]\to X$ with $\gamma(0)$ the first and $\gamma(1)$ the second. So the proof starts with two arbitrary points of the product and must produce one path between them.</p>
<p><b>The product</b> $X=\prod_{j\in J}X_j$ has as points the families $x=(x_j)_{j\in J}$, one coordinate $x_j\in X_j$ for each index $j$. $J$ can be any set: finite, countable or uncountable. The <b>product topology</b> ([[product-vs-box]]) is generated by the sets $\pi_j^{-1}(U_j)$ for open $U_j\subseteq X_j$, so it restricts only finitely many coordinates at a time.</p>
<p>The tool that matters is <b>Theorem 19.6</b> ([[maps-into-products]]): a map $\gamma:[0,1]\to\prod X_j$ is continuous (with the product topology) iff every coordinate map $\pi_j\circ\gamma:[0,1]\to X_j$ is continuous. So a path in a product is just a path in every coordinate at once, all run on the same clock $t$. That is the whole method: join the points coordinate by coordinate.</p>`],
 ['Breakdown', steps([
  [R`<b>Take arbitrary points</b> $x=(x_j)_{j\in J}$ and $y=(y_j)_{j\in J}$ in $X$.`, R`Path connected is a "for every pair" claim.`],
  [R`<b>For each $j$, choose a path</b> $\gamma_j:[0,1]\to X_j$ from $x_j$ to $y_j$.`, R`Each $X_j$ is path connected, and $x_j,y_j\in X_j$. (Choosing one path for every $j$ at once uses the axiom of choice when $J$ is infinite, as defining products already does; it is standard and does not need comment in the write-up.)`],
  [R`<b>Define</b> $\gamma:[0,1]\to X$ by $\gamma(t)=(\gamma_j(t))_{j\in J}$.`, R`A point of the product is a family of coordinates; at time $t$, coordinate $j$ is wherever path $\gamma_j$ is.`],
  [R`<b>Continuity:</b> $\pi_j\circ\gamma=\gamma_j$ is continuous for every $j$, so $\gamma$ is continuous by Theorem 19.6.`, R`Theorem 19.6 is exactly for maps into a product with the product topology. It would fail for the box topology, so name the product topology.`],
  [R`<b>Endpoints:</b> $\gamma(0)=(\gamma_j(0))_j=(x_j)_j=x$ and $\gamma(1)=(y_j)_j=y$.`, R`Two families are equal when they agree in every coordinate.`]])],
 ['Clean solution', R`<p>Give $X=\prod_{j\in J}X_j$ the product topology, and let $\pi_j:X\to X_j$ be the projections. Let $x=(x_j)_{j\in J}$ and $y=(y_j)_{j\in J}$ be points of $X$. For each $j\in J$, since $X_j$ is path connected, choose a continuous $\gamma_j:[0,1]\to X_j$ with $\gamma_j(0)=x_j$ and $\gamma_j(1)=y_j$. Define $\gamma:[0,1]\to X$ by $\gamma(t)=(\gamma_j(t))_{j\in J}$.</p>
<p>For each $j$, the coordinate function $\pi_j\circ\gamma=\gamma_j$ is continuous. By Theorem 19.6, a map into a product with the product topology is continuous if and only if all its coordinate functions are, so $\gamma$ is continuous. Moreover $\gamma(0)=(\gamma_j(0))_{j\in J}=(x_j)_{j\in J}=x$ and $\gamma(1)=(\gamma_j(1))_{j\in J}=(y_j)_{j\in J}=y$. Thus $\gamma$ is a path from $x$ to $y$ in $X$. Since $x,y$ were arbitrary, $X$ is path connected. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>Moving a point of a product means moving all its coordinates. If each coordinate can travel on its own, run all the journeys at once on one clock; nearness in the product topology is nearness in each coordinate separately (finitely many at a time), so the combined motion does not tear.</p>
<p><b>Why the product topology matters.</b> In the box topology on $\mathbb R^\omega$, the straight-line path from $0$ to $(1,2,3,\dots)$ is not continuous: the box $\prod(-\tfrac1n,\tfrac1n)$ around $0$ would need every coordinate $nt$ to stay below $\tfrac1n$, i.e. $t\lt\tfrac1{n^2}$ for all $n$, which forces $t=0$. Munkres shows in §23 that $\mathbb R^\omega$ with the box topology is not even connected.</p>`]]);

// ---------- Q4
hub8('hw8-q4', [
 ['How the terms are used', R`<p>This $X$ is the <b>Sierpiński space</b> ([[ex-sierpinski]]; there it is written with $\{1\}$ open, here with $\{0\}$ open, which is the same space with the labels swapped). Its open sets are only $\varnothing$, $\{0\}$ and $X$. In particular $\{1\}$ is <em>not</em> open, and every open set containing $1$ is all of $X$, so contains $0$: the point $1$ is stuck to $0$ ($1\in\overline{\{0\}}$).</p>
<p><b>Path connected</b> ([[path-connected]]): for each pair of points, a continuous $\gamma:[0,1]\to X$ joining them. The pairs are $(0,0)$, $(1,1)$, $(0,1)$ and $(1,0)$. Constant maps handle equal points, and reversing a path handles the opposite order, so the real work is one path from $0$ to $1$.</p>
<p><b>Continuity</b> into a finite space ([[m-finite]]): check the preimage of each of the three open sets. $\gamma^{-1}(\varnothing)=\varnothing$ and $\gamma^{-1}(X)=[0,1]$ are always open, so the only condition is that <b>$\gamma^{-1}(\{0\})$, the set of times spent at $0$, is open in $[0,1]$</b>. Open in $[0,1]$ uses the [[subspace-topology]]: $[0,1)=[0,1]\cap(-1,1)$ is open in $[0,1]$.</p>`],
 ['Breakdown', steps([
  [R`<b>List the open sets</b> and reduce continuity to one condition: $\gamma^{-1}(\{0\})$ open in $[0,1]$.`, R`$\varnothing$ and $X$ always have open preimages ($\varnothing$ and $[0,1]$).`],
  [R`<b>Define the path from $0$ to $1$:</b> $\gamma(t)=0$ for $0\le t\lt1$, and $\gamma(1)=1$.`, R`Spend an open stretch of time at the open point $0$, and jump to $1$ only at the last instant. The time spent at $0$ is then $[0,1)$.`],
  [R`<b>Check continuity:</b> $\gamma^{-1}(\{0\})=[0,1)=[0,1]\cap(-1,1)$, open in $[0,1]$.`, R`Subspace topology: intersect an open set of $\mathbb R$ with $[0,1]$.`],
  [R`<b>Endpoints:</b> $\gamma(0)=0$, $\gamma(1)=1$.`, ''],
  [R`<b>From $1$ to $0$:</b> $\delta(t)=\gamma(1-t)$; then $\delta^{-1}(\{0\})=(0,1]=[0,1]\cap(0,2)$, open, and $\delta(0)=1$, $\delta(1)=0$.`, R`Either reverse the path or check the new preimage directly; the direct check is short.`],
  [R`<b>Equal points:</b> the constant paths at $0$ and at $1$.`, R`Constant maps are continuous (every preimage is $\varnothing$ or $[0,1]$).`],
  [R`<b>Why not jump the other way?</b> $\gamma(t)=1$ for $t\lt1$, $\gamma(1)=0$ gives $\gamma^{-1}(\{0\})=\{1\}$, which is not open in $[0,1]$.`, R`Not needed in the write-up, but it shows the choice is forced: the open point must be the one occupying an open stretch of time.`]])],
 ['Clean solution', R`<p>The open sets of $X$ are $\varnothing$, $\{0\}$ and $X$. For any map $\gamma:[0,1]\to X$, $\gamma^{-1}(\varnothing)=\varnothing$ and $\gamma^{-1}(X)=[0,1]$ are open in $[0,1]$, so $\gamma$ is continuous if and only if $\gamma^{-1}(\{0\})$ is open in $[0,1]$.</p>
<p>Define $\gamma:[0,1]\to X$ by $\gamma(t)=0$ for $0\le t\lt1$ and $\gamma(1)=1$. Then $\gamma^{-1}(\{0\})=[0,1)=[0,1]\cap(-1,1)$, which is open in the subspace topology on $[0,1]$. So $\gamma$ is continuous, and it is a path from $\gamma(0)=0$ to $\gamma(1)=1$.</p>
<p>Define $\delta:[0,1]\to X$ by $\delta(t)=\gamma(1-t)$, so $\delta(t)=1$ for $t=0$ and $\delta(t)=0$ for $0\lt t\le1$. Then $\delta^{-1}(\{0\})=(0,1]=[0,1]\cap(0,2)$ is open in $[0,1]$, so $\delta$ is a path from $1$ to $0$. Finally, the constant maps at $0$ and at $1$ are continuous, giving paths from each point to itself.</p>
<p>Every pair of points of $X$ is joined by a path, so $X$ is path connected. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>In $\mathbb R$ a path cannot jump, because the place it jumps to has a small neighbourhood the path would have to enter gradually. In this $X$ the point $1$ has no small neighbourhood: its only neighbourhood is all of $X$. So the path can sit at $0$ and arrive at $1$ in a single instant without tearing anything. Paths in spaces that are not [[hausdorff|Hausdorff]] can do things paths in $\mathbb R$ cannot.</p>
<p>Compare [[hw8-q1]]: with the <em>discrete</em> topology on $\{0,1\}$, the space is not connected, so certainly not path connected. Removing the open set $\{1\}$ is what glues the two points together.</p>`]]);

// ---------- Q5
hub8('hw8-q5', [
 ['Picture', R`<svg viewBox="0 0 460 300" class="q4fig" role="img" aria-label="Z is the square X times Y with the lower-left block A times B removed; the cross through a point (a, b) outside the removed block joins everything.">
<rect x="70" y="30" width="240" height="220" fill="var(--q4fill)" stroke="var(--q4edge)" stroke-width="1.5"/>
<rect x="70" y="140" width="110" height="110" fill="var(--card)" stroke="var(--q4col)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="125" y="200" text-anchor="middle" class="q4s">A × B removed</text>
<line x1="250" y1="30" x2="250" y2="250" stroke="var(--q4col2)" stroke-width="2.5"/>
<line x1="70" y1="90" x2="310" y2="90" stroke="var(--q4col2)" stroke-width="2.5"/>
<circle cx="250" cy="90" r="4.5" fill="var(--q4col2)"/><text x="258" y="82" class="q4l">(a, b)</text>
<line x1="215" y1="30" x2="215" y2="250" stroke="var(--q4col)" stroke-width="1.5"/><circle cx="215" cy="200" r="3.5" fill="var(--q4col)"/><text x="221" y="215" class="q4l">(x, y)</text>
<text x="190" y="272" text-anchor="middle" class="q4t">X</text><text x="125" y="270" text-anchor="middle" class="q4s">A</text>
<text x="50" y="145" text-anchor="middle" class="q4t">Y</text><text x="56" y="200" text-anchor="middle" class="q4s">B</text>
<text x="330" y="60" class="q4s">{a} × Y and X × {b}:</text><text x="330" y="76" class="q4s">the cross through (a, b)</text>
<text x="330" y="150" class="q4s">a point (x, y) with y ∈ B</text><text x="330" y="166" class="q4s">has x ∉ A, so its vertical</text><text x="330" y="182" class="q4s">slice {x} × Y stays in Z</text><text x="330" y="198" class="q4s">and meets X × {b}</text>
</svg><p class="foot">Drawn with $X$ and $Y$ as intervals and $A$, $B$ as sub-intervals; in the problem they are any connected spaces and any proper subsets.</p>`],
 ['How the terms are used', R`<p><b>Which points are in $Z$.</b> $(x,y)\in A\times B$ means $x\in A$ <em>and</em> $y\in B$. So $(x,y)\in Z$ means $x\notin A$ <em>or</em> $y\notin B$. Every point of $Z$ is of one of these two kinds.</p>
<p><b>Slices.</b> For a fixed $x$, the vertical slice $\{x\}\times Y$; for a fixed $y$, the horizontal slice $X\times\{y\}$. If $x\notin A$, the whole vertical slice $\{x\}\times Y$ lies in $Z$ (its first coordinate is outside $A$). If $y\notin B$, the whole horizontal slice $X\times\{y\}$ lies in $Z$.</p>
<p><b>Proper subsets</b> ($A\subsetneq X$, $B\subsetneq Y$) guarantee there is some $a\in X\setminus A$ and $b\in Y\setminus B$. The point $(a,b)$ is in $Z$, and the cross $\{a\}\times Y\ \cup\ X\times\{b\}$ through it lies in $Z$.</p>
<p><b>Connected</b> ([[connected]]) is shown by assembling $Z$ from connected pieces, using results from §23:</p><ul><li><b>Slices are connected.</b> $Y\to X\times Y$, $y\mapsto(x,y)$, is continuous (its coordinates are a constant and the identity: Theorem 19.6 / 18.4), and its image is $\{x\}\times Y$; a continuous image of a connected space is connected (Theorem 23.5).</li><li><b>Union through a common point</b> (Theorem 23.3): if connected subspaces all contain one common point, their union is connected.</li><li><b>Subspace of a subspace</b> ([[hw1-q4]]): a subset of $Z$ gets the same topology from $Z$ as from $X\times Y$, so "connected" means the same whether the piece is viewed inside $Z$ or inside $X\times Y$.</li></ul>`],
 ['Breakdown', steps([
  [R`<b>Choose the hub:</b> $a\in X\setminus A$ and $b\in Y\setminus B$.`, R`They exist because $A\ne X$ and $B\ne Y$; this is the only use of "proper". The point $(a,b)$ will be common to every piece.`],
  [R`<b>Slices are connected:</b> for any $x$, $\{x\}\times Y$ is the image of the continuous map $y\mapsto(x,y)$, so it is connected; likewise $X\times\{y\}$.`, R`Theorem 23.5 (continuous images of connected spaces are connected), with continuity from Theorem 19.6: each coordinate is constant or the identity.`],
  [R`<b>Cover $Z$ by "L-shapes" through $(a,b)$.</b> For each $(x,y)\in Z$ define $C_{(x,y)}$: if $x\notin A$, $C=(\{x\}\times Y)\cup(X\times\{b\})$; if $x\in A$ (so $y\notin B$), $C=(X\times\{y\})\cup(\{a\}\times Y)$.`, R`Each point of $Z$ has a slice through it lying in $Z$; attach to it the arm of the cross through $(a,b)$ that it meets.`],
  [R`<b>Each $C_{(x,y)}$ lies in $Z$</b> and contains both $(x,y)$ and $(a,b)$.`, R`First case: $\{x\}\times Y\subseteq Z$ because $x\notin A$, and $X\times\{b\}\subseteq Z$ because $b\notin B$; it contains $(x,y)$ and $(a,b)$. Second case: $X\times\{y\}\subseteq Z$ because $y\notin B$, and $\{a\}\times Y\subseteq Z$ because $a\notin A$.`],
  [R`<b>Each $C_{(x,y)}$ is connected:</b> its two slices are connected and meet (at $(x,b)$, or at $(a,y)$).`, R`Theorem 23.3 with two pieces and the common point where they cross.`],
  [R`<b>Conclude:</b> $Z=\bigcup_{(x,y)\in Z}C_{(x,y)}$, a union of connected subspaces all containing $(a,b)$, so $Z$ is connected.`, R`Theorem 23.3 again. The union is all of $Z$ because each $C\subseteq Z$ and each point lies in its own $C$.`]])],
 ['Clean solution', R`<p>Since $A\ne X$ and $B\ne Y$, choose $a\in X\setminus A$ and $b\in Y\setminus B$. Note that $(x,y)\in Z$ iff $x\notin A$ or $y\notin B$.</p>
<p><em>Slices are connected.</em> For fixed $x_0\in X$, the map $Y\to X\times Y$, $y\mapsto(x_0,y)$, has coordinate functions the constant map $x_0$ and the identity of $Y$, both continuous, so it is continuous by Theorem 19.6. Its image $\{x_0\}\times Y$ is therefore connected, as a continuous image of the connected space $Y$ (Theorem 23.5). Likewise $X\times\{y_0\}$ is connected for each $y_0\in Y$. Since the topology a subset of $Z$ inherits from $Z$ equals the one it inherits from $X\times Y$, these slices, when contained in $Z$, are connected subspaces of $Z$.</p>
<p><em>Covering $Z$.</em> Let $(x,y)\in Z$. If $x\notin A$, set $C_{(x,y)}=(\{x\}\times Y)\cup(X\times\{b\})$. Every point of $\{x\}\times Y$ has first coordinate $x\notin A$, and every point of $X\times\{b\}$ has second coordinate $b\notin B$, so $C_{(x,y)}\subseteq Z$. The two slices are connected and share the point $(x,b)$, so $C_{(x,y)}$ is connected by Theorem 23.3. It contains $(x,y)$ and $(a,b)$.</p>
<p>If $x\in A$, then $y\notin B$; set $C_{(x,y)}=(X\times\{y\})\cup(\{a\}\times Y)$. As before $C_{(x,y)}\subseteq Z$ (second coordinates $y\notin B$; first coordinates $a\notin A$), it is connected since the slices share $(a,y)$, and it contains $(x,y)$ and $(a,b)$.</p>
<p><em>Conclusion.</em> $Z=\bigcup_{(x,y)\in Z}C_{(x,y)}$, since each $C_{(x,y)}\subseteq Z$ and each point $(x,y)$ lies in $C_{(x,y)}$. This is a union of connected subspaces of $Z$ that all contain the point $(a,b)$, so $Z$ is connected by Theorem 23.3. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>Removing $A\times B$ takes out a "corner block", but it never takes out a whole slice: a vertical slice is lost only where $x\in A$, and then only its part over $B$. Every surviving point can walk along a full slice to the cross through $(a,b)$, and the cross is in one piece. So $Z$ is one piece.</p>
<p><b>Why "proper" is needed.</b> If $A=X$, then $Z=X\times(Y\setminus B)$, which can fall apart: $X=Y=\mathbb R$, $A=\mathbb R$, $B=\{0\}$ gives $Z=\mathbb R\times(\mathbb R\setminus\{0\})$, the plane minus the $x$-axis, two open half-planes.</p>
<p>The argument also proves Theorem 23.6 for two factors (take $A=B=\varnothing$): $X\times Y$ is connected. The same hub-and-slices picture is how Munkres proves it.</p>`]]);

// ===== How to approach a problem: the routine, the whole picture, and a drill on first moves
A['approach'] = {title: 'How to approach a problem', kind: 'idea', where: 'Start here', pre: ['describing-by-structure'],
  lede: 'Most proofs in this course are found the same way: read the shape of the claim, name the spaces and their open sets, unwind the goal and the hypotheses into definitions, test an example, then write the first and last lines before the middle.',
  sections: [
  ['Why a routine', R`<p>A problem in topology rarely needs a clever idea at the start. It needs the statement turned into something concrete enough to act on. Almost every statement is made of defined words (closed, Hausdorff, continuous, quotient map), and each defined word, unwound, says exactly what has to be produced. The routine below does that unwinding in a fixed order, so that the first move is never a blank page. The clever step, when there is one, comes late, and it is usually small: which radius, which box, which set.</p>`],
  ['1. Read the logical shape', R`<p>The grammar of the claim fixes the first line of the proof.</p>
<table><tr><th>The claim says</th><th>The proof starts</th></tr>
<tr><td>"for every $x$ …", "every $U$ …"</td><td>"Let $x$ be arbitrary." Keep it arbitrary: never pick a convenient one.</td></tr>
<tr><td>"there exists …"</td><td>Construct the object and say what it is; then check it works.</td></tr>
<tr><td>"$P$ if and only if $Q$"</td><td>Two proofs, $(\Rightarrow)$ and $(\Leftarrow)$, each with its own routine.</td></tr>
<tr><td>"$A=B$", "$A\subseteq B$"</td><td>Take an element of the left side and show it lies in the right ([[m-set-equality]]).</td></tr>
<tr><td>"need not", "show by example", "is not"</td><td>One counterexample, checked in full ([[m-counterexample]]).</td></tr>
<tr><td>"determine whether"</td><td>Decide first by testing; then either prove it or give a counterexample.</td></tr></table>
<p>Many quantifiers are hidden inside definitions. "$f$ is continuous" hides "for every open $V$"; "$X$ is Hausdorff" hides "for every pair $x\neq y$"; "$C$ is closed" hides "for every point outside $C$". Bring them to the surface: they decide what the first line names.</p>`],
  ['2. Name the spaces and their open sets', R`<p>Before using any open set, know what the open sets are. For each space in the problem ask: what are its points, which topology does it carry, and what does a basic open set look like there? Draw it when you can.</p>
<ul><li>A subspace $Y\subseteq X$: the sets $Y\cap U$, $U$ open in $X$ ([[subspace-topology]]).</li>
<li>A product $X\times Y$: unions of boxes $U\times V$ ([[product-topology]]).</li>
<li>A quotient $X/{\sim}$: the sets whose preimage is open upstairs ([[quotient-topology]]).</li>
<li>A metric space: unions of balls ([[ball]]).</li>
<li>A finite space: the list of open sets itself ([[m-finite]]).</li></ul>
<p>Most errors in this course come from using the wrong open sets: treating a subspace's open sets as open in the big space, or a quotient's as images of open sets.</p>`],
  ['3. Unwind the goal', R`<p>Replace the conclusion by its definition, and keep replacing until it says what you must <em>produce</em>.</p>
<ul><li>"$X/{\sim}$ is Hausdorff" → for distinct points $[x]\neq[y]$, open sets $U\ni[x]$, $V\ni[y]$ with $U\cap V=\varnothing$ → (by the quotient topology) two disjoint, saturated, open sets in $X$, one containing each class.</li>
<li>"$C$ is closed" → $X\setminus C$ is open → every point outside $C$ has a basic open set around it that misses $C$.</li>
<li>"$f$ is continuous" → for each open $V$ (it is enough to take each basis element), $f^{-1}(V)$ is open.</li></ul>
<p>Then write the <b>last line</b> of the proof now, for example: "Hence $U$ and $V$ are disjoint open sets containing $[x]$ and $[y]$, so $X/{\sim}$ is Hausdorff." The proof is whatever connects the first line to it.</p>`],
  ['4. Unwind the hypotheses', R`<p>Do the same for what you are given, and write down what each hypothesis hands you.</p>
<ul><li>"$A$ is closed" gives: each $x\notin A$ has a basic open set (in a metric space, a ball) missing $A$.</li>
<li>"$f$ is continuous" gives: preimages of open sets are open.</li>
<li>"$X$ is Hausdorff" gives: disjoint neighbourhoods for any two points you name.</li></ul>
<p>A proof is usually the goal's demand met by the hypotheses' supply. If at the end a hypothesis has not been used, either the statement is more general than needed or, more often, that hypothesis is where the missing step lives.</p>`],
  ['5. Choose the form of each definition', R`<p>Most notions have several equivalent forms, and the right one makes the proof short.</p>
<ul><li>Closed: complement open; contains its limit points; equals its closure.</li>
<li>In the closure: every neighbourhood, or every basic neighbourhood, meets the set ([[closure-test]]).</li>
<li>Continuous: preimages of open sets; of closed sets; of basis elements; in metric spaces, ε–δ ([[continuity-equivalents]], [[epsilon-delta]]).</li></ul>
<p>Match the form to the supply. Hypotheses about complements and closed sets suggest the closed-set forms; hypotheses about individual points suggest the neighbourhood forms. The full table is in [[whole-picture]].</p>`],
  ['6. Test before proving', R`<p>Try the statement on a picture or a standard space before writing: $\mathbb R$, the plane, a three-point space, $\mathbb R_\ell$ ([[ex-lower-limit]]), an indiscrete space ([[ex-indiscrete]]). The test does one of two things. It shows why the statement is true (the picture often contains the proof: which ball, which radius, which box), or it produces a counterexample. For a "determine whether" question, this step is where the answer comes from.</p>`],
  ['7. Write it', R`<p>Write the first line (from the shape: "Let $x\in X\setminus C$"), the last line (from the unwound goal), and fill the middle with the hypotheses' supply. Name every object when it first appears and say where it comes from: "Since $A$ is closed, $X\setminus A$ is open, so there is $r\gt0$ with $B(x,r)\cap A=\varnothing$."</p>`],
  ['When you are stuck', R`<ul><li>Find the hypothesis you have not used, and unwind it again.</li>
<li>Switch to another form of the definition (step 5).</li>
<li>Reduce to basis elements: to show a set is open, show each of its points has a basis element inside it.</li>
<li>Try the special case: $\mathbb R$, or a finite space where everything can be listed.</li>
<li>Redraw the picture with the specific points named.</li>
<li>Look up the method for the goal in [[whole-picture]] (Goal → method).</li></ul>`],
  ['A demonstration', R`<p><b>Problem</b> (Munkres §17, Exercise 13). Show that $X$ is Hausdorff if and only if the diagonal $\Delta=\{(x,x):x\in X\}$ is closed in $X\times X$.</p>
<p><b>Shape.</b> "If and only if": two implications.</p>
<p><b>Spaces.</b> $X\times X$ with the product topology, so basic open sets are boxes $U\times V$. In the plane, $\Delta$ is the line $y=x$.</p>
<p><b>Unwind the goal.</b> $\Delta$ closed means its complement $\{(x,y):x\neq y\}$ is open, which means every $(x,y)$ with $x\neq y$ lies in a box $U\times V$ that misses $\Delta$. And a box misses $\Delta$ exactly when no point lies in both $U$ and $V$, that is, when $U\cap V=\varnothing$.</p>
<p><b>Compare with the hypothesis.</b> "A box $U\times V$ around $(x,y)$ missing $\Delta$" now reads word for word as "disjoint open sets $U\ni x$ and $V\ni y$", which is Hausdorff. Once both sides are unwound, the two directions are the same translation read forwards and backwards.</p>
<p><b>Write it.</b> $(\Rightarrow)$ Let $(x,y)\notin\Delta$, so $x\neq y$. Hausdorff gives open $U\ni x$, $V\ni y$ with $U\cap V=\varnothing$. Then $U\times V$ is open, contains $(x,y)$, and misses $\Delta$; so the complement of $\Delta$ is open and $\Delta$ is closed. $(\Leftarrow)$ Let $x\neq y$. Then $(x,y)$ lies in the open complement of $\Delta$, so some box $U\times V$ around it misses $\Delta$, which means $U\cap V=\varnothing$: $U$ and $V$ separate $x$ and $y$.</p>`],
  ['Practise', R`<p>[[first-moves]] drills the first three steps on short problems, with the reasoning for each choice.</p>`]]};

A['whole-picture'] = {title: 'The whole picture: spaces, constructions, maps, properties', kind: 'idea', where: 'Start here', pre: ['defining-by-maps', 'approach'],
  lede: 'Everything in the course is one of four things: a space, a way of building spaces, a kind of map, or a property; most problems ask how two of them interact.',
  sections: [
  ['The four kinds of thing', R`<ul><li><b>Spaces</b>: a set with a topology, usually given by a basis. The ones that recur: $\mathbb R$, $\mathbb R_\ell$, $\mathbb R_K$, finite spaces, metric spaces, $\prod\{0,1\}$ ([[standard-topologies]], [[ex-real-line]]).</li>
<li><b>Constructions</b>: new spaces from old. Subspace, product, quotient; also the metric and order topologies, which build a topology from extra structure.</li>
<li><b>Maps</b>: continuous, open, closed, quotient, homeomorphism, embedding. Each says what a function does to open sets.</li>
<li><b>Properties</b>: Hausdorff, $T_1$, connected, compact, metrizable, first countable. Each is a statement made with open sets only, so homeomorphisms keep it.</li></ul>
<p>A typical problem names two of these and asks how they interact. "Is the quotient Hausdorff?" is a construction against a property. "Is the projection open?" is a construction against a kind of map. "Is the continuous image of a connected space connected?" is a map against a property. Recognizing which interaction is being asked about tells you which theorems and which examples are relevant before you start.</p>`],
  ['Constructions and their maps', R`<p>Each construction comes with a map, and its topology is chosen to make that map continuous in the most economical way ([[defining-by-maps]]).</p>
<table><tr><th>Construction</th><th>Its map</th><th>Topology</th><th>Open sets</th></tr>
<tr><td>Subspace $Y\subseteq X$</td><td>inclusion $i:Y\to X$</td><td>coarsest making $i$ continuous</td><td>$Y\cap U$</td></tr>
<tr><td>Product $X\times Y$</td><td>projections $\pi_1,\pi_2$</td><td>coarsest making both continuous</td><td>unions of boxes $U\times V$</td></tr>
<tr><td>Quotient $X/{\sim}$</td><td>$p:X\to X/{\sim}$</td><td>finest making $p$ continuous</td><td>$U$ with $p^{-1}(U)$ open</td></tr></table>
<p>Two consequences settle most continuity questions about constructions. A map <em>into</em> a product is continuous exactly when each coordinate is ([[maps-into-products]]), and a map into a subspace exactly when it is continuous into the big space. A map <em>out of</em> a quotient is continuous exactly when its composite with $p$ is, so it is tested upstairs ([[maps-out-of-quotients]]).</p>`],
  ['Pulling back and pushing forward', R`<table><tr><th>Notion</th><th>Direction</th><th>Condition</th></tr>
<tr><td>[[continuous|Continuous]]</td><td>back</td><td>$f^{-1}$(open) is open</td></tr>
<tr><td>[[open-map|Open map]]</td><td>forward</td><td>$f$(open) is open</td></tr>
<tr><td>Closed map</td><td>forward</td><td>$f$(closed) is closed</td></tr>
<tr><td>[[quotient-map|Quotient map]]</td><td>both</td><td>surjective, and $U$ open $\iff f^{-1}(U)$ open</td></tr>
<tr><td>[[homeomorphism|Homeomorphism]]</td><td>both</td><td>bijective, continuous, with continuous inverse</td></tr>
<tr><td>[[embedding|Embedding]]</td><td>both, onto the image</td><td>a homeomorphism onto $f(X)$</td></tr></table>
<p>Preimages respect every set operation ($f^{-1}(A\cap B)=f^{-1}(A)\cap f^{-1}(B)$, and the same for unions and complements); images do not ($f(A\cap B)$ can be smaller than $f(A)\cap f(B)$). That is why continuity is the basic notion and openness of a map has to be checked case by case. Useful links between the rows: a continuous surjection that is open, or closed, is a quotient map (§22); a continuous open bijection is a homeomorphism; and for a bijection, open and closed are the same condition ([[hw7-q6]]).</p>`],
  ['Which properties survive which constructions', R`<table><tr><th>Property</th><th>Subspace</th><th>Product</th><th>Quotient</th><th>Image</th></tr>
<tr><td>[[hausdorff|Hausdorff]]</td><td>yes</td><td>yes</td><td>not always</td><td>no</td></tr>
<tr><td>[[t1|$T_1$]]</td><td>yes</td><td>yes</td><td>iff every class is closed</td><td>no</td></tr>
<tr><td>[[connected|Connected]]</td><td>no</td><td>yes</td><td>yes</td><td>yes</td></tr>
<tr><td>[[compact|Compact]]</td><td>if closed</td><td>yes</td><td>yes</td><td>yes</td></tr>
<tr><td>[[metrizable|Metrizable]]</td><td>yes</td><td>countable</td><td>not always</td><td>no</td></tr>
<tr><td>[[first-countable|First countable]]</td><td>yes</td><td>countable</td><td>not always</td><td>no</td></tr></table>
<p>"Image" means the image under a continuous surjection; "if closed" means closed subspaces; "countable" means countable products.</p>
<p>The standard examples behind the "not always" and "no" entries: $\mathbb R/(0,1)$ ([[ex-crush-open]]) and the line with two origins ([[ex-two-origins]]) are quotients of Hausdorff spaces that are not Hausdorff; the quotient in [[hw6-q3]] is Hausdorff but, by the remark there, not metrizable; two points of $\mathbb R$ form a subspace of a connected space that is not connected; any map onto an indiscrete space is continuous, so continuous images lose separation.</p>
<p>How to use the table: when a problem asks whether a construction has a property, a "yes" means look for a proof, and the theorem behind it is the model; a "not always" means look for a counterexample, and the standard example is the one to adapt. For quotients, failures happen at glued points, so check neighbourhoods of the glued classes first ([[crushing-a-set]]). A positive quotient result needs a hypothesis that controls the gluing, such as crushing a <em>closed</em> set ([[hw7-q1]]).</p>`],
  ['Goal → method', R`<table><tr><th>You are asked to show</th><th>Method</th></tr>
<tr><td>a collection is a topology</td><td>[[m-topology]]</td></tr>
<tr><td>two sets or two topologies are equal</td><td>[[m-set-equality]]</td></tr>
<tr><td>one topology is finer than another</td><td>[[m-compare]]</td></tr>
<tr><td>a set is open</td><td>[[m-open]]</td></tr>
<tr><td>a set is closed</td><td>[[m-closed]]</td></tr>
<tr><td>what a closure is</td><td>[[m-closure]]</td></tr>
<tr><td>a space is Hausdorff</td><td>[[m-hausdorff]]</td></tr>
<tr><td>a function is continuous</td><td>[[m-continuous]]</td></tr>
<tr><td>a map into a product is continuous</td><td>[[m-product-maps]]</td></tr>
<tr><td>a map is open, or closed</td><td>[[m-open-map]]</td></tr>
<tr><td>a map is a quotient map</td><td>[[m-quotient-map]]</td></tr>
<tr><td>a map is not a quotient map</td><td>[[m-not-quotient]]</td></tr>
<tr><td>something about a quotient space</td><td>[[m-quotient]]</td></tr>
<tr><td>a space is (not) connected</td><td>[[m-connected]]</td></tr>
<tr><td>a space is (not) compact</td><td>[[m-compact]]</td></tr>
<tr><td>something fails, or "need not" hold</td><td>[[m-counterexample]]</td></tr>
<tr><td>a computation in a finite space</td><td>[[m-finite]]</td></tr>
<tr><td>true or false, quickly</td><td>[[m-true-false]]</td></tr></table>`],
  ['Switching between forms of a definition', R`<table><tr><th>Notion</th><th>Equivalent forms</th></tr>
<tr><td>$U$ is open</td><td>$U\in\mathcal T$; each $x\in U$ has a basis element $B$ with $x\in B\subseteq U$; $U$ is a union of basis elements</td></tr>
<tr><td>$C$ is closed</td><td>$X\setminus C$ is open; $C$ contains all its limit points; $C=\overline C$</td></tr>
<tr><td>$x\in\overline A$</td><td>every open set containing $x$ meets $A$; every basis element containing $x$ meets $A$; in a metric space, some sequence in $A$ converges to $x$</td></tr>
<tr><td>$f$ is continuous</td><td>preimages of open sets are open; preimages of closed sets are closed; preimages of basis (or subbasis) elements are open; $f(\overline A)\subseteq\overline{f(A)}$ for all $A$; for each $x$ and each neighbourhood $V$ of $f(x)$ there is a neighbourhood $U$ of $x$ with $f(U)\subseteq V$; in metric spaces, ε–δ</td></tr>
<tr><td>$X$ is Hausdorff</td><td>distinct points have disjoint neighbourhoods; the diagonal is closed in $X\times X$</td></tr>
<tr><td>$p$ is a quotient map</td><td>surjective, and $U$ open $\iff p^{-1}(U)$ open; the same with closed sets; open sets of the target correspond to saturated open sets upstairs</td></tr></table>
<p>The first form in each row is the definition; the others are theorems ([[continuity-equivalents]], [[closure-test]], [[closure-limit-points]], [[sequence-lemma]], and the demonstration in [[approach]]). A short proof is usually a matter of choosing the form whose ingredients you already have.</p>`],
  ['How the chapters fit', R`<p>Chapter 1 supplies the language: sets, functions, relations, products. Chapter 2 builds the setting: spaces and bases, the three constructions, closed sets and limits, continuous maps, separation, metrics. Chapter 3 studies connectedness and compactness, the two properties that make the intermediate and extreme value theorems of calculus true in general; both are defined with open sets alone and both are carried forward by continuous maps. The later chapters (the fundamental group, covering spaces, surfaces) tell spaces apart by the loops they contain. At every stage the question is the same: what can be said using only open sets, and what survives continuous maps.</p>`]]};

A['first-moves'] = {title: 'Practice: first moves', kind: 'idea', where: 'Start here', pre: ['approach'],
  lede: 'Short drills on the start of a proof: for each problem, read its shape, unwind the goal, and choose the first line; then compare with the reasoning.',
  sections: [['The drill', R`<div id="drill"></div>`],
  ['How to use it', R`<p>Answer each stage before reading the explanation. The point is the opening, not the whole proof: when the shape, the unwound goal and the first line are right, the rest usually follows by matching the hypotheses to the goal. Each problem ends with an outline of the proof and links to its concepts. The routine behind the stages is in [[approach]].</p>`]]};

// each drill: statement, source, links, three stages [question, options, correct index, explanation], outline
var DRILL = [
 {q: R`Show that $X$ is Hausdorff if and only if the diagonal $\Delta=\{(x,x):x\in X\}$ is closed in $X\times X$.`, src: 'Munkres §17, Ex. 13', links: ['hausdorff', 'product-topology', 'closed-set'],
  st: [[R`What is the shape of the claim?`, [R`One example`, R`Two implications, each proved on its own`, R`An element chase between two sets`, R`A construction`], 1, R`"If and only if" is two claims: Hausdorff gives $\Delta$ closed, and $\Delta$ closed gives Hausdorff. Each direction gets its own first and last line.`],
   [R`What does "$\Delta$ is closed" unwind to?`, [R`Every point of $\Delta$ has a box inside $\Delta$`, R`Each $(x,y)$ with $x\neq y$ has a box $U\times V$ around it missing $\Delta$`, R`$\Delta$ has a limit point`, R`$\Delta$ is a product of closed sets`], 1, R`Closed means the complement is open; open in $X\times X$ means a basic box around each point. A box misses $\Delta$ exactly when $U\cap V=\varnothing$, which is the Hausdorff condition in disguise.`],
   [R`For $(\Rightarrow)$, which first line?`, [R`Let $(x,x)\in\Delta$.`, R`Let $(x,y)\in X\times X$ with $x\neq y$.`, R`Suppose $\Delta$ is not closed.`, R`Let $U$ and $V$ be open in $X$.`], 1, R`The goal is about points of the complement, so the proof starts by naming one. Starting on $\Delta$ itself goes nowhere: closedness is shown from outside.`]],
  out: R`$(\Rightarrow)$ Hausdorff gives disjoint open $U\ni x$, $V\ni y$; then $U\times V$ contains $(x,y)$ and misses $\Delta$. $(\Leftarrow)$ For $x\neq y$, the open complement contains a box $U\times V$ around $(x,y)$; missing $\Delta$ means $U\cap V=\varnothing$.`},
 {q: R`Show that in a Hausdorff space every finite set is closed.`, src: 'Munkres Theorem 17.8', links: ['t1', 'hausdorff', 'closed-set'],
  st: [[R`What is the shape, and how can it be reduced?`, [R`For every finite set; since finite unions of closed sets are closed, it is enough to show each one-point set is closed`, R`There exists a closed finite set`, R`A counterexample`, R`If and only if`], 0, R`A finite set is a finite union of one-point sets, and a finite union of closed sets is closed. So the real claim is: each $\{x\}$ is closed.`],
   [R`What is the cleanest way to show $\{x\}$ is closed?`, [R`Show $\{x\}$ is open`, R`Show its complement is open: each $y\neq x$ has a neighbourhood missing $x$`, R`Show $x$ is a limit point of $\{x\}$`, R`Show every sequence converges to $x$`], 1, R`Closed via the complement. The hypothesis (Hausdorff) is about pairs of points, and so is this form of the goal: a point $y$ outside $\{x\}$, and the point $x$.`],
   [R`Which first line?`, [R`Let $y\in X$ with $y\neq x$.`, R`Let $y=x$.`, R`Let $U$ be an open set containing $x$.`], 0, R`Name a point of the complement. Hausdorff then gives disjoint $U\ni x$ and $V\ni y$, and $V$ is a neighbourhood of $y$ missing $x$.`]],
  out: R`For $y\neq x$, Hausdorff gives $V\ni y$ with $x\notin V$. So $X\setminus\{x\}$ is the union of such $V$, hence open, and $\{x\}$ is closed. A finite set is a finite union of such sets, so it is closed.`},
 {q: R`Show that if $A\subseteq B$, then $\overline A\subseteq\overline B$.`, src: 'Closure basics', links: ['closure', 'closure-test'],
  st: [[R`What is the shape?`, [R`An element chase: take $x$ in the left side and show it is in the right`, R`A counterexample`, R`If and only if`, R`Construct a set`], 0, R`An inclusion of sets is proved point by point. (There is also a one-line route; see the outline.)`],
   [R`What does "$x\in\overline B$" unwind to?`, [R`$x\in B$`, R`Every open set containing $x$ meets $B$`, R`$x$ is a limit point of $B$`, R`$B$ is closed`], 1, R`The neighbourhood form of closure (Theorem 17.5). "$x\in B$" is too strong, and "limit point" leaves out the points of $B$ itself.`],
   [R`Which first line?`, [R`Let $x\in\overline A$, and let $U$ be an open set containing $x$.`, R`Let $x\in B$.`, R`Suppose $\overline A=\overline B$.`], 0, R`Start with a point of the left side, and name the arbitrary neighbourhood that the unwound goal quantifies over.`]],
  out: R`$U$ meets $A$ because $x\in\overline A$; since $A\subseteq B$, $U$ meets $B$; so $x\in\overline B$. One-line alternative: $\overline B$ is a closed set containing $B\supseteq A$, and $\overline A$ is the smallest closed set containing $A$.`},
 {q: R`Let $f:X\to Y$ be continuous. Show that $f(\overline A)\subseteq\overline{f(A)}$ for every $A\subseteq X$.`, src: 'Munkres Theorem 18.1', links: ['continuity-equivalents', 'closure-test', 'image-preimage'],
  st: [[R`What is the shape?`, [R`For every $A$, an inclusion: take a point of $f(\overline A)$, which has the form $f(x)$ with $x\in\overline A$`, R`A counterexample`, R`There exists $A$`], 0, R`A point of an image is $f$ of something. Naming that something, $x\in\overline A$, puts the hypothesis about $\overline A$ into play.`],
   [R`What does "$f(x)\in\overline{f(A)}$" unwind to?`, [R`Every open $V$ containing $f(x)$ meets $f(A)$`, R`$f(x)\in f(A)$`, R`$f$ is a closed map`], 0, R`The neighbourhood form of closure again, now in $Y$.`],
   [R`Which first line?`, [R`Let $x\in\overline A$, and let $V$ be open in $Y$ with $f(x)\in V$.`, R`Let $y\in\overline{f(A)}$.`, R`Let $V$ be open in $X$.`], 0, R`Point of the left side, then the arbitrary neighbourhood. The next move is to pull $V$ back: continuity is the only hypothesis, and it speaks about preimages.`]],
  out: R`$f^{-1}(V)$ is open (continuity) and contains $x$, so it meets $A$ at some $a$ (as $x\in\overline A$). Then $f(a)\in V\cap f(A)$, so $V$ meets $f(A)$.`},
 {q: R`Show that the lower limit topology on $\mathbb R$ is strictly finer than the standard topology.`, src: 'Munkres Lemma 13.4', links: ['lemma-13-3', 'ex-lower-limit', 'finer-coarser', 'm-compare'],
  st: [[R`What is the shape?`, [R`Two claims: an inclusion of topologies, and one set showing the inclusion is strict`, R`A single example`, R`An element chase inside $\mathbb R$`, R`If and only if`], 0, R`"Finer" is $\mathcal T\subseteq\mathcal T_\ell$; "strictly" adds that some $\ell$-open set is not standard-open, which is shown by one example.`],
   [R`How are two topologies given by bases compared?`, [R`List all their open sets`, R`Lemma 13.3: for each basis element $(a,b)$ and each $x$ in it, find $[c,d)$ with $x\in[c,d)\subseteq(a,b)$`, R`Show each $[a,b)$ is a union of intervals $(c,d)$`, R`Show $\mathbb R_\ell$ is Hausdorff`], 1, R`Comparing bases point by point is the standard tool. The third option is the wrong direction: it would show the standard topology is finer, which is false.`],
   [R`Which first line?`, [R`Let $x\in(a,b)$.`, R`Let $x\in[a,b)$.`, R`Suppose $[0,1)$ is open in $\mathbb R$.`], 0, R`Start inside a basis element of the coarser topology. Then $[x,b)$ contains $x$ and lies in $(a,b)$.`]],
  out: R`For $x\in(a,b)$, the set $[x,b)$ works, so $\mathcal T\subseteq\mathcal T_\ell$. Strictness: $[0,1)$ is $\ell$-open, but no interval $(c,d)$ with $0\in(c,d)$ lies inside $[0,1)$, so it is not standard-open.`},
 {q: R`Show that $\overline{A\cap B}$ need not equal $\overline A\cap\overline B$.`, src: 'Munkres §17, Ex. 8', links: ['closure', 'm-counterexample'],
  st: [[R`What is the shape?`, [R`An element chase both ways`, R`One counterexample, checked in full`, R`A proof by contradiction`, R`If and only if`], 1, R`"Need not" denies a general statement; one example in which it fails is the whole answer.`],
   [R`What must the example show?`, [R`That $\overline{A\cap B}$ is bigger than $\overline A\cap\overline B$`, R`A point of $\overline A\cap\overline B$ that is not in $\overline{A\cap B}$ (the inclusion $\subseteq$ always holds)`, R`That $A\cap B=\varnothing$ always`], 1, R`$\overline{A\cap B}\subseteq\overline A\cap\overline B$ is always true, since $A\cap B$ lies in each of $A$ and $B$. So a failure must come from the other side.`],
   [R`Which first line?`, [R`Take $A=(0,1)$ and $B=(1,2)$ in $\mathbb R$.`, R`Let $x\in\overline{A\cap B}$.`, R`Take $A=B$.`], 0, R`Two sets that share an edge but no points. ($\mathbb Q$ and the irrationals work too.)`]],

 {q: R`Let $Y$ be closed in $X$, and let $A$ be closed in the subspace $Y$. Show that $A$ is closed in $X$.`, src: 'Munkres Theorem 17.3', links: ['subspace-topology', 'closed-set'],

A['relation'] = {title: 'Relation', kind: 'definition', where: 'Ch. 1, §3', pre: ['indexed-products'],
  lede: R`A relation on $X$ is a set of ordered pairs from $X$: the pairs $(x,y)$ for which "$x$ is related to $y$" is true.`,
  sections: [
  ['What it is', R`<p>A relation is <b>a yes-or-no question about pairs</b>: for each pair of elements $x,y$ of $X$, is $x$ related to $y$? "Is less than", "has the same sign as" and "is equal to" are relations on $\mathbb R$. The relation is recorded by listing the pairs that get the answer yes.</p>`],
  ['Definition', R`<p>A <b>relation</b> on a set $X$ is a subset $C\subseteq X\times X$. One writes $x\,C\,y$, or $x\sim y$, to mean $(x,y)\in C$.</p>`],
  ['Reading the definition', R`<p>"$X\times X$" is the set of all ordered pairs $(x,y)$ with $x,y\in X$ ([[indexed-products]]). "A subset $C$" is a choice of some of these pairs. Nothing else is required: any choice of pairs is a relation. Munkres defines a relation as a set, rather than as a "rule", so that it is an exact object; two rules that say yes to the same pairs are the same relation.</p>`],
  ['Why it is defined this way', R`<p>Mathematics prefers to build everything out of sets. A function is also defined this way, as a set of pairs (its graph) in which each $x$ appears exactly once as a first entry. A relation drops that condition: $x$ may be related to many $y$, or to none.</p>`],
  ['Examples', R`<ul><li>$x\lt y$ on $\mathbb R$: the pairs with first entry smaller; in the plane, the region above the line $y=x$.</li>
<li>$x=y$ on $X$: only the pairs $(x,x)$, the <b>diagonal</b> $\Delta$ of $X\times X$.</li>
<li>On $\{1,2,3\}$, the set $C=\{(1,2),(3,3)\}$: $1$ is related to $2$, $3$ to $3$, and nothing else. It has no meaning beyond the list, and it is still a relation.</li></ul>`],
  ['What depends on it', R`<p>The relations that behave like "sameness" are the [[relation-equivalence|equivalence relations]]; their [[equivalence-class|classes]] form a [[partition]], from which a [[quotient-topology|quotient space]] is built. Order relations ($\lt$) give the [[order-topology]].</p>`],
  ['Where it sits', R`<p>Relations, functions and orders are all subsets of a product $X\times X$ or $X\times Y$. This is the set-theoretic foundation of Chapter 1: every later object (a topology, a metric, a map) is a set with a structure, and relations are the simplest structure there is.</p>`]]};
A['relation-equivalence'].pre = ['relation'];
A['relation-equivalence'].sections.splice(A['relation-equivalence'].sections.length - 1, 0,
  ['What counts as the same', R`<p>Nothing counts as the same automatically: the equivalence relation is a <em>choice</em> of which differences to ignore. On the same set $\mathbb R$:</p>
<table><tr><th>$x\sim y$ when</th><th>Classes</th></tr>
<tr><td>$x=y$</td><td>each point alone, $\{x\}$</td></tr>
<tr><td>same sign</td><td>$(-\infty,0)$, $\{0\}$, $(0,\infty)$</td></tr>
<tr><td>$x-y$ is an integer</td><td>one class for each decimal part $t\in[0,1)$</td></tr>
<tr><td>$x=y$, or both in $A$</td><td>$A$, and $\{x\}$ for each $x\notin A$</td></tr>
<tr><td>always</td><td>one class, all of $\mathbb R$</td></tr></table>
<p>The points never change; only the chosen sameness does. Equality ignores nothing and "always" ignores everything. In a problem the relation is given (as $\sim_A$ in [[hw7-q1]]); in building a space it is the list of what you want glued. The one constraint is the three rules, and transitivity is the one that bites: declaring $0\sim1$ and $1\sim2$ also declares $0\sim2$.</p>`]);
A['equivalence-class'].sections.splice(1, 0,
  ['Why classes do not overlap', R`<p>Suppose $z\in[x]$ and $z\in[y]$, so $z\sim x$ and $z\sim y$. Symmetry gives $x\sim z$, and transitivity with $z\sim y$ gives $x\sim y$. Then anything related to $x$ is related to $y$ and conversely, so $[x]=[y]$. Hence two classes are either equal or disjoint, and the classes sort $X$ into bins: a [[partition]].</p>`],
  ['What a class is for', R`<p>A class lets a whole group of things that count as the same be treated as <b>one object</b>. Many familiar objects are built this way: the number $\tfrac12$ is the class of pairs $(1,2),(2,4),(3,6),\ldots$; "3 o'clock" is the class $\{\ldots,-9,3,15,27,\ldots\}$.</p>
<p>In topology this is how spaces are glued. The relation says what is glued to what, and each class becomes one point of the [[quotient-topology|quotient]]: for the circle, $0$ and $1$ form one class; for [[crushing-a-set]], all of $A$ does.</p>
<p>Once things are glued, anything done on the new space may depend only on the class, not on the element chosen from it. A function descends to the quotient only if it is constant on each class ([[maps-out-of-quotients]]); a set has a picture downstairs only if it takes whole classes ([[saturated]]).</p>`]);

 S.splice(k, 1, ['Work-through', R`<div class="wk">
<h4>Naming the maps</h4>
<p>Every statement in this problem is about "all continuous maps $f:X\to\{0,1\}$", so it helps to give that collection a name. Let $\mathcal F$ be the set of all continuous $f:X\to\{0,1\}$. The relation then reads</p>
$$x\sim x'\iff f(x)=f(x')\ \text{ for every } f\in\mathcal F.$$
<p>Written this way, $x\sim x'$ is a whole list of equations, one for each map in $\mathcal F$. Each equation compares two values in $\{0,1\}$, and comparing values needs nothing more than ordinary equality. That observation is the entire idea of part (a).</p>

<h4>(a) Reflexive</h4>
<p>To show $x\sim x$ we have to show $f(x)=f(x)$ for every $f\in\mathcal F$. A claim about every $f$ is proved by taking one arbitrary $f$ and showing it there. So let $f\in\mathcal F$. Any value equals itself, so $f(x)=f(x)$. Since $f$ was arbitrary, this holds for all $f$, and $x\sim x$.</p>

<h4>(a) Symmetric</h4>
<p>Now suppose $x\sim x'$, which means $f(x)=f(x')$ for every $f$. We want $x'\sim x$, that is, $f(x')=f(x)$ for every $f$. Take an arbitrary $f\in\mathcal F$. The hypothesis, applied to this $f$, gives $f(x)=f(x')$, and an equation can be read in either direction, so $f(x')=f(x)$. Since $f$ was arbitrary, $x'\sim x$.</p>

<h4>(a) Transitive</h4>
<p>This is the step that needs care, because there are two hypotheses, each about all maps: $f(x)=f(x')$ for every $f$, and $f(x')=f(x'')$ for every $f$. The way to combine them is to fix <em>one</em> arbitrary $f\in\mathcal F$ and apply <em>both</em> hypotheses to that same $f$. Then $f(x)=f(x')$ and $f(x')=f(x'')$ are two equations sharing the middle value $f(x')$, so $f(x)=f(x'')$. Since $f$ was arbitrary, $x\sim x''$.</p>
<p>So $\sim$ is reflexive, symmetric and transitive, and is an equivalence relation. Notice that each property of $\sim$ came straight from the same property of $=$; the phrase "for every $f$" was simply carried along.</p>

<h4>(b) Deciding how to prove a set is closed</h4>
<p>Let $A$ be an equivalence class. There are two standard ways to show a set is closed ([[closed-set]]): show its complement is open, or build the set out of closed sets using operations that keep sets closed. The operations available are taking preimages under continuous maps (Theorem 18.1) and taking intersections of any number of closed sets (Theorem 17.1).</p>
<p>Which to use is decided by what we know. We know nothing at all about the topology of $X$; the only information about $X$ in the problem is that the maps in $\mathcal F$ are continuous. So whatever makes $A$ closed has to come from those maps, which means through preimages. The plan is therefore to write $A$ using preimages.</p>

<h4>(b) Writing the class as an intersection of preimages</h4>
<p>A class is easiest to work with once a point in it is named. Choose $x\in A$; then $A$ is the class of $x$, and by the definition of $\sim$,</p>
$$A=\{x'\in X:\ f(x')=f(x)\ \text{ for every } f\in\mathcal F\}.$$
<p>A point belongs to $A$ when it passes one test for each $f$. Look at a single test first. The points $x'$ with $f(x')=f(x)$ are the points that $f$ sends to the value $f(x)$, which is a preimage: $f^{-1}(\{f(x)\})$ ([[image-preimage]]). Passing every test means lying in every one of these preimages, and "lying in every one of a family of sets" is exactly lying in their intersection. So</p>
$$A=\bigcap_{f\in\mathcal F}f^{-1}(\{f(x)\}).$$
<p>To be sure of the equality, check both inclusions ([[m-set-equality]]). If $x'\in A$, then $f(x')=f(x)$ for each $f$, so $x'$ is in each preimage and therefore in the intersection. If $x'$ is in the intersection, then $f(x')=f(x)$ for each $f$, which says $x'\sim x$, so $x'\in A$.</p>

<h4>(b) Why "for every $f$" becomes an intersection</h4>
<p>"For every $f$" is the word "and" repeated once for each map, and in set language "and" is intersection. By definition, $\bigcap_f S_f=\{x': x'\in S_f\ \text{for every } f\}$: the points lying in <em>all</em> the sets. Compare $A=\{x': f(x')=f(x)\ \text{for every } f\}$. Both are "the points that pass a test for every $f$"; with $S_f=f^{-1}(\{f(x)\})$ the two tests are the same, since $f(x')=f(x)$ says exactly that $x'\in f^{-1}(\{f(x)\})$.</p>
<p>A small case makes it concrete. If only two maps $g,h$ were continuous, then</p>
$$x'\sim x\iff g(x')=g(x)\ \text{and}\ h(x')=h(x)\iff x'\in g^{-1}(\{g(x)\})\cap h^{-1}(\{h(x)\}).$$
<p>More maps add more "and"s, so more sets are intersected; infinitely many maps give an intersection of infinitely many sets, which is why the last step needs Theorem 17.1 for <em>any</em> number of closed sets.</p>
<p>A union would be wrong: $\bigcup_f S_f$ is the set of points in <em>at least one</em> $S_f$, which says "<em>some</em> map agrees on $x'$ and $x$". That is far weaker; a constant map agrees on every pair, so the union would be all of $X$.</p>
<table><tr><th>Logic</th><th>Sets</th></tr><tr><td>and; for every</td><td>$\cap$; $\bigcap$</td></tr><tr><td>or; for some</td><td>$\cup$; $\bigcup$</td></tr><tr><td>not</td><td>complement</td></tr></table>
<p>The last row explains the second proof below: "not in $A$" means "<em>some</em> map separates $x'$ from $x$", so the complement is a union (De Morgan's law).</p>
<h4>(b) Why each preimage is closed</h4>
<p>The value $f(x)$ is $0$ or $1$, so $\{f(x)\}$ is $\{0\}$ or $\{1\}$. In the discrete topology every subset is open, and so, taking complements, every subset is also closed ([[ex-discrete]]). In particular $\{f(x)\}$ is closed in $\{0,1\}$. Since $f$ is continuous, the preimage of this closed set is closed in $X$ (Theorem 18.1).</p>

<h4>(b) Finishing</h4>
<p>$A$ is now an intersection of closed sets, one for each $f\in\mathcal F$. There are usually infinitely many such maps, which is why it matters that Theorem 17.1 allows intersections of any number of closed sets, not just finitely many. So $A$ is closed. $\blacksquare$</p>

<h4>The same proof from the outside</h4>
<p>The argument can also be run on the complement. A point $x'$ is outside $A$ exactly when some map tells it apart from $x$, that is, $f(x')\ne f(x)$ for some $f$; since there are only two values, this means $f(x')=1-f(x)$. So</p>
$$X\setminus A=\bigcup_{f\in\mathcal F}f^{-1}(\{1-f(x)\}),$$
<p>a union of preimages of open sets, which is open. Hence $A$ is closed. This is the first proof with De Morgan's law applied: the complement of an intersection is the union of the complements. Either version is a complete answer.</p>

<h4>What has to be produced</h4>
<p>Path connected is a "for every pair" statement: for any two points of $X=\prod_{j\in J}X_j$ we must produce a path between them ([[path-connected]]). So the proof starts by naming two arbitrary points, and its job is to construct one continuous map $\gamma:[0,1]\to X$ with $\gamma(0)$ the first point and $\gamma(1)$ the second.</p>
<p>A point of the product is a family of coordinates, one in each factor. Write the two points as $x=(x_j)_{j\in J}$ and $y=(y_j)_{j\in J}$, with $x_j,y_j\in X_j$. The index set $J$ can be anything: two indices, countably many, uncountably many. The argument should not depend on which.</p>

<h4>Where the paths come from</h4>
<p>The only hypothesis is that each factor $X_j$ is path connected. Applied to the two points $x_j$ and $y_j$ of $X_j$, it gives a path in that factor: a continuous $\gamma_j:[0,1]\to X_j$ with $\gamma_j(0)=x_j$ and $\gamma_j(1)=y_j$. We do this for every $j$ at once, so we now have one path in each coordinate.</p>

<h4>Combining them into one path</h4>
<p>To move a point of the product, move all of its coordinates. Run all the coordinate paths at the same time, on the same clock $t$:</p>
$$\gamma(t)=(\gamma_j(t))_{j\in J}.$$
<p>At time $t$, the $j$-th coordinate of $\gamma(t)$ is wherever the path $\gamma_j$ has reached. This is a function from $[0,1]$ into $X$, since each $\gamma_j(t)$ lies in $X_j$.</p>

<h4>Why $\gamma$ is continuous</h4>
<p>Checking continuity directly would mean taking open sets of the product, which are unions of basis elements restricting finitely many coordinates. There is a theorem that does this work once and for all. <b>Recall</b> Theorem 19.6 ([[maps-into-products]]): a map into a product with the <em>product</em> topology is continuous exactly when each coordinate function is continuous. The [[coordinate-function|coordinate functions]] of $\gamma$ are $\pi_j\circ\gamma=\gamma_j$, and each $\gamma_j$ is a path, hence continuous. So $\gamma$ is continuous.</p>
<p>It is worth saying "product topology" in the write-up, because Theorem 19.6 is false for the box topology (see "Why it makes sense").</p>

<h4>Checking the endpoints, and concluding</h4>
<p>Two families are equal when they agree in every coordinate. At $t=0$ every coordinate is $\gamma_j(0)=x_j$, so $\gamma(0)=(x_j)_j=x$; at $t=1$ every coordinate is $\gamma_j(1)=y_j$, so $\gamma(1)=y$. Thus $\gamma$ is a path from $x$ to $y$. Since $x$ and $y$ were arbitrary, $X$ is path connected. $\blacksquare$</p>`);

wkSet('hw8-q4', R`
<h4>Listing what is open</h4>
<p>The space is small enough to write everything down. The open sets are $\varnothing$, $\{0\}$ and $X=\{0,1\}$. So $\{1\}$ is <em>not</em> open, and the only open set containing $1$ is all of $X$. That last fact is what will make the problem work: $1$ cannot be given a small neighbourhood that avoids $0$.</p>

<h4>What continuity means for a path into this space</h4>
<p>A path is a continuous $\gamma:[0,1]\to X$. <b>Recall</b> continuity ([[continuous]]): the preimage of every open set must be open, here in $[0,1]$. There are three open sets to check. $\gamma^{-1}(\varnothing)=\varnothing$ and $\gamma^{-1}(X)=[0,1]$ are always open, whatever $\gamma$ is. So the whole condition is:</p>
$$\gamma^{-1}(\{0\}),\ \text{the set of times at which the path is at } 0,\ \text{is open in } [0,1].$$
<p>"Open in $[0,1]$" uses the subspace topology ([[subspace-topology]]): a set is open in $[0,1]$ when it is $[0,1]\cap U$ for some open $U\subseteq\mathbb R$. So $[0,1)=[0,1]\cap(-1,1)$ is open in $[0,1]$, even though it is not open in $\mathbb R$; there is nothing to the left of $0$ to worry about.</p>

<h4>Finding the path from $0$ to $1$</h4>
<p>The path has to start at $0$ and end at $1$, so it must change value at some moment. The condition above says the times spent at $0$ must form an open set. So stay at $0$ for an open stretch of time, $[0,1)$, and arrive at $1$ only at the final instant:</p>
$$\gamma(t)=0\ \text{ for } 0\le t\lt1,\qquad \gamma(1)=1.$$
<p>Then $\gamma^{-1}(\{0\})=[0,1)$, which is open in $[0,1]$, so $\gamma$ is continuous; and $\gamma(0)=0$, $\gamma(1)=1$.</p>
<p>The jump cannot go the other way. If the path sat at $1$ and jumped to $0$ at the end, the time spent at $0$ would be the single point $\{1\}$, which is not open in $[0,1]$. The open point, $0$, has to be the one that occupies an open stretch of time.</p>

<h4>The other pairs of points</h4>
<p>Path connected asks for a path between every pair, so the remaining pairs need a line each. From $1$ to $0$, run the path backwards: $\delta(t)=\gamma(1-t)$. It is at $0$ for $0\lt t\le1$, and $\delta^{-1}(\{0\})=(0,1]=[0,1]\cap(0,2)$ is open in $[0,1]$, so $\delta$ is continuous, with $\delta(0)=1$ and $\delta(1)=0$. From a point to itself, use the constant path; every preimage under a constant map is $\varnothing$ or $[0,1]$, so it is continuous.</p>
<p>Every pair of points is joined by a path, so $X$ is path connected. $\blacksquare$</p>`);

wkSet('hw8-q5', R`
<h4>Which points are in $Z$</h4>
<p>Start by reading the set. A point $(x,y)$ is in $A\times B$ when $x\in A$ <em>and</em> $y\in B$. Removing those points leaves the points where this fails, and "not (both)" is "at least one fails":</p>
$$(x,y)\in Z\iff x\notin A\ \text{ or }\ y\notin B.$$
<p>So every point of $Z$ is of one of two kinds, and the proof will treat them in turn.</p>

<h4>Choosing a strategy for connectedness</h4>
<p>To show a space is connected you can assume a separation and reach a contradiction, or build the space out of pieces already known to be connected ([[m-connected]]). Here we know $X$ and $Y$ are connected and nothing else, so building is natural. The tool for gluing is Theorem 23.3: connected subspaces that all share one point have a connected union. So the plan is to find one point of $Z$, and for every point of $Z$ a connected subset of $Z$ joining it to that one point.</p>

<h4>Slices are connected copies of $X$ and $Y$</h4>
<p>The natural connected pieces of a product are its slices. For a fixed $x_0$, the vertical slice $\{x_0\}\times Y$ is the image of the map $Y\to X\times Y$, $y\mapsto(x_0,y)$. Its [[coordinate-function|coordinate functions]] are the constant map $x_0$ and the identity of $Y$, both continuous, so the map is continuous by Theorem 19.6. A continuous image of a connected space is connected (Theorem 23.5), so $\{x_0\}\times Y$ is connected. In the same way every horizontal slice $X\times\{y_0\}$ is connected.</p>
<p>A slice lies in $Z$ when its fixed coordinate is outside the removed set: if $x_0\notin A$, every point of $\{x_0\}\times Y$ has first coordinate outside $A$, so the whole vertical slice is in $Z$. Likewise $X\times\{y_0\}\subseteq Z$ when $y_0\notin B$. (A subset of $Z$ gets the same topology from $Z$ as from $X\times Y$, by [[hw1-q4]], so these slices are connected as subspaces of $Z$ too.)</p>

<h4>The hub</h4>
<p>This is where "proper subset" is used. Since $A\ne X$ there is a point $a\in X\setminus A$, and since $B\ne Y$ there is $b\in Y\setminus B$. By the previous paragraph the vertical slice $\{a\}\times Y$ and the horizontal slice $X\times\{b\}$ both lie in $Z$. They cross at $(a,b)$, which will be the common point every piece passes through.</p>

<h4>Joining every point to the hub</h4>
<p>Take any $(x,y)\in Z$. If $x\notin A$, its vertical slice $\{x\}\times Y$ lies in $Z$ and meets the horizontal arm $X\times\{b\}$ at $(x,b)$. Put</p>
$$C_{(x,y)}=(\{x\}\times Y)\cup(X\times\{b\}).$$
<p>It lies in $Z$, contains $(x,y)$ and $(a,b)$, and is connected by Theorem 23.3, since its two slices are connected and share $(x,b)$.</p>
<p>If instead $x\in A$, then $y\notin B$ (the point is in $Z$), so its horizontal slice $X\times\{y\}$ lies in $Z$ and meets the vertical arm $\{a\}\times Y$ at $(a,y)$. Put $C_{(x,y)}=(X\times\{y\})\cup(\{a\}\times Y)$; for the same reasons it lies in $Z$, is connected, and contains $(x,y)$ and $(a,b)$.</p>

<h4>Concluding</h4>
<p>Every point of $Z$ lies in its own $C_{(x,y)}$, and every $C_{(x,y)}$ lies in $Z$, so $Z=\bigcup_{(x,y)\in Z}C_{(x,y)}$. This is a union of connected subspaces all containing $(a,b)$, so $Z$ is connected by Theorem 23.3. $\blacksquare$</p>`);
