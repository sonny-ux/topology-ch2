// ===== Conceptual articles, rewritten to be elementary and complete: every term recalled, every step justified.
A['defining-by-maps'] = {title: 'Subspace, product, quotient: topologies defined by maps', kind: 'idea', where: '§15–22', pre: ['continuous', 'finer-coarser', 'subspace-topology', 'product-topology', 'quotient-topology'],
  lede: 'Three ways of making a new space have one thing in common: each new topology is chosen so that one particular map becomes continuous, and it is the most economical choice that does so.',
  sections: [
  ['The problem these constructions solve', R`<p>We often have spaces already, and a new <em>set</em> built from them that we want to make into a space:</p>
<ul><li>a <b>subset</b> $Y$ of a space $X$ (for example $[0,1]$ inside $\mathbb R$);</li><li>a <b>product</b> $X\times Y$ of two spaces (for example the plane $\mathbb R\times\mathbb R$);</li><li>a <b>set of pieces</b> $X^*$ obtained by gluing points of $X$ together (for example $[0,1]$ with $0$ and $1$ glued).</li></ul>
<p>A set can carry many different topologies. The question each time is: <em>which</em> topology should the new set get, so that it is related to the old spaces in the right way? The answer in all three cases comes from asking one particular map to be continuous.</p>`],
  ['Recall: comparing topologies', R`<p>Two topologies $\mathcal T$ and $\mathcal T'$ on the same set can be compared when one contains the other. If $\mathcal T\subseteq\mathcal T'$, every set that is open for $\mathcal T$ is also open for $\mathcal T'$, and we say $\mathcal T'$ is <b>finer</b> (it has more open sets) and $\mathcal T$ is <b>coarser</b> (it has fewer). "Coarsest topology with a property" means the one with the fewest open sets among all topologies with that property; "finest" means the one with the most. See [[finer-coarser]].</p>`],
  ['Recall: continuity is about preimages', R`<p>A function $f:A\to B$ between spaces is <b>continuous</b> if for every open set $V$ of $B$, the preimage $f^{-1}(V)=\{a\in A: f(a)\in V\}$ is open in $A$. See [[continuous]].</p>
<p>Notice what this asks of each side. It asks the <em>domain</em> $A$ to have certain sets open (the preimages). It asks the <em>target</em> $B$ nothing directly; but every set we declare open in $B$ adds another preimage that must be open in $A$.</p>`],
  ['The key observation', R`<p>Fix a function $f:A\to B$ and ask how its continuity depends on the topologies.</p>
<ol><li><b>More open sets on the domain make continuity easier.</b> Continuity asks for certain subsets of $A$ to be open; if $A$ has more open sets, more of these requests are met. In the extreme case, if every subset of $A$ is open (the discrete topology), every function out of $A$ is continuous.</li>
<li><b>More open sets on the target make continuity harder.</b> Each open set of $B$ is one more preimage that must be open in $A$. In the extreme case, if $B$ has only $\varnothing$ and $B$ open (the indiscrete topology), every function into $B$ is continuous, because $f^{-1}(\varnothing)=\varnothing$ and $f^{-1}(B)=A$ are always open.</li></ol>
<p>So when the new space is the <em>domain</em> of the map, continuity forces some sets to be open, and the economical choice is to open those and no more. When the new space is the <em>target</em>, continuity forbids some sets from being open, and the economical choice is to open everything not forbidden.</p>`],
  ['Subspace: the new space is the domain of the inclusion', R`<p>For $Y\subseteq X$, the <b>inclusion map</b> is $i:Y\to X$, $i(y)=y$: it sends each point of $Y$ to the same point, now regarded as a point of $X$. (It is often written $Y\hookrightarrow X$; the hooked arrow just signals an inclusion.)</p>
<ol><li><b>What continuity of $i$ requires.</b> For each open $U\subseteq X$, $i^{-1}(U)=\{y\in Y: y\in U\}=Y\cap U$ must be open in $Y$.</li>
<li><b>The economical choice.</b> Declare exactly these sets open: $\mathcal T_Y=\{Y\cap U: U \text{ open in } X\}$. This is the [[subspace-topology]]. It is a topology (the intersections with $Y$ of $\varnothing$ and $X$ are $\varnothing$ and $Y$; intersecting with $Y$ preserves unions and finite intersections).</li>
<li><b>Why the fewest is right.</b> Any further open set would be a region of $Y$ that $X$ itself does not regard as a neighbourhood. That would be nearness invented on $Y$, not inherited from $X$.</li></ol>`],
  ['Product: the new space is the domain of the projections', R`<p>For $X\times Y$, the <b>projections</b> are $\pi_1(x,y)=x$ and $\pi_2(x,y)=y$: they read off one coordinate.</p>
<ol><li><b>What continuity requires.</b> For open $U\subseteq X$, $\pi_1^{-1}(U)=U\times Y$ must be open; for open $V\subseteq Y$, $\pi_2^{-1}(V)=X\times V$ must be open.</li>
<li><b>What the topology axioms then force.</b> A topology is closed under finite intersections, so $(U\times Y)\cap(X\times V)=U\times V$ must be open too; and closed under unions, so every union of such boxes must be open.</li>
<li><b>The economical choice.</b> Declare exactly the unions of boxes $U\times V$ open. This is the [[product-topology]]: the fewest open sets that make both projections continuous.</li></ol>
<p>For infinitely many factors the same reasoning gives the product topology, not the box topology: intersections are only forced finitely many at a time ([[product-vs-box]]).</p>`],
  ['Quotient: the new space is the target of the gluing map', R`<p>For a gluing, $p:X\to X^*$ sends each point to the piece containing it. Now the new space $X^*$ is the <em>target</em>.</p>
<ol><li><b>What continuity of $p$ requires.</b> Every set $U$ we declare open in $X^*$ must have $p^{-1}(U)$ open in $X$. So a set whose preimage is <em>not</em> open is forbidden from being open.</li>
<li><b>The economical choice.</b> Declare open every set that is not forbidden: $U$ is open iff $p^{-1}(U)$ is open. This is the [[quotient-topology]], the most open sets $p$ allows.</li>
<li><b>Why the most is right.</b> Fewer open sets would throw away nearness information that the gluing did not force us to lose. For example the indiscrete topology on $X^*$ also makes $p$ continuous, but it forgets everything.</li></ol>`],
  ['What each construction gives you: a rule for maps', R`<p>Because each topology was chosen through one map, each comes with a rule for testing continuity of other maps, and these rules are what the homework uses.</p>
<ul><li><b>Into a subspace.</b> $f:Z\to Y$ is continuous iff $i\circ f:Z\to X$ is continuous. Reason: the open sets of $Y$ are the $Y\cap U$, and $f^{-1}(Y\cap U)=(i\circ f)^{-1}(U)$.</li>
<li><b>Into a product.</b> $f:Z\to X\times Y$ is continuous iff both coordinates $\pi_1\circ f$ and $\pi_2\circ f$ are. Reason: it suffices to check the sets $U\times Y$ and $X\times V$, whose preimages are $(\pi_1\circ f)^{-1}(U)$ and $(\pi_2\circ f)^{-1}(V)$ ([[maps-into-products]]).</li>
<li><b>Out of a quotient.</b> $g:X^*\to Z$ is continuous iff $g\circ p:X\to Z$ is. Reason: $g^{-1}(V)$ is open in $X^*$ iff $p^{-1}(g^{-1}(V))=(g\circ p)^{-1}(V)$ is open in $X$ ([[maps-out-of-quotients]]).</li></ul>
<p>In each case the question about the new space is turned into a question about the old spaces, where we already know the open sets.</p>`],
  ['When the constructions are combined', R`<p>Taking a subspace and then a product gives the same topology as taking a product and then a subspace ([[products-and-subspaces]], HW4 Q3). Taking a subspace and a quotient in different orders can give different topologies (HW6 Q3, HW7 Q5). The difference: subspaces and products are both "fewest open sets for maps out of the new space", so they agree; the quotient is "most open sets for a map into it", which pulls the other way.</p>`],
  ['Where this sits in mathematics', R`<p>The same three constructions exist for almost every kind of structure, and they are defined by the same kind of rule.</p>
<ul><li><b>Groups.</b> A subgroup, a product of groups $G\times H$, and a quotient group $G/N$ (gluing elements that differ by an element of $N$).</li>
<li><b>Vector spaces.</b> A subspace, a product $V\times W$, and a quotient space $V/W$.</li></ul>
<p>In each case, a map into a product is the same as a pair of maps into the factors, and a map out of a quotient is the same as a map out of the original that respects the gluing. Branches of mathematics differ in what structure they study; this way of building new objects and testing maps is shared.</p>
<p><b>Broader context (beyond Munkres):</b> category theory makes this pattern its subject. Objects are described by their maps to and from other objects ("universal properties"); products and subobjects are cases of <em>limits</em>, quotients of <em>colimits</em>. The topologies here are called the <em>initial</em> topology (fewest open sets making maps out continuous) and the <em>final</em> topology (most open sets making maps in continuous).</p>`]]};
// ---- the reasons: why each construction is needed, why that topology, what depends on it
(function(){ var S = A['defining-by-maps'].sections; function at(label){ for (var i = 0; i < S.length; i++) if (S[i][0] === label) return i; return -1; }
S.splice(at('Subspace: the new space is the domain of the inclusion') + 1, 0,
 ['Why subspaces are needed', R`<p>Most spaces we study are parts of larger ones: the interval $[0,1]$ and the half-line $[0,\infty)$ inside $\mathbb R$; the circle $S^1$, a disc, or the graph of a function inside the plane $\mathbb R^2$; the sphere inside $\mathbb R^3$. Functions are often defined only on such a part: $f(x)=1/x$ lives on $\mathbb R\setminus\{0\}$, and $\sqrt x$ on $[0,\infty)$.</p>
<p>To ask whether $\sqrt x$ is continuous, or whether $[0,1]$ is [[compact]] or [[connected]], we need $[0,1]$ and $[0,\infty)$ to be spaces in their own right. Every definition in topology is made for a space, so without a topology on the subset none of these questions can even be asked.</p>`],
 ['Why this topology and not another', R`<p>A subset can carry many topologies. Two alternatives show why the subspace topology is the right one.</p>
<ul><li><b>The discrete topology on $[0,1]$</b> (every subset open). Then every function on $[0,1]$ is continuous, including ones with jumps, so "continuous on $[0,1]$" would say nothing. And $[0,1]$ would fall apart into separate points: it would not be connected.</li>
<li><b>The indiscrete topology on $[0,1]$</b> (only $\varnothing$ and $[0,1]$). Then every sequence converges to every point, and $0$ and $1$ could not be told apart by open sets.</li></ul>
<p>The subspace topology is the one under which "continuous on $[0,1]$" means exactly what it means in calculus, and under which $[0,1]$ is near what $\mathbb R$ says it is near. It is right because it adds and removes nothing: it is the nearness of $X$, restricted.</p>`],
 ['What depends on it', R`<p>Every statement of the form "this subset is compact", "connected", "Hausdorff", or "this function on a subset is continuous" uses it. Closed sets of a subspace (Theorem 17.2), closures in a subspace (17.4), the pasting lemma (18.3: continuity on closed pieces), Heine–Borel (compact subsets of $\mathbb R^n$), and the intermediate value theorem on an interval are all statements about subspaces.</p>`]);
S.splice(at('Product: the new space is the domain of the projections') + 1, 0,
 ['Why products are needed', R`<p>Many spaces are made of several independent coordinates: the plane $\mathbb R^2$ is pairs of reals, $\mathbb R^n$ is $n$-tuples; the torus is $S^1\times S^1$ (one angle around the hole, one around the tube); the space of positions of two particles on a line is $\mathbb R\times\mathbb R$. Functions of several variables, $f(x,y)$, are functions on a product.</p>
<p>To say $f(x,y)=x+y$ is continuous we need a topology on $\mathbb R\times\mathbb R$, built from the topology of each factor.</p>`],
 ['Why this topology and not another', R`<p>With the product topology, a function into a product is continuous exactly when each coordinate is continuous ([[maps-into-products]]), and a sequence converges exactly when each coordinate converges ([[product-convergence]]). That is the behaviour we know from $\mathbb R^n$: a curve $t\mapsto(x(t),y(t))$ is continuous iff $x(t)$ and $y(t)$ are.</p>
<p>For finitely many factors the box topology is the same as the product topology. For infinitely many it has more open sets, and then the diagonal map $t\mapsto(t,t,t,\dots)$ into $\mathbb R^\omega$ is not continuous even though every coordinate is the identity ([[product-vs-box]]). The box topology breaks the one property products are supposed to have.</p>`],
 ['What depends on it', R`<p>Continuity of sums and products of real functions (they factor through $\mathbb R\times\mathbb R$); HW3 Q1 ($f\times g$); HW4 Q2 (regrouping products); products of Hausdorff or connected or compact spaces (17.11, 23.6, 26.7); and later the torus and other surfaces built as products.</p>`]);
S.splice(at('Quotient: the new space is the target of the gluing map') + 1, 0,
 ['Why quotients are needed', R`<p>Many important spaces are easiest to describe by gluing simple pieces, and some can hardly be described any other way.</p>
<ul><li>The <b>circle</b>: an interval with its ends glued.</li><li>The <b>torus</b>: a square with opposite edges glued, both pairs in the same direction.</li><li>The <b>Möbius strip</b>: a square with one pair of edges glued with a twist.</li><li>The <b>sphere</b>: a disc with its whole boundary circle crushed to one point.</li><li>The <b>projective plane</b>: a sphere with each point glued to its opposite point; it does not fit inside $\mathbb R^3$ at all, so gluing is the natural way to build it.</li></ul>
<p>Gluing also arises whenever we decide some points are "the same for our purposes": points with the same sign (HW6 Q1), points in the same orbit of a symmetry, or a whole closed set $A$ treated as one point (HW7 Q1).</p>`],
 ['Why this topology and not another', R`<p>Many topologies on $X^*$ make $p$ continuous; the indiscrete one always does. But a coarser choice would forget nearness the gluing did not destroy: on the circle built from $[0,1]$, the indiscrete topology would make every sequence converge to every point. The quotient topology keeps every open set of $X$ that survives the gluing (the [[saturated]] ones), so it remembers as much as possible. With it, the glued interval really is the circle: a neighbourhood of the glued point reaches out on both sides, as on $S^1$.</p>`],
 ['What depends on it', R`<p>Theorem 22.2 (maps out of a quotient) is how one proves a glued space is homeomorphic to a familiar one, e.g. $[0,1]/\{0\sim1\}\cong S^1$. The classification of surfaces (Chapter 12) describes every closed surface as a polygon with edges glued in pairs. The fundamental group (Chapter 9) is computed for spaces given by gluing. HW6 and HW7 are about recognising quotient maps and what they do to properties like Hausdorff.</p>`]);
S.splice(at('Where this sits in mathematics'), 0,
 ['Why the common pattern matters', R`<p>It replaces three separate lists of open sets with one way of thinking: <em>a new space is determined by how it should relate to the spaces it was built from</em>. In practice this means you almost never describe open sets of a subspace, product or quotient directly. You check a map instead: into a subspace through the inclusion, into a product through its coordinates, out of a quotient through $p$. Most proofs in §15–22 and in HW3–HW7 are this move.</p>
<p>It also explains surprises. When a subspace and a quotient are taken in different orders and the topologies differ (HW7 Q5), the reason is that one construction takes the fewest open sets and the other the most, so they need not agree.</p>`]);

var VERBATIM = {
'hw7-q1': R`<p>Let $X$ be a set and $A\subset X$ a non-empty subset. Define an equivalence relation $\sim_A$ on $X$ by declaring $x\sim_A y$ if and only if the following condition holds: either $x=y$, or $x$ and $y$ are both elements of $A$.</p><p>(a) It may be used without proof that $\sim_A$ is an equivalence relation. What are the equivalence classes for $\sim_A$?</p><p>(b) Assume $X$ has the metric topology induced by $d:X\times X\to\mathbb R$ and that $A\subset X$ is closed. Prove that $X/{\sim_A}$ is Hausdorff.</p>`,
'hw7-q2': R`<p>Let $p:\mathbb R\to\{-1,0,1\}$ be the quotient map from the previous homework. Determine whether $p$ is an open map, and whether it is a closed map. Justify your answer.</p>`,
'hw7-q3': R`<p>Let $X$ and $Y$ be topological spaces, and let $\pi_1:X\times Y\to X$ be the projection.</p><p>(a) Prove that $\pi_1$ is an open map.</p><p>(b) Show by example that $\pi_1$ need not be a closed map.</p>`,
'hw7-q4': R`<p>Let $\mathbb R$ have the standard topology and $\mathbb R^2=\mathbb R\times\mathbb R$ have the product topology. Let $A=[0,\infty)\times\mathbb R\ \cup\ \mathbb R\times\{0\}$ have the subspace topology from $\mathbb R^2$, and define $q:A\to\mathbb R$ as $q((x,y))=x$.</p><p>(a) Sketch $A\subset\mathbb R^2$ in a picture.</p><p>(b) Prove that $q$ is a quotient map. <em>Hint: a question from HW6 may be helpful.</em></p><p>(c) Prove that $q$ is not an open map. Then prove that $q$ is not a closed map.</p>`,
'hw7-q5': R`<p>Let $C=[0,1]\times[0,1]\subset\mathbb R^2$ and $D=C\cup([0,1]\times\{-1\})$, and let $p:D\to C$ be defined by $p((x,y))=(x,\max(0,y))$.</p><p>(a) Prove that $p$ is a quotient map. <em>Hint: a hint from the previous question may be helpful.</em></p><p>(b) Let $B\subset D$ be the subset defined in HW6Q3, give $B$ the subspace topology, let $i:B\to D$ be the inclusion map, and write $q=p\circ i:B\to C$. Sketch a picture of the subset $q(B)\subset C$. It should be visible in your picture what points in the boundary of the square are in $q(B)$.</p><p>(c) Prove that the quotient topology on $q(B)$ induced by the surjection $q:B\to q(B)$ does not equal the subspace topology from $C$.</p><p><em>Remark (not part of the question): This gives another example where quotient and subspace topologies are combined; it matters whether we first pass to the subspace topology and then to the quotient topology, or whether we apply these constructions in the opposite order.</em></p>`,
'hw7-q6': R`<p>(a) Let $X$ and $Y$ be topological spaces, and let $f:X\to Y$ be a bijection. Prove that $f$ is an open map if and only if $f$ is a closed map.</p><p>(b) Give an example of a bijection $f:X\to Y$ which is an open map but is not continuous.</p>`,
'hw4-q1': R`<p>Let $J$ and $X$ and $x:\mathcal P(J)\to X$ be as in HW3Q5. As in that problem, we get for any sequence $A_1,A_2,\dots\in\mathcal P(J)$ a sequence $x(A_1),x(A_2),\dots\in X$. Assume that $A_1\supset A_2\supset\cdots$. Prove that the sequence converges, and determine its limit.</p>`,
'hw4-q2': R`<p>Let $X_1,X_2,X_3$ be topological spaces; all products are given the product topology (for instance $(X_1\times X_2)\times X_3$ is the product of $X_1\times X_2$, itself given the product topology, with $X_3$). Let $f:(X_1\times X_2)\times X_3\to\prod_{\alpha\in\{1,2,3\}}X_\alpha$ be the function with coordinates $f_\alpha(((x_1,x_2),x_3))=x_\alpha$.</p><p>(a) Use Theorem 19.6 to prove that $f$ is continuous.</p><p>(b) Prove that $f$ is a homeomorphism.</p><p><em>Hint: in both (a) and (b), it should be possible to avoid explicitly mentioning open sets or bases.</em></p>`,
'hw4-q3': R`<p>Let $J$ be a set. For each $\alpha\in J$ let $X_\alpha$ be a topological space and $A_\alpha$ a subset. Let $A=\prod_{\alpha\in J}A_\alpha$ and $X=\prod_{\alpha\in J}X_\alpha$. Let $\mathcal T\subset\mathcal P(A)$ be the topology arising by first giving $X$ the product topology, and then giving $A\subset X$ the subspace topology. Let $\mathcal T'\subset\mathcal P(A)$ be the topology arising by first giving each $A_\alpha\subset X_\alpha$ the subspace topology, and then giving $A=\prod A_\alpha$ the product topology. Prove that $\mathcal T=\mathcal T'$.</p>`,
'hw4-q4': R`<p>Let $J$ be a set, let $\{0,1\}$ have the discrete topology, and let $X=\prod_{j\in J}\{0,1\}$ have the product topology. Let $\pi_j:X\to\{0,1\}$ denote the projections, and let $U_j=\pi_j^{-1}(\{0\})\subset X$. Let $z=(0)_{j\in J}\in X$.</p><p>(a) Prove that for any neighborhood $V\subset X$ of $z$, there exists a finite subset $J_V\subset J$ such that $\bigcap_{j\in J_V}U_j\subset V$.</p><p>(b) Now assume that there exists a sequence of open subsets $U_1\supset U_2\supset\cdots$ of $X$ such that $\bigcap_{n\in\mathbb Z_+}U_n=\{z\}$. Prove that there exists a sequence of subsets $J_1,J_2,\dots\subset J$, such that $J_n$ is finite for all $n$, and such that $\bigcup_n J_n=J$. Deduce that there exists an injective map $J\to\mathbb N$.</p>`
};

A['hw7-q2'].sections = [
 ['The problem', VERBATIM['hw7-q2'] + '<p class="foot">Word for word from the assignment PDF.</p>'],
 ['What it builds on: HW6 Q1', R`<p><b>The map.</b> $p:\mathbb R\to\{-1,0,1\}$ sends each real number to its sign:</p>
$$p(x)=\begin{cases}-1 & x<0\\ \ \ 0 & x=0\\ \ \ 1 & x>0.\end{cases}$$
<p><b>The topology on $\{-1,0,1\}$.</b> It is the [[quotient-topology]]: a subset $U$ is open exactly when $p^{-1}(U)$ is open in $\mathbb R$. Testing each subset:</p>
<ul><li>$p^{-1}(\{-1\})=(-\infty,0)$, open, so $\{-1\}$ is open.</li><li>$p^{-1}(\{1\})=(0,\infty)$, open, so $\{1\}$ is open.</li><li>$p^{-1}(\{-1,1\})=\mathbb R\setminus\{0\}$, open, so $\{-1,1\}$ is open.</li><li>$p^{-1}(\{0\})=\{0\}$, not open, so $\{0\}$ is not open; likewise $\{-1,0\}$ ($p^{-1}=(-\infty,0]$) and $\{0,1\}$ ($p^{-1}=[0,\infty)$) are not open.</li></ul>
$$\mathcal T=\{\varnothing,\ \{-1\},\ \{1\},\ \{-1,1\},\ \{-1,0,1\}\}.$$
<p class="foot">Reconstructed from our HW6 session notes; the HW6 PDF is not in the guide yet.</p>`],
 ['Concepts and method', ''],
 ['How the terms are used', R`<p>The question is about pushing sets <em>forward</em>. A map $p$ is an <b>open map</b> ([[open-map]]) when it carries every open set of its domain to an open set of its target: for each open $U\subseteq\mathbb R$, the image $p(U)=\{p(u):u\in U\}$ has to be one of the open sets of $\{-1,0,1\}$. It is a <b>closed map</b> when the same holds for closed sets: each closed $C\subseteq\mathbb R$ has to have $p(C)$ closed in $\{-1,0,1\}$. This runs opposite to continuity, which pulls open sets <em>back</em> through preimages; images going forward have no general reason to stay open or closed, which is why the question has to be checked.</p>
<p>To test an image you need the list of what counts as open and closed in the target. The topology on $\{-1,0,1\}$ from [[hw6-q1]] has five open sets, $\varnothing,\ \{-1\},\ \{1\},\ \{-1,1\},\ \{-1,0,1\}$. A set is [[closed-set|closed]] exactly when its complement is open, so taking the complement of each open set gives the five closed sets:</p>
$$\{-1,0,1\},\quad\{0,1\},\quad\{-1,0\},\quad\{0\},\quad\varnothing.$$
<p>The method then follows what "justify" asks for in each half. Showing that $p$ <em>is</em> open is a claim about every open $U$, so the argument has to cover an arbitrary $U$; the breakdown below does this by splitting into the cases $0\in U$ and $0\notin U$. Showing that $p$ is <em>not</em> closed denies a "for every" claim, so a single closed set $C$ whose image is missing from the list of closed sets settles it.</p>`],
 ['Breakdown: is p an open map?', steps([
   [R`<b>Take an arbitrary open set</b> $U\subseteq\mathbb R$. The goal is to show $p(U)\in\mathcal T$.`, R`Openness of a map is a statement about every open set, so the argument must start from an arbitrary one.`],
   [R`<b>Split into two cases:</b> $0\in U$ or $0\notin U$.`, R`The only point of $\mathbb R$ that behaves differently under $p$ is $0$ (it is the only point sent to $0$), and the only subsets that fail to be open in $\mathcal T$ are the ones containing $0$ but not everything. So whether $U$ contains $0$ is what decides the answer.`],
   [R`<b>Case $0\in U$.</b> Since $U$ is open in $\mathbb R$, there is $\varepsilon>0$ with $(-\varepsilon,\varepsilon)\subseteq U$. This interval contains $-\tfrac\varepsilon2<0$ and $\tfrac\varepsilon2>0$. So $p(U)$ contains $p(-\tfrac\varepsilon2)=-1$, $p(0)=0$ and $p(\tfrac\varepsilon2)=1$: $p(U)=\{-1,0,1\}$, which is open.`, R`An open set of $\mathbb R$ cannot contain $0$ without containing numbers on both sides of $0$ (definition of open in $\mathbb R$: [[m-open]]). That forces the image to be everything.`],
   [R`<b>Case $0\notin U$.</b> Then every point of $U$ is negative or positive, so $p(U)\subseteq\{-1,1\}$. The subsets of $\{-1,1\}$ are $\varnothing,\{-1\},\{1\},\{-1,1\}$, and all four are in $\mathcal T$.`, R`Every possible image is on the list of open sets, whatever $U$ is.`]
 ])],
 ['Breakdown: is p a closed map?', steps([
   [R`<b>Look for a closed set of $\mathbb R$ that avoids $0$.</b>`, R`The closed sets of $\{-1,0,1\}$ listed above all contain $0$, except $\varnothing$. So an image that misses $0$ and is nonempty cannot be closed.`],
   [R`<b>Take $C=\{5\}$.</b> A single point is closed in $\mathbb R$ (its complement $(-\infty,5)\cup(5,\infty)$ is open).`, R`Any closed set of positive numbers would do; a single point is the simplest.`],
   [R`<b>Compute the image:</b> $p(C)=\{1\}$.`, ''],
   [R`<b>Check whether $\{1\}$ is closed:</b> its complement is $\{-1,0\}$, which is not in $\mathcal T$. So $\{1\}$ is not closed.`, R`Closed means the complement is open ([[closed-set]]); $\{-1,0\}$ was shown not open in HW6 Q1, since $p^{-1}(\{-1,0\})=(-\infty,0]$ is not open in $\mathbb R$.`]
 ])],
 ['Conclusion', R`<p>$p$ <b>is an open map</b> (every open $U$ either contains $0$, and then $p(U)=\{-1,0,1\}$, or misses $0$, and then $p(U)\subseteq\{-1,1\}$, and every such set is open). $p$ <b>is not a closed map</b>: $\{5\}$ is closed in $\mathbb R$ but $p(\{5\})=\{1\}$ is not closed in $\{-1,0,1\}$.</p>`],
 ['Why the answer makes sense', R`<p>In the quotient, the point $0$ is <em>stuck to</em> both $-1$ and $1$: the [[closure]] of $\{1\}$ is $\{0,1\}$, because every open set containing $0$ is the whole space and so meets $\{1\}$. A closed set of positive numbers, far from $0$, lands on $\{1\}$ alone, and $\{1\}$ is missing the point $0$ it is stuck to. That is why pushing closed sets forward fails.</p>
<p>Pushing open sets forward works because an open set either avoids $0$ (and lands among the open points $\pm1$) or contains $0$ together with points on both sides (and lands on everything).</p>
<p>It also shows that a [[quotient-map]] need not be closed: $p$ is a quotient map by construction, open, and not closed.</p>`]
];

// ===== Homework 7, complete guides: problem, what it builds on, terms, breakdown, clean solution (folded), why it makes sense.
var PDF = '<p class="foot">Word for word from the assignment PDF.</p>';
function hub(id, parts){ A[id].sections = [['The problem', VERBATIM[id] + PDF]].concat(parts); }

// ---------- Q1
hub('hw7-q1', [
 ['Concepts and method', ''],
 ['How the terms are used', R`<p>The problem builds a new space by gluing, and each term names one stage of that construction. An <b>equivalence relation</b> ([[relation-equivalence]]) is a relation that is reflexive ($x\sim x$), symmetric ($x\sim y$ gives $y\sim x$) and transitive ($x\sim y$ and $y\sim z$ give $x\sim z$); these three rules are what make "glue these points together" consistent. Its <b>equivalence classes</b> ([[equivalence-class]]), $[x]=\{y: y\sim x\}$, are the glued pieces, and part (a) asks what they are for $\sim_A$: all of $A$ forms one class, and each point outside $A$ is a class by itself.</p>
<p>The <b>quotient space</b> $X/{\sim_A}$ has these classes as its points. Its topology is the [[quotient-topology]]: with $\pi:X\to X/{\sim_A}$ the map $\pi(z)=[z]$, a set $U$ of classes is open exactly when $\pi^{-1}(U)$, the union of the classes in $U$, is open in $X$. So every question about open sets in the quotient is answered by looking at open sets in $X$.</p>
<p>In $X$, open sets come from the <b>metric topology</b> ([[metric-topology]]): a set is open when around each of its points it contains a ball $B(x,r)=\{z:d(x,z)\lt r\}$. The hypothesis that <b>$A$ is closed</b> ([[closed-set]]) means $X\setminus A$ is open, so any point $x\notin A$ has a ball around it that misses $A$ entirely; this is the room the proof needs. The goal, <b>Hausdorff</b> ([[hausdorff]]), asks that any two distinct points of $X/{\sim_A}$ have disjoint open neighbourhoods. The method puts these together: in $X$, choose two disjoint open sets that are each a union of whole classes (a small ball around a point outside $A$, and either another small ball or the set of points close to $A$, which contains all of $A$ at once), and then carry them down to the quotient through $\pi$.</p>`],
 ['Breakdown', steps([
  [R`<b>(a) Find the class of a point of $A$.</b> For $a\in A$: any $y\in A$ satisfies "both in $A$", so $y\sim_A a$; any $y\notin A$ is neither equal to $a$ nor in $A$. So $[a]=A$.`, R`Read the condition literally: one of its two clauses must hold.`],
  [R`<b>(a) Find the class of a point outside $A$.</b> For $x\notin A$ the "both in $A$" clause never holds, so only $y=x$ works: $[x]=\{x\}$.`, ''],
  [R`<b>(b) Record the tool:</b> if $W\subseteq X$ is open and contains all of $A$ or none of it, then $\pi^{-1}(\pi(W))=W$, so $\pi(W)$ is open.`, R`$W$ is [[saturated]]: it never contains part of the class $A$ without the rest, and the other classes are single points.`],
  [R`<b>(b) Split the pairs of distinct points into two kinds:</b> two singletons, or $[A]$ and a singleton.`, R`By (a) those are the only points of the quotient, and two copies of $[A]$ would not be distinct. Method: [[m-hausdorff]].`],
  [R`<b>(b) Two singletons $\{x\},\{y\}$:</b> use balls of radius $r=\min(\tfrac{d(x,y)}2,r_x,r_y)$, where $B(x,r_x)$ and $B(y,r_y)$ miss $A$.`, R`$r\le r_x,r_y$ keeps the balls out of $A$ (so saturated); $r\le d(x,y)/2$ keeps them apart (triangle inequality).`],
  [R`<b>(b) $[A]$ and $\{x\}$:</b> with $B(x,r)\cap A=\varnothing$, use $U=B(x,\tfrac r2)$ and $W=\{z:d(z,x)>\tfrac r2\}$.`, R`$U$ misses $A$; $W$ contains all of $A$ since points of $A$ are at distance $\ge r$; no point is both nearer and farther than $\tfrac r2$. A ball around $A$ would not work, since $A$ may be large.`]])],
 ['Clean solution', R`<p><b>(a)</b> Let $a\in A$. If $y\in A$, then $y\sim_A a$ since both lie in $A$. If $y\notin A$, then $y\ne a$ and $y,a$ are not both in $A$, so $y\not\sim_A a$. Hence $[a]=A$. Let $x\notin A$. If $y\sim_A x$, then since $x\notin A$ the second clause fails, so $y=x$. Hence $[x]=\{x\}$. The classes are $A$ and the singletons $\{x\}$, $x\in X\setminus A$.</p>
<p><b>(b)</b> Let $\pi:X\to X/{\sim_A}$, $\pi(z)=[z]$. If $W\subseteq X$ is open and either $A\subseteq W$ or $A\cap W=\varnothing$, then $W$ is a union of classes, so $\pi^{-1}(\pi(W))=W$ is open and $\pi(W)$ is open in $X/{\sim_A}$.</p>
<p>Let $p\ne p'$ be points of $X/{\sim_A}$. By (a), each is $[A]$ or $\{x\}$ with $x\notin A$.</p>
<p><em>Case 1: $p=\{x\}$, $p'=\{y\}$, $x\ne y$, $x,y\notin A$.</em> Since $X\setminus A$ is open, there are $r_x,r_y>0$ with $B(x,r_x)\cap A=\varnothing=B(y,r_y)\cap A$. Let $r=\min(\tfrac{d(x,y)}2,r_x,r_y)>0$. Then $B(x,r)$ and $B(y,r)$ are open and miss $A$, so $\pi(B(x,r))\ni\{x\}$ and $\pi(B(y,r))\ni\{y\}$ are open. If $z\in B(x,r)\cap B(y,r)$, then $d(x,y)\le d(x,z)+d(z,y)<2r\le d(x,y)$, a contradiction; so the balls are disjoint, and since they are unions of classes, so are their images.</p>
<p><em>Case 2: $p=[A]$, $p'=\{x\}$, $x\notin A$.</em> Choose $r>0$ with $B(x,r)\cap A=\varnothing$. Let $U=B(x,\tfrac r2)$ and $W=\{z\in X: d(z,x)>\tfrac r2\}$. $U$ is open; $W$ is open since for $z\in W$, $B(z,d(z,x)-\tfrac r2)\subseteq W$ by the triangle inequality. $U\cap A=\varnothing$, and every $a\in A$ has $d(a,x)\ge r>\tfrac r2$, so $A\subseteq W$. Thus $\pi(U)\ni\{x\}$ and $\pi(W)\ni[A]$ are open. $U\cap W=\varnothing$, and both are unions of classes, so $\pi(U)\cap\pi(W)=\varnothing$.</p>
<p>Every pair of distinct points is separated, so $X/{\sim_A}$ is Hausdorff. $\blacksquare$</p>`],
 ['Why closed is needed', R`<p>For $A=(0,1)\subset\mathbb R$, every open set around $\{0\}$ contains $[A]$: the quotient is not Hausdorff ([[ex-crush-open]], [[crushing-a-set]]).</p>`]]);

(function(){ var S = A['hw7-q2'].sections, k = -1; S.forEach(function(s, i){ if (s[0] === 'Conclusion') k = i; });
 S.splice(k, 1, ['Clean solution', R`<p>Recall from HW6 that $\{-1,0,1\}$ has the quotient topology $\mathcal T=\{\varnothing,\{-1\},\{1\},\{-1,1\},\{-1,0,1\}\}$, where $p(x)$ is the sign of $x$. Its closed sets are $\{-1,0,1\},\{0,1\},\{-1,0\},\{0\},\varnothing$.</p>
<p><b>$p$ is open.</b> Let $U\subseteq\mathbb R$ be open. If $0\in U$, there is $\varepsilon>0$ with $(-\varepsilon,\varepsilon)\subseteq U$, so $-\tfrac\varepsilon2,0,\tfrac\varepsilon2\in U$ and $p(U)=\{-1,0,1\}\in\mathcal T$. If $0\notin U$, then $p(U)\subseteq\{-1,1\}$, and every subset of $\{-1,1\}$ lies in $\mathcal T$. In either case $p(U)$ is open.</p>
<p><b>$p$ is not closed.</b> The set $\{5\}$ is closed in $\mathbb R$, but $p(\{5\})=\{1\}$, whose complement $\{-1,0\}$ is not in $\mathcal T$. So $\{1\}$ is not closed, and $p$ is not a closed map. $\blacksquare$</p>`]); })();

// ---------- Q3
hub('hw7-q3', [
 ['What it builds on: HW2 Q2', R`<p>HW2 Q2 asked you to prove: if $W\subseteq X\times Y$ is open, then $\pi_1(W)$ is open in $X$. That is exactly part (a). Part (b) asks for the failure of the closed version.</p>`],
 ['Concepts and method', ''],
 ['How the terms are used', R`<p>The <b>projection</b> $\pi_1:X\times Y\to X$, $\pi_1(x,y)=x$ ([[projections]]), forgets the second coordinate. Part (a) asks that it be an <b>open map</b> ([[open-map]]): every open $W\subseteq X\times Y$ must have an open image $\pi_1(W)$. The open sets of $X\times Y$ are described by the <b>product topology</b> ([[product-topology]]): they are unions of boxes $U\times V$ with $U$ open in $X$ and $V$ open in $Y$, so around each point of an open $W$ there is a box lying inside $W$. The method uses this directly. For a point $x\in\pi_1(W)$, pick $(x,y)\in W$ and a box $U\times V\subseteq W$ around it; then $\pi_1(U\times V)=U$ is an open set containing $x$ and lying inside $\pi_1(W)$, which is what openness of $\pi_1(W)$ requires.</p>
<p>Part (b) concerns the <b>closed map</b> property, that images of closed sets are closed, and asks you to "show by example" that it can fail. A general claim ("for every closed set, the image is closed") is refuted by one instance, so the method ([[m-counterexample]]) is to choose particular spaces, such as $X=Y=\mathbb R$, and one closed set in $\mathbb R^2$ whose shadow on the $x$-axis is not closed.</p>`],
 ['Breakdown', steps([
  [R`<b>(a) Take open $W\subseteq X\times Y$ and a point $x\in\pi_1(W)$.</b> Then $x=\pi_1(x,y)$ for some $(x,y)\in W$.`, R`To show $\pi_1(W)$ is open, show every one of its points has an open set around it inside it ([[m-open]]).`],
  [R`<b>(a) Fit a box around $(x,y)$ inside $W$:</b> $U\times V$ with $(x,y)\in U\times V\subseteq W$.`, R`Definition of the product topology: boxes form a basis.`],
  [R`<b>(a) Project the box:</b> $x\in U$, and $U=\pi_1(U\times V)\subseteq\pi_1(W)$.`, R`$V$ is nonempty since it contains $y$, so every $u\in U$ is $\pi_1(u,y)$ with $(u,y)\in W$.`],
  [R`<b>(b) Choose $X=Y=\mathbb R$ and a closed set that approaches the $y$-axis without touching it.</b>`, R`A projection loses the second coordinate; a closed set can creep toward $x=0$ as $y\to\infty$, so its shadow approaches $0$ but never contains it.`],
  [R`<b>(b) Take $C=\{(x,y): xy=1\}$.</b> It is closed: it is $f^{-1}(\{1\})$ for the continuous $f(x,y)=xy$.`, R`Preimages of closed sets under continuous maps are closed ([[continuity-equivalents]]).`],
  [R`<b>(b) Its image is $\pi_1(C)=\mathbb R\setminus\{0\}$, which is not closed.</b>`, R`$0$ is a [[limit-point]] of $\mathbb R\setminus\{0\}$ not in it.`]])],
 ['Clean solution', R`<p><b>(a)</b> Let $W\subseteq X\times Y$ be open and $x\in\pi_1(W)$. Choose $y$ with $(x,y)\in W$. Since the boxes $U\times V$ ($U$ open in $X$, $V$ open in $Y$) form a basis for the product topology, there are such $U,V$ with $(x,y)\in U\times V\subseteq W$. For $u\in U$, $(u,y)\in U\times V\subseteq W$, so $u=\pi_1(u,y)\in\pi_1(W)$. Hence $x\in U\subseteq\pi_1(W)$ with $U$ open. Since $x$ was arbitrary, $\pi_1(W)$ is open, and $\pi_1$ is an open map.</p>
<p><b>(a), by unions</b> (the same proof, organised the other way). Let $W$ be open in $X\times Y$. Since the boxes $U\times V$ form a basis for the product topology, $W=\bigcup_{i\in I}(U_i\times V_i)$ with each $U_i$ open in $X$ and each $V_i$ open in $Y$. A box with $V_i=\varnothing$ is empty, so discarding those does not change $W$; assume each $V_i\neq\varnothing$. Images respect unions, so $\pi_1(W)=\bigcup_{i\in I}\pi_1(U_i\times V_i)$, and $\pi_1(U_i\times V_i)=U_i$ because $V_i$ is nonempty. Hence $\pi_1(W)=\bigcup_{i\in I}U_i$, a union of open sets of $X$, so it is open, and $\pi_1$ is an open map.</p>
<p><b>(b)</b> Let $X=Y=\mathbb R$ and $C=\{(x,y)\in\mathbb R^2: xy=1\}$. The map $f(x,y)=xy$ is continuous (a product of the continuous projections), and $\{1\}$ is closed in $\mathbb R$, so $C=f^{-1}(\{1\})$ is closed in $\mathbb R^2$. But $\pi_1(C)=\{x: x\ne0\}=\mathbb R\setminus\{0\}$, which is not closed: every interval around $0$ meets it, so $0$ is in its closure but not in the set. Hence $\pi_1$ is not a closed map. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>Room survives projection (a box of room projects onto an interval of room), but edges do not: the hyperbola's edge at $x=0$ is at infinite height, so its shadow has an edge point it never reaches.</p>`]]);

// ---------- Q4
hub('hw7-q4', [
 ['What it builds on: HW6 Q2', R`<p>HW6 Q2 showed: if $r:B\to A$ and there is a continuous $i:A\to B$ with $r\circ i=\mathrm{id}_A$, and $r$ is a continuous surjection, then $r$ is a quotient map, because if $r^{-1}(U)$ is open then $U=i^{-1}(r^{-1}(U))$ is open. This is the "section trick" in [[m-quotient-map]], and it is the hint for (b).</p>`],
 ['Concepts and method', ''],
 ['How the terms are used', R`<p>Start with the set. $[0,\infty)\times\mathbb R$ is the closed right half-plane, all points with $x\ge0$, and $\mathbb R\times\{0\}$ is the whole $x$-axis. Their union $A$ is the right half-plane with the left half of the axis sticking out of it. $A$ carries the <b>subspace topology</b> ([[subspace-topology]]): its open sets are the sets $A\cap O$ with $O$ open in $\mathbb R^2$. On the left part, $A$ is only a line, so a small open set around a point $(x,0)$ with $x\lt0$ is just an open interval of the axis, while around a point of the half-plane it is a disc, or half a disc on the edge $x=0$.</p>
<p>The map $q(x,y)=x$ is the first projection restricted to $A$: it squashes each vertical line of the half-plane to a single point and leaves the left axis as it is. Part (b) asks that $q$ be a <b>quotient map</b> ([[quotient-map]]): surjective, continuous, and such that $U\subseteq\mathbb R$ is open whenever $q^{-1}(U)$ is open in $A$. The method ([[m-quotient-map]]) checks these properties in turn, and the hint points to the HW6 fact ([[hw6-q2]]) that a continuous surjection with a continuous <em>section</em>, a map $s$ going back with $q\circ s=\mathrm{id}$, is a quotient map; here $s(x)=(x,0)$ is such a section.</p>
<p>Part (c) uses the <b>open map</b> and <b>closed map</b> properties ([[open-map]]) negatively, and for each one a single set is enough: an open set of $A$ whose image is not open, and a closed set of $A$ whose image is not closed ([[m-open-map]]). The shape of $A$ suggests where to look: along the edge $x=0$ of the half-plane for the first, and far out in the half-plane for the second.</p>`],
 ['Breakdown', steps([
  [R`<b>(a) Sketch:</b> shade everything with $x\ge0$; then draw the negative $x$-axis as a single line attached on the left.`, ''],
  [R`<b>(b) Surjective:</b> for $x\in\mathbb R$, $(x,0)\in A$ and $q(x,0)=x$.`, R`The axis is in $A$ for every $x$, including negatives.`],
  [R`<b>(b) Continuous:</b> $q$ is the restriction of $\pi_1:\mathbb R^2\to\mathbb R$ to the subspace $A$.`, R`Restrictions of continuous maps to subspaces are continuous (Theorem 18.2).`],
  [R`<b>(b) Reverse direction via a section:</b> $j:\mathbb R\to A$, $j(x)=(x,0)$, is continuous and $q\circ j=\mathrm{id}_{\mathbb R}$.`, R`$j$ is continuous into $\mathbb R^2$ (coordinates $x$ and $0$, Theorem 18.4), and its image lies in $A$, so it is continuous into $A$ (Theorem 18.2). Then $U=(q\circ j)^{-1}(U)=j^{-1}(q^{-1}(U))$.`],
  [R`<b>(c) Not open: find an open set of $A$ touching the edge $x=0$ from the right only.</b> Take $W=A\cap B((0,1),\tfrac12)$.`, R`$W$ is open in $A$ by definition of the subspace topology. The disc lies above the axis, so inside $A$ only its part with $x\ge0$ survives.`],
  [R`<b>(c) Its image is $q(W)=[0,\tfrac12)$, not open in $\mathbb R$.</b>`, R`$0$ has no room to the left in $q(W)$.`],
  [R`<b>(c) Not closed: use a closed set approaching $x=0$ without reaching it.</b> Take $C=\{(x,\tfrac1x): x>0\}\subseteq A$.`, R`$C$ is closed in $\mathbb R^2$ (preimage of $\{1\}$ under $xy$, intersected with the closed set $x\ge0$), hence $C=C\cap A$ is closed in $A$ (Theorem 17.2).`],
  [R`<b>(c) Its image is $q(C)=(0,\infty)$, not closed in $\mathbb R$.</b>`, R`$0$ is a limit point not in it. Compare [[hw7-q3]](b).`]])],
 ['Clean solution', R`<p><b>(a)</b> $A$ is the closed right half-plane $\{x\ge0\}$ together with the negative $x$-axis $\{(x,0):x<0\}$.</p>
<p><b>(b)</b> <em>Surjective:</em> for $x\in\mathbb R$, $(x,0)\in A$ and $q(x,0)=x$. <em>Continuous:</em> $q=\pi_1|_A$, the restriction of the continuous projection $\pi_1:\mathbb R^2\to\mathbb R$ to a subspace. <em>Reverse direction:</em> define $j:\mathbb R\to A$ by $j(x)=(x,0)$. Its coordinate functions $x\mapsto x$ and $x\mapsto0$ are continuous, so $j$ is continuous into $\mathbb R^2$ (Theorem 18.4), and since $j(\mathbb R)\subseteq A$, $j$ is continuous into $A$ (Theorem 18.2). Moreover $q\circ j=\mathrm{id}_{\mathbb R}$. If $U\subseteq\mathbb R$ and $q^{-1}(U)$ is open in $A$, then $U=(q\circ j)^{-1}(U)=j^{-1}(q^{-1}(U))$ is open. So $q$ is a quotient map.</p>
<p><b>(c)</b> <em>Not open:</em> let $W=A\cap B((0,1),\tfrac12)$, open in $A$. Points of the disc have $y>\tfrac12>0$, so $W=\{(x,y)\in B((0,1),\tfrac12): x\ge0\}$ and $q(W)=[0,\tfrac12)$, which is not open in $\mathbb R$ (no interval around $0$ lies in it). <em>Not closed:</em> let $C=\{(x,y): x>0,\ xy=1\}$. Since $C=\{xy=1\}\cap\{x\ge0\}$ is an intersection of closed subsets of $\mathbb R^2$, it is closed in $\mathbb R^2$, and $C=C\cap A$ is closed in $A$. But $q(C)=(0,\infty)$ is not closed in $\mathbb R$, since $0$ is a limit point of it. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>$q$ is a quotient map because of the section along the axis: openness can be carried back down the axis. It is not open because $A$ has an edge at $x=0$ above the axis, where open sets of $A$ stop abruptly, and projecting keeps that edge. This shows a quotient map need not be open or closed ([[open-map]]).</p>`]]);

// ---------- Q5 (parts b, c depend on HW6 Q3's set B)
hub('hw7-q5', [
 ['What it builds on', R`<p><b>HW7 Q4 hint (section trick).</b> If a continuous surjection $p$ has a continuous $j$ with $p\circ j=\mathrm{id}$, it is a quotient map ([[m-quotient-map]]).</p>
<p><b>HW6 Q3.</b> Defined a subset $B$ of $D$ and showed a map was not a quotient map using an open saturated set whose image is not open ([[m-not-quotient]]). The exact definition of $B$ is in the HW6 PDF, which is not in the guide yet.</p>`],
 ['Concepts and method', ''],
 ['How the terms are used', R`<p>$C$ is the closed unit square, and $D$ is $C$ together with a separate copy of its bottom edge at height $-1$, the segment $[0,1]\times\{-1\}$. The map $p(x,y)=(x,\max(0,y))$ does nothing on the square, where $y\ge0$, and sends $(x,-1)$ to $(x,0)$, so it glues the lower segment onto the bottom edge of the square. Part (a) asks that $p$ be a <b>quotient map</b> ([[quotient-map]]), and the method is the one from [[hw7-q4]]: check that $p$ is surjective and continuous, then use a continuous section, here the inclusion of $C$ into $D$ ([[m-quotient-map]]).</p>
<p>Part (b) restricts to the set $B$ of [[hw6-q3]] through the <b>inclusion map</b> $i:B\to D$, $i(b)=b$, so $q=p\circ i$ is just $p$ applied to points of $B$. Since $B$ lacks the side edges of the square, the picture of $q(B)$ has to show which boundary points survive: the bottom corners come back from the lower segment, and the rest of the side edges do not.</p>
<p>Part (c) compares two topologies on the same set $q(B)$: the <b>quotient topology</b> induced by $q$ ([[quotient-topology]]), in which $U$ is open when $q^{-1}(U)$ is open in $B$, and the <b>subspace topology</b> from $C$ ([[subspace-topology]]), in which $U$ is open when $U=q(B)\cap O$ for some $O$ open in $C$. Two topologies differ as soon as one set is open in one and not in the other, so the method is to find such a set ([[m-not-quotient]]); the corner $(0,0)$, as in HW6 Q3, is where to look.</p>`],
 ['Breakdown of (a)', steps([
  [R`<b>Surjective:</b> $p$ is the identity on $C\subseteq D$, so every point of $C$ is hit.`, ''],
  [R`<b>Continuous:</b> $p$ is the restriction to $D$ of $(x,y)\mapsto(x,\max(0,y))$, whose coordinates are continuous.`, R`$\max(0,y)$ is continuous (pasting lemma on $y\le0$, $y\ge0$; [[pasting-lemma]]); then Theorem 18.4 and restriction to a subspace.`],
  [R`<b>Section:</b> the inclusion $j:C\to D$ is continuous and $p\circ j=\mathrm{id}_C$.`, R`Inclusions of subspaces are continuous. Then the reverse direction follows as in Q4.`]])],
 ['Clean solution of (a)', R`<p>Let $j:C\to D$ be the inclusion. For $(x,y)\in C$, $y\ge0$, so $p(j(x,y))=(x,y)$: $p\circ j=\mathrm{id}_C$, and in particular $p$ is surjective. The map $F(x,y)=(x,\max(0,y))$ on $\mathbb R^2$ has continuous coordinates ($\max(0,y)$ is continuous by the pasting lemma applied to $y\le0$ and $y\ge0$), so $F$ is continuous, and $p=F|_D$ is continuous as a map into $\mathbb R^2$ with image in $C$, hence into $C$. If $p^{-1}(U)$ is open in $D$, then $U=(p\circ j)^{-1}(U)=j^{-1}(p^{-1}(U))$ is open in $C$ since $j$ is continuous. So $p$ is a quotient map. $\blacksquare$</p>`],
 ['Parts (b) and (c)', R`<p>These use the set $B$ from HW6 Q3. The method for (c) is [[m-not-quotient]]: find a set open in the quotient topology on $q(B)$ (an open saturated set of $B$, pushed down) that is not open in the subspace topology from $C$, typically at a boundary point of the square that $q(B)$ approaches from one side only. Send the HW6 PDF and these are filled in exactly.</p>`]]);

// ---------- Q6
hub('hw7-q6', [
 ['What it builds on: HW3 Q2', R`<p>HW3 Q2: the identity $i:(X,\mathcal T)\to(X,\mathcal T')$ is continuous iff $\mathcal T\supseteq\mathcal T'$ ($\mathcal T$ is finer). The same calculation for images gives part (b).</p>`],
 ['Concepts and method', ''],
 ['How the terms are used', R`<p>A <b>bijection</b> ([[functions]]) is a map that is injective (different points go to different points) and surjective (every point of $Y$ is hit), so it pairs off the points of $X$ and $Y$ exactly. Part (a) relies on that pairing: for a bijection, the image of a complement is the complement of the image, $f(X\setminus S)=Y\setminus f(S)$. Open and closed sets are linked by complements ([[closed-set]]), so being an <b>open map</b> (images of open sets are open) and being a <b>closed map</b> (images of closed sets are closed) ([[open-map]]) turn out to be the same condition once $f$ is a bijection.</p>
<p>Part (b) separates being open from being <b>continuous</b> ([[continuous]]), which asks that <em>preimages</em> of open sets be open. For a bijection, saying $f$ is open is the same as saying the inverse $f^{-1}$ is continuous, so the method ([[m-counterexample]]) is to find a bijection whose inverse is continuous while $f$ itself is not. The identity map from a set with a coarser topology to the same set with a finer one ([[finer-coarser]]) is the natural candidate.</p>`],
 ['Breakdown', steps([
  [R`<b>(a) Prove the identity $f(X\setminus U)=Y\setminus f(U)$ for a bijection.</b>`, R`It converts open sets to closed sets across $f$. "$\subseteq$": if $x\notin U$ and $f(x)=f(u)$ with $u\in U$, injectivity gives $x=u\in U$, impossible. "$\supseteq$": a $y\notin f(U)$ equals $f(x)$ for some $x$ by surjectivity, and $x\notin U$.`],
  [R`<b>(a) Open $\Rightarrow$ closed:</b> for closed $C$, $X\setminus C$ is open, so $f(X\setminus C)=Y\setminus f(C)$ is open, so $f(C)$ is closed.`, ''],
  [R`<b>(a) Closed $\Rightarrow$ open:</b> the same with the roles of open and closed exchanged.`, ''],
  [R`<b>(b) Take the identity from a coarser topology to a finer one:</b> $f=\mathrm{id}:\mathbb R\to\mathbb R_\ell$.`, R`Images under the identity are the same sets, so it is open iff every open set of the domain is open in the target, i.e. the target is finer. Continuity would need the reverse ([[hw3-q2]]).`],
  [R`<b>(b) Check:</b> open in $\mathbb R$ ⇒ open in $\mathbb R_\ell$; but $[0,1)$ is open in $\mathbb R_\ell$ and $f^{-1}([0,1))=[0,1)$ is not open in $\mathbb R$.`, R`[[ex-lower-limit]] is strictly finer than ℝ ([[lemma-13-3]]).`]])],
 ['Clean solution', R`<p><b>(a)</b> Let $f$ be a bijection. For any $U\subseteq X$, $f(X\setminus U)=Y\setminus f(U)$: if $x\notin U$ and $f(x)\in f(U)$, then $f(x)=f(u)$ for some $u\in U$, and injectivity gives $x=u\in U$, a contradiction; conversely if $y\notin f(U)$, by surjectivity $y=f(x)$ for some $x$, and $x\notin U$. Suppose $f$ is open and $C\subseteq X$ is closed. Then $X\setminus C$ is open, so $f(X\setminus C)=Y\setminus f(C)$ is open, so $f(C)$ is closed: $f$ is closed. Suppose $f$ is closed and $U$ is open. Then $X\setminus U$ is closed, so $Y\setminus f(U)=f(X\setminus U)$ is closed, so $f(U)$ is open: $f$ is open.</p>
<p><b>(b)</b> Let $f:\mathbb R\to\mathbb R_\ell$ be the identity, where $\mathbb R$ has the standard topology and $\mathbb R_\ell$ the lower limit topology. It is a bijection. It is open: an open set of $\mathbb R$ is a union of intervals $(a,b)=\bigcup_{a<c<b}[c,b)$, each open in $\mathbb R_\ell$, so $f(U)=U$ is open in $\mathbb R_\ell$. It is not continuous: $[0,1)$ is open in $\mathbb R_\ell$, but $f^{-1}([0,1))=[0,1)$ is not open in $\mathbb R$, since no interval around $0$ lies in it. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>A bijection matches points one to one, so complements correspond exactly; open and closed are complements, so they correspond too. For a bijection, "open" is the same as "the inverse is continuous", so (b) is a bijection whose inverse is continuous but which is not itself continuous.</p>`]]);

Object.assign(VERBATIM, {
'hw6-q1': R`<p>Let $\mathbb R$ have the standard topology and let $p:\mathbb R\to\{-1,0,1\}$ be defined by $p(x)=-1$ for $x<0$, $p(x)=0$ for $x=0$, $p(x)=1$ for $x>0$. Determine the quotient topology on $\{-1,0,1\}$ induced by $p$.</p>`,
'hw6-q2': R`<p>(a) Let $A$ and $B$ be topological spaces, let $i:A\to B$ and $r:B\to A$ be continuous, and assume $r\circ i(a)=a$ for all $a\in A$. Prove that $r$ is a quotient map.</p><p>(b) Let $X$ and $Y$ be topological spaces, and let $\pi_1:X\times Y\to X$ be the projection. Prove that $\pi_1$ is a quotient map when $Y\ne\varnothing$.</p>`,
'hw6-q3': R`<p>Let $X=(0,1)\times[0,1]$, $Y=[0,1]\times\{0\}$, and $Z=[0,1]\times\{-1\}$.</p><p>(a) Sketch the sets $A=X\cup Y\subset\mathbb R^2$ and $B=X\cup Z\subset\mathbb R^2$ in two separate pictures.</p><p>(b) Let $A$ and $B$ have the subspace topologies from the standard topology on $\mathbb R^2$, and let $q:B\to A$ be defined by $q((x,y))=(x,\max(0,y))$. Prove that $q$ is not a quotient map.</p><p><em>Remark (not part of the question): it can be shown that the quotient topology on $A$ induced by $q$ is Hausdorff but not metrizable.</em></p>`,
'hw6-q4': R`<p>Let $X$ and $Y$ be topological spaces and let $f:X\to Y$ be continuous. Let $A\subset Y$ denote the image of $f$, i.e., $A=\{f(x)\mid x\in X\}$.</p><p>(a) Prove that the quotient topology on $A$, induced by the surjection $X\to A$ defined by $x\mapsto f(x)$, is finer than the subspace topology from $A\subset Y$.</p><p>(b) Let $x,y\in X$. Prove that if there exists a Hausdorff space $Y$ and a continuous map $f:X\to Y$ with $f(x)\ne f(y)$, then there also exists a Hausdorff space $B$ and a surjective quotient map $q:X\to B$ with $q(x)\ne q(y)$.</p>`,
'hw6-q5': R`<p>This question is a continuation of the previous. Let $X$ be a topological space.</p><p>(a) Define a relation $\sim$ on $X$ by declaring $x\sim y$ if and only if the following condition holds: for any Hausdorff space $B$ and any surjective quotient map $q:X\to B$, then $q(x)=q(y)$. Prove that $\sim$ is an equivalence relation.</p><p>(b) Let $\sim$ be the equivalence relation defined in (a). Prove that the quotient space $X/{\sim}$ is Hausdorff.</p>`
});
['hw6-q1', 'hw6-q2', 'hw6-q4', 'hw6-q5'].forEach(function(id){ A[id].sections = [['The problem', VERBATIM[id] + PDF]].concat(A[id].sections.filter(function(s){ return s[0] !== 'The problem'; })); });
A['hw6-q5'].lede = R`(a) "Every Hausdorff quotient identifies $x$ and $y$" is an equivalence relation. (b) The quotient by it is Hausdorff.`;
A['hw6-q5'].sections.forEach(function(s){ if (s[0] === 'Key idea') s[1] = R`<p>(a) Each property reduces to the same property of $=$ in every $B$. (b) If $[x]\ne[y]$, some Hausdorff quotient $q:X\to B$ has $q(x)\ne q(y)$. Every point of a class goes to the same point of $B$, so $g([z])=q(z)$ is well defined and continuous ([[maps-out-of-quotients]]). Separate $q(x),q(y)$ in $B$ and pull the disjoint open sets back by $g$.</p>`; });

// ---------- HW6 Q3, complete
var Q3PIC = R`<p><b>The pieces.</b> $X=(0,1)\times[0,1]$ is the unit square without its left and right edges (it keeps its top and bottom edges, but not the four corners). $Y=[0,1]\times\{0\}$ is the full bottom edge, corners included. $Z=[0,1]\times\{-1\}$ is a copy of the bottom edge one unit lower.</p>
<p><b>$A=X\cup Y$:</b> the square without its side edges, but with the full bottom edge, so the two bottom corners $(0,0)$ and $(1,0)$ are in $A$ while the rest of the left and right edges is not.</p>
<p><b>$B=X\cup Z$:</b> the same strip $X$ (no corners), and separately, the segment $Z$ below it. $Z$ is at distance $1$ from $X$.</p>
<p><b>$q$:</b> on $X$ it does nothing ($y\ge0$). On $Z$ it lifts $(x,-1)$ to $(x,0)$. So $q$ glues $Z$ onto the bottom edge: each $(x,0)$ with $0<x<1$ is hit twice, by $(x,0)\in X$ and $(x,-1)\in Z$; the corners $(0,0),(1,0)$ are hit only from $Z$.</p>`;
A['hw6-q3'].sections = [
 ['The problem', VERBATIM['hw6-q3'] + PDF],
 ['Concepts and method', ''],
 ['How the terms are used', Q3PIC + R`<p>The problem is about the sets first, so the terms start there. $X=(0,1)\times[0,1]$ is the unit square with its left and right edges removed; it keeps the top and bottom edges except their endpoints, so none of the four corners is in $X$. $Y=[0,1]\times\{0\}$ is the full bottom edge, corners included, and $Z=[0,1]\times\{-1\}$ is a copy of that edge one unit lower. Taking unions, $A=X\cup Y$ is the strip with its whole bottom edge, so the bottom corners $(0,0)$ and $(1,0)$ belong to $A$ while the rest of the side edges do not; $B=X\cup Z$ is the same strip with the separate segment $Z$ lying a distance $1$ below it.</p>
<p>The map $q(x,y)=(x,\max(0,y))$ leaves points with $y\ge0$ where they are and lifts $(x,-1)$ to $(x,0)$. So $q$ glues $Z$ onto the bottom edge: each $(x,0)$ with $0\lt x\lt1$ is hit twice, by $(x,0)\in X$ and by $(x,-1)\in Z$, while the corners $(0,0)$ and $(1,0)$ are hit only from $Z$.</p>
<p>A <b>quotient map</b> ([[quotient-map]]) is a surjective continuous map with one more property: whenever $q^{-1}(U)$ is open in $B$, the set $U$ is already open in $A$. To show $q$ is <em>not</em> a quotient map ([[m-not-quotient]]), the method looks for one set $U\subseteq A$ that breaks this, with $q^{-1}(U)$ open in $B$ but $U$ not open in $A$. Both halves of that check use the <b>subspace topology</b> ([[subspace-topology]]): a set $V$ is open in $A$ exactly when $V=A\cap O$ for some $O$ open in $\mathbb R^2$, which amounts to saying that around each point of $V$ some small disc, cut down to $A$, stays inside $V$. The corner $(0,0)$ is where the two topologies pull apart: in $B$ its preimage sits on the separate segment $Z$, away from the strip, while in $A$ every disc around it also catches points of the strip.</p>`],
 ['Breakdown', steps([
  [R`<b>Find where $B$ has more room than $A$.</b> Look at the corner $(0,0)$. In $A$, every disc around $(0,0)$ contains points of the strip, like $(t,t)$ for small $t>0$. In $B$, its only preimage is $(0,-1)\in Z$, and near $(0,-1)$ the space $B$ is just the segment $Z$.`, R`A point "alone" upstairs but "crowded" downstairs is where the reverse direction fails ([[m-not-quotient]]).`],
  [R`<b>Build a candidate $U\ni(0,0)$</b> that contains a piece of the bottom edge and only a thin wedge of the strip: $U=\big([0,r)\times\{0\}\big)\cup T$, with $T=\{(x,y): 0<x<r,\ 0\le y<x\}$ and $0<r<1$.`, R`$U$ must contain enough of the strip near each edge point $(x,0)$, $0<x<r$, for its preimage to be open in $X$; the wedge $y<x$ gives that, while staying away from the diagonal approach to the corner.`],
  [R`<b>Compute the preimage:</b> $q^{-1}(U)=\big([0,r)\times\{-1\}\big)\cup T$.`, R`Points of $Z$ map to $(x,0)$, which is in $U$ iff $0\le x<r$; points of $X$ map to themselves, and $X\cap U=T$ (the edge points $(x,0)$, $0<x<r$, already lie in $T$).`],
  [R`<b>Show $q^{-1}(U)$ is open in $B$.</b> $[0,r)\times\{-1\}=B\cap\big((-1,r)\times(-\tfrac32,-\tfrac12)\big)$, and $T=B\cap\{(x,y): 0<x<r,\ -\tfrac12<y<x\}$.`, R`Each is an open set of $\mathbb R^2$ intersected with $B$: the first box meets $B$ only in $Z$; the second region meets $B$ only in $X$, and there exactly in $T$.`],
  [R`<b>Show $U$ is not open in $A$.</b> Every disc around $(0,0)$ contains $(t,t)$ for small $t>0$; $(t,t)\in A$ but $(t,t)\notin U$ since $y<x$ fails.`, R`So no $A\cap(\text{disc})$ around $(0,0)$ lies in $U$.`]])],
 ['Clean solution', R`<p><b>(a)</b> See the description above: $A$ is the strip $(0,1)\times[0,1]$ together with the full bottom edge $[0,1]\times\{0\}$; $B$ is the same strip together with the separate segment $[0,1]\times\{-1\}$.</p>
<p><b>(b)</b> Fix $0<r<1$ and let $T=\{(x,y): 0<x<r,\ 0\le y<x\}$ and $U=([0,r)\times\{0\})\cup T\subseteq A$. Since $q$ is the identity on $X$ and sends $(x,-1)$ to $(x,0)$,
$$q^{-1}(U)=\big([0,r)\times\{-1\}\big)\cup T.$$
This set is open in $B$: $[0,r)\times\{-1\}=B\cap\big((-1,r)\times(-\tfrac32,-\tfrac12)\big)$ and $T=B\cap\{(x,y): 0<x<r,\ -\tfrac12<y<x\}$, each the intersection of $B$ with an open subset of $\mathbb R^2$. But $U$ is not open in $A$: if $O$ is open in $\mathbb R^2$ with $(0,0)\in O$, then $O$ contains a disc $B((0,0),\varepsilon)$, which contains $(t,t)$ for $0<t<\min(\varepsilon/2,1)$; such points lie in $A$ but not in $U$, so $A\cap O\not\subseteq U$. Hence $q^{-1}(U)$ is open while $U$ is not, and $q$ is not a quotient map. $\blacksquare$</p>`],
 ['Why it makes sense', R`<p>Upstairs, the corner's preimage $(0,-1)$ sits on a segment with nothing above it, so an open set there can be thin. Downstairs, the corner is attached to the whole strip from every direction. The quotient topology only remembers what is open upstairs, so it allows the thin set; the subspace topology from the plane does not. The quotient topology on $A$ is strictly finer ([[hw6-q4]]).</p>`]];

'path-connected': {title: 'Path connected space', kind: 'definition', where: '§24', pre: ['connected', 'continuous', 'subspace-topology'],
  lede: R`Any two points can be joined by a path: a continuous map $\gamma:[0,1]\to X$ starting at one and ending at the other.`,
  sections: [
  ['What it is', R`<p>A path connected space is one you can <b>walk across</b>: from any point to any other there is a route that never tears, a continuous journey through the space. Connectedness says the space cannot be split; path connectedness says, more strongly, that every two points can actually be joined.</p>`],
  ['Definition', R`<p>A <b>path</b> in $X$ from $x$ to $y$ is a continuous map $\gamma:[a,b]\to X$ with $\gamma(a)=x$ and $\gamma(b)=y$; here $[a,b]\subset\mathbb R$ has the subspace topology from the standard topology on $\mathbb R$. The space $X$ is <b>path connected</b> if every pair of points of $X$ can be joined by a path in $X$ (Munkres §24). Any interval $[a,b]$ can be used; $[0,1]$ is the usual choice, and $t\mapsto a+t(b-a)$ converts one to the other.</p>`],
  ['Reading the definition', R`<p><b>"A continuous map."</b> The path is the map $\gamma$, not the set of points it passes through. Think of $t\in[0,1]$ as time and $\gamma(t)$ as where you are at time $t$. Continuity is checked exactly as always: for each open $V\subseteq X$, the set of times $\gamma^{-1}(V)$ at which you are in $V$ must be open in $[0,1]$ ([[continuous]]).</p>
<p><b>"Open in $[0,1]$."</b> Because $[0,1]$ carries the [[subspace-topology]], sets such as $[0,\tfrac12)$ and $(\tfrac12,1]$ are open in it: $[0,\tfrac12)=[0,1]\cap(-1,\tfrac12)$. An endpoint is harmless, since there is nothing beyond it (compare [[hw1-q5]]).</p>
<p><b>"Every pair."</b> The claim is about all pairs $x,y$, so a proof starts with two arbitrary points. The path may stand still ($\gamma$ constant when $x=y$), may retrace itself, and may pass through the same point many times; only continuity and the two endpoints are required.</p>`],
  ['Why it is defined this way', R`<p>It is the most direct way to say "in one piece": you can get from anywhere to anywhere without leaving the space. The interval $[0,1]$ is used as the measuring stick because it is itself connected (Theorem 24.1), so a continuous image of it cannot break apart. That is the reason a path connected space is automatically connected (see below).</p>
<p>Connectedness, by contrast, is defined negatively (no separation exists), which makes it the right notion for proofs by contradiction and for the intermediate value theorem. Path connectedness is defined positively (a path exists), so proofs of it are constructions: you write the path down.</p>`],
  ['Path connected implies connected', R`<p><b>Claim.</b> If $X$ is path connected, it is [[connected]]. <b>Proof.</b> Suppose $U,V$ separate $X$. Pick $x\in U$, $y\in V$ and a path $\gamma$ from $x$ to $y$. The image $\gamma([0,1])$ is connected (continuous image of a connected space, Theorem 23.5), so it lies entirely in $U$ or entirely in $V$ (Lemma 23.2). But it contains $x\in U$ and $y\in V$, a contradiction. $\blacksquare$</p>
<p>The converse is false: the topologist's sine curve, $\{(x,\sin\tfrac1x):0\lt x\le1\}$ together with the segment $\{0\}\times[-1,1]$, is connected but has no path from the segment to the curve (Munkres §24).</p>`],
  ['Worked example', R`<p><b>$\mathbb R^n$ and every convex set.</b> For $x,y\in\mathbb R^n$ the straight line $\gamma(t)=(1-t)x+ty$ is a path: each coordinate is a polynomial in $t$, hence continuous, so $\gamma$ is continuous by [[maps-into-products|Theorem 19.6]]; $\gamma(0)=x$ and $\gamma(1)=y$.</p>
<p><b>A two-point space.</b> In $\{0,1\}$ with open sets $\varnothing,\{0\},\{0,1\}$, the map that stays at $0$ for $t\lt1$ and jumps to $1$ at $t=1$ is a path ([[hw8-q4]]). Paths can jump in spaces that are not [[hausdorff|Hausdorff]].</p>`],
  ['Non-example, and why it fails', R`<p>$\mathbb R\setminus\{0\}$ is not path connected: a path from $-1$ to $1$ would be a continuous $\gamma:[0,1]\to\mathbb R$ with $\gamma(0)\lt0\lt\gamma(1)$, and by the intermediate value theorem ([[connected-reals]]) it would take the value $0$, which is not in the space.</p>
<p>$\{0,1\}$ with the [[ex-discrete|discrete topology]] is not path connected: $\gamma^{-1}(\{0\})$ and $\gamma^{-1}(\{1\})$ would separate $[0,1]$ ([[hw8-q1]]).</p>`],
  ['Common confusions', R`<p>A path is not required to be injective or "nice"; a constant map is a path. A path only has to be continuous <em>into $X$</em> with $X$'s topology, which can be very coarse; the coarser the topology on $X$, the easier it is for a map into $X$ to be continuous ([[finer-coarser]]).</p>`],
  ['What depends on it', R`<p>Path components (the classes of "joined by a path", §25, [[components]]); the fundamental group (Ch. 9), which studies paths and loops up to deformation; and many proofs of connectedness, which are easiest by showing path connectedness.</p>`],
  ['Where it sits', R`<p>§24, after connectedness (§23) and the connectedness of intervals (Theorem 24.1), which it relies on. It is one of the two central "one piece" notions of Chapter 3, and the one that leads into algebraic topology.</p>`],
  ['Method', R`<p>[[m-path-connected]].</p>`]]},
'm-path-connected': {title: 'Show a space is path connected', kind: 'method', where: '§24', pre: ['path-connected'],
  lede: 'Take two arbitrary points, write down a path between them, and check continuity and the two endpoints.',
  steps: [[R`<b>Start with two arbitrary points</b> $x,y\in X$.`, R`Path connectedness is a "for every pair" claim; never pick convenient points.`],
    [R`<b>Write the path as a formula</b> $\gamma:[0,1]\to X$.`, R`Typical shapes: a straight line $(1-t)x+ty$; one path per coordinate in a product; piecewise paths glued at a time $t_0$; in a finite space, a map that stays at one point and jumps at a single time.`],
    [R`<b>Check continuity.</b>`, R`In a finite space: compute $\gamma^{-1}(V)$ for every open $V$ and check each is open in $[0,1]$. Otherwise: build $\gamma$ from known continuous maps; for maps into a product use [[maps-into-products|Theorem 19.6]] (continuous iff every coordinate is); for pieces use the [[pasting-lemma]].`],
    [R`<b>Check the endpoints:</b> $\gamma(0)=x$, $\gamma(1)=y$.`, R`For a path from $y$ back to $x$, reverse it: $t\mapsto\gamma(1-t)$ is continuous (composition with the continuous map $t\mapsto1-t$).`]],

A['connected'].sections.push(
  ['Equivalent forms', R`<p>For a space $X$ these say the same thing:</p><ol><li>$X$ has no separation (the definition).</li><li>The only subsets of $X$ that are both open and closed are $\varnothing$ and $X$. (If $U$ is open and closed and $U\ne\varnothing,X$, then $U$ and $X\setminus U$ form a separation; conversely the two halves of a separation are each open and closed.)</li><li>Every continuous $f:X\to\{0,1\}$, with $\{0,1\}$ discrete, is constant. This is [[hw8-q1]]: a non-constant such $f$ is exactly a separation, $f^{-1}(\{0\})$ and $f^{-1}(\{1\})$.</li></ol><p>Form 3 is often the easiest to use: to show two points lie in one connected piece, show every map to $\{0,1\}$ agrees on them.</p>`],
  ['The key lemma (23.2)', R`<p>If $U,V$ separate $X$ and $Y\subseteq X$ is connected, then $Y\subseteq U$ or $Y\subseteq V$. <b>Why:</b> otherwise $Y\cap U$ and $Y\cap V$ would separate $Y$. Almost every connectedness proof uses this: a connected piece cannot straddle a separation. It is how Theorem 23.3 (connected sets through a common point have connected union) is proved, and it is the engine of [[hw8-q5]].</p>`],
  ['What depends on it', R`<p>The intermediate value theorem ([[connected-reals]]); [[path-connected|path connectedness]], which implies it; [[components]], the maximal connected pieces; and later the classification of spaces by how they fall apart (Ch. 3 onward).</p>`],
  ['Where it sits', R`<p>§23 opens Chapter 3. Chapter 2 built the language (open sets, continuity, subspaces, products, quotients); Chapter 3 uses it to define the first properties that tell spaces apart. Connectedness is a <b>topological property</b>: a [[homeomorphism]] preserves it, so $\mathbb R$ and $\mathbb R\setminus\{0\}$ are not homeomorphic.</p>`]);

A['components'].sections.push(['Link to HW8 Q2', R`<p>The relation of [[hw8-q2]] ("every continuous map to $\{0,1\}$ agrees on $x$ and $x'$") is coarser than "lie in a common connected subspace": if a connected $C$ contains both, every such $f$ is constant on $C$ by [[hw8-q1]]. So each component lies inside one class of HW8 Q2. <em>Intuition, beyond the HW:</em> those classes are called quasi-components in the wider literature; they can be strictly larger than components, but they are closed for the same reason components are.</p>`]);

A['connected'].sections.push(['Connected versus Hausdorff', R`<p><b>They are not opposites.</b> Both definitions use disjoint open sets, which makes them look like opposites, but they ask different things. Any combination occurs, and $\mathbb R$ has both.</p>
<table><tr><th></th><th>[[hausdorff|Hausdorff]]</th><th>Separation (what connected forbids)</th></tr>
<tr><td>Look for</td><td>disjoint open $U\ni x$, $V\ni y$</td><td>disjoint nonempty open $U,V$</td></tr>
<tr><td>Must $U\cup V=X$?</td><td><b>No</b>: points may be left out</td><td><b>Yes</b>: every point must land in one</td></tr>
<tr><td>Scale</td><td>local: two points</td><td>global: the whole space</td></tr></table>
<p><b>The one-word difference is "cover".</b> In $\mathbb R$, the sets $U=(-\infty,\tfrac12)$ and $V=(\tfrac12,\infty)$ separate the points $0$ and $1$ (Hausdorff), but they are not a separation of $\mathbb R$, since $U\cup V$ misses $\tfrac12$. Every split of $\mathbb R$ into two disjoint open sets leaves some point out; that is what connected means.</p>
<table><tr><th></th><th>Hausdorff</th><th>Not Hausdorff</th></tr>
<tr><td><b>Connected</b></td><td>$\mathbb R$, $[0,1]$</td><td>$\{0,1\}$ with open sets $\varnothing,\{0\},X$ ([[hw8-q4]]): the only open set containing $1$ is $X$</td></tr>
<tr><td><b>Not connected</b></td><td>$\{0,1\}$ discrete ([[hw8-q1]]); $\mathbb R\setminus\{0\}$</td><td>$\{a,b,c\}$ with open sets $\varnothing,\{a,b\},\{c\},X$: $\{a,b\},\{c\}$ split it, but $a,b$ cannot be separated</td></tr></table>
<p><b>The grain of truth.</b> More open sets make Hausdorff easier and connectedness harder: the [[ex-discrete|discrete]] topology is Hausdorff and as disconnected as possible; the [[ex-indiscrete|indiscrete]] topology is connected and not Hausdorff. They pull in opposite directions along the coarse-to-fine scale ([[finer-coarser]]), but the thresholds differ, so a space such as $\mathbb R$ can have enough open sets to separate points without having enough to split the whole space.</p>`]);
A['hausdorff'].sections.push(['Hausdorff versus connected', R`<p>Not opposites: Hausdorff separates <em>two points</em> with disjoint open sets that need not cover the space; a separation (which connected forbids) splits <em>the whole space</em> into two disjoint open sets that must cover it. All four combinations occur; $\mathbb R$ is both. Full comparison: [[connected]], "Connected versus Hausdorff".</p>`]);
